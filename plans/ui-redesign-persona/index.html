<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phantom UI Mockups</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: a viewer shell (pass stepper, screen list, notes) around one fixed 1280x720 game stage that scales to fit. */
:root{
  --vw-bg:#111014; --vw-panel:#1b1a20; --vw-line:#34323c; --vw-fg:#f3f1ec; --vw-dim:#a9a5b3; --vw-acc:#ff2a45;
  --red:#e4002b; --red2:#b80022; --ink:#0c0b0d; --paper:#ffffff; --bone:#f2efe6; --cyan:#19d3ff; --gold:#ffd400;
  --hp:#3ee06a; --hpmid:#ffcc00; --hplow:#ff3b3b;
  --f-disp:'Anton','Impact','Arial Narrow',sans-serif; --f-cond:'Barlow Condensed','Arial Narrow',sans-serif;
  --f-slab:'Alfa Slab One','Rockwell',serif; --f-fat:'Abril Fatface','Georgia',serif; --f-mono:'Rubik Mono One','Arial Black',sans-serif;
  --f-mark:'Permanent Marker','Comic Sans MS',cursive;
  color-scheme:dark;
}
body{margin:0;background:var(--vw-bg);color:var(--vw-fg);font:15px/1.45 var(--f-cond);letter-spacing:.01em;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
.vw{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.vw-top{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.vw-top h1{font:400 26px/1 var(--f-disp);letter-spacing:.03em;margin:0;text-transform:uppercase}
.vw-top h1 em{font-style:normal;color:var(--vw-acc)}
.vw-step{display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap}
.vw-step button,.vw-chip{font:700 15px/1 var(--f-cond);color:var(--vw-fg);background:var(--vw-panel);border:1px solid var(--vw-line);padding:8px 12px;cursor:pointer;text-transform:uppercase;letter-spacing:.06em}
.vw-step button:hover,.vw-chip:hover{border-color:var(--vw-acc)}
.vw-step button:focus-visible,.vw-chip:focus-visible,.vw-step input:focus-visible{outline:2px solid var(--vw-acc);outline-offset:2px}
.vw-step output{font:400 22px/1 var(--f-disp);min-width:7.2em;text-align:center;font-variant-numeric:tabular-nums}
.vw-step input[type=range]{width:min(260px,60vw);accent-color:var(--vw-acc)}
.vw-nav{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.vw-grp{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.vw-grp>span{font:700 12px/1 var(--f-cond);color:var(--vw-dim);text-transform:uppercase;letter-spacing:.12em;margin-right:2px}
.vw-chip{padding:6px 9px;font-size:13px;letter-spacing:.04em}
.vw-chip[aria-pressed=true]{background:var(--vw-acc);border-color:var(--vw-acc);color:#fff}
.vw-chip.new::after{content:"new";font-size:10px;margin-left:5px;color:var(--gold)}
.vw-chip.chg::after{content:"changed";font-size:10px;margin-left:5px;color:var(--cyan)}
.vw-stagewrap{position:relative;width:100%;aspect-ratio:16/9;background:#000;overflow:hidden;border:1px solid var(--vw-line);max-width:100%}
.vw-notes{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:14px}
.vw-notes>div{background:var(--vw-panel);border:1px solid var(--vw-line);padding:14px 16px;min-width:0}
.vw-notes h2{font:400 22px/1.1 var(--f-disp);margin:0 0 8px;text-transform:uppercase;letter-spacing:.03em;text-wrap:balance}
.vw-notes h2 small{font:700 12px/1 var(--f-cond);color:var(--vw-acc);letter-spacing:.14em;display:block;margin-bottom:6px}
.vw-notes p,.vw-notes li{font:500 16px/1.45 var(--f-cond);margin:0 0 6px;color:var(--vw-fg)}
.vw-notes dl{margin:0;display:grid;gap:8px}
.vw-notes dt{font:700 12px/1.2 var(--f-cond);color:var(--vw-dim);text-transform:uppercase;letter-spacing:.1em}
.vw-notes dd{margin:2px 0 0;font:500 16px/1.4 var(--f-cond)}
.vw-notes ul{margin:0;padding-left:18px}
@media (max-width:760px){.vw-notes{grid-template-columns:1fr}.vw-step{margin-left:0}}
body.shot{padding:0}body.shot .vw{max-width:none;gap:0}body.shot .vw>*:not(.vw-stagewrap){display:none}body.shot .vw-stagewrap{width:1280px;height:720px;aspect-ratio:auto;border:0}

/* ===== the stage ===== */
.stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;transform:scale(var(--k,1));overflow:hidden;background:var(--ink);color:var(--paper);font:700 22px/1.2 var(--f-cond);letter-spacing:0;user-select:none}
.stage *{box-sizing:border-box}
.scr{position:absolute;inset:0;overflow:hidden}
.abs{position:absolute}
.spr{display:block;line-height:0;font-style:normal}
.px{image-rendering:pixelated;display:block;max-width:none;zoom:var(--z,1)}
.ol{filter:drop-shadow(1px 0 0 #fff) drop-shadow(-1px 0 0 #fff) drop-shadow(0 1px 0 #fff) drop-shadow(0 -1px 0 #fff)}
.olk{filter:drop-shadow(1px 0 0 #000) drop-shadow(-1px 0 0 #000) drop-shadow(0 1px 0 #000) drop-shadow(0 -1px 0 #000)}
.flip{transform:scaleX(-1)}
[data-go]{cursor:pointer}
.stage.still *,.stage.still *::before,.stage.still *::after{animation-duration:.001s!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.001s!important}
@media (prefers-reduced-motion:reduce){.stage *,.stage *::before,.stage *::after{animation-duration:.001s!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.001s!important}}

/* ===== pass 1 · the Phantom kit: red, black, white, everything cut on a slant ===== */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:.25}}
@keyframes inL{from{transform:translateX(-140%) rotate(var(--r,-4deg))}}
@keyframes inR{from{transform:translateX(140%) rotate(var(--r,0deg))}}
@keyframes inUp{from{transform:translateY(60px);opacity:0}}
@keyframes bob{50%{transform:translateY(-6px)}}
.p1{
  & .bgr{position:absolute;inset:0;background:var(--red)}
  & .bgk{position:absolute;inset:0;background:var(--ink)}
  & .burst{position:absolute;left:var(--x,50%);top:var(--y,50%);width:2600px;height:2600px;margin:-1300px;background:repeating-conic-gradient(from 0deg,rgba(0,0,0,.2) 0 5deg,transparent 5deg 10deg);animation:spin 80s linear infinite}
  & .dots{position:absolute;inset:0;background:radial-gradient(circle,rgba(0,0,0,.4) 2.4px,transparent 2.8px) 0 0/14px 14px;-webkit-mask-image:linear-gradient(115deg,transparent 35%,#000 95%);mask-image:linear-gradient(115deg,transparent 35%,#000 95%)}
  & .shard{position:absolute;background:var(--c,var(--ink));clip-path:var(--cp)}
  & .art{position:absolute;inset:0;background-size:cover;background-position:center;image-rendering:pixelated}
  & .rs{display:inline-flex;align-items:center;white-space:nowrap}
  & .rs i{width:.3em}
  & .rs b{display:inline-block;font-weight:400;line-height:1;padding:.05em .11em .08em;margin:0 .012em;transform:rotate(var(--a)) translateY(var(--y)) scale(var(--s))}
  & .rs .r0{font-family:var(--f-disp);background:#fff;color:#000}
  & .rs .r1{font-family:var(--f-slab);background:#000;color:#fff}
  & .rs .r2{font-family:var(--f-fat);background:var(--red);color:#fff;box-shadow:0 0 0 4px #000}
  & .rs .r3{font-family:var(--f-mono);background:#000;color:#fff;font-size:.8em}
  & .rs .r4{font-family:var(--f-disp);background:var(--bone);color:#000;clip-path:polygon(5% 0,100% 7%,95% 100%,0 93%)}
  & .rs .r5{font-family:var(--f-slab);background:#fff;color:var(--red)}
  & .blade{position:relative;display:block;width:max-content;font:400 50px/1 var(--f-disp);color:#fff;padding:5px 26px 8px;transform:rotate(var(--r,-4deg));text-transform:uppercase;white-space:nowrap}
  & .blade small{display:block;font:700 18px/1.1 var(--f-cond);letter-spacing:.05em;margin-top:3px;text-transform:none;opacity:.85}
  & .blade.on{color:#000}
  & .blade.on::before,& .blade.on::after{content:"";position:absolute;inset:-3px -16px;clip-path:polygon(3% 0,100% 9%,97% 100%,0 89%);z-index:-1;background:#fff}
  & .blade.on::after{background:var(--sh,var(--red));transform:translate(11px,9px);z-index:-2}
  & .hd{position:absolute;left:-24px;top:16px;padding:12px 70px 16px 64px;background:#000;clip-path:polygon(0 0,100% 14%,95% 100%,0 84%);font:400 62px/1 var(--f-disp);transform:rotate(-5deg);color:#fff;text-transform:uppercase;white-space:nowrap;animation:inL .35s cubic-bezier(.2,1.3,.4,1) both}
  & .hd small{display:block;font:800 17px/1 var(--f-cond);color:var(--red);letter-spacing:.22em;margin-bottom:3px}
  & .hd.onred small{color:#fff}
  & .keys{position:absolute;right:26px;bottom:16px;display:flex;gap:12px;transform:rotate(-2deg)}
  & .key{display:flex;align-items:center;gap:8px;font:800 19px/1 var(--f-cond);text-transform:uppercase;letter-spacing:.04em;color:#fff;background:#000;padding:6px 18px 6px 6px;clip-path:polygon(0 0,100% 0,93% 100%,0 100%)}
  & .key b{display:grid;place-items:center;min-width:28px;height:28px;padding:0 6px;background:#fff;color:#000;font:400 17px/1 var(--f-disp)}
  & .ty{display:inline-flex;align-items:center;gap:5px;font:800 16px/1 var(--f-cond);letter-spacing:.06em;color:#fff;background:var(--tc);padding:3px 12px 3px 5px;transform:skewX(-12deg);text-shadow:0 1px 0 rgba(0,0,0,.45)}
  & .ty img{width:20px;height:20px;transform:skewX(12deg)}
  & .hpbar{display:block;width:var(--w,260px);height:16px;background:#000;border:2px solid #fff;transform:skewX(-24deg);overflow:hidden}
  & .hpbar i{display:block;height:100%;background:var(--hp)}
  & .hpbar.mid i{background:var(--hpmid)} & .hpbar.low i{background:var(--hplow)}
  & .mk{font-family:var(--f-mark);font-weight:400}
  /* title */
  & .s-title .logo{position:absolute;left:54px;top:150px;transform:rotate(-7deg);font-size:112px;display:flex;flex-direction:column;gap:14px;animation:inL .5s cubic-bezier(.2,1.3,.4,1) both}
  & .s-title .logo .rs:last-child{margin-left:70px;font-size:126px}
  & .s-title .tag{position:absolute;left:170px;top:478px;font:400 34px/1 var(--f-mark);color:#fff;transform:rotate(-7deg)}
  & .s-title .press{position:absolute;left:96px;top:560px;--r:-3deg;font-size:40px;animation:blink 1.3s steps(2) infinite}
  & .s-title .ver{position:absolute;left:26px;bottom:16px;font:800 18px/1 var(--f-cond);letter-spacing:.14em;color:#fff}
  & .s-title .heroes{position:absolute;right:40px;bottom:0;width:560px;height:640px}
    /* main menu */
  & .s-menu .list{position:absolute;left:70px;top:170px;display:flex;flex-direction:column;gap:12px}
  & .s-menu .list .blade:nth-child(odd){--r:-5deg} & .s-menu .list .blade:nth-child(even){--r:-2deg;margin-left:34px}
  & .s-menu .list .blade{animation:inL .4s cubic-bezier(.2,1.3,.4,1) both;animation-delay:calc(var(--i)*45ms)}
  & .s-menu .who{position:absolute;right:120px;bottom:0;animation:inR .45s cubic-bezier(.2,1.2,.4,1) both}
  & .s-menu .who .sh{filter:brightness(0) saturate(100%) invert(13%) sepia(96%) saturate(6500%) hue-rotate(343deg) brightness(92%);opacity:.95}
  & .s-menu .card{position:absolute;right:40px;top:60px;width:330px;background:#fff;color:#000;padding:14px 20px 16px;transform:rotate(4deg);clip-path:polygon(0 4%,100% 0,97% 100%,3% 96%);font:700 20px/1.25 var(--f-cond)}
  & .s-menu .card b{display:block;font:400 30px/1 var(--f-disp);text-transform:uppercase}
  /* battle */
  & .s-battle .plate{position:absolute;background:#000;color:#fff;padding:12px 30px 14px 26px;clip-path:polygon(0 0,100% 8%,96% 100%,2% 92%)}
  & .s-battle .plate h3{margin:0;font:400 38px/1 var(--f-disp);text-transform:uppercase;display:flex;align-items:baseline;gap:14px;white-space:nowrap}
  & .s-battle .plate h3 span{font:800 22px/1 var(--f-cond);color:var(--bone)}
  & .s-battle .plate .row{display:flex;gap:10px;align-items:center;margin-top:8px}
  & .s-battle .plate .num{font:400 26px/1 var(--f-disp);font-variant-numeric:tabular-nums}
  & .s-battle .foe{left:26px;top:30px;transform:rotate(-3deg);animation:inL .4s both}
  & .s-battle .me{right:330px;bottom:150px;transform:rotate(-2deg);animation:inR .4s both}
  & .s-battle .cmds{position:absolute;right:30px;bottom:74px;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
  & .s-battle .cmds .blade{font-size:46px;animation:inR .35s cubic-bezier(.2,1.3,.4,1) both;animation-delay:calc(var(--i)*50ms)}
  & .s-battle .msg{position:absolute;left:24px;bottom:22px;width:600px;background:#fff;color:#000;padding:16px 30px 18px;font:700 28px/1.15 var(--f-cond);clip-path:polygon(0 8%,100% 0,97% 100%,2% 94%);transform:rotate(-1.5deg)}
  & .s-battle .balls{position:absolute;display:flex;gap:6px}
  & .s-battle .mega{position:absolute;right:300px;bottom:84px;display:flex;align-items:center;gap:8px;background:var(--gold);color:#000;font:400 26px/1 var(--f-disp);padding:6px 18px 6px 10px;transform:rotate(-6deg) skewX(-10deg)}
  /* event */
  & .s-event .dlg{position:absolute;left:150px;bottom:34px;width:990px;min-height:170px;background:#000;color:#fff;padding:34px 46px 26px 56px;clip-path:polygon(1% 6%,100% 0,98% 100%,0 92%);font:700 29px/1.22 var(--f-cond);animation:inUp .3s both}
  & .s-event .who{position:absolute;left:190px;bottom:188px;background:var(--red);color:#fff;font:400 32px/1 var(--f-disp);padding:6px 30px 8px 22px;transform:rotate(-4deg) skewX(-10deg);text-transform:uppercase;box-shadow:6px 6px 0 #000}
  & .s-event .opts{position:absolute;right:40px;top:150px;display:flex;flex-direction:column;gap:16px;align-items:flex-end}
  & .s-event .opts .blade{font-size:34px;background:#000;animation:inR .35s both;animation-delay:calc(var(--i)*60ms)}
  & .s-event .opts .blade.on{background:none}
  & .s-event .npc{position:absolute;left:56px;bottom:150px}
  /* pause + settings */
  & .s-pause .list{position:absolute;left:80px;top:150px;display:flex;flex-direction:column;gap:6px}
  & .s-pause .list .blade{font-size:46px;--sh:#000;animation:inL .4s cubic-bezier(.2,1.3,.4,1) both;animation-delay:calc(var(--i)*40ms)}
  & .s-pause .list .blade:nth-child(even){margin-left:30px;--r:-2deg}
  & .s-pause .party{position:absolute;right:36px;top:60px;width:520px;display:flex;flex-direction:column;gap:8px}
  & .s-pause .pm{display:grid;grid-template-columns:76px 1fr auto;align-items:center;gap:10px;background:#000;padding:6px 24px 6px 10px;clip-path:polygon(0 0,100% 0,96% 100%,2% 100%);animation:inR .4s both;animation-delay:calc(var(--i)*40ms)}
  & .s-pause .pm:nth-child(even){transform:translateX(-22px)}
  & .s-pause .pm .pic{height:70px;display:grid;place-items:center}
  & .s-pause .pm b{display:block;font:400 26px/1 var(--f-disp);text-transform:uppercase;margin-bottom:6px}
  & .s-pause .pm .lv{font:800 20px/1 var(--f-cond);text-align:right}
  & .s-pause .pm .lv small{display:block;font:700 16px/1 var(--f-cond);color:var(--bone);margin-top:5px}
  & .s-pause .foot{position:absolute;left:36px;bottom:18px;display:flex;gap:10px}
  & .s-pause .foot span{background:#fff;color:#000;font:800 20px/1 var(--f-cond);padding:7px 18px;transform:skewX(-12deg)}
  & .s-set .tabs{position:absolute;left:400px;top:52px;display:flex;gap:6px}
  & .s-set .tabs span{font:400 24px/1 var(--f-disp);padding:8px 20px;background:#222;color:#aaa;transform:skewX(-14deg);text-transform:uppercase}
  & .s-set .tabs span.on{background:var(--red);color:#fff}
  & .s-set .rows{position:absolute;left:110px;top:150px;width:1060px;display:flex;flex-direction:column;gap:8px}
  & .s-set .row{display:flex;justify-content:space-between;align-items:center;padding:9px 34px;font:800 28px/1 var(--f-cond);text-transform:uppercase;letter-spacing:.03em;border-bottom:2px solid #333;animation:inUp .3s both;animation-delay:calc(var(--i)*30ms)}
  & .s-set .row .val{font:400 28px/1 var(--f-disp);color:var(--bone);display:flex;gap:16px;align-items:center}
  & .s-set .row .val::before{content:"◀";font-size:16px;color:var(--red)} & .s-set .row .val::after{content:"▶";font-size:16px;color:var(--red)}
  & .s-set .row.on{background:#fff;color:#000;border-color:#fff;clip-path:polygon(0 0,100% 6%,99% 100%,1% 94%);box-shadow:none}
  & .s-set .row.on .val{color:#000}
  & .s-set .help{position:absolute;left:110px;bottom:70px;width:760px;font:400 24px/1.25 var(--f-mark);color:var(--bone);transform:rotate(-1.5deg)}
}

/* ===== pass 2 · battle leaves the box: command burst, party stack, and a page each for moves, party, bag, hit ===== */
@keyframes pop{from{transform:scale(.2) rotate(var(--r,0deg));opacity:0}}
@keyframes jit{0%,100%{transform:rotate(var(--r,0deg)) translate(0,0)}50%{transform:rotate(calc(var(--r,0deg) + .6deg)) translate(1px,-1px)}}
@keyframes lock{from{transform:rotate(0) scale(1.5);opacity:0}to{transform:rotate(90deg) scale(1)}}
@keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-10px,4px)}40%{transform:translate(9px,-5px)}60%{transform:translate(-6px,2px)}80%{transform:translate(4px,-2px)}}
@keyframes lines{to{background-position:-400px 0}}
@keyframes drain{from{width:var(--from)}}
.p2{
  & .frame{position:absolute;inset:0;pointer-events:none;background:linear-gradient(#000,#000) top/100% 0 no-repeat}
  & .frame::before,& .frame::after{content:"";position:absolute;left:0;right:0;height:120px;background:#000}
  & .frame::before{top:0;clip-path:polygon(0 0,100% 0,100% 18%,0 62%)} & .frame::after{bottom:0;clip-path:polygon(0 80%,100% 30%,100% 100%,0 100%)}
  & .dim{position:absolute;inset:0;background:rgba(8,6,10,.62)}
  & .foe2{position:absolute;left:22px;top:26px;transform:rotate(-3deg);animation:inL .4s both}
  & .foe2 h3{margin:0;display:inline-flex;align-items:baseline;gap:12px;background:#000;color:#fff;font:400 44px/1 var(--f-disp);padding:6px 34px 8px 20px;clip-path:polygon(0 0,100% 0,95% 100%,0 100%);text-transform:uppercase}
  & .foe2 h3 span{font:800 22px/1 var(--f-cond);color:var(--gold)}
  & .foe2 .r{display:flex;align-items:center;gap:10px;margin:7px 0 0 16px}
  & .slash{display:block;position:relative;width:var(--w,300px);height:22px;background:#000;clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,0 100%);padding:4px 18px 4px 4px}
  & .slash i{display:block;height:100%;background:var(--hp);clip-path:polygon(0 0,100% 0,calc(100% - 9px) 100%,0 100%)}
  & .slash.mid i{background:var(--hpmid)} & .slash.low i{background:var(--hplow)}
  & .slash.xp{height:12px;padding:3px 12px 3px 3px} & .slash.xp i{background:var(--cyan)}
  & .num2{font:400 26px/1 var(--f-disp);color:#fff;text-shadow:2px 2px 0 #000;font-variant-numeric:tabular-nums}
  & .turn{position:absolute;right:300px;top:20px;background:var(--red);color:#fff;font:400 28px/1 var(--f-disp);padding:6px 24px 8px;transform:rotate(3deg) skewX(-12deg);box-shadow:5px 5px 0 #000}
  /* command burst */
  & .cw{position:absolute;left:330px;top:150px;width:520px;height:470px}
  & .cwbg{position:absolute;inset:0;background:#000;clip-path:polygon(8% 30%,30% 4%,44% 22%,70% 0,74% 26%,100% 30%,82% 50%,98% 76%,70% 74%,58% 100%,40% 78%,12% 92%,22% 60%,0 52%);animation:pop .3s cubic-bezier(.2,1.4,.4,1) both}
  & .cwbg.r{background:var(--red);transform:translate(12px,10px);animation:none}
  & .cw .c{position:absolute;display:flex;align-items:center;gap:10px;font:400 var(--fs,44px)/1 var(--f-disp);color:#fff;text-transform:uppercase;transform:rotate(var(--r));white-space:nowrap;animation:pop .28s cubic-bezier(.2,1.5,.4,1) both;animation-delay:calc(var(--i)*45ms + 80ms)}
  & .cw .c kbd{display:grid;place-items:center;width:34px;height:34px;background:#fff;color:#000;font:400 20px/1 var(--f-disp);transform:rotate(-8deg);box-shadow:3px 3px 0 var(--red)}
  & .cw .c.on{color:#000;background:#fff;padding:2px 26px 6px 12px;clip-path:polygon(0 6%,100% 0,96% 100%,2% 92%);animation:pop .28s both,jit .22s steps(2) .4s infinite}
  & .cw .c.on kbd{background:#000;color:#fff;box-shadow:none}
  & .cw .c.g{color:var(--gold)}
  & .cw .c small{font:800 16px/1 var(--f-cond);letter-spacing:.08em;color:var(--bone);align-self:flex-end;margin-bottom:6px}

<script>const PASSES=[{"n": 1, "name": "The Phantom kit", "change": "The first cut of the style, taken from Persona 5: red, black and white only, every panel cut on a slant, cut-out ransom letters for the logo, a turning sunburst and halftone dots behind everything. Six core screens: Title, Main menu, Battle command, Event, Pause and Settings.", "pages": ["Title", "Main menu", "Battle command", "Event", "Pause menu", "Settings"], "q": {"x": "It is loud already, but flat: panels sit on the page and nothing overlaps or moves much yet. Battle is still a normal Pokémon layout with slanted boxes.", "b": "First pass, so there is nothing to beat. It sets the rules every later pass has to top.", "p": "Yes. Battle only has the command list; moves, party, bag and targets each need a page. That is pass 2.", "m": "Pause is one list with the party beside it, and Settings is one page with six tabs. Both work but both are crowded; they get split up in pass 4.", "k": "Only because of the sprites. Types and Poké Balls are tiny; later passes have to pull Pokémon things into the style itself."}}, {"n": 2, "name": "Battle leaves the box", "change": "Battle stops being a Pokémon layout with slanted boxes. Commands burst out of your Pokémon in a jagged star, each on its own key, the way Persona 5 puts orders around the hero. Your party stands in a stack down the right edge with live HP. Black slanted bars frame the field like a film shot. Fight, Pokémon and Bag each open their own page, and a hit gets a full-screen splash.", "pages": ["Moves", "Party (switch)", "Bag", "Hit splash"], "q": {"x": "Much more. The command burst and the Super Effective splash are the first things on the page that could not be mistaken for any other Pokémon game.", "b": "Pass 1 had four words in a column. Now each command has a key, a size and an angle, the party is always in view, and moves show their type, power, PP and how well they hit before you choose.", "p": "Four added. Moves, party and bag used to be nowhere; they are full pages now so the battle screen holds only the fight.", "m": "Not touched this pass. In battle, X on the burst is Run and Info opens foe details; Pause still needs its own pass.", "k": "Better: type colours carry the move cards, HP bars keep green, yellow and red, Poké Balls count the foe's team, and the run's real limits (10 heals, 6 revives) sit on the Bag page."}}, {"n": 3, "name": "The run gets a calendar", "change": "Outside battle, every screen now carries a stage stamp in the top corner, built like Persona 5's date: a huge stage number, the region on a red tag and the time and weather in marker pen. The route is a subway-style map of diamond stops over the region's town map. Events are split in two: the character leans in from the side and talks, and only after you press does the choice page appear, with what each choice costs. Rewards are dealt as three cards. The Mart has a clerk, a wallet and a running cart total.", "pages": ["Route map", "Event · choice", "Reward", "Poké Mart"], "q": {"x": "Yes. Big character art leaning into frame, dealt cards and the outlined stage number give each page one loud thing to look at.", "b": "Pass 2 only fixed battle. This pass covers the other half of a run, and the old one-page event (text and choices on top of each other) is replaced by talk then choice.", "p": "Four added. Splitting talk from choice also follows the rule that text stays until you press and rewards only come after.", "m": "Esc on the map opens the menu and C jumps straight to the party. The menu itself is still the pass 1 list; it is the next pass.", "k": "More than before: the route sits on the real region map, stops use Poké Balls, the Mart clerk is the game's own sprite, and the stage stamp shows time and weather, which matter for evolutions."}}, {"n": 4, "name": "Menus get rooms", "change": "The pause list becomes a hub: your trainer stands huge on the right, the chosen word swells to twice the size, and each word opens its own page. New pages for the Pokémon summary (with a six-point stat web, the Pokémon answer to Persona's stat star), the Pokédex, a Trainer card laid out like a calling card, and Save slots. Settings stops being one crowded page: a hub of six big tiles, then one short page each, never more than six rows.", "pages": ["Pokémon summary", "Pokédex", "Trainer card", "Save", "Settings hub", "Game", "Battle", "Look", "Sound", "Controls", "Access"], "q": {"x": "Yes. The trainer filling the pause screen and the stat web give the menus the big-art feel the battle already had.", "b": "Pass 1 squeezed seven jobs and the whole party onto one pause page and all settings behind six tiny tabs. Every job now has room, and Settings rows are big enough to read from the couch.", "p": "Eleven added. Settings alone went from one page to seven.", "m": "This pass is the answer: Esc opens the hub anywhere outside battle, Settings is the sixth word, and Q/E flips between its pages without going back.", "k": "The summary keeps what players expect (types, ability, nature, held item, four moves, Exp bar); the Pokédex shows dark shapes for unseen Pokémon and the game's Mastery ranks."}}, {"n": 5, "name": "Everything moves into everything", "change": "Motion pass. Changing page is now a morph: the header, the stage stamp, your trainer, your Pokémon, the party strip and the key hints each slide and resize from where they were to where they belong on the next page, while a red, black and white blade wipes the rest. Idle screens loop without a seam: the chosen item jitters, trainers breathe, the dots drift. Three new battle moments: a Mega Evolution cut-in across the eyes, a win splash with a line from your trainer, and a result tally where Exp bars fill and numbers punch in.", "pages": ["Mega cut-in", "Win splash", "Result"], "q": {"x": "This is the pass that makes it feel like Persona rather than look like it. The cut-in and the win splash are the showiest pages so far.", "b": "Passes 1 to 4 were still pictures with slide-ins. Now nothing just appears: each page grows out of the one before, and each loop returns to its first frame.", "p": "Three added. Win and Result are separate on purpose, so the splash stays clean and the numbers get room.", "m": "Opening Pause, picking a word and landing on its page is one unbroken move; the trainer shrinks from the hub into the Trainer card. Settings pages slide along the rail the same way.", "k": "Mega Evolution uses the game's own Mega ring and stone art, Exp bars fill the way they always have, and Red's victory line is six dots, because Red never talks."}}];</script>

/* Viewer shell: pass stepper, screen chips, notes, scaling, and the morph between screens. */
(function(){
const Q=new URLSearchParams(location.search),stage=document.getElementById('stage'),MAXP=PASSES.length;
let P=Math.min(MAXP,+Q.get('pass')||MAXP),CUR=Q.get('s')||null,LIV=Q.get('liv')||'';
const still=Q.has('still');if(Q.has('shot'))document.body.classList.add('shot');
function cls(){stage.className='stage '+Array.from({length:P},(_,i)=>'p'+(i+1)).join(' ')+(still?' still':'');if(LIV)stage.dataset.liv=LIV;else delete stage.dataset.liv;stage.dataset.pass=P}
function paint(){const v=verAt(CUR,P);let h=v.fn(P);if(P>=5&&!h.includes('class="wipe"'))h+='<div class="wipe" aria-hidden="true"><i></i><i></i><i></i></div>';stage.innerHTML=`<section class="scr s-${CUR}">${h}</section>`;stage.dataset.scr=CUR}
function show(id,anim){const L=listAt(P);if(!L.includes(id))id=L[0];const run=()=>{CUR=id;cls();paint();chrome()};
  if(anim&&P>=5&&!still&&document.startViewTransition&&!matchMedia('(prefers-reduced-motion:reduce)').matches)document.startViewTransition(run);else run()}
function chrome(){const L=listAt(P),nav=document.getElementById('vw-nav'),groups=[...new Set(L.map(id=>SCR[id].group))];
  nav.innerHTML=groups.map(g=>`<div class="vw-grp"><span>${g}</span>${L.filter(id=>SCR[id].group===g).map(id=>{const v=verAt(id,P);return`<button class="vw-chip${v.since===P?(SCR[id].v[0].since===P?' new':' chg'):''}" data-s="${id}" aria-pressed="${id===CUR}">${SCR[id].title}</button>`}).join('')}</div>`).join('');
  document.getElementById('vw-pass').value=P;document.getElementById('vw-out').textContent=`Pass ${P} of 25`;
  const n=PASSES[P-1],Qs=[['More extravagant, pleasing, eye-catching?','x'],['How is it changed and better than the last pass?','b'],['More pages to avoid clutter?','p'],['How do a Menu and Settings fit?','m'],['Does it feel like a Pokémon game?','k']];
  document.getElementById('vw-notes').innerHTML=`<div><h2><small>INTERVAL ${Math.ceil(P/5)} · PASS ${P}</small>${n.name}</h2><p>${n.change}</p>${n.pages&&n.pages.length?`<p><b>New pages:</b> ${n.pages.join(', ')}</p>`:''}</div><div><dl>${Qs.map(([q,k])=>`<div><dt>${q}</dt><dd>${n.q[k]}</dd></div>`).join('')}</dl></div>`;
  const lv=document.getElementById('vw-liv');if(lv)lv.hidden=!(window.LIVERIES&&P>=LIVERIES.since);
  if(lv&&!lv.hidden)lv.innerHTML=`<span>Version</span>`+LIVERIES.list.map(([k,l])=>`<button class="vw-chip" data-liv="${k}" aria-pressed="${(LIV||LIVERIES.list[0][0])===k}">${l}</button>`).join('')}
function fit(){const w=document.getElementById('vw-wrap').clientWidth;stage.style.setProperty('--k',document.body.classList.contains('shot')?1:w/1280)}
new ResizeObserver(fit).observe(document.getElementById('vw-wrap'));fit();
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g&&stage.contains(g)){show(g.dataset.go,true);return}
  const c=e.target.closest('[data-s]');if(c){show(c.dataset.s,true);return}
  const l=e.target.closest('[data-liv]');if(l){LIV=l.dataset.liv;show(CUR,true);return}
  if(e.target.id==='vw-prev'){P=Math.max(1,P-1);show(CUR,true)}if(e.target.id==='vw-next'){P=Math.min(MAXP,P+1);show(CUR,true)}
  if(e.target.id==='vw-tour'){tour()}});
document.getElementById('vw-pass').max=MAXP;
document.getElementById('vw-pass').addEventListener('input',e=>{P=+e.target.value;show(CUR,false)});
document.addEventListener('keydown',e=>{if(e.target.matches('input,button'))return;const L=listAt(P),i=L.indexOf(CUR);if(e.key==='ArrowRight')show(L[(i+1)%L.length],true);if(e.key==='ArrowLeft')show(L[(i-1+L.length)%L.length],true)});
let tt=null;function tour(){const b=document.getElementById('vw-tour');if(tt){clearInterval(tt);tt=null;b.textContent='Play tour';return}b.textContent='Stop tour';tt=setInterval(()=>{const L=listAt(P),i=L.indexOf(CUR);show(L[(i+1)%L.length],true)},2600)}
window.__mock={list:()=>listAt(P),show:id=>show(id,false),go:id=>show(id,true),pass:()=>P,setLiv:l=>{LIV=l;show(CUR,false)}};
show(CUR||listAt(P)[0],false);
})();

</script>
