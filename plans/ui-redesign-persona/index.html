<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phantom UI Mockups</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: a viewer shell (pass stepper, screen list, notes) around one fixed 1280x720 game stage that scales to fit. */
:root{
  --vw-bg:#111014; --vw-panel:#1b1a20; --vw-line:#34323c; --vw-fg:#f3f1ec; --vw-dim:#a9a5b3; --vw-acc:#ff2a45;
  --red:#e4002b; --red2:#b80022; --ink:#0c0b0d; --paper:#ffffff; --bone:#f2efe6; --cyan:#19d3ff; --gold:#ffd400;
  --k:#000;--w:#fff;--on:#fff;--accw:#e4002b;--hp:#3ee06a; --hpmid:#ffcc00; --hplow:#ff3b3b;
  --f-disp:'Anton','Impact','Arial Narrow',sans-serif; --f-cond:'Barlow Condensed','Arial Narrow',sans-serif;
  --f-slab:'Alfa Slab One','Rockwell',serif; --f-fat:'Abril Fatface','Georgia',serif; --f-mono:'Rubik Mono One','Arial Black',sans-serif;
  --f-mark:'Permanent Marker','Comic Sans MS',cursive;
  color-scheme:dark;
}
body{margin:0;background:var(--vw-bg);color:var(--vw-fg);font:15px/1.45 var(--f-cond);letter-spacing:.01em;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 40px}
.vw{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.vw-top{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.vw-top h1{font:400 26px/1 var(--f-disp);letter-spacing:.03em;margin:0;text-transform:uppercase}
.vw-top h1 em{font-style:normal;color:var(--vw-acc)}
.vw-step{display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap}
.vw-step button,.vw-chip{font:700 15px/1 var(--f-cond);color:var(--vw-fg);background:var(--vw-panel);border:1px solid var(--vw-line);padding:8px 12px;cursor:pointer;text-transform:uppercase;letter-spacing:.06em}
.vw-step button:hover,.vw-chip:hover{border-color:var(--vw-acc)}
.vw-step button:focus-visible,.vw-chip:focus-visible,.vw-step input:focus-visible{outline:2px solid var(--vw-acc);outline-offset:2px}
.vw-step output{font:400 22px/1 var(--f-disp);min-width:7.2em;text-align:center;font-variant-numeric:tabular-nums}
.vw-step input[type=range]{width:min(260px,60vw);accent-color:var(--vw-acc)}
.vw-nav{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.vw-grp{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.vw-grp>span{font:700 12px/1 var(--f-cond);color:var(--vw-dim);text-transform:uppercase;letter-spacing:.12em;margin-right:2px}
.vw-chip{padding:6px 9px;font-size:13px;letter-spacing:.04em}
.vw-chip[aria-pressed=true]{background:var(--vw-acc);border-color:var(--vw-acc);color:#fff}
.vw-chip.new::after{content:"new";font-size:10px;margin-left:5px;color:var(--gold)}
.vw-chip.chg::after{content:"changed";font-size:10px;margin-left:5px;color:var(--cyan)}
.vw-stagewrap{position:relative;width:100%;aspect-ratio:16/9;background:#000;overflow:hidden;border:1px solid var(--vw-line);max-width:100%}
.vw-notes{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:14px}
.vw-notes>div{background:var(--vw-panel);border:1px solid var(--vw-line);padding:14px 16px;min-width:0}
.vw-notes h2{font:400 22px/1.1 var(--f-disp);margin:0 0 8px;text-transform:uppercase;letter-spacing:.03em;text-wrap:balance}
.vw-notes h2 small{font:700 12px/1 var(--f-cond);color:var(--vw-acc);letter-spacing:.14em;display:block;margin-bottom:6px}
.vw-notes p,.vw-notes li{font:500 16px/1.45 var(--f-cond);margin:0 0 6px;color:var(--vw-fg)}
.vw-notes dl{margin:0;display:grid;gap:8px}
.vw-notes dt{font:700 12px/1.2 var(--f-cond);color:var(--vw-dim);text-transform:uppercase;letter-spacing:.1em}
.vw-notes dd{margin:2px 0 0;font:500 16px/1.4 var(--f-cond)}
.vw-notes ul{margin:0;padding-left:18px}
@media (max-width:760px){.vw-notes{grid-template-columns:1fr}.vw-step{margin-left:0}}
body.shot{padding:0}body.shot .vw{max-width:none;gap:0}body.shot .vw>*:not(.vw-stagewrap){display:none}body.shot .vw-stagewrap{width:1280px;height:720px;aspect-ratio:auto;border:0}

/* ===== the stage ===== */
.stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;transform:scale(var(--scale,1));overflow:hidden;background:var(--ink);color:var(--paper);font:700 22px/1.2 var(--f-cond);letter-spacing:0;user-select:none}
.stage *{box-sizing:border-box}
.scr{position:absolute;inset:0;overflow:hidden}
.abs{position:absolute}
.spr{display:block;line-height:0;font-style:normal}
.px{image-rendering:pixelated;display:block;max-width:none;zoom:var(--z,1)}
.ol{filter:drop-shadow(1px 0 0 var(--w)) drop-shadow(-1px 0 0 var(--w)) drop-shadow(0 1px 0 var(--w)) drop-shadow(0 -1px 0 var(--w))}
.olk{filter:drop-shadow(1px 0 0 var(--k)) drop-shadow(-1px 0 0 var(--k)) drop-shadow(0 1px 0 var(--k)) drop-shadow(0 -1px 0 var(--k))}
.flip{transform:scaleX(-1)}
[data-go]{cursor:pointer}
.stage.still *,.stage.still *::before,.stage.still *::after{animation-duration:.001s!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.001s!important}
@media (prefers-reduced-motion:reduce){.stage *,.stage *::before,.stage *::after{animation-duration:.001s!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.001s!important}}

/* ===== pass 1 · the Phantom kit: red, black, white, everything cut on a slant ===== */
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{50%{opacity:.25}}
@keyframes inL{from{transform:translateX(-140%) rotate(var(--r,-4deg))}}
@keyframes inR{from{transform:translateX(140%) rotate(var(--r,0deg))}}
@keyframes inUp{from{transform:translateY(60px);opacity:0}}
@keyframes bob{50%{transform:translateY(-6px)}}
.p1{
  & .bgr{position:absolute;inset:0;background:var(--red)}
  & .bgk{position:absolute;inset:0;background:var(--ink)}
  & .burst{position:absolute;left:var(--x,50%);top:var(--y,50%);width:2600px;height:2600px;margin:-1300px;background:repeating-conic-gradient(from 0deg,rgba(0,0,0,.2) 0 5deg,transparent 5deg 10deg);animation:spin 80s linear infinite}
  & .dots{position:absolute;inset:0;background:radial-gradient(circle,rgba(0,0,0,.4) 2.4px,transparent 2.8px) 0 0/14px 14px;-webkit-mask-image:linear-gradient(115deg,transparent 35%,var(--k) 95%);mask-image:linear-gradient(115deg,transparent 35%,var(--k) 95%)}
  & .shard{position:absolute;background:var(--c,var(--ink));clip-path:var(--cp)}
  & .art{position:absolute;inset:0;background-size:cover;background-position:center;image-rendering:pixelated}
  & .rs{display:inline-flex;align-items:center;white-space:nowrap}
  & .rs i{width:.3em}
  & .rs b{display:inline-block;font-weight:400;line-height:1;padding:.05em .11em .08em;margin:0 .012em;transform:rotate(var(--a)) translateY(var(--y)) scale(var(--s))}
  & .rs .r0{font-family:var(--f-disp);background:var(--w);color:var(--k)}
  & .rs .r1{font-family:var(--f-slab);background:var(--k);color:var(--w)}
  & .rs .r2{font-family:var(--f-fat);background:var(--red);color:var(--on);box-shadow:0 0 0 4px var(--k)}
  & .rs .r3{font-family:var(--f-mono);background:var(--k);color:var(--w);font-size:.8em}
  & .rs .r4{font-family:var(--f-disp);background:var(--bone);color:var(--k);clip-path:polygon(5% 0,100% 7%,95% 100%,0 93%)}
  & .rs .r5{font-family:var(--f-slab);background:var(--w);color:var(--accw)}
  & .blade{position:relative;display:block;width:max-content;font:400 50px/1 var(--f-disp);color:var(--w);padding:5px 26px 8px;transform:rotate(var(--r,-4deg));text-transform:uppercase;white-space:nowrap}
  & .blade small{display:block;font:700 18px/1.1 var(--f-cond);letter-spacing:.05em;margin-top:3px;text-transform:none;opacity:.85}
  & .blade.on{color:var(--k)}
  & .blade.on::before,& .blade.on::after{content:"";position:absolute;inset:-3px -16px;clip-path:polygon(3% 0,100% 9%,97% 100%,0 89%);z-index:-1;background:var(--w)}
  & .blade.on::after{background:var(--sh,var(--red));transform:translate(11px,9px);z-index:-2}
  & .hd{position:absolute;left:-24px;top:16px;padding:12px 70px 16px 64px;background:var(--k);clip-path:polygon(0 0,100% 14%,95% 100%,0 84%);font:400 62px/1 var(--f-disp);transform:rotate(-5deg);color:var(--w);text-transform:uppercase;white-space:nowrap;animation:inL .35s cubic-bezier(.2,1.3,.4,1) both}
  & .hd small{display:block;font:800 17px/1 var(--f-cond);color:var(--red);letter-spacing:.22em;margin-bottom:3px}
  & .hd.onred small{color:var(--w)}
  & .keys{position:absolute;right:26px;bottom:16px;display:flex;gap:12px;transform:rotate(-2deg)}
  & .key{display:flex;align-items:center;gap:8px;font:800 19px/1 var(--f-cond);text-transform:uppercase;letter-spacing:.04em;color:var(--w);background:var(--k);padding:6px 18px 6px 6px;clip-path:polygon(0 0,100% 0,93% 100%,0 100%)}
  & .key b{display:grid;place-items:center;min-width:28px;height:28px;padding:0 6px;background:var(--w);color:var(--k);font:400 17px/1 var(--f-disp)}
  & .ty{display:inline-flex;align-items:center;gap:5px;font:800 16px/1 var(--f-cond);letter-spacing:.06em;color:var(--w);background:var(--tc);padding:3px 12px 3px 5px;transform:skewX(-12deg);text-shadow:0 1px 0 rgba(0,0,0,.45)}
  & .ty img{width:20px;height:20px;transform:skewX(12deg)}
  & .hpbar{display:block;width:var(--w,260px);height:16px;background:var(--k);border:2px solid var(--w);transform:skewX(-24deg);overflow:hidden}
  & .hpbar i{display:block;height:100%;background:var(--hp)}
  & .hpbar.mid i{background:var(--hpmid)} & .hpbar.low i{background:var(--hplow)}
  & .mk{font-family:var(--f-mark);font-weight:400}
  /* title */
  & .s-title .logo{position:absolute;left:54px;top:150px;transform:rotate(-7deg);font-size:112px;display:flex;flex-direction:column;gap:14px;animation:inL .5s cubic-bezier(.2,1.3,.4,1) both}
  & .s-title .logo .rs:last-child{margin-left:70px;font-size:126px}
  & .s-title .tag{position:absolute;left:170px;top:478px;font:400 34px/1 var(--f-mark);color:var(--w);transform:rotate(-7deg)}
  & .s-title .press{position:absolute;left:96px;top:560px;--r:-3deg;font-size:40px;animation:blink 1.3s steps(2) infinite}
  & .s-title .ver{position:absolute;left:26px;bottom:16px;font:800 18px/1 var(--f-cond);letter-spacing:.14em;color:var(--w)}
  & .s-title .heroes{position:absolute;right:40px;bottom:0;width:560px;height:640px}
    /* main menu */
  & .s-menu .list{position:absolute;left:70px;top:170px;display:flex;flex-direction:column;gap:12px}
  & .s-menu .list .blade:nth-child(odd){--r:-5deg} & .s-menu .list .blade:nth-child(even){--r:-2deg;margin-left:34px}
  & .s-menu .list .blade{animation:inL .4s cubic-bezier(.2,1.3,.4,1) both;animation-delay:calc(var(--i)*45ms)}
  & .s-menu .who{position:absolute;right:120px;bottom:0;animation:inR .45s cubic-bezier(.2,1.2,.4,1) both}
  & .s-menu .who .sh{filter:brightness(0) saturate(100%) invert(13%) sepia(96%) saturate(6500%) hue-rotate(343deg) brightness(92%);opacity:.95}
  & .s-menu .card{position:absolute;right:40px;top:60px;width:330px;background:var(--w);color:var(--k);padding:14px 20px 16px;transform:rotate(4deg);clip-path:polygon(0 4%,100% 0,97% 100%,3% 96%);font:700 20px/1.25 var(--f-cond)}
  & .s-menu .card b{display:block;font:400 30px/1 var(--f-disp);text-transform:uppercase}
  /* battle */
  & .s-battle .plate{position:absolute;background:var(--k);color:var(--w);padding:12px 30px 14px 26px;clip-path:polygon(0 0,100% 8%,96% 100%,2% 92%)}
  & .s-battle .plate h3{margin:0;font:400 38px/1 var(--f-disp);text-transform:uppercase;display:flex;align-items:baseline;gap:14px;white-space:nowrap}
  & .s-battle .plate h3 span{font:800 22px/1 var(--f-cond);color:var(--bone)}
  & .s-battle .plate .row{display:flex;gap:10px;align-items:center;margin-top:8px}
  & .s-battle .plate .num{font:400 26px/1 var(--f-disp);font-variant-numeric:tabular-nums}
  & .s-battle .foe{left:26px;top:30px;transform:rotate(-3deg);animation:inL .4s both}
  & .s-battle .me{right:330px;bottom:150px;transform:rotate(-2deg);animation:inR .4s both}
  & .s-battle .cmds{position:absolute;right:30px;bottom:74px;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
  & .s-battle .cmds .blade{font-size:46px;animation:inR .35s cubic-bezier(.2,1.3,.4,1) both;animation-delay:calc(var(--i)*50ms)}
  & .s-battle .msg{position:absolute;left:24px;bottom:22px;width:600px;background:var(--w);color:var(--k);padding:16px 30px 18px;font:700 28px/1.15 var(--f-cond);clip-path:polygon(0 8%,100% 0,97% 100%,2% 94%);transform:rotate(-1.5deg)}
  & .s-battle .balls{position:absolute;display:flex;gap:6px}
  & .s-battle .mega{position:absolute;right:300px;bottom:84px;display:flex;align-items:center;gap:8px;background:var(--gold);color:var(--k);font:400 26px/1 var(--f-disp);padding:6px 18px 6px 10px;transform:rotate(-6deg) skewX(-10deg)}
  /* event */
  & .s-event .dlg{position:absolute;left:150px;bottom:34px;width:990px;min-height:170px;background:var(--k);color:var(--w);padding:34px 46px 26px 56px;clip-path:polygon(1% 6%,100% 0,98% 100%,0 92%);font:700 29px/1.22 var(--f-cond);animation:inUp .3s both}
  & .s-event .who{position:absolute;left:190px;bottom:188px;background:var(--red);color:var(--on);font:400 32px/1 var(--f-disp);padding:6px 30px 8px 22px;transform:rotate(-4deg) skewX(-10deg);text-transform:uppercase;box-shadow:6px 6px 0 var(--k)}
  & .s-event .opts{position:absolute;right:40px;top:150px;display:flex;flex-direction:column;gap:16px;align-items:flex-end}
  & .s-event .opts .blade{font-size:34px;background:var(--k);animation:inR .35s both;animation-delay:calc(var(--i)*60ms)}
  & .s-event .opts .blade.on{background:none}
  & .s-event .npc{position:absolute;left:56px;bottom:150px}
  /* pause + settings */
  & .s-pause .list{position:absolute;left:80px;top:150px;display:flex;flex-direction:column;gap:6px}
  & .s-pause .list .blade{font-size:46px;--sh:var(--k);animation:inL .4s cubic-bezier(.2,1.3,.4,1) both;animation-delay:calc(var(--i)*40ms)}
  & .s-pause .list .blade:nth-child(even){margin-left:30px;--r:-2deg}
  & .s-pause .party{position:absolute;right:36px;top:60px;width:520px;display:flex;flex-direction:column;gap:8px}
  & .s-pause .pm{display:grid;grid-template-columns:76px 1fr auto;align-items:center;gap:10px;background:var(--k);padding:6px 24px 6px 10px;clip-path:polygon(0 0,100% 0,96% 100%,2% 100%);animation:inR .4s both;animation-delay:calc(var(--i)*40ms)}
  & .s-pause .pm:nth-child(even){transform:translateX(-22px)}
  & .s-pause .pm .pic{height:70px;display:grid;place-items:center}
  & .s-pause .pm b{display:block;font:400 26px/1 var(--f-disp);text-transform:uppercase;margin-bottom:6px}
  & .s-pause .pm .lv{font:800 20px/1 var(--f-cond);text-align:right}
  & .s-pause .pm .lv small{display:block;font:700 16px/1 var(--f-cond);color:var(--bone);margin-top:5px}
  & .s-pause .foot{position:absolute;left:36px;bottom:18px;display:flex;gap:10px}
  & .s-pause .foot span{background:var(--w);color:var(--k);font:800 20px/1 var(--f-cond);padding:7px 18px;transform:skewX(-12deg)}
  & .s-set .tabs{position:absolute;left:400px;top:52px;display:flex;gap:6px}
  & .s-set .tabs span{font:400 24px/1 var(--f-disp);padding:8px 20px;background:#222;color:#aaa;transform:skewX(-14deg);text-transform:uppercase}
  & .s-set .tabs span.on{background:var(--red);color:var(--on)}
  & .s-set .rows{position:absolute;left:110px;top:150px;width:1060px;display:flex;flex-direction:column;gap:8px}
  & .s-set .row{display:flex;justify-content:space-between;align-items:center;padding:9px 34px;font:800 28px/1 var(--f-cond);text-transform:uppercase;letter-spacing:.03em;border-bottom:2px solid #333;animation:inUp .3s both;animation-delay:calc(var(--i)*30ms)}
  & .s-set .row .val{font:400 28px/1 var(--f-disp);color:var(--bone);display:flex;gap:16px;align-items:center}
  & .s-set .row .val::before{content:"◀";font-size:16px;color:var(--red)} & .s-set .row .val::after{content:"▶";font-size:16px;color:var(--red)}
  & .s-set .row.on{background:var(--w);color:var(--k);border-color:var(--w);clip-path:polygon(0 0,100% 6%,99% 100%,1% 94%);box-shadow:none}
  & .s-set .row.on .val{color:var(--k)}
  & .s-set .help{position:absolute;left:110px;bottom:70px;width:760px;font:400 24px/1.25 var(--f-mark);color:var(--bone);transform:rotate(-1.5deg)}
}

/* ===== pass 2 · battle leaves the box: command burst, party stack, and a page each for moves, party, bag, hit ===== */
@keyframes pop{from{transform:scale(.2) rotate(var(--r,0deg));opacity:0}}
@keyframes jit{0%,100%{transform:rotate(var(--r,0deg)) translate(0,0)}50%{transform:rotate(calc(var(--r,0deg) + .6deg)) translate(1px,-1px)}}
@keyframes lock{from{transform:rotate(0) scale(1.5);opacity:0}to{transform:rotate(90deg) scale(1)}}
@keyframes shake{0%,100%{transform:translate(0,0)}20%{transform:translate(-10px,4px)}40%{transform:translate(9px,-5px)}60%{transform:translate(-6px,2px)}80%{transform:translate(4px,-2px)}}
@keyframes lines{to{background-position:-400px 0}}
@keyframes drain{from{width:var(--from)}}
.p2{
  & .frame{position:absolute;inset:0;pointer-events:none;background:linear-gradient(var(--k),var(--k)) top/100% 0 no-repeat}
  & .frame::before,& .frame::after{content:"";position:absolute;left:0;right:0;height:120px;background:var(--k)}
  & .frame::before{top:0;clip-path:polygon(0 0,100% 0,100% 18%,0 62%)} & .frame::after{bottom:0;clip-path:polygon(0 80%,100% 30%,100% 100%,0 100%)}
  & .dim{position:absolute;inset:0;background:rgba(8,6,10,.62)}
  & .foe2{position:absolute;left:22px;top:26px;transform:rotate(-3deg);animation:inL .4s both}
  & .foe2 h3{margin:0;display:inline-flex;align-items:baseline;gap:12px;background:var(--k);color:var(--w);font:400 44px/1 var(--f-disp);padding:6px 34px 8px 20px;clip-path:polygon(0 0,100% 0,95% 100%,0 100%);text-transform:uppercase}
  & .foe2 h3 span{font:800 22px/1 var(--f-cond);color:var(--gold)}
  & .foe2 .r{display:flex;align-items:center;gap:10px;margin:7px 0 0 16px}
  & .slash{display:block;position:relative;width:var(--w,300px);height:22px;background:var(--k);clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,0 100%);padding:4px 18px 4px 4px}
  & .slash i{display:block;height:100%;background:var(--hp);clip-path:polygon(0 0,100% 0,calc(100% - 9px) 100%,0 100%)}
  & .slash.mid i{background:var(--hpmid)} & .slash.low i{background:var(--hplow)}
  & .slash.xp{height:12px;padding:3px 12px 3px 3px} & .slash.xp i{background:var(--cyan)}
  & .num2{font:400 26px/1 var(--f-disp);color:var(--w);text-shadow:2px 2px 0 var(--k);font-variant-numeric:tabular-nums}
  & .turn{position:absolute;right:300px;top:20px;background:var(--red);color:var(--on);font:400 28px/1 var(--f-disp);padding:6px 24px 8px;transform:rotate(3deg) skewX(-12deg);box-shadow:5px 5px 0 var(--k)}
  /* command burst */
  & .cw{position:absolute;left:330px;top:150px;width:520px;height:470px}
  & .cwbg{position:absolute;inset:0;background:var(--k);clip-path:polygon(8% 30%,30% 4%,44% 22%,70% 0,74% 26%,100% 30%,82% 50%,98% 76%,70% 74%,58% 100%,40% 78%,12% 92%,22% 60%,0 52%);animation:pop .3s cubic-bezier(.2,1.4,.4,1) both}
  & .cwbg.r{background:var(--red);transform:translate(12px,10px);animation:none}
  & .cw .c{position:absolute;display:flex;align-items:center;gap:10px;font:400 var(--fs,44px)/1 var(--f-disp);color:var(--w);text-transform:uppercase;transform:rotate(var(--r));white-space:nowrap;animation:pop .28s cubic-bezier(.2,1.5,.4,1) both;animation-delay:calc(var(--i)*45ms + 80ms)}
  & .cw .c kbd{display:grid;place-items:center;width:34px;height:34px;background:var(--w);color:var(--k);font:400 20px/1 var(--f-disp);transform:rotate(-8deg);box-shadow:3px 3px 0 var(--red)}

@keyframes ringdash{to{transform:translate(0,0) rotate(360deg)}}
@keyframes glow{50%{filter:drop-shadow(0 0 14px rgba(125,249,255,.9))}}
@keyframes tide{50%{transform:translateY(-10px)}}
.p6[data-liv=midnight]{
  --k:#041036;--w:#f4fbff;--red:#22b8ff;--red2:#0b63d6;--on:#041036;--accw:#0b63d6;--ink:#020a26;--bone:#b9d8f2;--gold:#ffe56b;--cyan:#7df9ff;

  background:var(--ink);
  & *{font-weight:800!important;font-style:italic!important}
  & .bgr{background:linear-gradient(160deg,#1668e0 0%,#0a2f9c 45%,#041036 100%)}
  & .bgk{background:radial-gradient(120% 90% at 80% 10%,#0a2c86 0%,#020a26 70%)}
  & .burst{background:repeating-conic-gradient(from 0deg,rgba(125,220,255,.13) 0 2.5deg,transparent 2.5deg 15deg);animation-duration:140s}
  & .dots{background:radial-gradient(circle,rgba(170,235,255,.45) 2px,transparent 3px) 0 0/90px 120px,radial-gradient(circle,rgba(170,235,255,.22) 5px,transparent 6px) 40px 60px/130px 170px;-webkit-mask-image:linear-gradient(0deg,#000,transparent 85%);mask-image:linear-gradient(0deg,#000,transparent 85%);animation:bubbles 7s linear infinite}
  & .shard{opacity:.92;background:linear-gradient(180deg,var(--c,#06164a),#020a26)}
  & .rs b{background:none!important;box-shadow:none!important;clip-path:none!important;color:var(--w)!important;transform:none!important;padding:0!important;margin:0!important;letter-spacing:.07em;font-size:1em!important;text-shadow:0 0 22px rgba(34,184,255,.9)}
  & .rs b:first-child{color:var(--cyan)!important}
  & .rs{border-bottom:8px solid var(--red);padding:0 40px 6px 0;position:relative}
  & .rs::after{content:"";position:absolute;right:0;bottom:-8px;width:34px;height:8px;background:var(--w)}
  & .blade{transform:rotate(-3deg)!important;letter-spacing:.03em}
  & .blade.on{color:var(--k)}
  & .blade.on::before,& .blade.on::after{clip-path:polygon(4% 0,100% 0,96% 100%,0 100%);inset:-2px -22px;background:linear-gradient(90deg,#fff,#aeefff)}
  & .blade.on::after{background:var(--red);transform:translate(0,7px) scaleY(.12);transform-origin:50% 100%}
  & .hd{background:none;clip-path:none;transform:rotate(-3deg);padding-left:54px;text-shadow:0 0 26px rgba(34,184,255,.9);border-bottom:6px solid var(--red);letter-spacing:.05em}
  & .hd small{color:var(--cyan)}
  & .key{background:rgba(4,16,54,.75);clip-path:none;border:2px solid var(--w);border-radius:999px;padding:5px 16px 5px 5px}
  & .key b{border-radius:999px;background:var(--red);color:var(--k)}
  & .ty{transform:skewX(-18deg);border-radius:2px}
  & .slash,& .slash i,& .hpbar{clip-path:none;transform:skewX(-30deg)} & .slash i{transform:none;box-shadow:0 0 10px currentColor}
  & .frame::before,& .frame::after{background:linear-gradient(90deg,#020a26,#0a2f9c)}
  /* battle: the burst becomes a ring */
  & .cwbg{clip-path:none;border-radius:50%;inset:26px 60px 34px 50px;background:radial-gradient(circle,rgba(4,16,54,.94) 0 62%,rgba(34,184,255,.5) 62.5% 64%,rgba(4,16,54,.8) 64.5% 100%);animation:pop .3s both}

  & .cw .c.on{clip-path:polygon(4% 0,100% 0,96% 100%,0 100%);background:linear-gradient(90deg,#fff,#aeefff)}
  & .cw .c.on kbd{background:var(--k);color:var(--w)}
  & .say,& .msg{clip-path:polygon(3% 0,100% 0,97% 100%,0 100%);background:rgba(244,251,255,.95);border-bottom:6px solid var(--red)}
  & .turn{box-shadow:none;border-bottom:4px solid var(--w)}
  & .stack .m,& .pm,& .pc,& .tl,& .kv,& .it,& .sr,& .slot,& .cat,& .dx,& .ch,& .mv .c,& .info,& .stop,& .rail span{background:linear-gradient(90deg,rgba(6,28,92,.94),rgba(3,14,48,.94));box-shadow:inset 5px 0 0 var(--red)}
  & .stack .m.on,& .pc.on,& .tl.up,& .it.on,& .sr.on,& .slot.on,& .cat.on,& .dx.on,& .ch.on,& .mv .c.on{background:linear-gradient(90deg,#fff,#c7f3ff);box-shadow:inset 8px 0 0 var(--red);color:var(--k)}

  & .foe2 h3,& .plate{background:linear-gradient(90deg,rgba(6,28,92,.96),rgba(3,14,48,.7))}
  & .foe2 h3 span{color:var(--cyan)}
  & .eff.se{box-shadow:0 0 0 3px var(--k),0 0 24px var(--gold)}
  & .ring{border-color:var(--cyan)} & .ring::before,& .ring::after{background:var(--cyan)}
  & .gim{box-shadow:none;border-bottom:5px solid var(--k)}
  & .speed{background:repeating-linear-gradient(90deg,transparent 0 46px,rgba(255,255,255,.9) 46px 50px,transparent 50px 130px,rgba(2,10,38,.85) 130px 150px,transparent 150px 400px),linear-gradient(#1668e0,#0a2f9c)}
  & .cut .rays{background:repeating-linear-gradient(0deg,#7df9ff 0 22px,#fff 22px 30px,#041036 30px 74px,#22b8ff 74px 82px,#041036 82px 150px)}
  /* talk */
  & .talk{clip-path:polygon(2% 0,100% 0,98% 100%,0 100%);background:linear-gradient(180deg,rgba(6,28,92,.96),rgba(2,10,38,.96));border-top:5px solid var(--red)}
  & .talk::before{border-width:0 0 2px 0;border-color:rgba(125,249,255,.6);clip-path:none;inset:14px 40px}
  & .name{clip-path:polygon(4% 0,100% 0,96% 100%,0 100%);transform:rotate(-3deg)}
  & .nextb{background:var(--red);color:var(--k)}
  & .strip{background:linear-gradient(180deg,#aeefff,#22b8ff);opacity:.5} & .strip.r{background:var(--w);opacity:.35}
  & .bust .sh,& .hero .sh,& .s-menu .who .sh{filter:brightness(0) saturate(100%) invert(58%) sepia(92%) saturate(1800%) hue-rotate(170deg) brightness(104%);opacity:.75}
  /* run */
  & .day>b,& .day>div{-webkit-text-stroke-color:var(--k);text-shadow:0 0 26px rgba(34,184,255,.9)}
  & .day>strong{box-shadow:none;border-bottom:4px solid var(--w)} & .day>i{background:none;color:var(--cyan);letter-spacing:.14em;text-transform:uppercase;font-size:17px}
  & .day::after{content:"";position:absolute;left:100%;top:6px;margin-left:22px;width:74px;height:74px;border-radius:50%;background:radial-gradient(circle at 68% 42%,transparent 0 36px,#fdfbe0 37px);box-shadow:0 0 30px rgba(253,251,224,.75);animation:tide 5s ease-in-out infinite}
  & .s-map .wash{background:#0a2f9c} & .s-map .tex{opacity:.6}
  & .s-map .ln{stroke:#020a26} & .s-map .ln2{stroke:var(--cyan)} & .s-map .ln2.old{stroke:#4a6aa8}
  & .nd{border-radius:50%;background:#06205f;border-color:var(--cyan)} & .nd.next,& .nd.sel{background:var(--w);border-color:var(--red)} & .nd.sel{box-shadow:0 0 0 6px var(--gold),0 0 40px var(--cyan)} & .nd.here{background:var(--red)}
  & .nd.done{background:#16306e;border-color:#4a6aa8}
  & .wallet{clip-path:polygon(5% 0,100% 0,100% 100%,0 100%);box-shadow:none;border-bottom:6px solid var(--red)}
  & .rc{box-shadow:0 0 0 4px var(--red);border-radius:6px} & .rc.on{box-shadow:0 0 0 5px var(--gold),0 0 50px var(--cyan)}
  & .rc .pic{background:linear-gradient(160deg,#1668e0,#041036);box-shadow:0 0 0 4px var(--red)}
  & .bub{clip-path:polygon(0 0,100% 0,100% 84%,40% 84%,30% 100%,26% 84%,0 84%)}
  /* menus */
  & .hub .h{--r:-3deg!important;letter-spacing:.03em} & .hub .h.on::before{background:linear-gradient(90deg,#fff,#aeefff);clip-path:polygon(3% 0,100% 0,97% 100%,0 100%)} & .hub .h.on::after{background:var(--red);transform:translate(0,8px) scaleY(.1);transform-origin:50% 100%}
  & .hub .h small{background:var(--red);color:var(--k)}
  & .facts span{background:rgba(4,16,54,.85);border-bottom:3px solid var(--red)} & .facts span b{color:var(--cyan)}
  & .sm-pic::before{clip-path:circle(46%);background:radial-gradient(circle,rgba(4,16,54,.9) 0 86%,var(--cyan) 87% 90%,transparent 91%)}
  & .radar .val{fill:rgba(125,249,255,.75);stroke:var(--w)} & .radar text.n{fill:var(--cyan)}
  & .sm-tabs span.on,& .pockets span.on,& .tabs span.on{box-shadow:none;border-bottom:5px solid var(--red)}
  & .tcard{box-shadow:0 0 0 4px var(--red),0 0 60px rgba(34,184,255,.6)} & .tcard::before{background:linear-gradient(160deg,#1668e0,#041036)}
  & .badges i.f{background:var(--cyan)}
  & .dexcard,& .rc,& .tcard,& .card{background:linear-gradient(180deg,#fff,#d9f6ff)}
  & .dexcard .pic{background:linear-gradient(160deg,#1668e0,#041036)}
  & .stop .pic{background:linear-gradient(160deg,#1668e0,#0a2f9c)}
  & .kcap,& .idet .big{box-shadow:0 0 0 3px var(--red)}
  & .stamp{color:var(--cyan);border-color:var(--cyan)}
  & .s-win .line{text-shadow:0 0 30px var(--red);font-size:56px} & .gains .g,& .prize,& .sm-lv,& .s-hit .dmg,& .cols span{text-shadow:0 0 26px rgba(34,184,255,.9)}
  & .prev{background:linear-gradient(160deg,#1668e0,#041036)}
  & .cat i{color:var(--red);opacity:.35}
  & .tcard .rs b{color:var(--k)!important;text-shadow:none} & .tcard .rs b:first-child{color:var(--accw)!important}
}

<div class="vw">
<header class="vw-top"><h1>Pocket Raiders <em>Phantom UI</em></h1>
<div class="vw-step"><button id="vw-prev" type="button">Earlier pass</button><output id="vw-out" for="vw-pass"></output><button id="vw-next" type="button">Later pass</button><input id="vw-pass" type="range" min="1" max="25" step="1" aria-label="Pass"><button id="vw-tour" type="button">Play tour</button></div></header>
<div class="vw-nav" id="vw-liv" hidden></div>

</div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><filter id="rough" x="-10%" y="-20%" width="120%" height="140%"><feTurbulence type="fractalNoise" baseFrequency=".022 .06" numOctaves="3" seed="4" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="26" xChannelSelector="R" yChannelSelector="G"/></filter><filter id="rough2" x="-5%" y="-10%" width="110%" height="120%"><feTurbulence type="fractalNoise" baseFrequency=".05" numOctaves="2" seed="9" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="9"/></filter></svg>
<script>const PASSES=[{"n": 1, "name": "The Phantom kit", "change": "The first cut of the style, taken from Persona 5: red, black and white only, every panel cut on a slant, cut-out ransom letters for the logo, a turning sunburst and halftone dots behind everything. Six core screens: Title, Main menu, Battle command, Event, Pause and Settings.", "pages": ["Title", "Main menu", "Battle command", "Event", "Pause menu", "Settings"], "q": {"x": "It is loud already, but flat: panels sit on the page and nothing overlaps or moves much yet. Battle is still a normal Pokémon layout with slanted boxes.", "b": "First pass, so there is nothing to beat. It sets the rules every later pass has to top.", "p": "Yes. Battle only has the command list; moves, party, bag and targets each need a page. That is pass 2.", "m": "Pause is one list with the party beside it, and Settings is one page with six tabs. Both work but both are crowded; they get split up in pass 4.", "k": "Only because of the sprites. Types and Poké Balls are tiny; later passes have to pull Pokémon things into the style itself."}}, {"n": 2, "name": "Battle leaves the box", "change": "Battle stops being a Pokémon layout with slanted boxes. Commands burst out of your Pokémon in a jagged star, each on its own key, the way Persona 5 puts orders around the hero. Your party stands in a stack down the right edge with live HP. Black slanted bars frame the field like a film shot. Fight, Pokémon and Bag each open their own page, and a hit gets a full-screen splash.", "pages": ["Moves", "Party (switch)", "Bag", "Hit splash"], "q": {"x": "Much more. The command burst and the Super Effective splash are the first things on the page that could not be mistaken for any other Pokémon game.", "b": "Pass 1 had four words in a column. Now each command has a key, a size and an angle, the party is always in view, and moves show their type, power, PP and how well they hit before you choose.", "p": "Four added. Moves, party and bag used to be nowhere; they are full pages now so the battle screen holds only the fight.", "m": "Not touched this pass. In battle, X on the burst is Run and Info opens foe details; Pause still needs its own pass.", "k": "Better: type colours carry the move cards, HP bars keep green, yellow and red, Poké Balls count the foe's team, and the run's real limits (10 heals, 6 revives) sit on the Bag page."}}, {"n": 3, "name": "The run gets a calendar", "change": "Outside battle, every screen now carries a stage stamp in the top corner, built like Persona 5's date: a huge stage number, the region on a red tag and the time and weather in marker pen. The route is a subway-style map of diamond stops over the region's town map. Events are split in two: the character leans in from the side and talks, and only after you press does the choice page appear, with what each choice costs. Rewards are dealt as three cards. The Mart has a clerk, a wallet and a running cart total.", "pages": ["Route map", "Event · choice", "Reward", "Poké Mart"], "q": {"x": "Yes. Big character art leaning into frame, dealt cards and the outlined stage number give each page one loud thing to look at.", "b": "Pass 2 only fixed battle. This pass covers the other half of a run, and the old one-page event (text and choices on top of each other) is replaced by talk then choice.", "p": "Four added. Splitting talk from choice also follows the rule that text stays until you press and rewards only come after.", "m": "Esc on the map opens the menu and C jumps straight to the party. The menu itself is still the pass 1 list; it is the next pass.", "k": "More than before: the route sits on the real region map, stops use Poké Balls, the Mart clerk is the game's own sprite, and the stage stamp shows time and weather, which matter for evolutions."}}, {"n": 4, "name": "Menus get rooms", "change": "The pause list becomes a hub: your trainer stands huge on the right, the chosen word swells to twice the size, and each word opens its own page. New pages for the Pokémon summary (with a six-point stat web, the Pokémon answer to Persona's stat star), the Pokédex, a Trainer card laid out like a calling card, and Save slots. Settings stops being one crowded page: a hub of six big tiles, then one short page each, never more than six rows.", "pages": ["Pokémon summary", "Pokédex", "Trainer card", "Save", "Settings hub", "Game", "Battle", "Look", "Sound", "Controls", "Access"], "q": {"x": "Yes. The trainer filling the pause screen and the stat web give the menus the big-art feel the battle already had.", "b": "Pass 1 squeezed seven jobs and the whole party onto one pause page and all settings behind six tiny tabs. Every job now has room, and Settings rows are big enough to read from the couch.", "p": "Eleven added. Settings alone went from one page to seven.", "m": "This pass is the answer: Esc opens the hub anywhere outside battle, Settings is the sixth word, and Q/E flips between its pages without going back.", "k": "The summary keeps what players expect (types, ability, nature, held item, four moves, Exp bar); the Pokédex shows dark shapes for unseen Pokémon and the game's Mastery ranks."}}, {"n": 5, "name": "Everything moves into everything", "change": "Motion pass. Changing page is now a morph: the header, the stage stamp, your trainer, your Pokémon, the party strip and the key hints each slide and resize from where they were to where they belong on the next page, while a red, black and white blade wipes the rest. Idle screens loop without a seam: the chosen item jitters, trainers breathe, the dots drift. Three new battle moments: a Mega Evolution cut-in across the eyes, a win splash with a line from your trainer, and a result tally where Exp bars fill and numbers punch in.", "pages": ["Mega cut-in", "Win splash", "Result"], "q": {"x": "This is the pass that makes it feel like Persona rather than look like it. The cut-in and the win splash are the showiest pages so far.", "b": "Passes 1 to 4 were still pictures with slide-ins. Now nothing just appears: each page grows out of the one before, and each loop returns to its first frame.", "p": "Three added. Win and Result are separate on purpose, so the splash stays clean and the numbers get room.", "m": "Opening Pause, picking a word and landing on its page is one unbroken move; the trainer shrinks from the hub into the Trainer card. Settings pages slide along the rail the same way.", "k": "Mega Evolution uses the game's own Mega ring and stone art, Exp bars fill the way they always have, and Red's victory line is six dots, because Red never talks."}}, {"n": 6, "name": "Blue version: Midnight", "change": "The style stops being one skin. Pokémon games come as versions, and so do Persona games, so each trainer now gets a version that borrows a different Persona. First is Blue version, taken from Persona 3 Reload: deep water blue, cyan light and glow instead of red and black, one clean slant instead of jagged cuts, bubbles rising where the dots were, a moon beside the stage stamp. The battle command star becomes a ring with a turning dashed rim. Blue stands where Red stood on every screen, with his own win line. Use the Version buttons above the stage to switch; all 27 screens have both.", "pages": [], "q": {"x": "It is calmer than Phantom on purpose, but the glow, the moon and the water give it its own kind of show. Having two looks at all is the big jump.", "b": "Passes 1 to 5 were one look with no way to tell runs apart. Now the look itself says whose run it is. Colours were also pulled out into named tokens, which is what makes versions possible.", "p": "No new pages this pass; every existing page gained a second look. A Version select page comes in pass 9.", "m": "Same pages, same keys. Settings › Look will get a Version row in pass 9.", "k": "More than any pass so far: Red and Blue versions are the oldest Pokémon idea there is, and the rival finally has his own look."}}, {"n": 7, "name": "Yellow version: Channel", "change": "The third version, taken from Persona 4 Golden. Where Phantom cuts and Midnight glows, Channel is a TV set: bright yellow with moving colour bars and scan lines, every panel rounded with a thick black outline and a drop shadow, chunky friendly lettering, a spinning sun as the weather forecast beside the stage stamp, and the battle command star turned into a rounded TV screen. Hilda is the trainer. All 27 screens.", "pages": [], "q": {"x": "It is the loudest of the three and the most cheerful. The colour bars and the thick outlines read from across a room.", "b": "Pass 6 proved a second version could work by changing colour and glow. This one changes shape as well: slanted cut panels become rounded outlined ones, which the token work in pass 6 did not cover, so accent text got its own token too.", "p": "No new pages; every page gained a third look.", "m": "Unchanged. The Settings rows turn into rounded switches and sliders here, which suits them better than slants did.", "k": "Yes. Yellow version was the Pikachu one, and this is the look where the sprites feel most at home: bright, toy-like, sunny."}}, {"n": 8, "name": "Green version: Fantasia", "change": "The fourth version, taken from Metaphor: ReFantazio. Nothing here is flat colour: backgrounds are grainy verdigris paint, the black shapes have torn, brushed edges, and thin gilt lines frame every panel. Lettering is a tall serif with a gold drop capital and italics. The slant is gone; everything sits upright and is built on circles: an astrolabe turns behind the pages, map stops are ringed medals, and the battle commands sit around a turning wheel instead of a star. Green is the trainer. All 27 screens.", "pages": [], "q": {"x": "In a different way from the others: rich instead of loud. The turning gilt rings, the paint grain and the serif capitals make it look like a storybook.", "b": "Midnight and Channel changed colour and panel shape. Fantasia changes the material (paint and paper instead of flat ink), the lettering and the geometry, and moves the six battle commands onto a wheel.", "p": "No new pages; every page gained a fourth look.", "m": "Unchanged in structure. The pause words stand upright with diamond bullets, and Settings rows read like a ledger with gilt rules.", "k": "Green version was the very first Pokémon game in Japan, so it suits the old-book look. Types sit on small heraldic ribbons and HP bars keep their colours inside gilt frames."}}, {"n": 9, "name": "Pick your version", "change": "The four looks stop being a hidden switch and become a choice the player makes. A new Version Select page lines the trainers up in five slanted columns, each drawn in its own style, and the one you pick opens wide. A fifth version arrives, Gold, in the style of the Velvet Room: blue curtains, gold trim, arched windows, and titles dealt out as playing cards. Settings › Look now names your version, the title screen wears a version tag, and switching plays a full-screen flash with the version's name.", "pages": ["Version select"], "q": {"x": "Yes. The select page shows all five styles side by side at once, which no earlier pass could, and the Gold version adds a rich, quiet look to contrast the loud ones.", "b": "Passes 6 to 8 added looks you could only reach from the viewer. Now the game itself has a page and a setting for them, a trainer tied to each, and a proper switch animation.", "p": "One new page, Version Select, so the choice is not buried in a settings row.", "m": "Settings › Look gets a Version row and a preview that opens the select page. The Main Menu title carries the version tag with a key to change it.", "k": "Very much: Red, Blue, Yellow, Green and Gold versions are how Pokémon games have always been sold, each with a cover Pokémon."}}, {"n": 10, "name": "Every version gets its own stage", "change": "Until now the versions shared one layout and changed its paint. This pass gives each one its own staging for the two screens you see most, the title and the pause hub. Blue rises out of a tide under a full moon, with the menu as a staircase of slanted words. Yellow has the trainer climbing out of a TV set, with the menu as a stack of colourful show cards. Green sets the trainer inside an astrolabe ring with the menu running around its rim. Gold deals the menu as seven tarot cards under a spotlight. Each title also shows that version's own cover Pokémon. Red keeps the angled Phantom layout as the baseline. All five versions were checked on every page for cut-off or overlapping text.", "pages": [], "q": {"x": "Yes. The five title screens no longer look like recolours of each other; each has its own scene, shapes and movement.", "b": "Passes 6 to 9 changed colours, lettering and panel shapes. This one changes where things stand and how the menu is built, so a version is recognisable even as a silhouette.", "p": "No new pages. Instead the same two pages exist in five different layouts.", "m": "The pause hub is the menu, and it is the page that changes most: a staircase, show cards, a ring, or a card spread. Settings is one of its seven entries in every version.", "k": "Each version has its own cover Pokémon on the title (Charizard, Gyarados, Pikachu, Venusaur, Gengar), the way each Pokémon game has its own box art."}}, {"n": 11, "name": "A road into every run", "change": "Starting a run used to be one menu line. Now it is four short pages joined by a step ribbon in the corner: pick a version, answer Prof. Oak's partner quiz, choose one of three partners from three different regions, then sign off the run's rules on a calling card. Each partner card shows its Remembrance, the record you have with it from past runs. This pass also adds a shared panel that every version dresses its own way, so all later pages arrive finished in all five versions.", "pages": ["Partner quiz", "Choose partner", "Run rules"], "q": {"x": "Yes. The partner cards flip in and the chosen one lifts with a gold frame, and the rules page is a signed calling card instead of a list.", "b": "Interval 2 was about looks. This pass is about flow: a new run is now a small ceremony with a clear start and end, instead of dropping the player straight onto the map.", "p": "Three new pages. The quiz, the partner pick and the rules each get a whole screen, so none of them has to share space.", "m": "New Run on the Main Menu leads into this road. The rules page reuses the Settings rows, so it reads the same as Settings, but only holds the five rules that lock when a run begins.", "k": "A professor's quiz and three starters to choose from is the most Pokémon opening there is, and the three always come from different regions as the game's rules say."}}, {"n": 12, "name": "The world gets a map", "change": "Hub Town and Pocket Town become places you can see at a glance. The Hub Town map is drawn from the game's real town layout, tipped on a slant, with the five districts named, all 18 places pinned and a numbered list beside it so any building is two presses away. Going inside a place now has its own page: the keeper stands on the left, the rooms are big slanted choices, and a preview shows what the chosen room holds. Pocket Town's 54 places are sorted into its five hamlets as a directory of tiles, with tags for what is ready today.", "pages": ["Hub Town map", "Inside a place", "Pocket Town"], "q": {"x": "Yes. A real map with pulsing pins and district colours is far more striking than a list of buildings, and the keeper busts make each place feel staffed.", "b": "Pass 11 built the road into a run. This pass builds everything around the run: the town between runs, which until now had no page in this redesign at all.", "p": "Three new pages: the map, the inside of a building, and the Pocket Town directory. Each building's rooms get space instead of sharing one crowded hub menu.", "m": "The map is reached from Hub Town on the Main Menu and by pressing M in town. Settings keeps Hub style, so players who prefer to walk can still walk.", "k": "A town map with a fly-to list is straight out of the Pokémon Town Map, and the Pokémon Center, Bank and Day-care style places are all there by name."}}, {"n": 13, "name": "People remember you", "change": "The run now has faces. The four rivals who are always on your trail get a board of their own, each with a rivalry rank from 1 to 10, your record against them, where you meet next and the ace they will announce. When a rivalry deepens the game stops for a full-screen Rank Up moment with a falling-paper burst and a card for the rival. Between stages, the Rotom Phone shows messages from rivals, Prof. Oak and even your Pokémon as slanted chat bubbles, and Rotom chips in with tips. (The rank is a new idea shown here for the director to accept or drop.)", "pages": ["Rivals", "Rank up", "Rotom Phone"], "q": {"x": "Yes. A giant outlined rank number behind the rival, the Rank Up splash and the chat bubbles are the loudest pages since the battle cut-ins.", "b": "Passes 11 and 12 built the road and the town. This pass adds the people on it, which makes the run feel like a story with a cast instead of a list of fights.", "p": "Three new pages. Rival details used to be one line on the route map; now they have room for records, aces and what changes at the next rank.", "m": "Rivals and the Rotom Phone are both entries on the pause hub. Settings › Game can turn phone messages off for players who want fewer interruptions.", "k": "Rivals who text you and brag are pure Pokémon, the phone is the Rotom Phone, and each rival's ace is called out by name, as the game's ace rule asks."}}, {"n": 14, "name": "Ceremonies", "change": "The big moments of a run stop being pop-ups. Evolution, learning a move, a capture and a Legendary Blessing each get a staged page with black bars sliding in top and bottom and the moment's name running along them like a film strip. Evolution shows the old shape as a white silhouette, three pulsing arrows and the new Pokémon bursting in with its stat gains counting up, and it says that B stops it. A new move is offered as a tilted card beside the four it could replace, with a plain line on what you would gain. A capture shakes the ball three times before the card flips in. A Blessing floats as a single card on pure black, with no spotlight and no podium.", "pages": ["Evolution", "New move", "Capture", "Legendary Blessing"], "q": {"x": "Yes. The letterbox bars, the running ticker and the cards flipping in make these the most theatrical pages so far.", "b": "Passes 11 to 13 added places and people. This pass adds time: the game now slows down and frames its own best moments, which is what makes Persona's battles and rank-ups memorable.", "p": "Four new pages. Learning a move in particular used to share the result screen; alone, it has room to compare the old move with the new one.", "m": "Settings › Battle already has cut-ins Every time, Once per battle or Off; the same switch shortens these pages to their last frame. None of them is reachable from the menu, they only happen.", "k": "\"What? Charmeleon is evolving!\", \"Gotcha!\" and choosing which of four moves to forget are the most familiar Pokémon moments there are, kept word for word."}}, {"n": 15, "name": "One press from anywhere", "change": "With 44 pages, finding your way matters more than adding another. Hold Tab anywhere in a run and a quick wheel pops over the map with eight places to jump to; point and let go. Menu pages now carry a trail strip in the bottom corner that says where you are (Pause, Settings, Look) and which pages sit either side on Q and E. Two pages that were only promised by a button now exist: the text log, which keeps every line and choice of the stage, and the Reserve box, where a seventh catch waits. Every page was re-checked in all five versions.", "pages": ["Quick wheel", "Text log", "Reserve"], "q": {"x": "The quick wheel is the showpiece: eight slanted plates spring out in a ring and the chosen one swells in the accent colour.", "b": "Passes 11 to 14 each added pages. This one ties them together, so the redesign reads as one game with a clear spine instead of a pile of screens.", "p": "Three new pages, and both the log and the Reserve take jobs away from crowded ones (the event page and the party page).", "m": "The wheel is the menu when you are in a hurry, and the pause hub is the menu when you are not. Settings is on both, and the trail strip always shows the way back to it.", "k": "The Reserve is the PC Box by another name, with the same grid of sprites, and the wheel uses plain Pokémon words: Party, Bag, Pokédex, Save."}}, {"n": 16, "name": "The fight gets a cast", "change": "Until now a battle simply began. Now it is introduced. A Versus page splits the screen down a slanted line with your trainer on one side and the rival on the other, their Poké Balls counted out and the stakes written underneath. One press opens a scouting page that shows what you have seen of their team this run, and nothing you have not. When a trainer sends out their ace it is announced with its own cut-in, the trainer's eyes across the screen and an ACE star, so the ace rule is impossible to miss. Bosses get a title card that lists the gimmicks they carry.", "pages": ["Versus", "Scout the team", "Ace announcement", "Boss title card"], "q": {"x": "Yes. The Versus slam and the ace cut-in are the loudest things in the game so far: the screen tears in two, the letters land with a thud, and a star spins in.", "b": "Interval 3 added calm pages around the battle. This pass adds drama in front of it, so a rival or a Champion feels like an event before a single move is chosen.", "p": "Four new pages. Scouting is its own page so the Versus page stays a poster, and the ace gets a page to itself because the rule says it must be announced.", "m": "The pause menu and the quick wheel are closed while these play, since they last a second or two. Settings › Battle already has an Ace announcement switch and a cut-in length setting that these pages obey.", "k": "Poké Balls count the teams exactly as the old games did, the foes are canon (Silver with Sneasel and Gengar, Lance with his dragons), and the wording is plain trainer talk."}}, {"n": 17, "name": "The command screen reads the fight", "change": "The battle screen itself is rebuilt. Commands no longer sit in a burst in the middle; they fan out in an arc around your own Pokémon, the way Persona hangs its menu on the hero, and the chosen one grows. A turn ribbon across the top shows who moves next. The foe panel now shows what you actually know: status, stat changes and the types it is weak to. Moves moved onto a four-way cross, one press each, beside a target card that previews how much HP the move should take. Two new pages hold the detail so the main screen stays clean: Battle info and the Battle log.", "pages": ["Battle info", "Battle log"], "q": {"x": "The fan springs open plate by plate and the damage preview pulses on the foe's HP bar. It is flashier and it tells you more at the same time.", "b": "Pass 16 dressed up the start of a fight. This pass changes the part you look at most: fewer presses to pick a move, and the answers to “who goes first” and “will this hurt” are on screen before you ask.", "p": "Two new pages. Stat stages, weather and hazards went to Battle info, and the turn-by-turn record went to Battle log, instead of being squeezed around the arena.", "m": "Pause and the quick wheel still open from here. Settings › Battle decides whether the damage preview and weakness icons show, for players who want the old guessing game.", "k": "Fight, Pokémon, Bag and Run are all still there in the classic order, with type icons, PP and status tags like PAR exactly as the series writes them."}}, {"n": 18, "name": "Four gimmicks, four different shows", "change": "Mega Evolution had a cut-in since pass 5 and the other three gimmicks had nothing. Now each has its own show, built so you could tell them apart with the sound off. Terastallize fills the screen with moving prism light, crowns the Pokémon and spells its name in cut gems. Dynamax makes the Pokémon tower out of frame over a tiny foe while the letters stack up the side like a building. The Z-Move is a gold flare with a huge Z and the trainer in silhouette. Because a battle allows only one, a new Gimmick page deals the four as cards and says which are ready.", "pages": ["Choose a gimmick", "Terastallize cut-in", "Dynamax cut-in", "Z-Move cut-in"], "q": {"x": "By a long way. These are the most over-the-top pages in the set, and each one has its own colours and its own kind of lettering instead of sharing one template.", "b": "Pass 17 was about reading the fight calmly. This is the opposite: the reward for pressing the big button. It also fixes a gap, since three of the four gimmicks had no page at all.", "p": "Four new pages. The chooser keeps a four-way decision off the command screen, where it would have meant four extra buttons.", "m": "Settings › Battle has a Gimmick cut-ins row (every time, first time each battle, off). With cut-ins off the battle shows a one-line banner instead, so nothing here is forced on anyone.", "k": "These are the series' own four gimmicks with their own icons from the game files, the Tera crown, the Dynamax turn count and Max Moves, and a real Z-Move name."}}, {"n": 19, "name": "Every fight gets an ending", "change": "Battles had a start and a middle but only one way to end: You Win. Now the ending depends on what happened. A knockout gets its own splash in the Persona finishing-blow style, with the winner posed large and the loser tipped over. A boss who is nearly beaten gets a Last Stand page, two shutters closing on the screen with a phase meter between them. Losing to a rival shows Not Over, which says in plain words that the run goes on. And when a run really does end, the Run Over page is quiet instead of loud: the road you travelled, your best Pokémon, and what you keep.", "pages": ["Knockout splash", "Boss last stand", "Rival loss", "Run over"], "q": {"x": "The knockout and Last Stand pages are as loud as anything so far. Run Over is deliberately the opposite, and the contrast makes both land harder.", "b": "Passes 16 to 18 built the fight up. This one pays it off, and it closes two gaps: nothing told you a rival loss was safe, and nothing marked the end of a run.", "p": "Four new pages. Each is a moment that used to be a single line of text in the battle box.", "m": "Run Over is the one place where the menu is the page: New run, Back to Hub Town, Look back at the run. Settings stays reachable from Hub Town a press later.", "k": "A fainted Pokémon tips over the way it always has, the rival is still rude about winning, and what you keep is counted in Pokédex pages and Remembrances."}}, {"n": 20, "name": "The joins between pages", "change": "Since pass 5 every page change used the same slanted sweep. With 60 pages that became wallpaper, so now the join tells you what kind of thing is happening. Going into a fight slashes the screen open. Cut-ins and big moments open from the middle like a flashbulb. Menus drop in over a dimmed game. Moving to a new place pushes the old one away. Pages inside one menu keep the quick sweep. Two missing beats at the start of a battle were added: a wild Pokémon bursting out of the grass, and both sides sending out. A Page changes page in Settings shows all of the joins looping side by side.", "pages": ["Wild Pokémon appears", "Send out", "Page changes"], "q": {"x": "Yes, and this one is felt more than seen: click from the map into a fight and the whole screen tears open, where before it only slid.", "b": "Passes 16 to 19 made single pages louder. This pass works on the gaps between them, which is what makes 60 separate pages feel like one moving game.", "p": "Three new pages. The wild entrance and the send-out used to be one line of text each, and the joins get a page of their own so they can be judged without hunting for them.", "m": "Menus have their own join (the drop), so opening Pause or Settings never looks like starting a battle. The Page changes page lives in Settings › Look beside Motion, with Full, Reduced and Off.", "k": "A wild Pokémon appearing out of tall grass with a “!” and a thrown Poké Ball opening are the two oldest animations in the series. They are both here, just drawn in this style."}}];</script>

/* Engine: screens register versions by pass; the stage shows the newest version at or below the chosen pass. */
const SP='sprites/';
const SCR={},ORDER=[];
function scr(id,group,title,since,fn){(SCR[id]||(SCR[id]={id,group,title,v:[]})).v.push({since,fn});SCR[id].v.sort((a,b)=>a.since-b.since);if(!ORDER.includes(id))ORDER.push(id)}
const verAt=(id,p)=>{let r=null;for(const v of SCR[id].v)if(v.since<=p)r=v;return r};
const listAt=p=>ORDER.filter(id=>verAt(id,p));
const im=(n,z=1,c='',s='')=>`<i class="spr" style="${s}"><img class="px ${c}" src="${SP}${n}.png" alt="" style="--z:${z}"></i>`;
const at=(x,y,w,h)=>`left:${x}px;top:${y}px;${w!=null?`width:${w}px;`:''}${h!=null?`height:${h}px;`:''}`;
const TYC={normal:'#9fa19f',fire:'#ff6a2b',water:'#2f8fff',grass:'#3fb84a',electric:'#f7c400',ice:'#3fd8ff',fighting:'#ff8000',poison:'#a245d6',ground:'#a0672c',flying:'#7fb8ff',psychic:'#ff4f86',bug:'#96a81f',rock:'#b3a676',ghost:'#70417a',dragon:'#5a63e8',dark:'#50413f',steel:'#60a1b8',fairy:'#ef70ef'};
const ty=t=>`<span class="ty" style="--tc:${TYC[t]}"><img class="px" src="${SP}ty-${t}.png" alt="">${t.toUpperCase()}</span>`;
function rnd(seed){let h=seed>>>0||1;return()=>((h=Math.imul(h^h>>>15,2246822507)^Math.imul(h^h>>>13,3266489909),(h^=h>>>16)>>>0)/4294967296)}
function ransom(str,seed=7,cls=''){const r=rnd(seed);return`<span class="rs ${cls}" aria-label="${str}">`+[...str].map(ch=>ch===' '?'<i></i>':`<b class="r${Math.floor(r()*6)}" style="--a:${(r()*12-6).toFixed(1)}deg;--y:${Math.round(r()*10-5)}px;--s:${(0.86+r()*0.3).toFixed(2)}">${ch}</b>`).join('')+'</span>'}
const keys=(...k)=>`<div class="keys">${k.map(([a,b,g])=>`<span class="key"${g?` data-go="${g}"`:''}><b${a.length>1?' class="w"':''}>${a}</b>${b}</span>`).join('')}</div>`;
const hp=(cur,max,cls='')=>{const p=Math.round(cur/max*100);return`<span class="hpbar ${cls} ${p<=20?'low':p<=50?'mid':''}"><i style="width:${p}%"></i></span>`};

const REEL=[['slash','Slash','Into a fight','The screen is cut open on a slant.'],['iris','Flare','Cut-ins and big moments','Opens from the middle like a flashbulb.'],['drop','Drop','Opening a menu','The menu drops in and the game dims behind.'],['page','Turn','Moving on: map, town, events','The next place pushes the last one away.'],['sweep','Sweep','Between pages of one menu','A quick slanted wipe, the pass 5 morph.'],['share','Carry','On every change','The title, your Pokémon and the key hints glide to their new spots.']];

/* Viewer shell: pass stepper, screen chips, notes, scaling, and the morph between screens. */
(function(){
const Q=new URLSearchParams(location.search),stage=document.getElementById('stage'),MAXP=PASSES.length;
let P=Math.min(MAXP,+Q.get('pass')||MAXP),CUR=Q.get('s')||null;const livOk=l=>P>=LIVERIES.since&&LIVERIES.list.some(([k,,s])=>k===l&&s<=P);function autoLiv(){LIV=P<LIVERIES.since?'phantom':(LIVERIES.intro[P]||(livOk(LIV)?LIV:'phantom'))}autoLiv();if(Q.get('liv')&&livOk(Q.get('liv')))LIV=Q.get('liv');
const still=Q.has('still');let FL=false;if(Q.has('shot'))document.body.classList.add('shot');
function cls(){stage.className='stage '+Array.from({length:P},(_,i)=>'p'+(i+1)).join(' ')+(still?' still':'');stage.dataset.liv=LIV;stage.dataset.pass=P}
function paint(){const v=verAt(CUR,P);let h=v.fn(P);if(P>=5&&!h.includes('class="wipe"'))h+='<div class="wipe" aria-hidden="true"><i></i><i></i><i></i></div>';if(P>=15&&typeof crumb==='function')h+=crumb(CUR);if(FL&&!still){const v=VERS.find(x=>x[0]===LIV);h+=`<div class="vflash" aria-hidden="true"><b>${v[1]}<small>VERSION</small></b></div>`}FL=false;stage.innerHTML=`<section class="scr s-${CUR}">${h}</section>`;stage.dataset.scr=CUR}
function show(id,anim){const L=listAt(P);if(!L.includes(id))id=L[0];const run=()=>{CUR=id;cls();paint();chrome()};document.documentElement.dataset.tr=(P>=20&&anim&&CUR&&CUR!==id&&typeof TRK==='function')?TRK(CUR,id):'';
  if(anim&&P>=5&&!still&&document.startViewTransition&&!matchMedia('(prefers-reduced-motion:reduce)').matches)document.startViewTransition(run);else run()}
function chrome(){const L=listAt(P),nav=document.getElementById('vw-nav'),groups=[...new Set(L.map(id=>SCR[id].group))];
  nav.innerHTML=groups.map(g=>`<div class="vw-grp"><span>${g}</span>${L.filter(id=>SCR[id].group===g).map(id=>{const v=verAt(id,P);return`<button class="vw-chip${v.since===P?(SCR[id].v[0].since===P?' new':' chg'):''}" data-s="${id}" aria-pressed="${id===CUR}">${SCR[id].title}</button>`}).join('')}</div>`).join('');
  document.getElementById('vw-pass').value=P;document.getElementById('vw-out').textContent=`Pass ${P} of 25`;
  const n=PASSES[P-1],Qs=[['More extravagant, pleasing, eye-catching?','x'],['How is it changed and better than the last pass?','b'],['More pages to avoid clutter?','p'],['How do a Menu and Settings fit?','m'],['Does it feel like a Pokémon game?','k']];
  document.getElementById('vw-notes').innerHTML=`<div><h2><small>INTERVAL ${Math.ceil(P/5)} · PASS ${P}</small>${n.name}</h2><p>${n.change}</p>${n.pages&&n.pages.length?`<p><b>New pages:</b> ${n.pages.join(', ')}</p>`:''}</div><div><dl>${Qs.map(([q,k])=>`<div><dt>${q}</dt><dd>${n.q[k]}</dd></div>`).join('')}</dl></div>`;
  const lv=document.getElementById('vw-liv');lv.hidden=P<LIVERIES.since;
  if(!lv.hidden)lv.innerHTML=`<div class="vw-grp"><span>Version</span>`+LIVERIES.list.filter(([,,s])=>s<=P).map(([k,l])=>`<button class="vw-chip" data-setliv="${k}" aria-pressed="${LIV===k}">${l}</button>`).join('')+'</div>'}
function fit(){const w=document.getElementById('vw-wrap').clientWidth;stage.style.setProperty('--scale',document.body.classList.contains('shot')?1:w/1280)}
new ResizeObserver(fit).observe(document.getElementById('vw-wrap'));fit();
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g&&stage.contains(g)){show(g.dataset.go,true);return}
  const c=e.target.closest('[data-s]');if(c){show(c.dataset.s,true);return}
  const l=e.target.closest('[data-setliv]');if(l){if(l.dataset.setliv!==LIV){LIV=l.dataset.setliv;FL=P>=9}show(CUR,true);return}
  if(e.target.id==='vw-prev'){P=Math.max(1,P-1);autoLiv();show(CUR,true)}if(e.target.id==='vw-next'){P=Math.min(MAXP,P+1);autoLiv();show(CUR,true)}
  if(e.target.id==='vw-tour'){tour()}});
document.getElementById('vw-pass').max=MAXP;
document.getElementById('vw-pass').addEventListener('input',e=>{P=+e.target.value;autoLiv();show(CUR,false)});
document.addEventListener('keydown',e=>{if(e.target.matches('input,button'))return;const L=listAt(P),i=L.indexOf(CUR);if(e.key==='ArrowRight')show(L[(i+1)%L.length],true);if(e.key==='ArrowLeft')show(L[(i-1+L.length)%L.length],true)});
let tt=null;function tour(){const b=document.getElementById('vw-tour');if(tt){clearInterval(tt);tt=null;b.textContent='Play tour';return}b.textContent='Stop tour';tt=setInterval(()=>{const L=listAt(P),i=L.indexOf(CUR);show(L[(i+1)%L.length],true)},2600)}
window.__mock={list:()=>listAt(P),show:id=>show(id,false),go:id=>show(id,true),pass:()=>P,setLiv:l=>{LIV=l;show(CUR,false)}};
show(CUR||listAt(P)[0],false);
})();

</script>
