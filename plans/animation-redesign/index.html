/* viewer chrome (single dark look on purpose: it frames game screens) */
:root{color-scheme:dark;--vbg:#12141b;--vpanel:#1b1e28;--vfg:#eef0f6;--vmute:#9aa2b8;--vline:#2c3142;--vacc:#ffcb05}
html,body{height:auto}
body{margin:0;background:var(--vbg);color:var(--vfg);font:14px/1.5 'M PLUS Rounded 1c',system-ui,sans-serif}
#app{max-width:1200px;margin:0 auto;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
.vw-top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.vw-top h1{font:400 26px/1 'Jersey 15',sans-serif;letter-spacing:.04em;margin:0;color:var(--vacc)}
.vw-passbar{display:flex;align-items:center;gap:8px;flex:1 1 320px;min-width:0}
.vw-passbar b{font:400 20px/1 'Jersey 15',sans-serif;white-space:nowrap}
.vw-passbar span{color:var(--vmute);min-width:0;overflow-wrap:anywhere}
.vw-btn{font:inherit;color:var(--vfg);background:var(--vpanel);border:1px solid var(--vline);border-radius:8px;padding:6px 12px;cursor:pointer}
.vw-btn.on{background:var(--vacc);color:#16181f;border-color:var(--vacc);font-weight:800}
.vw-btn:hover,.vw-chip:hover{border-color:var(--vacc)}
.vw-btn:focus-visible,.vw-chip:focus-visible,input:focus-visible{outline:2px solid var(--vacc);outline-offset:2px}
#vw-range{flex:1 1 160px;min-width:120px;accent-color:var(--vacc)}
#vw-wrap{position:relative;width:100%;overflow:hidden;border-radius:10px;background:#000;box-shadow:0 0 0 1px var(--vline)}
#stage{position:absolute;left:0;top:0;width:960px;height:540px;transform-origin:0 0;overflow:hidden;view-transition-name:stage;contain:layout paint;background:#0b0d14;color:#fff;font:500 15px/1.3 'M PLUS Rounded 1c',sans-serif}
.vw-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;color:var(--vmute)}
#vw-scrub{flex:1 1 220px;min-width:140px;accent-color:var(--vacc)}
#vw-time{font-variant-numeric:tabular-nums;min-width:11ch}
#vw-cur{flex:1 1 200px;color:var(--vfg)}
#vw-beats{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
#vw-beats li{background:var(--vpanel);border:1px solid var(--vline);border-radius:6px;padding:2px 9px;color:var(--vmute);font-size:13px}
#vw-beats li b{color:var(--vfg);font-weight:800;margin-right:4px;font-variant-numeric:tabular-nums}
#vw-beats li.on{background:var(--vacc);border-color:var(--vacc);color:#16181f}
#vw-beats li.on b{color:#16181f}
#vw-about p{margin:0 0 4px;max-width:90ch;color:var(--vmute)}
#vw-about b{color:var(--vfg);margin-right:6px}
#vw-clips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.vw-g{font:400 16px/1 'Jersey 15',sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--vmute);margin:0 2px 0 8px}
.vw-g:first-child{margin-left:0}
.vw-chip{font:inherit;font-size:13px;color:var(--vfg);background:var(--vpanel);border:1px solid var(--vline);border-radius:999px;padding:3px 10px;cursor:pointer}
.vw-chip.on{background:var(--vacc);color:#16181f;border-color:var(--vacc);font-weight:800}
.vw-chip i{font-style:normal;font-size:10px;text-transform:uppercase;letter-spacing:.06em;margin-left:6px;padding:0 5px;border-radius:6px;background:#e3350d;color:#fff}
.vw-chip i.ch{background:#2a75bb}
#vw-review{background:var(--vpanel);border:1px solid var(--vline);border-radius:10px;padding:14px 18px}
#vw-review h2{font:400 24px/1.1 'Jersey 15',sans-serif;margin:0 0 6px;color:var(--vacc);letter-spacing:.03em}
#vw-review p{margin:0 0 8px;max-width:75ch}
.vw-big{font-size:15px}
.vw-new{color:var(--vmute)}
#vw-review dl{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:6px 16px;margin:8px 0 0}
#vw-review dt{color:var(--vmute)}
#vw-review dd{margin:0;max-width:75ch}
@media (max-width:640px){#vw-review dl{grid-template-columns:minmax(0,1fr)}#vw-review dd{margin-bottom:6px}}
body.bare #app{padding:0;max-width:none;display:block}
body.bare .vw-ui{display:none}
body.bare #vw-wrap{width:960px;height:540px;border-radius:0;box-shadow:none}
::view-transition-group(*){animation-duration:.3s}
/* ---------- the stage ---------- */
#stage,#stage *,#stage *::before,#stage *::after{box-sizing:border-box}
#stage .wd,#stage .cam,#stage .shk,#stage .L{position:absolute;left:0;top:0;width:960px;height:540px}
#stage .wd{overflow:hidden}
#stage .cam,#stage .shk{transform-origin:50% 50%;will-change:transform}
#stage .L{pointer-events:none}
#stage .a{position:absolute;left:0;top:0;will-change:transform,opacity}
.px{image-rendering:pixelated;image-rendering:crisp-edges}
#stage .shd{background:#0a1020;border-radius:50%}
#stage .tn{mix-blend-mode:normal}
/* shared look, taken from pass 25 of the UI redesign: Raider Red, Pika Yellow, Ink, Paper, Sky */
#stage{--red:#e3350d;--yel:#ffcb05;--ink:#1d2a4d;--ink2:#131c36;--paper:#fff;--sky:#2a75bb;--ok:#3ec46d;--mid:#f5b800;--low:#e3350d}
#stage .dsp{font-family:'Jersey 15',sans-serif;font-weight:400;letter-spacing:.03em;line-height:1}
#stage .plate{background:linear-gradient(180deg,#22325e,#16203f);border:3px solid var(--ink2);box-shadow:0 0 0 2px #2f4a8a inset,0 4px 0 #0008;border-radius:14px;color:#fff;padding:7px 14px 8px;overflow:hidden}
#stage .plate .nm{font:400 25px/1 'Jersey 15',sans-serif;letter-spacing:.03em;white-space:nowrap}
#stage .plate .lv{color:var(--yel);font:800 13px/1 'M PLUS Rounded 1c',sans-serif;margin-left:10px}
#stage .plate .row{display:flex;align-items:center;gap:8px;margin-top:5px;white-space:nowrap}
#stage .plate em{font:800 12px/1 'M PLUS Rounded 1c',sans-serif;color:var(--yel);font-style:normal}
#stage .hp{position:relative;flex:1;height:11px;background:#dfe5f5;border:2px solid var(--ink2);transform:skewX(-20deg);overflow:hidden}
#stage .hp i{position:absolute;left:0;top:0;bottom:0;display:block}
#stage .hp .gh{background:#fff;opacity:.9;width:0}
#stage .hp .fl{background:linear-gradient(180deg,#8fe6a8,var(--ok))}
#stage .hp.mid .fl{background:linear-gradient(180deg,#ffe07a,var(--mid))}
#stage .hp.low .fl{background:linear-gradient(180deg,#ff9a7a,var(--low))}
#stage .plate .num{font:800 13px/1 'M PLUS Rounded 1c',sans-serif;min-width:58px;text-align:right;font-variant-numeric:tabular-nums}
#stage .flag{position:absolute;right:-14px;top:-4px;bottom:-4px;width:112px;background:linear-gradient(105deg,transparent 0 18%,var(--red) 18% 52%,#fff 52% 58%,var(--ok) 58%);opacity:.95}
#stage .xp{position:relative;height:5px;flex:0 0 150px;background:#0b1226;border-radius:3px;overflow:hidden}
#stage .xp i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#4cc3ff,#9ae4ff)}
#stage .msg{background:#131c36f2;border:3px solid var(--ink2);box-shadow:0 0 0 2px #2f4a8a inset,0 4px 0 #0008;border-radius:18px;color:#fff;padding:10px 18px;font:500 19px/1.25 'M PLUS Rounded 1c',sans-serif;display:flex;align-items:center}
#stage .msg b{color:var(--yel);font-weight:800}
#stage .pill{font:800 13px/1 'M PLUS Rounded 1c',sans-serif;padding:4px 10px;border-radius:99px;background:var(--yel);color:var(--ink);white-space:nowrap}
#stage .ttl{font:400 64px/1 'Jersey 15',sans-serif;letter-spacing:.04em;color:#fff;text-shadow:4px 4px 0 var(--red),-2px -2px 0 var(--ink2),2px -2px 0 var(--ink2),-2px 2px 0 var(--ink2),6px 6px 0 var(--ink2);white-space:nowrap}
#stage .ttl.y{color:var(--yel)}
#stage .cap{font:800 15px/1.2 'M PLUS Rounded 1c',sans-serif;color:#fff;text-shadow:0 2px 0 #000a;white-space:nowrap}
#stage .card{background:#fff;color:var(--ink);border-radius:16px;box-shadow:0 5px 0 #0006;padding:10px 16px;font:800 15px/1.3 'M PLUS Rounded 1c',sans-serif}
#stage .dmg{font:400 44px/1 'Jersey 15',sans-serif;color:#fff;text-shadow:3px 3px 0 var(--ink2),-2px -2px 0 var(--ink2),2px -2px 0 var(--ink2),-2px 2px 0 var(--ink2);white-space:nowrap}
#stage .stamp{font:400 30px/1 'Jersey 15',sans-serif;letter-spacing:.05em;padding:5px 14px 6px;border-radius:10px;background:var(--red);color:#fff;border:3px solid var(--ink2);white-space:nowrap}
#stage .stamp.g{background:var(--ok);color:var(--ink2)} #stage .stamp.y{background:var(--yel);color:var(--ink2)} #stage .stamp.b{background:var(--sky)} #stage .stamp.k{background:var(--ink2)}
#vw-capbar{display:none}
body.cap #vw-capbar{display:block;width:960px;height:44px;background:#12141b;color:#eef0f6;font:500 17px/44px 'M PLUS Rounded 1c',sans-serif;padding:0 16px;white-space:nowrap;overflow:hidden}
body.cap #vw-capbar b{color:#ffcb05;font:400 22px/44px 'Jersey 15',sans-serif;letter-spacing:.04em;margin-right:14px}
#vw-lists{display:grid;gap:10px;margin-top:12px}
#vw-lists details{background:var(--vpanel);border:1px solid var(--vline);border-radius:10px;padding:10px 18px}
#vw-lists summary{font:400 24px/1.2 'Jersey 15',sans-serif;color:var(--vacc);cursor:pointer;letter-spacing:.03em}
#vw-lists h3{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--vmute);margin:18px 0 6px}
#vw-lists ol{margin:0;padding:0;list-style:none;display:grid;gap:10px}
#vw-lists li{border-top:1px solid var(--vline);padding-top:8px;max-width:90ch}
#vw-lists p{margin:2px 0;color:var(--vmute)}
#vw-lists p b{color:var(--vfg);margin-right:6px}
#vw-lists p.t{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
#vw-lists p.t i{font-style:normal;font-size:11px;text-transform:uppercase;letter-spacing:.06em;border:1px solid var(--vline);border-radius:9px;padding:1px 7px}
#vw-lists p.t i.need{color:var(--vacc);border-color:var(--vacc)}

</style>

const NOTES={"1": {"name": "First Motion", "big": "The floor. Six basic battle beats (send out, recall, attack and hit, faint, HP bar, standing) each get one clean, readable tween. The game's own sprite frames keep playing underneath; everything here is the code-made motion around them.", "clips": ["Send Out", "Recall", "Attack and Hit", "Faint", "HP Bar", "Standing"], "q1": "Not yet. This pass is about order and clarity: one thing happens at a time and you can always tell what.", "q2": "Compared with the game today: recall gets its red beam back, fainting sinks into the ground instead of fading, and the HP number counts down with the bar.", "q3": "Yes. Switching, level-up, EXP and a missed attack have no clip yet. They come in pass 2.", "q4": "Nothing to set yet. From pass 20 every clip here obeys the motion settings.", "q5": "The ball arc, white flash and red recall beam are straight from the handheld games."}, "2": {"name": "Weight", "big": "Everything gets mass. The ball squashes when it lands, attacks wind up before they go, hits freeze for a blink before the recoil, landings throw dust and the HP plate takes the blow too.", "clips": ["Switch", "Miss", "EXP and Level Up"], "q1": "Yes. The same six beats now have bounce, stretch and dust, so even a plain Tackle looks like it hurts.", "q2": "Pass 1 moved things from A to B. Pass 2 adds what happens before (wind-up) and after (recoil, settle, dust) each move, plus hit-stop: an 80ms freeze on contact that makes hits feel heavy.", "q3": "Three more clips: switching as one unbroken move, a dodge for a missed attack, and EXP into level-up.", "q4": "Hit-stop and screen shake already have sliders in Settings; these clips are drawn at their default strength.", "q5": "The ball bounce before it opens and the two happy hops on level-up are small touches the 3D games use."}, "3": {"name": "Elements", "big": "Type is now visible in the motion itself. Eighteen impact kits, a type-coloured glow before every move, and type sparks when a Pokémon lands. The game's move animations still play; this is the layer wrapped around them.", "clips": ["Type Reel", "Wind-up Tells", "End-of-turn Damage", "Healing"], "q1": "Yes. Hits went from a white blink to bolts, embers, splashes, shards and petals. The Type Reel alone is eighteen new effects.", "q2": "Pass 2 made a hit feel heavy; pass 3 makes it look like what it is. You can now tell fire from water with the sound off and the text hidden.", "q3": "Four more clips, and a new Conditions group for burn, poison and Leech Seed ticks, which had no animation at all in the game.", "q4": "The type kits use particles, so they follow the existing Reduce particles setting: at Reduced they keep the star and ring and drop the sparks.", "q5": "Type colours are the ones on the type pills in the UI redesign, so a Fire move matches its button."}, "4": {"name": "Trainers", "big": "People join in. Trainers skid on with dust, wind up and throw from the hand, call out to their Pokémon, announce their ace before it lands and pay up when they lose. They step in for a moment and step out again, so the battle screen stays clear.", "clips": ["Trainer Intro", "Ace Call", "Trainer Defeated", "Trainer Call-out"], "q1": "Yes. A battle now opens with two people facing off, and the ace gets a full-screen banner and a double-size landing.", "q2": "Passes 1 to 3 were only about the Pokémon. Now the ball leaves from a hand, the team size is shown as balls dropping onto the name plate, and the ace is announced before it appears instead of just being the last one left.", "q3": "Four trainer clips and a new Trainers group. Gym Leaders, rivals and villains get their own passes later (13 and 14).", "q4": "Trainer call-outs would sit under Settings, Battle, with Full, Short and Off.", "q5": "Trainer slides in, throws, steps out is exactly how the handheld games open a battle. Your throw uses the game's own throw frames."}, "5": {"name": "Stagecraft", "big": "The interface starts performing. Plates fly in on springs, damage numbers jump out of the hit, SUPER EFFECTIVE slams on like a rubber stamp, the message bubble pops for every line, and the three set pieces every Pokémon game is remembered for (the wild encounter, the catch and the break-out) get full choreography.", "clips": ["Numbers and Stamps", "Danger", "Wild Encounter", "Catch", "Break Out"], "q1": "Yes. The catch alone has a bonk, two bounces, three lamps, a click, flying stars, a stamp and confetti.", "q2": "Until now the plates and text sat still while the Pokémon moved. Now the whole screen reacts to a hit, and breaking out of a ball (which had no animation at all) is its own moment.", "q3": "Five more clips and a Catching group. 24 clips in total after five passes.", "q4": "Damage numbers and battle text animations already have switches in Settings; stamps would share the damage numbers switch.", "q5": "Three ball shakes with a click and stars is the most recognisable animation in the series. The lamps make the count readable on a small screen."}, "6": {"name": "Power Surge", "big": "The four gimmicks are re-staged around the game's own effect art: the Mega orb that cracks and shatters, Tera crystals that grow out of the ground, Dynamax storm clouds with the camera pulling back, and a Z-Move with its real title art. Their language also leaks into normal play: strong moves dim the arena as they charge, and big hits throw rays behind the target.", "clips": ["Mega Evolution", "Terastallize", "Dynamax", "Dynamax Ends", "Z-Move"], "q1": "By a long way. These are the loudest moments in a battle and each now has a build-up, a break and a landing instead of one flash.", "q2": "Pass 5 made the interface react. Pass 6 adds scale: the arena dims, the camera moves for the first time, the HP bar doubles on screen, and something stays behind afterwards (the Tera crown, the Mega mark on the bar, the turn lamps).", "q3": "Five clips and a Gimmicks group. Dynamax ending gets its own clip because today it is a 0.65s shrink. Primal Reversion and Gigantamax come in the next pass and the lists.", "q4": "The four Fast switches in Settings stay. Fast would play the last third of each clip: the break and the landing, without the build-up.", "q5": "Each one follows the order from its home game: bracelet then orb for Mega, orb then crystals then crown for Tera, big ball over the shoulder for Dynamax, trainer and Pokémon together for Z-Moves."}, "7": {"name": "Galar", "big": "Galar gets a stadium: stands with a crowd that bobs, jumps, flashes cameras and sinks, a Crowd meter, and floodlights in the gym's colour. Gigantamax is no longer a Dynamax copy, G-Max moves leave something on the field, raids get a den entry and a barrier, and the Champion and Eternatus each get a scene. Everywhere else the ground now answers: bases dip and flash under landings and hits.", "clips": ["Stadium Crowd", "Gym Leader Entrance", "Gigantamax", "G-Max Move", "Max Raid Den", "Raid Barrier", "Champion Time", "Eternamax"], "q1": "Yes. Until now every battle happened in a quiet field. A stadium that reacts to you is the biggest single jump in spectacle so far.", "q2": "Pass 6 made the Pokémon bigger. Pass 7 makes the place bigger: there is an audience, the lights go out for the Champion, the sky cracks for Eternatus, and in ordinary battles the ground itself now moves under landings and hits.", "q3": "Eight clips and a Galar group. The den entry and the barrier are new moments that deserve their own screens; today a raid starts with a plain fade.", "q4": "Menu stays reachable during the entrances (they skip on a button press). Settings gets one new switch in this pass: Crowd reactions (On, Quiet, Off), next to Screen shake.", "q5": "It is Sword and Shield's best trick: sport. Numbers on shirts, League Cards, chants, a Champion with a cape. The rest of the game keeps its routes and caves, so Galar feels like its own region."}, "8": {"name": "Conditions", "big": "Things that stay. Each of the six conditions gets an arrival, a look that lasts and its own tick every turn, with a chip that flies onto the HP plate. Weather has an entrance, a layer and an exit. Terrains finally stay on the ground. Stat changes, abilities and Protect get their own shapes, and the end of the turn becomes a short parade with a turn counter. Outdoors, the air now moves in every battle.", "clips": ["Burn", "Poison", "Paralysis", "Sleep", "Freeze", "Confusion", "Rain", "Harsh Sunlight", "Sandstorm", "Snow", "Weather Clears", "Terrain", "Stat Changes", "Ability Trigger", "Protect", "End of Turn"], "q1": "Yes, in a quieter way. Passes 6 and 7 were about the loudest five seconds. This pass makes the other fifty turns look alive: something is always burning, snowing, drifting or humming.", "q2": "Before this pass nothing lasted: an effect played and the screen went back to normal. Now you can read the state of a battle without any text, because a frozen Pokémon is in a block of ice and Electric Terrain is a grid under its feet.", "q3": "Sixteen clips and a Conditions group. Terrain and the end-of-turn parade are new moments; the game shows nothing for them today.", "q4": "Weather, terrain and status chips need no menu. Settings gets a Weather effects level (Full, Light, Off) because rain and sand cover the whole screen, and the turn counter can be hidden.", "q5": "The BRN, PSN, PAR, SLP and FRZ chips, the Z's, the stars round a confused head and the weather lines are straight from the series. They are just given more than one frame."}, "9": {"name": "Story Time", "big": "Events move for the first time, and they move on the real pass-25 event pages: each page from the UI redesign is photographed and cut into pieces that slide, flip and fly. An event opens through a camera iris, choices are dealt like cards, results change the place the way you travelled there, rewards wait for your button, and an event battle is wiped in on the slant. In battle, the bubble now points at whoever is acting.", "clips": ["Event Opens", "Event Choice", "Event Result", "Event Reward", "Event Stage Starts", "Blessing", "Pokémon Center", "Starter Remembrance"], "q1": "Yes. Events were the stillest part of the game: a picture and a text box. Now people walk on, cards are dealt, and the lighthouse stairs actually scroll.", "q2": "Passes 6 to 8 were all battle. This is the first pass outside it, and the first that animates the redesigned pages themselves instead of a stand-in, so what you see is exactly the chosen look in motion.", "q3": "Eight clips and an Events group. No new pages are needed; the four-step strip (Talk, Choose, Result, Reward) already splits an event into pages and every step now has its own entrance.", "q4": "The journal key and Menu stay live through all of it. Text speed in Settings drives the typing; Hold to skip jumps every entrance to its last frame; rewards still never leave without a press.", "q5": "Walking on from the side of the screen, an iris to change place, balls rolling in at the Professor's feet and the Center jingle lighting six balls are all things the series does."}, "10": {"name": "World Tour", "big": "Everything between battles moves, on the real chosen pages: the pass-17 title assembles itself, Hub Town pops up like a pop-up book, the map draws its paths and you hop along them, a region arrives with a passport stamp, the team walks the road, the shop basket bumps, the Rotom Phone menu rises, and one transition ties it together: the screen shuts like a Poké Ball and opens on the next place.", "clips": ["Ball Wipe", "Wild Encounter (redone)", "Title Screen", "Hub Town Arrives", "Map: Moving On", "Region Arrival", "On the Road", "Poké Mart: Buying", "Pause Menu Opens", "Next Stop Card"], "q1": "Yes. These screens are where a run spends half its time and until now they simply appeared. Now each one builds in front of you in under two seconds.", "q2": "Pass 9 moved events. Pass 10 moves the rest of the world and adds the first shared transition, the ball wipe, so going from map to battle to reward reads as one journey. Wild Encounter is re-cut to start on the map.", "q3": "Ten clips, a World group and a Screens group. On the Road and the Next Stop card are short pages that exist only to be animated; they replace two plain fades.", "q4": "This pass is where they live. The Menu is the Rotom Phone rising from the bottom edge on any screen, and closing is the same motion backwards at double speed. Settings gets Transition style (Ball, Fade, Cut).", "q5": "A ball shutting over the screen, a passport stamp for each region, hopping along a route line and your team walking behind you are about as Pokémon as it gets."}, "11": {"name": "Personality", "big": "The sprite frames are untouched, but every Pokémon now carries itself differently around them. There are six idle styles by body type, cries sized to the Pokémon, light landings that bounce and heavy ones that shake the screen and knock the other side off its feet, a stagger before fainting, and small character moments: worn out, a winner's hop, hanging on for you, flinching, getting impatient while you think.", "clips": ["Idle Styles", "Light and Heavy", "Worn Out", "Winner's Moment", "Toughed It Out", "Shiny Entrance", "Flinch", "Waiting on You"], "q1": "In a different way from the last five passes: not louder, more alive. A battle screen with two Pokémon that stand differently is more eye-catching for the whole fight, not just for a second.", "q2": "Until now the Pokémon were pieces that effects happened to. From this pass they act: they cry out, stagger, slump, celebrate and look round at you. Every earlier clip changes because idle, send-out and fainting are all re-animated.", "q3": "Eight clips. No new pages; these all live on the battle screen and take no space on it.", "q4": "Nothing new in the Menu. Settings: the character moments (Winner's Moment, Waiting on You) follow the existing Battle animations level, so Reduced keeps the idles and drops the extras.", "q5": "This is the anime's half of Pokémon: a Pikachu that bounces and a Snorlax that lands like a boulder. It is also what Pokémon-Amie and camp did for the series."}, "12": {"name": "Big Hits", "big": "How a move is delivered now depends on what it is. Special moves are fired across the field with a shot in the move's colour instead of a lunge; how far the target is thrown depends on how hard it was hit. And the moves that deserve a shape of their own get one: charge-ups, multi-hits with a combo counter, criticals that stop time, recoil, drain, one-hit KOs, recharge turns, contact punishers, priority moves and entry hazards that stay on the field.", "clips": ["Power Tiers", "Charge-Up Move", "Multi-Hit", "Critical Hit", "Recoil", "Drain", "One-Hit KO", "Recharge Turn", "Contact Punish", "Priority Move", "Entry Hazards"], "q1": "Yes. The single most repeated action in the game, using a move, now has three sizes and two deliveries, and the critical hit finally looks like the best thing that can happen on a turn.", "q2": "Pass 3 gave hits a type. Pass 12 gives them a size and a kind. Flamethrower and Slash no longer move the same way, and every earlier clip with a special move in it now fires a shot.", "q3": "Eleven clips in Moves. Entry hazards and the recharge turn show things the game only says in text today.", "q4": "No menu changes. Settings: the critical-hit freeze counts as hit-stop and follows the Hit-stop switch; shots and knockback follow Battle animations (Reduced keeps the flash and number only).", "q5": "Beams across the field, a Pokémon thrown back by a strong hit, stones circling a team: this is how the anime and the 3D games show the same moves."}, "13": {"name": "Showdown", "big": "The fights that matter get an entrance, played on the real pass-25 pages: the VS screen slams together, Gym Leaders stride in under their badge, a Legendary is felt before it is seen, an Ultra Beast tears the sky, and the badge falls like a coin. In battle, bosses visibly change phase, Totems flare, and enemy healing is thrown where you can see and count it. Every opposing trainer now arrives on a banner.", "clips": ["VS Screen", "Gym Leader", "Legendary Encounter", "Ultra Beast", "Badge Get", "Boss Phase Change", "Totem Aura", "Enemy Heal"], "q1": "Yes. These are the five or six moments a run is remembered for, and each now has its own staging instead of sharing one intro.", "q2": "Pass 12 was about single moves. Pass 13 is about occasions: it changes how a fight starts and how it turns. The Legendary and Ultra Beast intros are built on silence and glitch, which nothing before this pass used.", "q3": "Eight clips in Bosses. Boss Phase Change and Enemy Heal are new on-screen moments; the heal pips are a small permanent addition to a boss trainer's plate.", "q4": "Menu stays reachable; every intro skips on a press. Settings: Boss intros (Full, Short, Off) joins the Fast gimmick switches. Short keeps the name stamp only.", "q5": "A VS screen, a Leader's pose under their badge, a Legendary waiting at the back of a cave and a badge you actually receive are core series moments."}, "14": {"name": "Rivals and Villains", "big": "The people who keep coming back get staging of their own. A rival spots you on the map and races down the path at you, the Rival Board deals its cards, beating a rival changes their record in front of you, and losing to one says in green that the run goes on. The evil team ambushes under an alarm, its Boss walks into a spotlight, the Betrayal cracks the screen and the Legendary snaps its chains. And whoever is speaking now gets a name tab and their face on the bubble, in every battle.", "clips": ["Rival Spots You", "Rival Board", "Rival Beaten", "Losing to a Rival", "Evil Team Ambush", "Team Boss Entrance", "The Betrayal", "The Legendary Breaks Loose"], "q1": "Yes. Rivals and the evil team are the story of a run, and until now they borrowed the plain trainer intro. The spotlight walk, the cracked screen and the snapping chains are the biggest set pieces so far.", "q2": "Pass 13 staged one-off bosses. Pass 14 stages relationships: the same four rivals and one team across a whole run, so the animations carry memory (records that change, a counter of grunts left, the Boss losing his colour). Speaker tabs change every trainer line in the game.", "q3": "Eight clips in two new groups, Rivals and Villains. Rival Spots You and The Legendary Breaks Loose are moments the game does not show at all today.", "q4": "Menu: the Rival Board is one press from Pause, and its cards deal in the same way there. Settings: Speaker faces (On, Off) joins Text options; Boss intros (Full, Short, Off) from pass 13 also covers these entrances.", "q5": "A rival who says \"Smell ya later\" and looks back, a team in black that shows up under an alarm, and a Boss in a dark room are as Pokémon as it gets."}, "15": {"name": "Director's Notes", "big": "Kice's notes on the first fourteen passes, built in. The Trainer Intro and the Ace Call are no longer drawn by the animation mockup: they are the UI mockups' own pages set in motion. The Blessing drops the three-card page and goes back to the game's original cutscene, remade as something holy. The Event Choice keeps the whole text box instead of a cut-down one. And every clip with a map in it now uses the smaller map that shows eight stops with room to spare.", "clips": ["Trainer Intro", "Ace Call", "Event Choice", "Legendary Blessing"], "q1": "The Blessing is: a bell in the dark, a rose window, a halo, the Legendary as a pale vision, scripture with an illuminated letter, candles, feathers, and your partner bowing under the light. The Ace Call now has the ace leap off its own banner onto the field.", "q2": "Passes 13 and 14 added new moments. Pass 15 goes back and corrects existing ones against the director's notes, and changes the method: pages are now photographed with a see-through background, so pieces move cleanly instead of dragging a cut-out along.", "q3": "No new pages. The Blessing is one page again (the original), not a choice of three. The map shows eight stops, so each hop and each path is larger on screen and easier to follow.", "q4": "Unchanged. The Blessing still finishes at once on the first Enter and moves on with the second, as in the game today; with animations off everything is shown at once.", "q5": "Legendaries blessing a journey from a shaft of light, with bells and a tower-top hush, is how the series treats Ho-Oh and Lugia."}, "16": {"name": "Gimmicks, Remake 1: Scale", "big": "The first of five remakes of the gimmick cutscenes, each with a new goal. Goal one is scale. Mega Evolution, Terastallizing, Dynamax and the Z-Move stop being effects on the battle screen and become the whole screen: the camera pushes in, the UI mockups' own cut-in page opens out of the Pokémon, the change happens at five times battle size, and the page closes back onto the field. The camera also joins normal play: hard hits punch in, knock-outs get a slow push.", "clips": ["Mega Evolution", "Terastallize", "Dynamax", "Z-Move", "Knock-out Camera", "Entrance Camera"], "q1": "Much more. An orb that fills the screen and shatters across its full width, crystals as tall as the screen, a Charizard that grows past the top of the picture, a Z taller than the screen.", "q2": "Until now the gimmicks were effects placed on the battle screen (pass 6). Now each one is a full-screen cutscene that ends on the UI mockups' own cut-in page, and the camera moves for the first time anywhere in the mockups.", "q3": "No new pages: the cut-in pages already exist in the UI mockups and are used as they are. Two new camera clips.", "q4": "Settings: Fast gimmick switches play only the last second (the new form landing on the field). Camera movement (On, Reduced, Off) is a new line under Motion.", "q5": "A gimmick that takes over the screen is exactly how the main games stage Mega Evolution, Dynamax and Z-Moves."}, "17": {"name": "Gimmicks, Remake 2: Impact", "big": "Remake 1 made the gimmick cutscenes big. Remake 2 makes them hit. Nothing eases any more: each cutscene is told in hard cuts and held frames, like a fighting-game super or an anime impact frame. A black frame with the item in white, the battle in negative, three comic panels slammed on at an angle (the Pokémon's eyes, your raised arm, the word), a black-and-white frame of the Pokémon, the change in three or four hard beats, and only then colour. In normal play the hits that matter now get one negative frame, and the hit that ends a battle gets a Finishing Blow.", "clips": ["Mega Evolution", "Terastallize", "Dynamax", "Z-Move", "Finishing Blow"], "q1": "Yes, in a different way from remake 1: less on screen at any moment, but every frame is a poster. Negative frames, black and white, comic panels and a K.O. stamp are new to the mockups.", "q2": "Remake 1 was smooth and enormous. Remake 2 keeps the full-screen staging and throws out the smoothness: it is roughly two seconds shorter and reads as a series of hits. It also changes ordinary battles (negative frame on big hits).", "q3": "No new pages; one new clip (Finishing Blow).", "q4": "Settings: Flashing effects (Full, Soft, Off) is required for this remake. Soft replaces negative frames with a dim; Off removes them and the black-and-white frames. This must exist before any of this is built.", "q5": "The panels and held frames are how the anime and the newer games cut their big moments, and K.O. stamps are straight out of Stadium."}, "18": {"name": "Gimmicks, Remake 3: Light", "big": "Remake 1 was big and remake 2 hit hard. Remake 3 is lit. The arena goes dark and the item is the only light in it; a beam carries that light to the Pokémon; the light swallows the screen; the change itself is drawn in light (a prism for Mega, a refraction for Tera, a storm pillar for Dynamax, a sunrise for the Z-Move); the new form arrives as the exposure settles; and when the cutscene ends the arena stays lit in the gimmick's colour. In normal play every hit now throws its type's colour onto the floor.", "clips": ["Mega Evolution", "Terastallize", "Dynamax", "Z-Move", "Move Light"], "q1": "Yes. Darkness, beams, rainbow shafts, god rays, lens flares and a white-out are all new, and the cutscene now changes the battle screen after it ends.", "q2": "Remake 2 was hard cuts in black and white. Remake 3 goes the other way: no cuts at all, everything is one continuous change of light from dark to white to colour. It is also the first remake where the field looks different afterwards.", "q3": "No new pages; one new clip (Move Light).", "q4": "Settings: a Lighting effects switch (On, Simple, Off). Simple keeps the item glow and the floor colour and drops the blend effects, for slower computers. The white-out follows the Flashing effects setting from remake 2.", "q5": "The glowing item and the beam are how Sword and Shield and Scarlet and Violet start their gimmicks, and the rainbow light is the Mega Evolution symbol used as actual light."}, "19": {"name": "Gimmicks, Remake 4: Together", "big": "The first three remakes were about the Pokémon alone. Remake 4 is about the two of you. The screen splits, you on one side and your Pokémon on the other, with heartbeats that speed up; the halves open like doors and you are standing side by side; and each gimmick is something you do together: the Key Stone calls and the Mega Stone answers, you throw the Tera Orb, you hurl the giant ball and stand in front of the giant, you strike the Z-pose in step. Afterwards you call out and your partner answers. In normal play your trainer now reacts with a face and one word.", "clips": ["Mega Evolution", "Terastallize", "Dynamax", "Z-Move", "Trainer Reactions"], "q1": "Yes, and for the first time with a person in it. The split screen, the heartbeats, the throw and the size comparison in Dynamax are the most staged moments so far.", "q2": "Remake 3 was about light and had nobody in it. Remake 4 puts your trainer in every beat, gives each gimmick its own action instead of one shared shape, and adds a spoken line and an answer at the end.", "q3": "No new pages; one new clip (Trainer Reactions). The cut-in page gains your face in its corner.", "q4": "Settings: Trainer reactions (On, Off). Menu: the trainer shown is the one you picked (Red, Blue, Green, Hilda or Nate), so every one of the five needs these poses.", "q5": "This is the anime's version of every gimmick: the trainer touches the Key Stone, throws the orb, hurls the giant ball, does the Z-pose. The games show it too, from X and Y onward."}, "20": {"name": "Gimmicks, Remake 5: Signature", "big": "Remakes 1 to 4 each gave all four gimmicks the same new idea: scale, impact, light, together. The last remake does the opposite. The four cutscenes stop sharing a shape and each gets one picture nobody could mistake for another. Mega Evolution is glass: the new picture slams together out of shards and shatters back to the field. Terastallizing goes inside the jewel, a kaleidoscope. Dynamax is one long pan up the giant, from your shoes to its face above the clouds. The Z-Move is the move itself, seen from the sky, with the damage counted out. Each one also has a one-second short cut for when you have already seen it this run.", "clips": ["Mega Evolution", "Terastallize", "Dynamax", "Z-Move", "Short Cut (Seen Before)"], "q1": "Yes. The shard assembly, the kaleidoscope and the pan are each the single most elaborate thing in the mockups, and none of them is reused by another gimmick.", "q2": "Remake 4 still used one template four times. Remake 5 has four different structures and four different lengths, and it is the first to deal with repetition: a full version once per run and a short cut after that.", "q3": "No new pages; one new clip (the short cut).", "q4": "Settings: Gimmick cutscenes (Full every time, Full once per run, Always short). This replaces the Fast Mega switch and covers all four. Menu: nothing new.", "q5": "The shatter is the Mega Evolution sting from X and Y, the jewel is Scarlet and Violet, the towering pan is how Sword and Shield frame a Dynamax, and counting out the damage after a finisher is pure Stadium."}, "21": {"name": "Living Arenas", "big": "Twenty passes moved the Pokémon, the camera, the light and the trainers. The ground they stand on had not moved once: every arena was a flat striped backdrop. This pass makes each place a place. Clouds and wind in the meadow, drips and a shaft of light in the cave, swell on the sea, embers on the volcano, breath in the ice cave. The run's time of day now reaches into battle, the arena builds itself when a fight starts, and the field remembers what was done to it: scorch marks, ice, puddles and cracks stay until the battle ends.", "clips": ["Meadow", "Cave", "Open Sea", "Volcano", "Ice Cave", "Time of Day", "The Field Remembers", "Arena Arrival"], "q1": "Yes, in the opposite direction from the gimmick remakes: nothing here is loud, but it is on screen for every second of every battle, which the cutscenes are not.", "q2": "Passes 16 to 20 remade four cutscenes five times. This pass adds eight clips and changes every battle clip at once: each one now has its arena's life behind it and leaves marks on the ground.", "q3": "Eight new clips. No new pages.", "q4": "Settings: Arena life (Full, Light, Off) and Ground marks (On, Off), both under Battle effects. Light keeps clouds and time of day and drops the small moving pieces. Menu: the pause menu dims the arena but lets it keep moving behind it.", "q5": "Swaying grass, cave ceilings, bobbing platforms on water and day and night in battle are all things the main series has done since Diamond and Pearl. The backdrops themselves are untouched."}, "22": {"name": "Side Roads", "big": "Everything so far happened in a battle, on the map or in an event. This pass goes to the places in between: an evolution, an egg hatching, a trade, an expedition leaving and coming home, and the reward you pick after a fight. It also gives motion to the two moments the game plays today as a hard cut and a text menu: Second Chance and Rewind.", "clips": ["Evolution", "Egg Hatch", "Trade", "Expedition: Out and Back", "Battle Reward", "Second Chance", "Rewind"], "q1": "Yes. These are the moments players remember from a run, and five of the seven had almost no motion of their own. Second Chance and Rewind go from nothing to a full sequence.", "q2": "Pass 21 added quiet motion to every battle. Pass 22 is seven set pieces that have nothing to do with battle effects: rooms, routes, cards and clocks.", "q3": "Seven new clips. They would sit on the existing Evolution, Egg, Trade, Expedition and Reward pages.", "q4": "Settings: Evolution, Egg and Trade each follow the existing Cutscene length setting (Full, Short). Rewind and Second Chance ignore Skip, because they tell you something you need to know. Menu: the Expedition clock sits on the pause menu while a team is away.", "q5": "The flicker in the evolution, the rocking egg and the two balls crossing in a trade are the series' own pictures; they are kept and given more room."}, "23": {"name": "Reactions and Flow", "big": "The big moments are done. This pass is the small ones that happen dozens of times an hour: experience arriving, a new move replacing an old one, an item being used, a held item doing its job, who moves first, how the text is typed, and the game telling you it has saved. None of these had motion that explained what happened.", "clips": ["EXP for the Whole Team", "New Move", "Using an Item", "Held Items Speak Up", "Who Goes First", "Message Rhythm", "Saving and Notices"], "q1": "In a quieter way. Nothing here fills the screen, but every one replaces a line of text with something you can watch, and the experience lights now follow every knock-out in the whole set.", "q2": "Pass 22 was seven set pieces you see once or twice a run. Pass 23 is seven small motions you see every few seconds, so each one is under two seconds and never blocks input.", "q3": "Seven new clips, and one change (experience lights) that plays inside every earlier clip where a foe faints.", "q4": "Settings: Message Rhythm becomes the Text speed setting (Instant, Fast, Story). Who Goes First has its own on and off switch under Battle. Menu: the save ball and the notices also show on the pause menu, in the same corner.", "q5": "The item spray, the Focus Sash holding on at one point, and the move being forgotten with a puff are all things the series tells you in text. Here you see them."}, "24": {"name": "Move Families", "big": "When a move has no animation of its own, the game plays one of 26 shared effects called families. Today most of them are the same lunge or the same dot in a different colour. This pass rebuilds all 26 so that each one has its own startup, its own way of crossing the field and its own shape when it lands, and the Pokémon acts it out.", "clips": ["Close Range, Four Ways", "Shots, Beams and Breath", "Elements Have Shapes", "Sparks, Sludge, Mind and Shadow", "Care, Cover and Field", "Explosion", "One Family, Four Types", "Family Reel: All 26"], "q1": "Yes, and it is the widest change in the set: these effects cover every move that has no animation file, in every battle. Explosion alone goes from a glow and a wash to a held breath and a white-out.", "q2": "Pass 23 was about small moments between moves. Pass 24 is the moves themselves, and it is built as a system (startup, travel, impact) so one table drives all 26.", "q3": "Eight new clips. The reel shows all 26 families on one page.", "q4": "Settings: the existing Battle effects setting (Full, Reduced, Off) applies. Reduced keeps the impact shape and drops the startup and the travel. Menu: the Family Reel could sit in the Pokédex help pages as a guide to reading moves.", "q5": "Teeth for a bite, a pane for Protect, spikes for ice and stars round the head for confusion are the pictures the series has always used. The type colours and particles from pass 3 still dress every one."}, "25": {"name": "Master Cut", "big": "The last pass draws almost nothing new. It plays the clips back to back, the way a player meets them: one whole trainer battle, one whole event, and the first stretch of a run from the title to the second region. Then it sets the two rules every clip has to follow: what Reduced motion keeps and drops, and how a cutscene is skipped or shortened.", "clips": ["One Whole Battle", "One Whole Event", "One Run in a Minute", "Reduced Motion: Three Levels", "Hold to Skip, and Short Cuts"], "q1": "It is the whole set at once. One Whole Battle runs nine clips in 48 seconds without a single screen that was not redesigned.", "q2": "Every pass before this made single moments better. Pass 25 checks that they belong together, and writes down the two rules that make the set safe to build.", "q3": "Five new clips, 144 in the set. The three chains reuse 25 earlier clips exactly as they are.", "q4": "This pass is the Settings answer. Battle effects (Full, Reduced, Off) and Cutscene length (Full, Short) are shown working, and Hold to skip gets one behaviour everywhere. The pause menu can open at any point of any chain; the clip under it holds its frame.", "q5": "Played end to end it reads as one Pokémon game: the map, the VS screen, the send-out, the ace, the knock-out, the reward. That is the test this pass exists to run."}};
const LISTS={"R": [["Battle basics", [{"id": "sendout", "t": "Send Out", "today": "The ball flies a fixed 0.7s arc, then the Pokémon scales up from 60% with a bounce. Both sides look the same.", "idea": "Pass 1: One clear order: ball leaves, ball lands, white flash and ring, the Pokémon grows out of the light and its colour fades in. Pass 2: The ball lands, squashes and bounces once before it opens. The Pokémon comes out tall and thin, lands flat and wide, and settles. Dust on both landings. Pass 3: The landing ring and a spray of sparks come in the Pokémon's own type colours: fire for Charizard, water for Blastoise. Pass 4: The rival skids in with dust, steps back and whips the ball. You slide in, wind up and release on the game's own throw frames, and the ball leaves from the hand. Each trainer steps out as their Pokémon lands. Pass 5: Plates fly in from their own sides with a spring instead of fading, and each line of text pops its bubble. Pass 7: The ground answers: the base dips and flashes under every landing. Pass 11: Entrances end with a cry sized to the Pokémon, and a heavy Pokémon shakes the screen and bounces the other side off its feet.", "see": "pass 1, improved up to pass 21, clip \"Send Out\"", "tag": "want", "where": "src/ui/playerTrainer.ts:140, src/ui/aero.ts:76", "note": ""}, {"id": "recall", "t": "Recall", "today": "The Pokémon just fades out over 0.25s. No beam, no ball.", "idea": "Pass 1: The classic red beam: the Pokémon turns red, a beam snaps back to your side and it shrinks away along it. Pass 2: The trainer side holds the ball out first. The Pokémon braces, then is pulled thin up the beam, and the ball jolts as it catches. Pass 4: Your trainer leans in from the edge holding the ball out, takes the Pokémon back and steps away.", "see": "pass 1, improved up to pass 4, clip \"Recall\"", "tag": "need", "where": "src/scenes/BattleScene.ts:5152", "note": "Gap in the survey: no ball-return picture exists."}, {"id": "attack", "t": "Attack and Hit", "today": "A 24px lunge, a 60ms white fill, a colour flash and a 6-step shake. HP drains at the same time.", "idea": "Pass 1: Lunge in, two white blinks and a knock-back on the target, then the HP bar drains while the number counts down. Pass 2: A wind-up lean back, a stretched dash, an 80ms freeze on contact, then the target squashes, is thrown back and springs upright. The HP plate jolts and a ghost bar shows what was lost. Pass 3: The user glows in the move's type before it goes, and the hit bursts in that type: electric bolts for Thunder Punch. Pass 5: The damage number springs out of the hit and a red SUPER EFFECTIVE! stamp slams on at an angle. The message bubble pops and shows a bouncing arrow when it is done. Pass 6: A super effective or critical hit now throws type-coloured rays behind the target (the game's own burst art, re-coloured). Pass 7: The target's base jolts with the hit, harder for a super effective or critical one. Pass 8: The air moves: pollen drifts through every outdoor battle and a cloud shadow slides across the ground. Pass 9: The message bubble grows a pointer that slides to whoever is acting: left for your Pokémon, right for the foe. Pass 12: Special moves are now fired, not lunged: the user rears back and a shot in the move's colour crosses the field. Big hits throw the target further. Pass 16: Hard hits now punch the camera in toward the target, and a knock-out gets a slow push. Pass 18: Every hit now lights the floor in its type's colour, and a big hit lights the other Pokémon too. Pass 19: Your trainer now reacts with a face and one word when a big hit lands, either way. Pass 21: Every battle now has its arena's life behind it, and big hits leave a mark on the ground.", "see": "pass 1, improved up to pass 21, clip \"Attack and Hit\"", "tag": "want", "where": "src/ui/battleFx/battleFx.ts:367-424", "note": ""}, {"id": "faint", "t": "Faint", "today": "The sprite slides down 30px and fades in 0.4s. No last hit moment.", "idea": "Pass 1: The last hit lands, the bar empties, then the Pokémon sinks into the ground at its feet. Pass 2: A stagger left and right, the knees give, then the drop with a dust cloud. Pass 3: The last hit carries its type: embers for Flamethrower. Pass 7: The fainted side's base goes dark until the next Pokémon lands. Pass 11: It staggers back before it sinks. Pass 19: Your trainer cheers a knock-out and thanks a fallen partner. Pass 23: When a foe falls, its experience now leaves it as lights and flies to your bar.", "see": "pass 1, improved up to pass 23, clip \"Faint\"", "tag": "need", "where": "src/scenes/BattleScene.ts:5133", "note": "Gap in the survey: no last-hit moment."}, {"id": "hpbar", "t": "HP Bar", "today": "Drain time grows with the damage; a ghost bar follows. Colour changes snap.", "idea": "Pass 1: One steady 0.6s drain with an ease at both ends, and the number counts with it. Green, yellow and red change as the bar passes each mark. Pass 2: The bar snaps down fast, a white ghost bar holds for a beat and then catches up. The whole plate takes a small jolt. Pass 5: The bar flashes as it crosses into yellow and into red, and in the red it pulses with a slow glow around the plate.", "see": "pass 1, improved up to pass 11, clip \"HP Bar\"", "tag": "want", "where": "src/ui/widgets.ts:547", "note": ""}, {"id": "idle", "t": "Standing", "today": "The game plays each Pokémon's own sprite frames and adds a small 0.9s up-down stretch.", "idea": "Pass 1: Keep the sprite frames. Slow the breath to 1.9s and squeeze the width a little as the body rises, so it reads as breathing, not bobbing. Pass 2: The breath is a little deeper and the shadow shrinks as the body rises. Pass 11: Each Pokémon now stands in its own way: Charizard hovers over a shrinking shadow, Blastoise breathes slow and deep.", "see": "pass 1, improved up to pass 21, clip \"Standing\"", "tag": "want", "where": "src/ui/aero.ts:108", "note": ""}, {"id": "switch", "t": "Switch", "today": "The old Pokémon fades, the new one bounces in, and the info box slides 420px.", "idea": "Pass 2: One unbroken move: beam back, the bar tucks down, the next ball is already in the air, the bar comes back with the new name. Pass 4: Your trainer steps in for the recall and again for the throw, so a switch reads as one person doing two things.", "see": "pass 2, improved up to pass 11, clip \"Switch\"", "tag": "want", "where": "src/scenes/BattleScene.ts:1606, 5179", "note": ""}, {"id": "miss", "t": "Miss", "today": "The target slides 36px sideways and fades for 130ms.", "idea": "The target sees it coming: a quick duck and side-step with a stretch, the attacker overshoots and skids, then both reset.", "see": "pass 2, improved up to pass 5, clip \"Miss\"", "tag": "want", "where": "src/scenes/BattleScene.ts:5141", "note": ""}, {"id": "lowhp", "t": "Danger", "today": "The bar turns red. Nothing else changes.", "idea": "When HP drops under a fifth the bar pulses, the whole plate gets a slow red glow and the Pokémon breathes faster and sags. It stops the moment it is healed.", "see": "pass 5, improved up to pass 12, clip \"Danger\"", "tag": "want", "where": "src/ui/widgets.ts:547", "note": ""}, {"id": "encounter", "t": "Wild Encounter", "today": "Glass shutters close and open in 0.36s with a ball bloom, then the Pokémon is simply there.", "idea": "Pass 5: Two flashes, the screen splits into bars that pull apart, and the wild Pokémon slides in as a dark shape. Its colour floods in with its cry, its plate flies in, and only then do you throw. Pass 10: Now starts on the map: the stop pulses, the ball wipe shuts over it and opens on the arena, and the pass-5 entrance (dark shape, colour floods in with the cry, plate flies in) follows without a cut.", "see": "pass 5, improved up to pass 21, clip \"Wild Encounter\"", "tag": "want", "where": "src/ui/battleFx/spectacle.ts:51", "note": ""}, {"id": "p-shiny", "t": "Shiny Entrance", "today": "A sparkle animation plays once over the sprite.", "idea": "A shiny announces itself. Stars circle in and collapse onto it, a glint runs across the sprite, the whole arena brightens for a beat, and a star chip pins itself to the name plate so you cannot miss what you just found.", "see": "pass 11, clip \"Shiny Entrance\"", "tag": "want", "where": "", "note": ""}, {"t": "Damage number shown twice", "today": "Two parts of the code can each float a number for the same hit. The survey could not confirm whether both play.", "idea": "One number per hit, from the Numbers and Stamps design (pass 5). Check and remove the second.", "see": "", "tag": "need", "where": "src/scenes/BattleScene.ts:5039, 2230; src/ui/battleFx/battleFx.ts:426", "note": ""}]], ["After battle", [{"id": "levelup", "t": "EXP and Level Up", "today": "The EXP bar fills, then a \"Level up\" banner scales in and rises with a gold burst.", "idea": "The bar fills fast and overshoots into a flash, the level number ticks over on the bar, and the Pokémon does two happy hops with dust on each landing.", "see": "pass 2, improved up to pass 23, clip \"EXP and Level Up\"", "tag": "want", "where": "src/ui/battleFx/transitions.ts:10", "note": ""}]], ["Moves", [{"id": "types", "t": "Type Reel", "today": "When a move has no animation file the game falls back to one of 26 shared effects, or a 24px lunge with a colour tint.", "idea": "Eighteen impact kits, one per type, built from six shapes (sparks, rings, stars, streaks, bolts, chunks). They ride on top of every move animation so a hit always reads as its type, even on the fallback.", "see": "pass 3, improved up to pass 12, clip \"Type Reel\"", "tag": "want", "where": "src/ui/battleFx/familyFx.ts:198", "note": ""}, {"id": "telegraph", "t": "Wind-up Tells", "today": "A marker on the user before the move, in three styles: quick, normal, strong.", "idea": "Pass 3: The user glows in the move's type colour while a ring closes in at its feet. Quick moves barely flicker, strong moves pull sparks inward and make the ground tremble. Pass 6: A strong move dims the arena and wraps the user in a rising aura while it charges, so you can feel the size of what is coming.", "see": "pass 3, improved up to pass 12, clip \"Wind-up Tells\"", "tag": "want", "where": "src/core/presentation/cues.ts (telegraph cue)", "note": ""}, {"id": "stamps", "t": "Numbers and Stamps", "today": "A floating number (scale 0.6 to 1, rises 46px) and a small SUPER / WEAK / IMMUNE / CRIT badge.", "idea": "The number springs out of the hit and lifts away. Super effective is a red stamp that slams on at an angle and shakes the screen; not very effective settles in softly in blue; a critical hit turns the number gold and bigger.", "see": "pass 5, improved up to pass 17, clip \"Numbers and Stamps\"", "tag": "want", "where": "src/ui/battleFx/battleFx.ts:426", "note": ""}, {"id": "bh-tiers", "t": "Power Tiers", "today": "Every damaging move shakes the screen by the same amount and knocks the target back the same 30px.", "idea": "Three sizes of hit. A weak move is a tap: small spark, no shake. A normal move throws the target a body-width. A heavy move stops time for a moment, throws it most of the way off its base with two dust clouds, and the damage number is twice the size.", "see": "pass 12, improved up to pass 21, clip \"Power Tiers\"", "tag": "want", "where": "src/core/presentation/cues.ts:137", "note": ""}, {"id": "bh-charge", "t": "Charge-Up Move", "today": "A text line on the first turn, the move animation on the second.", "idea": "The first turn is a build-up you can watch: light is pulled in from all over the arena, the glow grows, and a CHARGING chip sits on the Pokémon through the foe's turn. The second turn lets it all go as one beam wider than the Pokémon.", "see": "pass 12, clip \"Charge-Up Move\"", "tag": "want", "where": "src/ui/battleFx/cinematics.ts:848", "note": ""}, {"id": "bh-crit", "t": "Critical Hit", "today": "The same hit with a text line afterwards.", "idea": "Pass 12: At the moment of contact everything stops. Black bars close in from top and bottom, the camera jumps to the target, the colour drains for a quarter of a second, and then the hit lands with the yellow CRITICAL HIT stamp and a number half as big again. Pass 17: A critical or super effective hit now gets one negative frame and a white star at the point of contact.", "see": "pass 12, improved up to pass 19, clip \"Critical Hit\"", "tag": "want", "where": "src/ui/battleFx/skillMoments.ts:67", "note": ""}, {"id": "mf-close", "t": "Close Range, Four Ways", "today": "A move with no animation file plays one of 26 shared effects. For the four close-range families that is the same 24-pixel lunge, with a ring, a slash line or a burst drawn on the target.", "idea": "The Pokémon acts the family out. A plain contact move is a shoulder dash and a ring. A bite closes two rows of teeth on the target and leaves claw marks. A punch lands as one fist-sized disc with six short lines. A heavy move crouches, glows, crosses nearly the whole field and leaves dust. You can tell the four apart with the sound off.", "see": "pass 24, clip \"Close Range, Four Ways\"", "tag": "want", "where": "src/ui/battleFx/familyFx.ts:198, src/core/presentation/families.ts:39", "note": ""}, {"id": "mf-shot", "t": "Shots, Beams and Breath", "today": "Projectile, beam, flame and dragon moves share two shapes: a dot that flies and a line that appears. Flame and dragon breath are the same line in two colours.", "idea": "Four different things leave the mouth. A projectile is a ball with a tail that arcs. A beam gathers light first, then holds as a three-layer bar that pushes the user back. A flame is a stream of growing puffs that takes time to arrive. Dragon breath is the same stream, but the body glows first and it ends in a burst.", "see": "pass 24, clip \"Shots, Beams and Breath\"", "tag": "want", "where": "src/ui/battleFx/familyFx.ts:198", "note": ""}, {"id": "mf-element", "t": "Elements Have Shapes", "today": "Wind, water, ground and ice moves differ mostly by colour. A wave and a gust are the same arc; a quake is a screen shake.", "idea": "Each element gets a shape nothing else uses. Wind is three thin crescents and a cut. Water is three tall crescents that arrive as a ring. Ground never travels: rock teeth come up under the target, which hops. Ice arrives as a ball, grows a row of spikes from the floor, and the spikes shatter.", "see": "pass 24, clip \"Elements Have Shapes\"", "tag": "want", "where": "src/ui/battleFx/familyFx.ts:198", "note": ""}, {"id": "mf-mind", "t": "Sparks, Sludge, Mind and Shadow", "today": "Electric, poison, psychic, ghost and status moves are a dot or a ring in the type colour. A status move looks like a weak attack.", "idea": "Five families that never touch the target. Lightning comes from the sky, three times. Poison is a lobbed ball that opens into a cloud and drips. A psychic move lifts the target off the ground, tilts it, and drops it. A ghost move darkens the field and opens two eyes behind the target. A status move is slow, does no damage, and leaves stars circling the head.", "see": "pass 24, clip \"Sparks, Sludge, Mind and Shadow\"", "tag": "want", "where": "src/ui/battleFx/familyFx.ts:198", "note": ""}, {"id": "mf-self", "t": "Care, Cover and Field", "today": "Healing, protection and field moves play a sparkle on the user. Protect shows nothing when it actually blocks a hit.", "idea": "Three families aimed at yourself. Healing rises from the feet and the bar fills as the lights pass the head. A barrier is a six-sided pane that stays up for the turn; when it blocks a hit it flashes, throws the hit back as sparks, and says so. A field move washes across the whole screen once and then changes the arena light for as long as it lasts.", "see": "pass 24, clip \"Care, Cover and Field\"", "tag": "want", "where": "src/ui/battleFx/familyFx.ts:198", "note": ""}, {"id": "mf-burst", "t": "Explosion", "today": "A charge glow, a burst on the user and a white wash. The user faints with the normal faint.", "idea": "The loudest family gets silence first. The body shrinks and flashes faster and faster while rings close in on it. Everything stops for a held breath. Then white, a ring that leaves the screen, a long shake, and a scorch where it stood. The user does not sink away: it is simply gone when the light clears.", "see": "pass 24, clip \"Explosion\"", "tag": "want", "where": "src/ui/battleFx/familyFx.ts:198", "note": ""}, {"id": "mf-type", "t": "One Family, Four Types", "today": "The family picks the shape and the type picks one flat colour.", "idea": "The family decides how a move is built and the type dresses it. Here the beam family plays four times in a row: fighting, dark, water and normal. The gather, the held bar and the push-back never change. The three colours, the particles and what the hit leaves on the ground come from the type kit.", "see": "pass 24, clip \"One Family, Four Types\"", "tag": "want", "where": "src/ui/battleFx/familyFx.ts:198", "note": ""}, {"id": "mf-reel", "t": "Family Reel: All 26", "today": "The 26 families are a table in the code: a startup, a travel and an impact for each. In play, most of them look alike.", "idea": "The same table, drawn so every row is different at a glance. Each tile shows a user dot on the left and a target dot on the right and plays its family on a loop: who moves, what crosses, and what shape lands. Families that act on the user (Burst, Healing, Barrier, Field) play on the left dot. The seven clips before this one are these tiles at full size.", "see": "pass 24, clip \"Family Reel: All 26\"", "tag": "want", "where": "src/core/presentation/families.ts:39", "note": ""}, {"t": "Mastery flourish", "today": "Sparks and a shine ring on the target when a mastered move hits.", "idea": "A mastered move plays its family startup one step bigger and its impact shape gets a gold edge, so mastery reads from the move itself.", "see": "", "tag": "want", "where": "src/ui/battleFx/battleFx.ts:322", "note": ""}, {"t": "Heated and Hyper moments (23 story animations)", "today": "23 named story animations (overdrive, interaction, rival, bond, drama), each timed on its own.", "idea": "Re-time all 23 on the set's shared beats (wind-up, hit-stop, hold, release). Each of the five groups gets one colour and one shape.", "see": "", "tag": "want", "where": "src/core/presentation/storyAnims.ts, src/ui/battleFx/storyFx.ts:94", "note": ""}, {"t": "Moment scene", "today": "Fade to black, static, then lines one at a time.", "idea": "An iris closes on the Pokémon as in Event Opens (pass 9); the lines are typed with Message Rhythm (pass 23).", "see": "", "tag": "want", "where": "src/ui/battleFx/momentScene.ts:132", "note": ""}]], ["Conditions", [{"id": "heal", "t": "Healing", "today": "A shared \"heal\" effect from the move pack and a green number.", "idea": "Green plus-signs rise through the Pokémon, it brightens and gives one small hop, and the bar climbs with the number.", "see": "pass 3, improved up to pass 12, clip \"Healing\"", "tag": "want", "where": "src/core/presentation/cues.ts:199", "note": ""}, {"id": "st-brn", "t": "Burn", "today": "The shared burn animation plays once, then a text banner. The end-of-turn damage is a number only.", "idea": "Flames climb the body from the feet, the BRN chip lands on the plate, and the Pokémon keeps a warm flicker. Each turn the flames flare up as the HP drops.", "see": "pass 8, improved up to pass 12, clip \"Burn\"", "tag": "want", "where": "src/core/presentation/cues.ts:230", "note": ""}, {"id": "st-psn", "t": "Poison", "today": "The shared poison animation plays once. The end-of-turn damage is a number only.", "idea": "Purple bubbles rise through the body and pop, the Pokémon sags and takes on a sick tint. Each turn one big bubble swells over its head and bursts as the HP drops.", "see": "pass 8, clip \"Poison\"", "tag": "want", "where": "src/core/presentation/cues.ts:230", "note": ""}, {"id": "st-par", "t": "Paralysis", "today": "The shared paralysis animation plays once; when it cannot move the same animation replays.", "idea": "Bolts crawl over the body and it locks up: its idle animation stops and it twitches instead. When it fails to move it lunges a few pixels, snaps back and sparks.", "see": "pass 8, clip \"Paralysis\"", "tag": "want", "where": "src/core/presentation/cues.ts:230", "note": ""}, {"id": "st-slp", "t": "Sleep", "today": "No shared animation beyond a short one; the sprite keeps its normal idle while asleep.", "idea": "It slumps, its breathing slows to a third, and Z's drift up from its head for as long as it sleeps. Waking up is a jump, a \"!\" and the Z's popping.", "see": "pass 8, clip \"Sleep\"", "tag": "want", "where": "src/core/presentation/cues.ts:230", "note": ""}, {"id": "st-frz", "t": "Freeze", "today": "The shared freeze animation plays once; the sprite keeps moving afterwards.", "idea": "Ice grows up from the ground and closes over the Pokémon, which stops dead inside it. Glints run over the block while it is frozen. Thawing cracks it, then it shatters and steams.", "see": "pass 8, clip \"Freeze\"", "tag": "want", "where": "src/core/presentation/cues.ts:230", "note": ""}, {"id": "st-cnf", "t": "Confusion", "today": "The shared confusion animation plays; hitting itself is a number and a text line.", "idea": "Three stars circle its head and it sways under them for as long as it is confused. When it hurts itself it swings at nothing, the stars scatter and a bump star lands on its own head.", "see": "pass 8, clip \"Confusion\"", "tag": "want", "where": "src/core/presentation/cues.ts:217", "note": ""}, {"id": "w-rain", "t": "Rain", "today": "The move animation plays, then falling rain sprites loop until it ends.", "idea": "Clouds roll in across the top and thunder flashes once before the first drops. Rain slants across in front of everything, puddle rings open on the ground, and a boosted Water move is called out by the weather chip.", "see": "pass 8, improved up to pass 21, clip \"Rain\"", "tag": "want", "where": "src/ui/battleFx/weather.ts:44", "note": ""}, {"id": "w-sun", "t": "Harsh Sunlight", "today": "The move animation plays, then a glow sits over the arena.", "idea": "The light sweeps across the field from the top corner, a turning sun and lens circles stay in the sky, colours get richer and every shadow shrinks under its Pokémon.", "see": "pass 8, improved up to pass 21, clip \"Harsh Sunlight\"", "tag": "want", "where": "src/ui/battleFx/weather.ts:44", "note": ""}, {"id": "w-sand", "t": "Sandstorm", "today": "A scrolling sand layer; the end-of-turn damage is a number only.", "idea": "A wall of sand crosses the screen and stays as two layers moving at different speeds with grit flying past. At the end of the turn the wind gusts, both Pokémon lean into it and take their chip damage together.", "see": "pass 8, clip \"Sandstorm\"", "tag": "want", "where": "src/ui/battleFx/weather.ts:44", "note": ""}, {"id": "w-snow", "t": "Snow", "today": "Falling snow sprites loop until it ends.", "idea": "One flake lands first. Then the snow comes down slowly with a side-to-side drift, frost creeps in from the edges of the screen, and Ice types get a cold shimmer when their Defense rises.", "see": "pass 8, clip \"Snow\"", "tag": "want", "where": "src/ui/battleFx/weather.ts:44", "note": ""}, {"id": "statup", "t": "Stat Changes", "today": "Three arrows drift 60px and fade, with a word banner.", "idea": "Chevrons in the stat's own colour sweep the whole body, up for a boost and down for a drop. A two-stage change sends two waves and bigger chevrons. A row of six pips next to the Pokémon shows where the stat stands.", "see": "pass 8, clip \"Stat Changes\"", "tag": "want", "where": "src/ui/battleFx/battleFx.ts:460", "note": ""}, {"id": "ability", "t": "Ability Trigger", "today": "A word banner with a few sparks.", "idea": "The ability gets a flag that unrolls from its owner's side of the screen, and the Pokémon acts it out. Here Intimidate: Gyarados leans in, its glare crosses the field, and your Pokémon shrinks back as its Attack drops.", "see": "pass 8, clip \"Ability Trigger\"", "tag": "want", "where": "src/ui/battleFx/abilityFx.ts:234", "note": ""}, {"id": "protect", "t": "Protect", "today": "The Protect move animation, then \"protected itself\" text.", "idea": "A shield of plates snaps together in front of the Pokémon and holds. The attack hits it, not the Pokémon: the plates flash where it lands, ripple, push the attacker back and then fold away.", "see": "pass 8, improved up to pass 12, clip \"Protect\"", "tag": "want", "where": "src/core/presentation/cues.ts (protect slot)", "note": ""}, {"t": "The 8 ability animations", "today": "Eight registered ability animations share one banner and a few sparks.", "idea": "Ability Trigger (pass 8) is the base. Each of the eight gets its own icon and one shape from the type kit.", "see": "", "tag": "want", "where": "src/core/presentation/abilityAnims.ts", "note": ""}]], ["Trainers", [{"id": "t-intro", "t": "Trainer Intro", "today": "Bars scale in, the trainer slides 0.48s and a VS card shows.", "idea": "Pass 4: The trainer skids in, their name plate snaps out from behind them, and their Poké Balls drop onto the plate one by one with a bounce, so you can count the team before the fight. Pass 13: Every opposing trainer now arrives on a red and gold banner with speed lines. Pass 15: The Trainer Intro page from the UI mockups, moving: the two colours slam together, both trainers slide in, the VS badge spins in and thumps, the name tags rise with each team's balls and the trainer says their line. Then the page splits down its own slant and the first Pokémon are thrown out behind it without a cut.", "see": "pass 4, improved up to pass 15, clip \"Trainer Intro\"", "tag": "need", "where": "src/ui/battleFx/spectacle.ts:51, src/ui/battleFx/vsScreens.ts:37", "note": "Kice note: use the trainer intro from the UI mockups."}, {"id": "t-ace", "t": "Ace Call", "today": "A burst at the foe and the line \"sends out their ace\". The ace is just the last one standing.", "idea": "Pass 4: The ace is announced before it lands. The trainer comes back on, an ACE banner slams across, the ball is thrown higher and slower, and the landing is twice as big, with a star and an Ace tag on its plate. Pass 14: When a trainer speaks, the bubble gets a name tab and their face in their own colour. Pass 15: The Ace Call from the UI mockups, moving: the trainer speaks first, then the navy band slams across on its slant, their portrait pops, the ace's name wipes on with its chips, and the ace itself arrives on the band as a dark shape that flashes into colour under a star. The band leaves and the ace leaps off it onto the field.", "see": "pass 4, improved up to pass 15, clip \"Ace Call\"", "tag": "need", "where": "src/scenes/BattleScene.ts:5200", "note": "Kice note: use the ace call from the UI mockups. Also the Ace rule: an ace must be announced."}, {"id": "t-lose", "t": "Trainer Defeated", "today": "The trainer slides back and the prize money line shows.", "idea": "The beaten trainer walks back on, drops their shoulders, and the prize money flips out as coins that arc across to your side while the total counts up.", "see": "pass 4, improved up to pass 14, clip \"Trainer Defeated\"", "tag": "want", "where": "src/scenes/BattleScene.ts:1152", "note": ""}, {"t": "Last Resort and mentor scene", "today": "A full-screen mentor scene, then a moment.", "idea": "Use the split screen from pass 19 (trainer on one half, Pokémon on the other) so it matches the gimmick scenes.", "see": "", "tag": "want", "where": "src/ui/battleFx/mentorScene.ts, src/scenes/BattleScene.ts:3982", "note": ""}, {"t": "Player trainer moments (hit, win, defeat frames)", "today": "The player trainer has drawn frames for throw, recall, win, hit and defeat.", "idea": "The frames stay. Trainer Reactions (pass 19) decides when each plays and adds the word chip.", "see": "", "tag": "want", "where": "src/ui/playerTrainer.ts:8", "note": ""}, {"t": "Trainer intro strips and boss poses", "today": "Intro strips play once at 12 frames a second and hold the last frame. 75 bosses are posed once.", "idea": "The frames stay. After the last frame the trainer keeps a slow breathing loop instead of freezing.", "see": "", "tag": "want", "where": "src/ui/sprites.ts:175-208", "note": ""}]], ["Catching", [{"id": "catch", "t": "Catch", "today": "Ball flies 0.45s, the foe shrinks and fades, the ball bounces, each shake is a 120ms rock, then a burst.", "idea": "The ball bonks the Pokémon and pops up before it opens, drops and bounces twice with dust, and three lamps above it light one per shake. On the click it squashes, three stars fly, and GOTCHA! stamps on.", "see": "pass 5, clip \"Catch\"", "tag": "want", "where": "src/scenes/BattleScene.ts:5560", "note": ""}]], ["Gimmicks", [{"id": "mega", "t": "Mega Evolution", "today": "A 4.3s scene: pink crystal, shatter, white flash. With Fast Mega on, a short generic cut-in.", "idea": "Pass 6: The bracelet throws six colours into the Pokémon, the game's orb closes around it and cracks while the arena dims, then it shatters outward and the Mega form lands with a roar. The Mega mark spins up and drops onto the name bar. 3.6s. Pass 16: Remake 1, goal: scale. The camera pushes in on Charizard and the cut-in page opens out of it until it is the whole screen. The orb closes around a Charizard five times its battle size while twelve streaks of colour drive in from every edge, cracks, and blows apart across the full width. Mega Charizard X lands on the page, the title slams, the four facts are dealt, and the page closes back onto the field where the Mega now stands. Pass 17: Remake 2, goal: impact. No easing, only cuts. Black frame: the bracelet in white. The battle in negative for three frames. Three comic panels slam on at an angle: Charizard's eyes, your raised arm, the word MEGA. Then a black-and-white frame of Charizard, the orb already cracked, three hard cracks with lightning, and it blows out in black and white shards before the colour arrives with the Mega form. Pass 18: Remake 3, goal: light. The arena goes dark and the Mega Bracelet is the only light in it. A beam carries that light to Charizard, who starts to glow, and the glow swallows the screen. Inside it the orb is a lamp: the Mega rainbow fans out of it as six real shafts of light, turning, and white needles leak out through the cracks. Mega Charizard X arrives as the exposure settles, and back on the field the arena stays lit in its colour. Pass 19: Remake 4, goal: together. The screen splits: you on the left raising the Mega Bracelet, Charizard on the right, a white seam between you and five heartbeats that speed up. The halves open like doors and you are standing side by side. The Key Stone lights in your hand, the Mega Stone answers on Charizard's chest, and six strands of colour run between the two before the orb closes. Afterwards you call out and Mega Charizard X answers. Pass 20: Remake 5, goal: one signature picture. Mega Evolution is glass. A double helix of colour climbs Charizard on the field, cracks run from it to every edge of the battle screen, and the screen goes black. Then the new picture slams together out of twenty-four shards, the corners first and Mega Charizard X's face last. When it is over the picture shatters again, and the pieces fall away from the field.", "see": "pass 6, improved up to pass 20, clip \"Mega Evolution\"", "tag": "need", "where": "src/ui/battleFx/megaScene.ts:42, src/ui/battleFx/cinematics.ts:331", "note": "Kice note: remade five times (passes 16 to 20)."}, {"id": "tera", "t": "Terastallize", "today": "A 2.2s scene: the crystal shakes and breaks; afterwards a jewel bobs 4px above the Pokémon.", "idea": "Pass 6: Crystals from the game's Tera art grow out of the ground around the Pokémon one after another, rainbow rings pass through, and it all bursts into shards. The Tera crown drops onto its head in the new type's colour and stays, bobbing, with a soft glint on the sprite. Pass 16: Remake 1, goal: scale. Five crystals as tall as the screen punch up from the bottom edge one after another, each one jolting the picture, until Charizard is walled in. Pulse rings pass through, everything shatters across the whole screen, and the Terastallized form lands on the cut-in page under its jewel. Pass 17: Remake 2, goal: impact. The same hard-cut language: item in white on black, the battle in negative, three panels with the word TERA. The five crystals do not grow, they are simply there, one every two frames, each with a flash; one negative frame, and they are gone in shards. Pass 18: Remake 3, goal: light. Lights out, the Tera Orb glows, a beam reaches Charizard. Five crystals rise as dark shapes. One white beam comes in from the corner, enters the middle crystal and leaves the other side as a rainbow; the crystals light up one after another, and everything shatters into coloured facets. Afterwards the field is lit pale blue. Pass 19: Remake 4, goal: together. After the split screen and the heartbeats, you throw the Tera Orb: it arcs over Charizard's head, bursts into a beam of light, and the crystals grow where it lands, lighting you from the side. Afterwards you call out and Charizard answers. Pass 20: Remake 5, goal: one signature picture. Terastallizing goes inside the jewel. One crystal closes over Charizard on the field, and the camera goes into it: twelve mirrored slices of Charizard turn like a kaleidoscope, changing colour as they go, then fold into a single point of light that becomes the crown.", "see": "pass 6, improved up to pass 20, clip \"Terastallize\"", "tag": "need", "where": "src/ui/battleFx/teraScene.ts:42", "note": "Kice note: remade five times (passes 16 to 20)."}, {"id": "dynamax", "t": "Dynamax", "today": "A 2.4s scene: recall, the band rises, the ball falls and shakes four times, a silhouette grows, the red giant roars.", "idea": "Pass 6: The ball swells in your hand
