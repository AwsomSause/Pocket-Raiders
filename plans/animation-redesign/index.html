until it is too big to hold, you heave it up and over, and where it lands the Pokémon rises through red storm clouds while the camera pulls back to fit it. Its HP bar doubles in front of you and three turn lamps light. Pass 7: The game's raid storm spiral now turns behind the giant. Pass 16: Remake 1, goal: scale. Storm clouds roll in at the top and Charizard simply keeps growing: past the title, past the top of the screen, while the camera tilts up to follow and lightning walks across behind it. It lands on the cut-in page as the giant, and back on the field the camera has pulled out to fit it. Pass 17: Remake 2, goal: impact. After the panels and the word MAX, Charizard does not swell, it jumps: three sizes in three cuts, each with a shock ring across the floor and a bolt behind it, the third one past the top of the screen. One negative frame and the giant is on the page. Pass 18: Remake 3, goal: light. Lights out, the Dynamax Band glows. A column of red light comes down out of the storm cloud and Charizard's silhouette grows inside it while lightning lights the cloud from within. The column widens until it is the whole screen. Afterwards the arena is lit red from the giant. Pass 19: Remake 4, goal: together. After the split screen, you call Charizard back, the ball swells in your hand, and you hurl it over your shoulder. It bursts behind you and the giant rises with you standing small in front of it, in its shadow. That picture of the two sizes is the cutscene. Pass 20: Remake 5, goal: one signature picture. Dynamax is one long camera move. You throw the swollen ball up out of the top of the screen and the camera follows it. Cut: your shoes, and a foot the size of a house. The camera climbs the giant without a cut, through two layers of storm cloud, and stops at its face above the weather as it roars.", "see": "pass 6, improved up to pass 20, clip \"Dynamax\"", "tag": "need", "where": "src/ui/battleFx/dynamaxScene.ts:52, src/ui/battleFx/cinematics.ts:516", "note": "Kice note: remade five times (passes 16 to 20)."}, {"id": "dmax-end", "t": "Dynamax Ends", "today": "A 0.65s shrink.", "idea": "The third lamp goes out, steam vents from the giant as it shrinks past its normal size and springs back, the clouds blow away and the camera settles. 1.4s.", "see": "pass 6, improved up to pass 7, clip \"Dynamax Ends\"", "tag": "want", "where": "src/core/presentation/transformAnims.ts:15", "note": ""}, {"id": "zmove", "t": "Z-Move", "today": "A 1.9s cut-in: white silhouette, speed lines, a rainbow Z ring and the move title sliding in.", "idea": "Pass 6: Trainer and Pokémon charge together: light flows from your Z-Ring into the Pokémon, a giant Z burns in behind it, the move's own title art slams across, and the hit lands as three blasts with the whole screen shaking. Pass 16: Remake 1, goal: scale. A rainbow Z spins in until it is taller than the screen, Z-Power streams in from every side, and Charizard burns white in the middle of it. The cut-in page shows the pose, the ring and the move's own title art, then closes onto the field for the hit. Pass 17: Remake 2, goal: impact. After the panels, the Z is not a shape that spins in: it is cut into the screen in three slashes, each with a flash, and holds for a breath over the black-and-white Charizard before the colour and the title art hit. Pass 18: Remake 3, goal: light. Lights out, the Z-Ring glows. A sun rises behind Charizard's silhouette, its rays turning, and the Z is written across it in three strokes of light. A lens flare cuts the screen and the silhouette burns white. The hit lands in a gold-lit arena. Pass 19: Remake 4, goal: together. After the split screen, you and Charizard strike the Z-pose in step: One, Two, Z. Each beat draws one stroke of the Z behind you both, and your Z-Power streams from your hand across to Charizard until it burns gold. Pass 20: Remake 5, goal: one signature picture. The Z-Move is the cutscene. Charizard leaves the top of the screen. Cut to the sky looking down: Blastoise small on the field, a shadow growing around it, and a fireball the size of the screen coming down. The damage is counted out in huge numbers, the move's title card holds, and Charizard lands back on a scorched field.", "see": "pass 6, improved up to pass 20, clip \"Z-Move\"", "tag": "need", "where": "src/ui/battleFx/zMoveScene.ts:47, src/ui/battleFx/cinematics.ts:742", "note": "Kice note: remade five times (passes 16 to 20)."}, {"t": "Primal Reversion", "today": "Reuses the Mega crystal scene, 2.5 seconds.", "idea": "Its own cut in the pass 20 style: the screen breaks into ancient-pattern slabs instead of glass.", "see": "", "tag": "want", "where": "src/ui/battleFx/cinematics.ts:50", "note": ""}, {"t": "Shadow and purified aura", "today": "A burst in the aura colour and a 0.9 second pulse. (The survey was not sure this is main-game.)", "idea": "Use the Totem Aura design (pass 13) in the shadow colour. Purifying plays it backwards and ends in the Blessing light.", "see": "", "tag": "want", "where": "src/scenes/BattleScene.ts:2743, src/ui/battleFx/markAura.ts:72", "note": ""}, {"t": "What a gimmick leaves on the Pokémon", "today": "A Tera jewel bobs 4 pixels above the Pokémon. Mega and Dynamax leave nothing.", "idea": "Each gimmick leaves one lasting sign on the Pokémon and on its plate, as in the pass 16 after-states.", "see": "", "tag": "want", "where": "src/scenes/BattleScene.ts:1398", "note": ""}]], ["Galar", [{"id": "stadium", "t": "Stadium Crowd", "today": "Galar gym battles use a normal arena. The crowd is only in the music.", "idea": "A stadium built for these battles: four rows of stands that bob to the beat, a banner wall in the gym's colour, floodlights. The crowd jumps and cameras flash on a super effective hit, sinks when you take one, and a Crowd meter swings between the two sides.", "see": "pass 7, clip \"Stadium Crowd\"", "tag": "want", "where": "src/ui/galar/stadiumDirector.ts", "note": ""}, {"t": "Favour bar, banners, camera cuts and interview", "today": "The favour bar eases for 0.5s, a banner slides and holds, ten small moves on the cut art, then an interview.", "idea": "All four join the Stadium Crowd design (pass 7): the bar moves with the crowd wave, banners unroll from the stands, the interview uses Trainer Call-out.", "see": "", "tag": "want", "where": "src/ui/galar/stadiumDirector.ts:264, 321; src/ui/galar/cutArt.ts", "note": ""}]], ["Bosses", [{"id": "vs", "t": "VS Screen", "today": "Bars scale in and a VS card shows for a moment.", "idea": "The two colours slam in from either side and meet on the slant with a spark. Both trainers slide in leaning forward, the VS badge spins in between them and thumps, the name tags drop with each team's balls, and the rival gets a line before the screen splits open on the battle.", "see": "pass 13, clip \"VS Screen\"", "tag": "want", "where": "src/ui/battleFx/vsScreens.ts:37", "note": ""}, {"id": "gym-intro", "t": "Gym Leader", "today": "A trainer intro with a longer text line.", "idea": "The gym's rays open behind an empty stage. The badge at stake drops in glowing, the Leader strides in from the right and hits their pose, the name is stamped across, and what you are up against is dealt out line by line: type, team, boss power, prize.", "see": "pass 13, clip \"Gym Leader\"", "tag": "want", "where": "src/ui/battleFx/spectacle.ts:51", "note": ""}, {"id": "legend", "t": "Legendary Encounter", "today": "The Legendary has a transformation-style intro; the encounter itself starts like a wild battle.", "idea": "Silence first: the screen is nearly black and the text arrives slowly. A shape is there before you can see it. Two eyes light, pressure lines push outward, and then the colour floods in with one shock ring that rattles the whole screen. Only then does the name appear.", "see": "pass 13, clip \"Legendary Encounter\"", "tag": "want", "where": "src/core/presentation/legendAnims.ts:12", "note": ""}, {"id": "boss-phase", "t": "Boss Phase Change", "today": "Boss phases follow the game state with a text line.", "idea": "When a boss ace drops to half, the fight visibly changes gear: the HP plate cracks and re-forms with a red edge, the arena darkens to the boss's colour, the ace flares and roars, and a PHASE 2 stamp lands. Nothing about the rules changes; you just cannot miss it.", "see": "pass 13, improved up to pass 14, clip \"Boss Phase Change\"", "tag": "want", "where": "src/ui/battleFx/spectacle.ts:366, src/ui/battleFx/arenaLife.ts:109", "note": ""}, {"id": "boss-heal", "t": "Enemy Heal", "today": "A text line and the bar refills.", "idea": "The trainer leans in from the edge and tosses the item. It arcs across, bursts into green light over their Pokémon, the bar climbs with a count, and one of the four heal pips on their plate goes dark so you always know how many they have left.", "see": "pass 13, clip \"Enemy Heal\"", "tag": "want", "where": "src/core/presentation/cues.ts:199", "note": ""}, {"t": "Legend title cards (12 shapes)", "today": "Twelve title-card shapes, 1.2 to 1.6 seconds each.", "idea": "Keep the twelve shapes. Each one opens with the Legendary Encounter beats (near black, eyes, colour flood), so the card ends the entrance and does not come before it.", "see": "", "tag": "want", "where": "src/core/presentation/legendAnims.ts:12, src/ui/battleFx/rivalStepIn.ts:115", "note": ""}]], ["Camera", [{"id": "cam-ko", "t": "Knock-out Camera", "today": "The camera never moves in a normal battle.", "idea": "The camera is now part of every fight. A hard hit punches in toward the target for a few frames; a knock-out gets a slow push toward the falling Pokémon and eases back out as the winner settles.", "see": "pass 16, improved up to pass 23, clip \"Knock-out Camera\"", "tag": "want", "where": "src/scenes/BattleScene.ts:2221", "note": ""}, {"t": "Opening reveal camera", "today": "At the start of a battle the camera pans for 0.9s at 1.7 times zoom while a veil fades.", "idea": "Fold it into Entrance Camera (pass 16), so the opening and every later send-out use the same camera move.", "see": "", "tag": "want", "where": "src/ui/battleFx/opening.ts:52", "note": ""}]], ["Short cuts", [{"id": "sg-short", "t": "Short Cut (Seen Before)", "today": "Fast Mega is a setting that swaps the scene for a generic cut-in. Tera, Dynamax and Z-Moves always play in full.", "idea": "A roguelike shows you the same gimmick many times. The first time in a run you get the full cutscene. After that each one plays a one-second cut that keeps only its signature: for Mega Evolution, the cracks, one white frame, and the glass falling away from a Mega that is already standing there.", "see": "pass 20, clip \"Short Cut (Seen Before)\"", "tag": "want", "where": "src/ui/battleFx/cinematics.ts:81", "note": ""}]], ["Flow", [{"id": "bag-item", "t": "Using an Item", "today": "A heal animation from the move pack and a green number.", "idea": "The item is shown being used. It leaves the bag chip, hangs over the Pokémon, tips, and sprays; the green rises through the Pokémon from the feet up while the bar refills behind a white leading edge. The bag chip counts one down. A Revive, an X Attack and a status heal would use the same four beats with their own colour.", "see": "pass 23, clip \"Using an Item\"", "tag": "want", "where": "src/core/presentation/cues.ts:199", "note": ""}, {"id": "msg", "t": "Message Rhythm", "today": "Battle text appears instantly by default. With typing on, every letter takes the same 30 ms.", "idea": "Typing is on, fast, and has rhythm. A comma is a short breath and a full stop a longer one. Moving on makes the bubble dip like a button being pressed. An important line punches the bubble and flashes its border; a quiet one types its dots slowly. The arrow bounces only when the game is waiting for you.", "see": "pass 23, clip \"Message Rhythm\"", "tag": "want", "where": "src/ui/dialogue/storyDialogue.ts:14, src/core/state.ts:2000", "note": ""}]], ["Events", [{"id": "ev-open", "t": "Event Opens", "today": "The map fades out and the event page fades in with everything already in place.", "idea": "The view closes on the map stop like a camera iris and opens on the place. The scene settles, the title strip slides in, you and your partner walk on from the left, the other person from the right, and only then the dialogue box rises and starts to talk.", "see": "pass 9, clip \"Event Opens\"", "tag": "want", "where": "src/scenes/EventScene.ts, src/ui/redux/screens/event.ts", "note": ""}, {"id": "ev-choice", "t": "Event Choice", "today": "The choices appear as a list in place of the text.", "idea": "Pass 9: The scene dims and steps back. What was just said shrinks into a chip at the top so you can still read it, and the choices are dealt up from the bottom like cards. The one you pick lifts, flashes and flies into the progress strip; the others fall away. Pass 15: On the corrected Event Choice page: the whole text box stays where it is, so you can still read what you were asked. The scene dims, the people step back into it, and the three choices are dealt in above the box like a hand of cards. The one you pick lifts, flashes and flies into the progress strip; the others fall away. Every piece is see-through, so nothing drags a cut-out along with it.", "see": "pass 9, improved up to pass 15, clip \"Event Choice\"", "tag": "need", "where": "src/ui/redux/screens/event.ts", "note": "Kice note: the choice has a cutout of a text bar."}, {"id": "ev-result", "t": "Event Result", "today": "The picture and text change in place.", "idea": "The place changes the way you got there: climbing the lighthouse scrolls the old room down and the lamp room in from above while you keep walking. Whatever was waiting drops into view, your side jumps, and the text carries on.", "see": "pass 9, clip \"Event Result\"", "tag": "want", "where": "src/ui/redux/screens/event.ts", "note": ""}, {"id": "ev-reward", "t": "Event Reward", "today": "Rewards appear after the text is dismissed and stay until you press a button.", "idea": "Same rule, with a show: the heading drops in, each reward card flips over with a ring of light, and they wait. When you press Enter they fly off one at a time to where they now live: the wallet, the bag, the Reserve.", "see": "pass 9, clip \"Event Reward\"", "tag": "want", "where": "src/ui/redux/screens/event.ts", "note": ""}, {"id": "blessing", "t": "Legendary Blessing", "today": "Three cards appear; the chosen one is highlighted.", "idea": "Pass 9: Three beams of light come down first and the cards descend inside them. The one you take rises and burns gold while feathers fall; the other two tip back into the dark. Its line of legend appears underneath, and the card flies up into the run strip. Pass 15: The original cutscene, kept in its order and made holy. A bell tolls three times in the dark. Light comes down from above through a rose window, the object descends in it under a halo, and the Legendary appears behind it, vast and pale. The passage is written like scripture, one line at a time after an illuminated letter. Candles light, feathers fall, and at the end the light comes down on your partner, who bows under its own small halo.", "see": "pass 9, improved up to pass 15, clip \"Legendary Blessing\"", "tag": "need", "where": "src/scenes/BlessingScene.ts", "note": "Kice note: the original cutscene, remade holy. Overrides the UI mockups."}, {"id": "starter", "t": "Starter Remembrance", "today": "The three starter cards are shown at once.", "idea": "Three Poké Balls roll in and stop under the Professor's words. They open one at a time, left to right, and each one turns into its card with the region stamp already on it. The first one you look at grows; the others wait their turn.", "see": "pass 9, clip \"Starter Remembrance\"", "tag": "want", "where": "src/scenes/StarterSelectScene.ts", "note": ""}, {"t": "Pseudo-stage banner", "today": "A banner on the map.", "idea": "The purple band from Event Stage Starts (pass 9), because a pseudo-stage always belongs to an event.", "see": "", "tag": "want", "where": "src/scenes/MapScene.ts:1388", "note": ""}, {"t": "Event screen styles (8)", "today": "Eight event styles with 3 to 12 small tweens each.", "idea": "All eight use the same four clips (Event Opens, Choice, Result, Reward). A style changes colours and frames, not timing.", "see": "", "tag": "want", "where": "src/ui/eventStyles/, src/ui/redux/redux.css:133", "note": ""}]], ["Side roads", [{"id": "evolve", "t": "Evolution", "today": "A full scene already: the silhouette flickers faster and faster for 4.2s, a white flash, and the new form scales from 1.15 to 1.", "idea": "The flicker stays, because that flicker is Pokémon. Everything around it is new. The room goes dark to one spotlight, two ribbons of light climb the Pokémon, each swap is bigger than the last and sends a ring across the floor, and when the new shape holds, the colour rises through it from the feet up. Then the name slams in, the stat gains count up in a column, and a new move drops in last. The B button hint pulses the whole time.", "see": "pass 22, clip \"Evolution\"", "tag": "want", "where": "src/ui/evolutionScene.ts:237", "note": ""}, {"id": "egg", "t": "Egg Hatch", "today": "The caption rises, the egg hops once, wobbles three times with cracks and a small shake, then a burst and a white flash.", "idea": "The egg is given a little stage and a little patience. It rocks, stops, rocks harder; each crack is drawn as a line with light behind it; it jumps clean off the ground before it goes. The baby does not just appear: it sits in the bottom half of the shell, blinks at you, hops out, and the shell halves rock on the floor behind it.", "see": "pass 22, clip \"Egg Hatch\"", "tag": "want", "where": "src/scenes/DecisionScene.ts:697", "note": ""}, {"id": "trade", "t": "Trade", "today": "Thirteen trade screen styles with two to seven small tweens each: cards slide, a fade, the new Pokémon is shown.", "idea": "One trade animation for all thirteen screens. Both Pokémon are called back, the two balls rise onto a pair of rails, and they pass each other in the middle of the screen in a flash, each leaving a trail in its trainer's colour. They drop on the far side and open. The two trainers stay on screen the whole time, because a trade is between people.", "see": "pass 22, clip \"Trade\"", "tag": "want", "where": "src/ui/tradeStyles/", "note": ""}, {"id": "reward", "t": "Battle Reward", "today": "Nine reward screen styles; a card reveals in 0.16s, a gift lid opens, a sheen sweeps.", "idea": "Three cards are dealt face down onto the dimmed field, flip over one by one and lean toward your cursor as it passes. The one you pick lifts, flashes, and its item flies to your bag, where the count ticks up. The two you left tip over and fall off the bottom of the screen.", "see": "pass 22, clip \"Battle Reward\"", "tag": "want", "where": "src/ui/rewardStyles/", "note": ""}, {"t": "Run over (defeat or victory)", "today": "Ten small tweens on the end-of-run screen.", "idea": "The map path dims stop by stop back to the start, your team walks off together, then the run's numbers count up one line at a time.", "see": "", "tag": "want", "where": "src/scenes/GameOverScene.ts", "note": ""}, {"t": "Hall of Fame", "today": "Three small tweens.", "idea": "Each team member steps into a spotlight in order, with its level and the stop where it joined.", "see": "", "tag": "want", "where": "src/scenes/HallOfFameScene.ts", "note": ""}, {"t": "Credits", "today": "A plain roll with three tweens.", "idea": "The run's stops scroll past as a road, with your team walking along it under the names.", "see": "", "tag": "want", "where": "src/scenes/CreditsScene.ts", "note": ""}, {"t": "Minigames", "today": "One shared screen with two tweens.", "idea": "A three-beat count-in, score ticks that pop, and a finish stamp, the same for every minigame.", "see": "", "tag": "want", "where": "src/scenes/MinigameScene.ts", "note": ""}, {"t": "Legacy Gallery", "today": "Two small tweens.", "idea": "Past trainers stand in a row; the one you pick steps forward and its team is sent out behind it, ace last.", "see": "", "tag": "want", "where": "src/scenes/LegacyGalleryScene.ts", "note": ""}]], ["Screens", [{"id": "wipe", "t": "Ball Wipe", "today": "Screens change with a fade, or glass shutters for battles.", "idea": "Every big change of place shuts like a Poké Ball and opens on the next screen: two halves slide in on the slant, meet, the button flashes, and they part. 0.8s, used for map to battle, battle to reward and town to road.", "see": "pass 10, clip \"Ball Wipe\"", "tag": "want", "where": "src/ui/transitions.ts:19, src/ui/battleFx/spectacle.ts:312", "note": ""}, {"id": "title", "t": "Title Screen", "today": "The title appears complete after loading.", "idea": "The title builds itself in under two seconds: the navy slab slides in on its slant, POCKET drops and RAIDERS slides under it, your trainer steps in from the right, the menu deals out row by row, Rotom's note and the Best badge pop, and your last team walks along the bottom.", "see": "pass 10, clip \"Title Screen\"", "tag": "want", "where": "src/scenes/MainMenuScene.ts:100", "note": ""}, {"t": "Boot screen", "today": "A fish bobs every 0.6s and scales in.", "idea": "The game opens with the Ball Wipe (pass 10), so the first thing you see is in the same language as the rest.", "see": "", "tag": "want", "where": "src/scenes/BootScene.ts:176", "note": ""}, {"t": "Loading looks (9)", "today": "Nine loading looks that loop every 0.7 to 1.4 seconds.", "idea": "Keep the nine. Put them on one 1.2 second beat and end each by handing off to the Next Stop Card (pass 10).", "see": "", "tag": "want", "where": "src/ui/loadingLooks.ts", "note": ""}, {"t": "Title background clips and Press Start", "today": "Six video clips crossfade every 9 seconds. Press Start blinks.", "idea": "The crossfade stays. Press Start breathes on the same 0.9 second beat as a Pokémon standing, instead of blinking.", "see": "", "tag": "want", "where": "src/ui/titleClips.ts, src/scenes/MainMenuScene.ts:158", "note": ""}, {"t": "Screen transition styles", "today": "Four styles to choose from (fade, bounce, wipe, ripple). Battles always get a plain fade whatever is chosen.", "idea": "One family: Ball Wipe into battles, a slanted wipe between screens, an iris for events. The setting picks the speed, not a different style.", "see": "", "tag": "want", "where": "src/ui/transitions.ts:19, src/main.ts:150", "note": ""}, {"t": "Sheen sweep on every screen", "today": "A shine sweeps across every screen as it arrives.", "idea": "Keep it only for screens that arrive with a win or a reward, so the shine means something.", "see": "", "tag": "want", "where": "src/ui/transitions.ts (sheenSweep)", "note": ""}, {"t": "New UI page motion (about 55 CSS animations)", "today": "About 55 small animations in the new UI stylesheet, each timed on its own.", "idea": "One timing table for the whole game (0.12s pop, 0.25s slide, 0.4s settle), so pages and battles move at the same speeds.", "see": "", "tag": "want", "where": "src/ui/redux/redux.css", "note": ""}, {"t": "Settings", "today": "Five small tweens.", "idea": "Switches flick, sliders show their effect live. Battle effects plays the Reduced Motion clip (pass 25) in a small window as you change it.", "see": "", "tag": "want", "where": "src/scenes/SettingsScene.ts", "note": ""}, {"t": "Save Slots", "today": "Two small tweens; the three cards are simply there.", "idea": "The three cards are dealt in. The one you pick opens like a trainer card and the others tuck behind it.", "see": "", "tag": "want", "where": "src/scenes/SaveSlotsScene.ts", "note": ""}, {"t": "Trainer Select", "today": "Four small tweens.", "idea": "The trainer you point at steps forward and plays its win frame; the others step back and dim.", "see": "", "tag": "want", "where": "src/scenes/TrainerSelectScene.ts", "note": ""}, {"t": "Briefing", "today": "Two small tweens.", "idea": "The lines stamp in one by one like a mission card, on the Message Rhythm beat.", "see": "", "tag": "want", "where": "src/scenes/BriefingScene.ts", "note": ""}, {"t": "Party and summary panel", "today": "Sprites sway every 1.4s, hop in loops, and the panel fades shut. Eight party styles.", "idea": "Party tiles pop in order like the Pause Menu. The Pokémon you point at plays its own Idle Style (pass 11).", "see": "", "tag": "want", "where": "src/ui/partyPanel.ts:418, 662", "note": ""}]], ["World", [{"id": "map-travel", "t": "Map: Moving On", "today": "Path lines are static; the marker jumps to the stop you pick.", "idea": "The stop you just cleared gets a stamp. The paths to the next stops draw themselves outward and those stops start to pulse. Pick one and you hop along the line in three bounces, land with a puff, and the view closes on the stop.", "see": "pass 10, clip \"Map: Moving On\"", "tag": "need", "where": "src/scenes/MapScene.ts:1460", "note": "Kice note: smaller map that shows 8 stops with room to spare. Also fills a gap: paths are never drawn on today."}, {"id": "shop", "t": "Poké Mart: Buying", "today": "The count changes and the money number updates.", "idea": "What you buy hops off its shelf and lands in the basket, which bumps and adds up. At check-out your coins fly to the counter, a SOLD stamp lands, and the clerk thanks you.", "see": "pass 10, clip \"Poké Mart: Buying\"", "tag": "want", "where": "src/ui/shopStyles/common.ts:105", "note": ""}, {"t": "Hub Town: walking and the crowd", "today": "You walk a tile in 0.14s and run one in 0.075s. Townsfolk wander.", "idea": "Speeds stay. The walker squashes a little on start and stop, and townsfolk turn to look as you pass.", "see": "", "tag": "want", "where": "src/ui/hubTown/townView.ts:284, src/ui/hubTown/crowd.ts", "note": ""}, {"t": "Hub Town: day and night, growth, signs", "today": "A halo pulses with the time of day, growth shows sparkles, signs bob every 0.52s.", "idea": "All three follow the Time of Day clock from pass 21, so the town and the battles share one sky.", "see": "", "tag": "want", "where": "src/ui/hubTown/townTime.ts:38, townGrowth.ts:42, indicators.ts:89", "note": ""}, {"t": "Pocket Town folk", "today": "Folk walk a step in 0.34s at 7 frames a second.", "idea": "Same rules as the Hub Town crowd.", "see": "", "tag": "want", "where": "src/ui/hubTown/pocketFolk.ts:139", "note": ""}, {"t": "Map: halos, path sparks and depth", "today": "Reachable stops breathe, open paths carry light sparks, the layers shift a little.", "idea": "Keep all three. The halos pulse in order along the path from where you stand, so the eye is led to the next stops.", "see": "", "tag": "want", "where": "src/scenes/MapScene.ts:764, 968-1025", "note": ""}, {"t": "Map: healing stop", "today": "A green wash and 14 rising sparkles, 0.8 seconds.", "idea": "Use the Healing family (pass 24): lights rise from each party icon in order and each bar fills as they pass.", "see": "", "tag": "want", "where": "src/scenes/MapScene.ts:546", "note": ""}, {"t": "Map: the egg", "today": "The egg wobbles on the map.", "idea": "The wobble gets stronger the closer the egg is to hatching, and matches the first beat of Egg Hatch (pass 22).", "see": "", "tag": "want", "where": "src/scenes/MapScene.ts:1180", "note": ""}, {"t": "Map: welcome back", "today": "A banner pans for 0.9s and a dream blur clears when you resume.", "idea": "The blur clears outward from your marker, then the Next Stop Card says where you were.", "see": "", "tag": "want", "where": "src/scenes/MapScene.ts:905, 1384", "note": ""}, {"t": "Shop screen styles (8)", "today": "Coins count up in 0.38s, a price pops, the stall shakes on a failed buy, a box slides.", "idea": "All eight use the Poké Mart: Buying beats (hop off the shelf, basket bump, coins fly, SOLD).", "see": "", "tag": "want", "where": "src/ui/shopStyles/", "note": ""}]], ["Rules for the whole set", [{"id": "mc-calm", "t": "Reduced Motion: Three Levels", "today": "The game has a Reduced motion setting. It shortens some tweens and leaves others alone, case by case.", "idea": "One rule for the whole set, shown on one hit. Full: wind-up, hit-stop, shake, flash, particles and camera. Reduced: the screen never shakes, flashes or moves; the wind-up is short; the shapes, the number and the bar stay. Off: the bar, the number and the text change, and nothing else moves. What happened is readable at every level, because no clip in this set uses motion as the only way to say something.", "see": "pass 25, clip \"Reduced Motion: Three Levels\"", "tag": "need", "where": "src/core/settingsRegistry.ts (battleAnimations and about 40 other switches)", "note": "Needed before anything is built: one rule for what Reduced and Off keep."}, {"id": "mc-skip", "t": "Hold to Skip, and Short Cuts", "today": "Some cutscenes can be skipped with a key press and some cannot. A skipped cutscene cuts to black and back.", "idea": "Two rules. First: every cutscene over two seconds can be skipped by holding a button. A small bar fills while you hold, so one stray press never loses a scene, and the skip is one white frame straight to the last picture of the cutscene, never to black. Second: the Cutscene length setting swaps a long cutscene for its own short cut, made for it, like the one-second Mega.", "see": "pass 25, clip \"Hold to Skip, and Short Cuts\"", "tag": "need", "where": "src/core/state.ts:2120 (fastMega, fastTera, fastDynamax, fastZMove)", "note": "Needed before anything is built: one rule for skipping."}]]], "N": [["Battle basics", [{"id": "p-idles", "t": "Idle Styles", "today": "Every Pokémon plays its sprite loop and nothing else; they all stand the same way.", "idea": "Six ways of standing, chosen by body type and layered on top of the sprite loop: fliers hover over a shrinking shadow, ghosts drift and flicker, heavy ones breathe slow and deep, electric ones twitch and hop, long ones sway, the rest stand steady.", "see": "pass 11, clip \"Idle Styles\"", "tag": "", "where": "", "note": ""}, {"id": "p-size", "t": "Light and Heavy", "today": "Every Pokémon lands the same way.", "idea": "Weight is a character trait. A small Pokémon lands, bounces twice and squeaks out a little cry. A heavy one comes down like a dropped piano: the screen jolts, dust goes both ways, the HP plates rattle and the Pokémon across the field is bounced off its feet.", "see": "pass 11, clip \"Light and Heavy\"", "tag": "", "where": "", "note": ""}, {"id": "p-tired", "t": "Worn Out", "today": "The HP bar turns red and pulses. The Pokémon stands exactly as before.", "idea": "Below a fifth of its HP the Pokémon itself shows it: it slumps, breathes fast and shallow, and sweat flicks off. Heal it and it straightens up with a shake and goes back to its normal stance.", "see": "pass 11, clip \"Worn Out\"", "tag": "", "where": "", "note": ""}, {"id": "p-bond", "t": "Toughed It Out", "today": "A text line says it held on; the HP bar stops at 1.", "idea": "The bar drains to a single point and catches there with a spark. The Pokémon skids back, drops to one knee, shakes, then plants its feet and glows for a heartbeat. A HUNG ON stamp lands and a heart floats up toward you.", "see": "pass 11, improved up to pass 19, clip \"Toughed It Out\"", "tag": "", "where": "", "note": ""}, {"id": "p-flinch", "t": "Flinch", "today": "A text line: \"flinched and couldn't move\".", "idea": "The Pokémon starts its lunge, jerks to a stop, pulls its head down and backs up two steps with a sweat drop. The move never comes out, and you can see why.", "see": "pass 11, clip \"Flinch\"", "tag": "", "where": "", "note": ""}, {"id": "p-wait", "t": "Waiting on You", "today": "Nothing happens while you think.", "idea": "Take more than a few seconds over your move and your Pokémon notices: it glances round with a \"?\", bounces on its feet twice, and settles again. It never repeats within a turn and never blocks input.", "see": "pass 11, clip \"Waiting on You\"", "tag": "", "where": "", "note": ""}, {"t": "Forced out (Roar, Whirlwind)", "today": "No motion of its own was found in the survey.", "idea": "The target is dragged backwards into its ball. The next Pokémon is thrown out, not sent.", "see": "", "tag": "", "where": "", "note": ""}, {"t": "Hit and run (U-turn, Volt Switch)", "today": "No motion of its own was found in the survey.", "idea": "The user's dash ends inside its own ball, so there is no separate recall.", "see": "", "tag": "", "where": "", "note": ""}, {"t": "Form change in battle", "today": "No motion of its own was found in the survey.", "idea": "One beat: a snap, a ring in the type colour, and the plate updates. Used for a broken disguise and other mid-battle form changes.", "see": "", "tag": "", "where": "", "note": ""}, {"t": "Transform", "today": "No motion of its own was found in the survey.", "idea": "The user's outline wipes across into the shape of the target.", "see": "", "tag": "", "where": "", "note": ""}, {"t": "Running away", "today": "No motion of its own was found in the survey.", "idea": "The Pokémon is recalled (pass 1 Recall), the trainer turns, and the battle slides away with dust. A failed run is a stumble and a shake of the head.", "see": "", "tag": "", "where": "", "note": ""}, {"t": "Battle menu buttons", "today": "No motion of its own was found in the survey.", "idea": "Buttons press down two pixels and pop back. The four moves fan out in their type colours. No new look, motion only.", "see": "", "tag": "", "where": "", "note": ""}]], ["After battle", [{"id": "p-victory", "t": "Winner's Moment", "today": "After a knock-out the winner keeps idling until the EXP bar moves.", "idea": "The winner gets a second to itself. It hops twice, spins once on the spot, a note pops out, and it leans toward you. Different body types celebrate differently: fliers loop, heavy ones stamp once.", "see": "pass 11, improved up to pass 16, clip \"Winner's Moment\"", "tag": "", "where": "", "note": ""}]], ["Moves", [{"id": "bh-multi", "t": "Multi-Hit", "today": "The move animation plays once and the damage is shown as separate numbers.", "idea": "Each hit is a quick jab with its own spark and its own notch off the HP bar, and a combo counter in the corner ticks up and grows with every one. It ends by slamming the total.", "see": "pass 12, clip \"Multi-Hit\"", "tag": "", "where": "", "note": ""}, {"id": "bh-recoil", "t": "Recoil", "today": "A number on the user and a text line.", "idea": "The force comes back. A crack of the move's own colour runs from the target back along the ground to the user, who winces, flashes and loses its bit of HP. You see why it hurt.", "see": "pass 12, clip \"Recoil\"", "tag": "", "where": "", "note": ""}, {"id": "bh-drain", "t": "Drain", "today": "Two numbers: damage on the target, healing on the user.", "idea": "After the hit, what was taken travels: green lights lift off the target one by one, cross the field in an arc and sink into the user, whose HP bar steps up as each arrives.", "see": "pass 12, clip \"Drain\"", "tag": "", "where": "", "note": ""}, {"id": "bh-ohko", "t": "One-Hit KO", "today": "A normal hit animation and the bar empties.", "idea": "The ground opens. A crack races from the user to the target, the target's base splits and it drops straight down out of sight, and the bar empties in one frame under a ONE-HIT KO stamp.", "see": "pass 12, improved up to pass 23, clip \"One-Hit KO\"", "tag": "", "where": "", "note": ""}, {"id": "bh-beam", "t": "Recharge Turn", "today": "A text line: \"must recharge!\".", "idea": "After the biggest moves the user is spent, and looks it: steam pours off it, it sags with a grey tint and a RECHARGE chip hangs over it while the foe takes a free turn. When the turn ends the chip pops and it stands back up.", "see": "pass 12, improved up to pass 18, clip \"Recharge Turn\"", "tag": "", "where": "", "note": ""}, {"id": "bh-contact", "t": "Contact Punish", "today": "A number on the attacker and a text line (Rocky Helmet, Rough Skin).", "idea": "Touching the wrong thing bites back at the moment of contact: spikes jab out of the target, the attacker bounces off further than it came in with a star on its nose, and the item or ability flag slides out to say why.", "see": "pass 12, clip \"Contact Punish\"", "tag": "", "where": "", "note": ""}, {"id": "bh-priority", "t": "Priority Move", "today": "Plays like any other move; only the turn order tells you it went first.", "idea": "A FIRST! tag snaps onto the user before anything else on the turn can start. It does not wind up: it blurs, leaves three after-images across the field, and the hit lands before the tag has faded.", "see": "pass 12, clip \"Priority Move\"", "tag": "", "where": "", "note": ""}, {"id": "bh-hazard", "t": "Entry Hazards", "today": "The move animation plays; nothing stays on the field and the switch-in damage is a number.", "idea": "Hazards stay where you can see them. Stealth Rock throws five stones that plant themselves around your side and hover there with a ROCKS chip. When your next Pokémon comes in they all stab inward at once.", "see": "pass 12, clip \"Entry Hazards\"", "tag": "", "where": "", "note": ""}]], ["Conditions", [{"id": "tick", "t": "End-of-turn Damage", "today": "Burn, poison, Leech Seed, recoil and weather damage only show a number. Nothing plays on the Pokémon.", "idea": "Pass 3: A small version of the type impact, a flinch and a short drain. Fast, because it happens every turn: 0.5s each. Pass 8: Residual damage now has a look for each cause; see Burn, Poison and End of Turn.", "see": "pass 3, improved up to pass 8, clip \"End-of-turn Damage\"", "tag": "", "where": "", "note": ""}, {"id": "w-end", "t": "Weather Clears", "today": "The layer disappears with a text line.", "idea": "The chip counts its last turn and pops. The rain thins out, one beam of light breaks through the clouds and travels across the field, and the colours come back.", "see": "pass 8, clip \"Weather Clears\"", "tag": "", "where": "", "note": ""}, {"id": "terrain", "t": "Terrain", "today": "Only the move animation plays. Nothing stays on the ground, so you cannot see that a terrain is active.", "idea": "A terrain is a carpet that rolls out from the user's feet and stays under both Pokémon: a humming grid for Electric, growing flowers for Grassy, slow rings for Psychic, drifting mist for Misty. Each has its own chip and turn count.", "see": "pass 8, clip \"Terrain\"", "tag": "", "where": "", "note": ""}, {"id": "endturn", "t": "End of Turn", "today": "Leftovers, poison and weather each print a number one after another, then the next turn starts.", "idea": "The end of a turn becomes a short parade: a row of chips shows what is about to happen, each lights up as its tick plays on the field, and then a line sweeps the screen and the turn counter flips over.", "see": "pass 8, clip \"End of Turn\"", "tag": "", "where": "", "note": ""}, {"t": "Screens stay up (Reflect, Light Screen)", "today": "No motion of its own was found in the survey.", "idea": "A faint six-sided pane (the Barrier family, pass 24) stands in front of the side for as long as the screen lasts, and flashes each time it lowers a hit.", "see": "", "tag": "", "where": "", "note": ""}, {"t": "Tailwind stays", "today": "No motion of its own was found in the survey.", "idea": "Thin crescents (the Wind family) keep crossing behind the side that has the wind.", "see": "", "tag": "", "where": "", "note": ""}, {"t": "Trick Room stays", "today": "No motion of its own was found in the survey.", "idea": "The arena floor shows a tilted grid, and the Who Goes First strip (pass 23) runs backwards.", "see": "", "tag": "", "where": "", "note": ""}, {"t": "Leech Seed and binding stay", "today": "No motion of its own was found in the survey.", "idea": "A small vine or ring stays on the Pokémon. The End-of-turn Damage tick (pass 3) travels along it.", "see": "", "tag": "", "where": "", "note": ""}, {"t": "Substitute", "today": "No motion of its own was found in the survey.", "idea": "A doll drops in front of the Pokémon, takes the hit in its place, and bursts when it breaks.", "see": "", "tag": "", "where": "", "note": ""}, {"t": "Perish count", "today": "No motion of its own was found in the survey.", "idea": "A number chip on the plate ticks down each turn with a bell.", "see": "", "tag": "", "where": "", "note": ""}, {"t": "Status icon lands on the plate", "today": "No motion of its own was found in the survey.", "idea": "The icon pops onto the plate in the status colour, and shakes on any turn the status stops the Pokémon acting.", "see": "", "tag": "", "where": "", "note": ""}, {"t": "Stat stages stay on the plate", "today": "No motion of its own was found in the survey.", "idea": "Small up and down chips stay on the plate after Stat Changes (pass 8) and count what is active.", "see": "", "tag": "", "where": "", "note": ""}, {"t": "Weather and terrain turn counter", "today": "No motion of its own was found in the survey.", "idea": "A chip counts the turns left, flips each turn, and flashes on the last one before Weather Clears.", "see": "", "tag": "", "where": "", "note": ""}]], ["Trainers", [{"id": "t-call", "t": "Trainer Call-out", "today": "Trainer lines appear in the normal message box.", "idea": "A small portrait card pops in at the edge with a speech bubble on a springy tail, the Pokémon it is aimed at perks up, and the card tucks away. It never covers the plates.", "see": "pass 4, improved up to pass 13, clip \"Trainer Call-out\"", "tag": "", "where": "", "note": ""}, {"t": "Trainers at rest", "today": "No motion of its own was found in the survey.", "idea": "Trainers with a single still picture get breathing, a blink and a weight shift made in code, like Idle Styles for Pokémon (pass 11).", "see": "", "tag": "", "where": "", "note": ""}]], ["Catching", [{"id": "breakout", "t": "Break Out", "today": "The ball vanishes and the Pokémon is back in the same frame. No burst at all.", "idea": "The ball rattles faster and faster, splits into two halves that spin away, and the Pokémon bursts back out bigger than life before it settles with an angry hop. The unlit lamp falls off.", "see": "pass 5, clip \"Break Out\"", "tag": "", "where": "", "note": ""}, {"t": "Ball kinds open differently", "today": "No motion of its own was found in the survey.", "idea": "Each kind of ball has its own burst colour and number of rings. Seal Case extras ride on top.", "see": "", "tag": "", "where": "", "note": ""}, {"t": "New Pokédex entry", "today": "No motion of its own was found in the survey.", "idea": "After a first catch, a card flips in and the silhouette fills with colour from the feet up.", "see": "", "tag": "", "where": "", "note": ""}, {"t": "Nickname prompt", "today": "No motion of its own was found in the survey.", "idea": "The name tag slides out of the ball and waits; the name is typed onto it.", "see": "", "tag": "", "where": "", "note": ""}]], ["Galar", [{"id": "gym-galar", "t": "Gym Leader Entrance", "today": "The same slide-in as any trainer, then the battle starts.", "idea": "The leader walks out of the tunnel as a shadow against the light, their number fills the screen, the stadium lights snap on in their colour and their League Card flips over to show the team size. Then both sides take the pitch.", "see": "pass 7, clip \"Gym Leader Entrance\"", "tag": "", "where": "", "note": ""}, {"id": "gmax", "t": "Gigantamax", "today": "Plays the Dynamax scene; the form just swaps.", "idea": "Its own show. The swollen ball bursts in the sky, the Pokémon's shadow grows up through the storm past the top of the screen, the camera pulls back to find the new shape, and its special feature (here the burning wings) ignites last. The G-Max mark stamps the name bar.", "see": "pass 7, clip \"Gigantamax\"", "tag": "", "where": "", "note": ""}, {"id": "gmax-move", "t": "G-Max Move", "today": "Max and G-Max moves share one generic animation.", "idea": "The giant fires across the whole pitch: the title slams in, a wall of the move's type rolls from one side to the other, and what the move leaves behind stays on the field (here G-Max Wildfire's flames, with a 4-turn counter).", "see": "pass 7, clip \"G-Max Move\"", "tag": "", "where": "", "note": ""}, {"id": "raid-den", "t": "Max Raid Den", "today": "A raid starts like any other battle, with a screen fade.", "idea": "A red pillar of light stands over the den. Step in and the light swallows the screen, the storm spiral opens, and a giant shadow rises out of it while the star rating counts up. Your team of four lines up underneath it, tiny.", "see": "pass 7, clip \"Max Raid Den\"", "tag": "", "where": "", "note": ""}, {"id": "raid-shield", "t": "Raid Barrier", "today": "Not in the game: raid bosses have no barrier.", "idea": "At half HP the boss throws up a barrier of six plates. Each hit cracks one off, the counter under its HP bar empties, and when the last one goes the whole barrier shatters and the boss staggers, wide open.", "see": "pass 7, clip \"Raid Barrier\"", "tag": "", "where": "", "note": "Needs a rule first: raid bosses have no barrier in the game today."}, {"id": "champion", "t": "Champion Time", "today": "The Champion uses the same intro as a gym leader.", "idea": "The stadium goes dark. One spotlight, the cape, the pose. The stands turn red and gold row by row, his Charizard's shadow sweeps over the pitch, and the title card lands: undefeated.", "see": "pass 7, clip \"Champion Time\"", "tag": "", "where": "", "note": ""}, {"id": "eternamax", "t": "Eternamax", "today": "Eternatus changes form with the Dynamax scene.", "idea": "The sky cracks. Eternatus is pulled up into the storm, the screen goes black except for the red core, and the Eternamax form uncoils above the arena, too big for the frame. The HP bar grows a second layer.", "see": "pass 7, clip \"Eternamax\"", "tag": "", "where": "", "note": ""}]], ["Bosses", [{"id": "ub", "t": "Ultra Beast", "today": "No presentation: an Ultra Beast appears like any wild Pokémon.", "idea": "The sky tears. A crack splits the picture, the screen glitches in strips, and the hole widens with something drifting out of it that does not move like a Pokémon. Its name flickers as if the game is not sure of it.", "see": "pass 13, clip \"Ultra Beast\"", "tag": "", "where": "", "note": ""}, {"id": "badge", "t": "Badge Get", "today": "A badge screen appears.", "idea": "The badge falls from the top turning like a coin, lands with a ring of light and a shine that sweeps across it. Its name slams in, the extras you won pop up one by one, and confetti keeps falling until you move on.", "see": "pass 13, clip \"Badge Get\"", "tag": "", "where": "", "note": ""}, {"id": "totem", "t": "Totem Aura", "today": "A text line: the Totem's aura flared.", "idea": "A Totem is half as big again and looks it. Its aura bursts upward like a bonfire, rainbow chevrons climb it as every stat rises, and when it calls for help the ally drops in beside it with a thump.", "see": "pass 13, clip \"Totem Aura\"", "tag": "", "where": "", "note": ""}]], ["Rivals", [{"id": "rv-spot", "t": "Rival Spots You", "today": "A rival battle is a stop like any other. You learn who it is when the battle starts.", "idea": "You are spotted. A ! pops over your marker, the rival's marker leaves its stop and races back down the path toward you leaving a trail in their colour, the two bump, and the map is slashed open in their colour straight into the VS screen.", "see": "pass 14, clip \"Rival Spots You\"", "tag": "", "where": "", "note": ""}, {"id": "rv-board", "t": "Rival Board", "today": "The rivals list appears complete.", "idea": "Four cards are dealt from the right and land one after another. The rival who is closest lifts with a gold ring, the one you have not met yet rattles behind its question mark, and each \"next\" line ticks so you can see when they are coming.", "see": "pass 14, clip \"Rival Board\"", "tag": "", "where": "", "note": ""}, {"id": "rv-win", "t": "Rival Beaten", "today": "The rival's defeat line shows and the battle ends like any other.", "idea": "The rival walks back on with a line of their own. Their card slides in with the record changing in front of you and the stop where you will meet next, the rival bonus pops, and they turn to leave, stop, look back once, and go.", "see": "pass 14, clip \"Rival Beaten\"", "tag": "", "where": "", "note": ""}, {"id": "rival-loss", "t": "Losing to a Rival", "today": "The loss is reported with the same fade as any defeat.", "idea": "No fade to black, because the run is not over. The rival's colour sweeps across, they stride in, the headline slams down in two beats, and then the important part: a green \"Your run goes on\" pops and pulses, and what you keep is ticked off line by line.", "see": "pass 14, clip \"Losing to a Rival\"", "tag": "", "where": "", "note": ""}, {"t": "Rival Rescue Plan", "today": "No motion of its own was found in the survey.", "idea": "The rival steps in with the Trainer Call-out, the plan choices are dealt like Event Choice cards, and the readiness word stamps on.", "see": "", "tag": "", "where": "", "note": ""}]], ["Villains", [{"id": "grunt", "t": "Evil Team Ambush", "today": "Grunt battles start like any trainer battle.", "idea": "An alarm: the screen pulses red twice and the lights drop. Two shapes step out of the dark, the lights snap back on them, the team's letter is stamped on the floor, and the one who challenges you steps forward while the other backs off to wait their turn. A counter shows how many are left.", "see": "pass 14, clip \"Evil Team Ambush\"", "tag": "", "where": "", "note": ""}, {"id": "boss-team", "t": "Team Boss Entrance", "today": "The team's leader appears like any other trainer.", "idea": "The room is dark. One spotlight flickers on over an empty floor. A tall shadow walks into it without hurrying, the light widens and gives him his colour, the grunts on both sides jump to attention and step back, and his name lands on a red band. His line arrives slowly.", "see": "pass 14, clip \"Team Boss Entrance\"", "tag": "", "where": "", "note": ""}, {"id": "betrayal", "t": "The Betrayal", "today": "The betrayal is a text scene before the Legendary battle.", "idea": "The beaten Boss sags and loses his colour. A grunt walks past him to the switch, says what the team really thinks, and throws it: the screen cracks from top to bottom, the title slams in, the four steps of what happens next are dealt out, and something behind the sealed door opens its eyes.", "see": "pass 14, clip \"The Betrayal\"", "tag": "", "where": "", "note": ""}, {"id": "leg-free", "t": "The Legendary Breaks Loose", "today": "The Legendary battle after a betrayal starts like a wild battle.", "idea": "It is held by four chains and it is pulling. They snap one at a time, each with a crack and flying links. On the last one it roars, the grunt runs for his life across the front of the screen, and the plate arrives with a gold tag: catch it or beat it.", "see": "pass 14, clip \"The Legendary Breaks Loose\"", "tag": "", "where": "", "note": ""}]], ["Camera", [{"id": "cam-send", "t": "Entrance Camera", "today": "The camera never moves in a normal battle.", "idea": "When a Pokémon comes in, the camera leans toward its side as the ball lands, gives it a beat alone in the frame, and settles back to the two-shot as its plate arrives.", "see": "pass 16, clip \"Entrance Camera\"", "tag": "", "where": "", "note": ""}]], ["Impact frames", [{"id": "if-finish", "t": "Finishing Blow", "today": "The last knock-out of a battle looks like every other.", "idea": "The hit that ends a battle gets the full treatment: time stops on a negative frame, the screen goes black and white with lines racing in on the target, one beat of silence, and then colour snaps back as it is thrown clear off its base. K.O. is stamped across the screen.", "see": "pass 17, improved up to pass 23, clip \"Finishing Blow\"", "tag": "", "where": "", "note": ""}]], ["Light", [{"id": "lt-move", "t": "Move Light", "today": "Moves never light the arena. A Flamethrower in a cave looks the same as one at noon.", "idea": "Moves are light sources. In a dark place you can see it best: the charge lights the user from below, the hit throws the type's colour across the floor and onto the other Pokémon, and the glow takes a moment to die. A fire hit is orange, an electric one is yellow, a water one is blue.", "see": "pass 18, clip \"Move Light\"", "tag": "", "where": "", "note": ""}]], ["Trainer and Pokémon together", [{"id": "tg-react", "t": "Trainer Reactions", "today": "You are never seen or heard in a battle.", "idea": "Your trainer stays off the field, as decided, but is no longer silent. At the moments that matter a small face pops up at the right of your bar with one word: a wince when your Pokémon takes a big hit, a shout when yours lands, and a cheer on the knock-out. It never covers the message or the plates and is gone in a second.", "see": "pass 19, clip \"Trainer Reactions\"", "tag": "", "where": "", "note": ""}]], ["Arenas", [{"id": "ar-grass", "t": "Meadow", "today": "A flat striped backdrop. Since pass 8 a cloud shadow and a few motes drift over it.", "idea": "Clouds cross the sky, twelve tufts of grass sway out of step, two butterflies wander through. Every few seconds a gust runs across: the tufts bend in a wave from left to right and three white wind lines pass.", "see": "pass 21, clip \"Meadow\"", "tag": "", "where": "", "note": ""}, {"id": "ar-cave", "t": "Cave", "today": "A flat brown backdrop.", "idea": "A ragged ceiling of rock hangs over the top of the screen. One shaft of daylight leans in from the left with dust turning in it, and water drips from three points, each drop opening a ring where it lands. Now and then something small flies across.", "see": "pass 21, clip \"Cave\"", "tag": "", "where": "", "note": ""}, {"id": "ar-sea", "t": "Open Sea", "today": "A flat blue backdrop; both Pokémon nge the rules.", "see": "pass 21, clip \"The Field Remembers\"", "tag": "", "where": "", "note": ""}, {"id": "ar-build", "t": "Arena Arrival", "today": "The battle screen appears complete after the transition.", "idea": "The place arrives before the fight does. The sky drops in from the top and the ground rolls up from the bottom, the two platforms slide in from opposite sides, the grass pops up tuft by tuft, and only then does the Pokémon step in. It takes under a second and a half.", "see": "pass 21, clip \"Arena Arrival\"", "tag": "", "where": "", "note": ""}]], ["Flow", [{"id": "exp-team", "t": "EXP for the Whole Team", "today": "Only the active Pokémon's bar fills. The rest of the party gains experience in a text line.", "idea": "The fallen Pokémon's experience leaves it as lights. Most fly to the bar of the one that fought; the rest split off to five small portraits that slide in on the right, each with its own little bar. The bars fill in order, top to bottom, and the one that levels up flashes, hops, and shows its new level.", "see": "pass 23, clip \"EXP for the Whole Team\"", "tag": "", "where": "", "note": ""}, {"id": "move-learn", "t": "New Move", "today": "A text prompt and a list. The old move is replaced without motion.", "idea": "The four moves are four tiles in their type colours. The new move comes down from above as a fifth tile, glowing, and waits. You pick the one to lose: it counts One, Two, and with a Poof it turns white, cracks and drops out of the frame, and the new tile swings into the gap and locks with a ring.", "see": "pass 23, clip \"New Move\"", "tag": "", "where": "", "note": ""}, {"id": "held", "t": "Held Items Speak Up", "today": "A held item that triggers gets a text line.", "idea": "When a held item does its job you see the item. A Focus Sash appears across the Pokémon, pulls tight as the bar stops one point short of empty, and snaps in two. A Shell Bell pops up beside the attacker after its hit, swings twice with two rings of soun ound and the party is restored.", "idea": "The six balls on the machine light up one after another in time with the jingle, flash together, and then the team list slides in with each row popping as its HP is restored. Nurse Joy only speaks once it is done.", "see": "pass 9, clip \"Pokémon Center\"", "tag": "", "where": "", "note": ""}]], ["Side roads", [{"id": "xp", "t": "Expedition: Out and Back", "today": "No motion of its own was found for expeditions.", "idea": "Sending three Pokémon away should feel like sending them somewhere. A route draws itself across a field map dot by dot, the three set off along it in single file and shrink into the distance, and a small clock turns while you play on. When they come home they are carrying a chest between them; it drops, pops open, and what they found flies out into a row and is counted.", "see": "pass 22, clip \"Expedition: Out and Back\"", "tag": "", "where": "", "note": ""}, {"id": "second", "t": "Second Chance", "today": "Two lines of text, then the battle restarts with a hard cut. No motion.", "idea": "Losing should stop the world for a second. The colour drains out of the battle and everything hangs. A single Revive falls slowly through the grey, turning, and where it lands a ring of gold runs out across the field putting the colour back. Your Pokémon rises the way it fell, its bar refills, and the counter of chances ticks down so you know it will not happen twice.", "see": "pass 22, clip \"Second Chance\"", "tag": "", "where": "", "note": ""}, {"id": "rewind", "t": "Rewind", "today": "A text menu. The turn is simply restored.", "idea": "A rewind should look like one. Press it and the last turn runs backwards at four times speed under tape lines: the damage number drops back into the Pokémon, the bar climbs back up, both Pokémon slide back to where they stood. A clock hand spins the wrong way in the middle of the screen, the turn counter flips from 6 back to 5, and the tape lines snap off.", "see": "pass 22, clip \" /* Pocket Raiders animation redesign: mockup kit.
   clip(pass, id, meta, fn) is one animation; verb(pass, name, fn) is a reusable move (send out, hit, faint...).
   Both are versioned by pass: at pass P the newest version with pass <= P plays, so a later pass re-animates every clip that uses a verb.
   A clip is a timeline of plain numbers (no CSS animations), so it can be paused, slowed, scrubbed and photographed at any moment. */
const AK = { clips: {}, verbs: {}, order: [], P: 1, cur: null, S: null, t: 0, speed: 1, play: true, hold: 0.9 };
const GROUPS = ['Battle basics', 'Moves', 'Catching', 'Trainers', 'Gimmicks', 'Galar', 'Conditions', 'Bosses', 'Rivals and villains', 'After battle', 'Events', 'World', 'Side roads', 'Screens', 'Guide'];
function clip(pass, id, meta, fn) { (AK.clips[id] = AK.clips[id] || []).push({ pass, meta, fn }); if (!AK.order.includes(id)) AK.order.push(id); }
function verb(pass, name, fn) { (AK.verbs[name] = AK.verbs[name] || []).push({ pass, fn }); }
function pick(list, P) { let b = null; for (const d of list || []) if (d.pass <= P && (!b || d.pass >= b.pass)) b = d; return b; }
function V(name, ...a) { const d = pick(AK.verbs[name], AK.P); return d ? d.fn(...a) : null; }
/* VP: the version of a verb from before `pass`, so a new version can build on the old one */
/* CP(pass, id): the body of clip `id` as it was before `pass`, so a later pass can wrap it (set S.off to start it later) */
function CP(pass, id) { return (AK.clips[id] || []).filter(c => c.pass < pass).sort((a, b) => b.pass - a.pass)[0].fn; }
function VP(pass, name, ...a) { const d = pick((AK.verbs[name] || []).filter(x => x.pass < pass), pass); return d ? d.fn(...a) : null; }
function clipsAt(P) {
  const out = [];
  for (const id of AK.order) { const d = pick(AK.clips[id], P); if (d && d.fn) out.push({ id, meta: d.meta, isNew: Math.min(...AK.clips[id].map(x => x.pass)) === P, changed: d.pass === P }); }
  return out.sort((a, b) => GROUPS.indexOf(a.meta.g) - GROUPS.indexOf(b.meta.g));
}
/* touch(pass, ids or {id: new idea line}): say that a pass re-animates these clips through its verbs (marks them "redone" on the page and the sheets) */
function touch(pass, ids) { const map = typeof ids === 'string' ? Object.fromEntries(ids.split(' ').map(i => [i, 0])) : ids; for (const id in map) { const prev = pick(AK.clips[id].filter(d => d.pass < pass), pass); if (prev) clip(pass, id, map[id] ? Object.assign({}, prev.meta, { idea: map[id] }) : prev.meta, prev.fn); } }

const EZ = {
  lin: u => u, in: u => u * u, out: u => 1 - (1 - u) * (1 - u), io: u => u < .5 ? 2 * u * u : 1 - 2 * (1 - u) * (1 - u),
  in3: u => u * u * u, out3: u => 1 - (1 - u) ** 3, out5: u => 1 - (1 - u) ** 5, io3: u => u < .5 ? 4 * u * u * u : 1 - ((-2 * u + 2) ** 3) / 2,

/* first n visible letters of a string that may hold <b> tags */
function tslice(str, n) { let out = '', c = 0, open = []; for (let i = 0; i < str.length && c < n; i++) { if (str[i] === '<') { const j = str.indexOf('>', i), tag = str.slice(i, j + 1); out += tag; if (tag[1] === '/') open.pop(); else open.push(tag.slice(1, -1).split(' ')[0]); i = j; } else { out += str[i]; c++; } } return out + open.reverse().map(t => `</${t}>`).join(''); }

  }
  also(d, p, e) { const c = this.c; this.to(d, p, e); this.c = c; return this; }
  set(p) { return this.to(0, p); }
  _seg(k, d, v, e) { (this.tr[k] = this.tr[k] || []).push({ t: this.c, d, v, e: ez(e), n: this.S.n++ }); this.sorted = 0; }
  /* cyc(seconds, period, {prop: [v0, v1, ... v0]}): loop through the values every period, for a while */

  /* style(prop, value) and html(text): instant switches at the cursor */

  html(v) { return this.style('@html', v); }

  type(str, cps = 40) { this.typed = this.typed || []; this.typed.push({ t: this.c, str, cps }); this.c += str.replace(/<[^>]+>/g, '').length / cps; if (this.c > this.S.dur) this.S.dur = this.c; return this; }

  _sort() { for (const k in this.tr) { const L = this.tr[k]; L.sort((a, b) => a.t - b.t || a.n - b.n); for (let i = 0; i < L.length; i++) L[i].f = this._ev(k, L, i - 1, L[i].t); } this.sorted = 1; }
  _ev(k, L, i, t) {
    if (i < 0) return this.init[k] !== undefined ? this.init[k] : (DEF[k] !== undefined ? DEF[k] : 0);
    const s = L[i];
    if (s.vals) { const tt = Math.min(t, s.t + s.d) - s.t, n = s.vals.length - 1, ph = ((tt / s.per) % 1) * n, a = Math.min(n - 1, Math.floor(ph)); if (t >= s.t + s.d && s.d < 900) return s.vals[0]; return s.vals[a] + (s.vals[a + 1] - s.vals[a]) * s.e(ph - a); }

   so the battle screen stays clear (the trainer is not on screen during a turn). */
verb(4, 'trin', (S, side, t, o = {}) => {
  const me = side === 'me', X = o.x ?? (me ? 130 : PFOE.x);
  const tr = me ? S.img(o.k || 'pt-hilda', { x: -150, y: 540, ay: 1, sc: 1.2, L: 'mid', z: 3 }) : S.img(o.k || 'ft-blue', { x: 1090, y: PFOE.y + 8, ay: 1, sc: 2.7, L: 'mid' });
  tr.side = side; tr.X = X; tr.Y = me ? 540 : PFOE.y + 8; if (tr.strip && me) tr.at(0).set({ f: 0 });
  tr.at(t).to(.42, { x: X }, 'out3'); tr.at(t).set({ kx: me ? -10 : 10 }).wait(.3).to(.3, { kx: 0 }, 'back');
  if (!me) dust(S, t + .36, X + 30, tr.Y - 4, 6);
  S.beat(t, (me ? 'You' : 'Trainer') + ' slide in');
  return tr;
});
/* throw: returns { t: release time, x, y: the hand } */
verb(4, 'throw', (S, tr, t) => {
  if (tr.side === 'me') {
    tr.at(t).to(.14, { x: tr.X - 14 }, 'out').to(.1, { x: tr.X + 18 }, 'in3').to(.3, { x: tr.X }, 'back');
    tr.at(t).set({ f: 1 }).wait(.14).set({ f: 2 }).wait(.06).set({ f: 3 }).wait(.1).set({ f: 4 });
    S.beat(t, 'Wind-up').beat(t + .2, 'Release'); return { t: t + .2, x: tr.X + 78, y: tr.Y - tr.H * .62 };
  }
  tr.at(t).to(.2, { x: tr.X + 110 }, 'out').to(.14, { x: tr.X + 126, r: 9 }, 'out').to(.09, { x: tr.X + 92, r: -12 }, 'in3').to(.3, { r: 0 }, 'back');
  S.beat(t, 'Steps back, winds up').beat(t + .43, 'Release'); return { t: t + .43, x: tr.X + 50, y: tr.Y - tr.H * .7 };
});
verb(4, 'trout', (S, tr, t) => { const me = tr.side === 'me'; tr.at(t).to(.1, { kx: me ? 8 : -8 }).to(.3, { x: me ? -170 : 1110 }, 'in3'); return t + .4; });
verb(4, 'send', (S, m, t, o = {}) => {
  if (!o.first && !o.tr) return VP(4, 'send', S, m, t, o);
  const tr = V('trin', S, m.side, t, o), r = V('throw', S, tr, t + (o.hold ?? .55)); V('trout', S, tr, r.t + .4);
  return VP(4, 'send', S, m, r.t, Object.assign({}, o, { x0: r.x, y0: r.y }));
});
verb(4, 'recall', (S, m, t, o = {}) => {
  const me = m.back, tr = V('trin', S, m.side, t - .35, { x: me ? 70 : 900 }); if (me) tr.at(t - .1).set({ f: 4 });
  const e = VP(4, 'recall', S, m, t, o); V('trout', S, tr, e - .1); return e;
});

/* Pass 5: Stagecraft. The interface joins the performance: plates fly in, numbers and stamps land with the hit, the message bubble pops,
   and the big set pieces (wild encounter, the catch, the break-out) get their own choreography. */
const stamp = (S, t, txt, c, x, y, soft) => { const p = S.box({ L: 'ov', x, y, html: txt, cls: 'stamp ' + c, o: 0, s: soft ? .8 : 2.2, r: soft ? 0 : -7 }); p.at(t).set({ o: 1 }).to(soft ? .2 : .12, { s: 1 }, soft ? 'out' : 'in3').wait(.75).to(.2, { o: 0, y: y - 14 }); if (!soft) S.shake(t + .12, .12, 4); return p; };

verb(5, 'say', (S, t, str, o = {}) => {

  if (!S._arr) { S._arr = S.box({ par: m, w: 14, h: 10, bg: '#ffcb05', o: 0, css: 'left:426px;top:40px;clip-path:polygon(0 0,100% 0,50% 100%)' }); S._arr.cyc(999, .5, { y: [0, 5, 0] }); }
  S._arr.at(t).set({ o: 0 }).at(t + str.replace(/<[^>]+>/g, '').length / (o.cps || 55) + .05).set({ o: 1 });
});
verb(5, 'hpdrain', (S, who, t, to) => {

  if (to > 0 && to <= 20) { h.bar.at(t + .5).cyc(999, .5, { br: [1, 1.9, 1] }); h.pl.gc = '#ff3b30'; h.pl.at(t + .5).cyc(999, 1, { glow: [0, 14, 0] }); }
  return e;

verb(5, 'hit', (S, m, t, o = {}) => {
  const e = VP(5, 'hit', S, m, t, o), foe = m.side === 'foe', sx = foe ? m.X - 170 : m.X + 210, sy = foe ? 134 : m.Y - 70;
  if (o.dmg) S.pop(t + .07, '-' + o.dmg, { x: m.X + (foe ? -20 : 40), y: m.Y - m.H * .5 - 6, rise: 54, hold: .45, css: o.crit ? 'color:#ffcb05;font-size:60px' : '' });
  if (o.crit) stamp(S, t + .1, 'CRITICAL HIT!', 'y', sx, sy - 48);
  if (o.eff === 1) stamp(S, t + .22, 'SUPER EFFECTIVE!', '', sx, sy); else if (o.eff === -1) stamp(S, t + .22, 'Not very effective…', 'b', sx, sy, 1); else if (o.eff === 0) stamp(S, t + .22, 'NO EFFECT', 'k', sx, sy, 1);
  return Math.max(e, t + (o.eff !== undefined || o.crit ? 1.15 : .6));
});

  S.streak(T2, { x1: bx, y1: f.Y - 90, x2: f.X, y2: f.Y, w: 14, col: '#ff3b30', d: .06, hold: .2, out: .1 });
  const T3 = T2 + .4; b.at(T3 - .08).to(.08, { s: .8 }).to(.1, { s: 1 }); b.fn(.26, { y: u => f.Y - 90 + (gy - f.Y + 90) * u * u }); dust(S, T3 + .28, bx, gy + 14, 5);

clip(24, 'mf-reel', { t: 'Family Reel: All 26', g: 'Moves', now: 'The 26 families are a table in the code: a startup, a travel and an impact for each. In play, most of them look alike.', idea: 'The same table, drawn so every row is different at a glance. Each tile shows a user dot on the left and a target dot on the right and plays its family on a loop: who moves, what crosses, and what shape lands. Families that act on the user (Burst, Healing, Barrier, Field) play on the left dot. The seven clips before this one are these tiles at full size.' }, S => {
  S.full({ L: 'bg', bg: 'radial-gradient(ellipse at 50% 40%,#22325e,#0e1530)' });
  FAM26.forEach(([nm, st, tr, im, self, c], i) => { const col = i % 7, row = Math.floor(i / 7), x = 78 + col * 134 + (row === 3 ? 134 : 0), y = 78 + row * 128, x0 = x - 34, x1 = x + 34, yy = y - 12;
    S.box({ L: 'bg', x, y, w: 124, h: 116, rad: 14, bg: '#ffffff0d', css: 'border:2px solid #ffffff22' }); S.box({ L: 'ui', x, y: y + 40, html: nm, css: `font:700 12px/1 "M PLUS Rounded 1c",sans-serif;color:${c};white-space:nowrap` });
    const u = S.box({ L: 'ui', x: x0, y: yy, w: 16, h: 16, rad: '50%', bg: '#fff', css: 'border:2px solid #16203f;box-sizing:border-box' }), tg = S.box({ L: 'ui', x: x1, y: yy, w: 16, h: 16, rad: '50%', bg: '#8fa0d0', css: 'border:2px solid #16203f;box-sizing:border-box' });
    for (let k = 0; k < 5; k++) { let t = .4 + col * .07 + row * .12 + k * 1.5; if (st === 1) { u.at(t).to(.14, { s: 1.5 }, 'out').to(.12, { s: 1 }, 'back2'); t += .26; } if (st === 2) { S.ring(t, { L: 'ui', x: x0, y: yy, r0: 26, r1: 7, col: c, w: 3, d: .3, e: 'in' }); t += .32; } const T = MTR[tr](S, t, u, x0, x1, yy, c); MIM[im](S, T, self ? x0 : x1, yy, c, self ? u : tg); if (!self && im !== 'quake' && im !== 'shield' && im !== 'sparkle') tg.at(T).to(.05, { x: x1 + 5 }, 'out').to(.15, { x: x1 }, 'io'); } });
  S.beat(.4, 'All 26 play at once').beat(1.9, 'Top row: who moves and what lands').beat(3.4, 'Second row: the elements').beat(4.9, 'Third row: mind, care and cover').beat(6.4, 'Last row: the loud ones').end(8);
});

/* ===== pass 25 ===== */
/* Pass 25: MASTER CUT. Almost nothing new is drawn here. Earlier clips are played back to back, as the player would meet
   them, so the whole set can be judged as one thing. Then the two settings every clip has to respect: Reduced and Skip. */
const CORE25 = ['root', 'id', 'P', 'acts', 'dur', 'n', 'beats', 'seed', 'meta'];
/* scene25(S, t0, clip id or function, {from, len}): play a clip inside this one, on its own stage and camera, seen only from t0 for len seconds */
const scene25 = (S, t0, what, o = {}) => {
  const keep = {}; for (const k of Object.keys(S)) if (!CORE25.includes(k)) { keep[k] = S[k]; delete S[k]; }
  const root = document.createElement('div'); root.style.cssText = 'position:absolute;left:0;top:0;width:960px;height:540px;overflow:hidden';
  root.innerHTML = '<div class="wd"><div class="cam"><div class="shk"><div class="L L-bg"></div><div class="L L-mid"></div><div class="L L-fx"></div></div></div></div><div class="L L-ov"></div><div class="L L-ui"></div><div class="L L-top"></div>';
  S.root.insertBefore(root, [...S.root.children].find(e => e.classList.contains('L-ov')));
  const vis = new Act(S, root, { o: 0 }), d0 = S.dur, b0 = S.beats; S.dur = 0; S.beats = [];
  S.L = {}; for (const k of ['bg', 'mid', 'fx', 'ov', 'ui', 'top']) S.L[k] = root.querySelector('.L-' + k); S.cam = new Act(S, root.querySelector('.cam')); S.shk = new Act(S, root.querySelector('.shk'));
  S.off = t0 - (o.from || 0); (typeof what === 'string' ? CP(26, what) : what)(S);
  const len = o.len || S.dur - t0; for (const k of Object.keys(S)) if (!CORE25.includes(k)) delete S[k]; Object.assign(S, keep);
  S.beats = b0; S.dur = Math.max(d0, t0 + len); vis.c = t0; vis.set({ o: 1 }); if (!o.last) { vis.c = t0 + len; vis.set({ o: 0 }); } return t0 + len;
};
const wipe25 = (S, t) => { const w = S.box({ L: 'top', x: -900, y: 270, w: 1300, h: 760, kx: -14, bg: '#16203f', css: 'border-left:16px solid #ffcb05;border-right:16px solid #ffcb05;box-sizing:border-box' }); w.at(t - .2).to(.2, { x: 480 }, 'in').wait(.04).to(.22, { x: 1900 }, 'out').set({ o: 0 }); };
const chain25 = (S, L) => { let t = 0; L.forEach(([id, len, label, from], i) => { if (i) wipe25(S, t); S.beat(t + .12, label); t = scene25(S, t, id, { len, from, last: i === L.length - 1 }); }); S.end(t); return t; };

clip(25, 'mc-battle', { t: 'One Whole Battle', g: 'Master Cut', now: 'Each of these moments exists in the game today, but they were made at different times and do not share timing, colours or camera.', idea: 'Nine clips from this set, back to back, as one trainer battle: pick the stop on the map, the trainer intro from the UI mockups, who goes first and the first hit, the ace call, a Mega in its one-second cut, the finishing blow, experience for the whole team, the trainer paying up, and the reward. Watch for whether it feels like one game.' }, S => {
  chain25(S, [['map-travel', 4.6, 'Map: pick the next stop'], ['t-intro', 10, 'Trainer intro, then both send out'], ['order', 4.2, 'Who goes first, and the first hit'], ['t-ace', 6, 'The ace is called'], ['sg-short', 3.1, 'Mega: the one-second cut'], ['if-finish', 4.4, 'The finishing blow'], ['exp-team', 5.2, 'Experience for the whole team'], ['t-lose', 3.6, 'The trainer pays up'], ['reward', 7.4, 'Pick a reward']]);
});
clip(25, 'mc-event', { t: 'One Whole Event', g: 'Master Cut', now: 'An event is a text box over a picture, a list of choices, sometimes a battle, then a result line.', idea: 'Six clips as one event stop: the iris opens on the place, the choice cards are dealt above a whole text box, the choice turns into a battle stage, one critical hit, the result scrolls the room, and the rewards fly to where they live before the iris returns you to the map.' }, S => {
  chain25(S, [['ev-open', 6.8, 'The stop opens on the place'], ['ev-choice', 5.6, 'Three choices, text box whole'], ['ev-stage', 4, 'The choice becomes a battle'], ['bh-crit', 3.4, 'One critical hit'], ['ev-result', 6.8, 'What happened'], ['ev-reward', 6.9, 'Rewards, then back to the map']]);
});
clip(25, 'mc-run', { t: 'One Run in a Minute', g: 'Master Cut', now: 'Screens change with a fade or a hard cut. Each screen starts its own motion from nothing.', idea: 'Ten clips as the first stretch of a run: title, starter, Hub Town, the road, a wild encounter, the catch, the Pokémon Center, a Gym Leader, the badge, and the next region. Every screen arrives with the same family of moves: things drop in, pop in order, and leave the way they came.' }, S => {
  chain25(S, [['title', 3.7, 'Title'], ['starter', 5.3, 'Choose a starter'], ['hub', 4.4, 'Hub Town'], ['travel', 5.4, 'On the road'], ['encounter', 6.2, 'A wild Pokémon'], ['catch', 7.2, 'The catch'], ['center', 4.8, 'Pokémon Center'], ['gym-intro', 5, 'The Gym Leader'], ['badge', 4.8, 'The badge'], ['region', 4, 'The next region']]);
});
/* one hit, three ways: 0 full, 1 reduced, 2 off */
const calm25 = mode => S => {
  V('stage', S, { msg: 1, foe: { hp: 80 } }); S.nocheer = 1; const m = S.me, f = S.foe;
  chip(S, .1, 'Battle effects: <b>' + ['Full', 'Reduced', 'Off'][mode] + '</b>', 566, 30, 'background:#16203f;color:#fff;border:2px solid ' + ['#ffcb05', '#7dff9a', '#9fb0d8'][mode]);
  if (mode) { S.nocam = 1; S.shake = () => S; S.flash = () => S.full({ o: 0 }); S.lines = () => []; S.burst = () => []; }
  V('say', S, .2, '<b>Charizard</b> used <b>Flare Blitz</b>!');
  if (mode < 2) { const h = V('strike', S, m, .6, { ty: 'fire', tele: mode ? 'quick' : 'strong' }); V('hit', S, f, h, mode ? { ty: 'fire', to: 34 } : { ty: 'fire', to: 34, dmg: 96, big: 1.4 }); if (mode) S.pop(h + .07, '-96', { x: f.X - 20, y: f.Y - f.H * .5 - 6, rise: 30 }); }
  else { f.i.at(.9).set({ wh: 1 }).wait(.1).set({ wh: 0 }); S.hp('foe', .9, .5, 34); S.pop(.95, '-96', { x: f.X - 20, y: f.Y - f.H * .5 - 6, rise: 0, in: .01, out: .01 }); }
  S.end(3.3);
};
clip(25, 'mc-calm', { t: 'Reduced Motion: Three Levels', g: 'Master Cut', now: 'The game has a Reduced motion setting. It shortens some tweens and leaves others alone, case by case.', idea: 'One rule for the whole set, shown on one hit. Full: wind-up, hit-stop, shake, flash, particles and camera. Reduced: the screen never shakes, flashes or moves; the wind-up is short; the shapes, the number and the bar stay. Off: the bar, the number and the text change, and nothing else moves. What happened is readable at every level, because no clip in this set uses motion as the only way to say something.' }, S => {
  let t = 0; ['Full: wind-up, hit-stop, shake, flash, particles, camera', 'Reduced: no shake, no flash, no camera, no particles', 'Off: the bar, the number and the text. Nothing else moves'].forEach((lb, i) => { if (i) wipe25(S, t); S.beat(t + .12, lb); t = scene25(S, t, calm25(i), { len: 3.3, last: i === 2 }); }); S.end(t);
});
clip(25, 'mc-skip', { t: 'Hold to Skip, and Short Cuts', g: 'Master Cut', now: 'Some cutscenes can be skipped with a key press and some cannot. A skipped cutscene cuts to black and back.', idea: 'Two rules. First: every cutscene over two seconds can be skipped by holding a button. A small bar fills while you hold, so one stray press never loses a scene, and the skip is one white frame straight to the last picture of the cutscene, never to black. Second: the Cutscene length setting swaps a long cutscene for its own short cut, made for it, like the one-second Mega.' }, S => {
  const T = 2.5; scene25(S, 0, 'mega', { len: T }); const pill = S.box({ L: 'top', x: 820, y: 34, w: 220, h: 38, rad: 19, bg: '#16203f', o: 0, css: 'border:2px solid #fff;box-sizing:border-box;overflow:hidden' }), fill = S.box({ par: pill, x: 0, y: 0, w: 220, h: 38, ax: 0, ay: 0, org: '0 50%', sx: 0, bg: '#ffcb05' }), tx = S.box({ par: pill, x: 108, y: 17, html: 'Hold <b>B</b> to skip', css: 'font:700 15px/1 "M PLUS Rounded 1c",sans-serif;color:#fff;white-space:nowrap;mix-blend-mode:difference' });
  pill.at(.9).set({ o: 1 }).to(.15, { y: 38 }, 'back2'); fill.at(1.3).to(1.1, { sx: 1 }, 'lin'); pill.at(T - .05).to(.1, { s: 1.15 }, 'out').to(.15, { o: 0 }); S.flash(T - .02, .14, '#fff', 1, 'top');
  const e = scene25(S, T, 'mega', { from: 7.7, len: 2 }); wipe25(S, e); const c = chip(S, e + .25, 'Cutscene length: <b>Short</b>', 820, 34, 'background:#16203f;color:#fff;border:2px solid #7dff9a', 'top'); const e2 = scene25(S, e, 'sg-short', { len: 3.4, last: 1 }); c.at(e2 - .3).to(.15, { o: 0 });
  S.beat(.2, 'The full Mega cutscene starts').beat(.9, 'A prompt appears').beat(1.3, 'Hold: the bar fills').beat(T, 'One white frame, straight to the last picture').beat(e + .25, 'Or set Cutscene length to Short').beat(e + 1.2, 'Its own one-second cut').end(e2);
});

boot();
