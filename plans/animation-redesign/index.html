/* viewer chrome (single dark look on purpose: it frames game screens) */
:root{color-scheme:dark;--vbg:#12141b;--vpanel:#1b1e28;--vfg:#eef0f6;--vmute:#9aa2b8;--vline:#2c3142;--vacc:#ffcb05}
html,body{height:auto}
body{margin:0;background:var(--vbg);color:var(--vfg);font:14px/1.5 'M PLUS Rounded 1c',system-ui,sans-serif}
#app{max-width:1200px;margin:0 auto;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
.vw-top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.vw-top h1{font:400 26px/1 'Jersey 15',sans-serif;letter-spacing:.04em;margin:0;color:var(--vacc)}
.vw-passbar{display:flex;align-items:center;gap:8px;flex:1 1 320px;min-width:0}
.vw-passbar b{font:400 20px/1 'Jersey 15',sans-serif;white-space:nowrap}
.vw-passbar span{color:var(--vmute);min-width:0;overflow-wrap:anywhere}
.vw-btn{font:inherit;color:var(--vfg);background:var(--vpanel);border:1px solid var(--vline);border-radius:8px;padding:6px 12px;cursor:pointer}
.vw-btn.on{background:var(--vacc);color:#16181f;border-color:var(--vacc);font-weight:800}
.vw-btn:hover,.vw-chip:hover{border-color:var(--vacc)}
.vw-btn:focus-visible,.vw-chip:focus-visible,input:focus-visible{outline:2px solid var(--vacc);outline-offset:2px}
#vw-range{flex:1 1 160px;min-width:120px;accent-color:var(--vacc)}
#vw-wrap{position:relative;width:100%;overflow:hidden;border-radius:10px;background:#000;box-shadow:0 0 0 1px var(--vline)}
#stage{position:absolute;left:0;top:0;width:960px;height:540px;transform-origin:0 0;overflow:hidden;view-transition-name:stage;contain:layout paint;background:#0b0d14;color:#fff;font:500 15px/1.3 'M PLUS Rounded 1c',sans-serif}
.vw-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;color:var(--vmute)}
#vw-scrub{flex:1 1 220px;min-width:140px;accent-color:var(--vacc)}
#vw-time{font-variant-numeric:tabular-nums;min-width:11ch}
#vw-cur{flex:1 1 200px;color:var(--vfg)}
#vw-beats{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
#vw-beats li{background:var(--vpanel);border:1px solid var(--vline);border-radius:6px;padding:2px 9px;color:var(--vmute);font-size:13px}
#vw-beats li b{color:var(--vfg);font-weight:800;margin-right:4px;font-variant-numeric:tabular-nums}
#vw-beats li.on{background:var(--vacc);border-color:var(--vacc);color:#16181f}
#vw-beats li.on b{color:#16181f}
#vw-about p{margin:0 0 4px;max-width:90ch;color:var(--vmute)}
#vw-about b{color:var(--vfg);margin-right:6px}
#vw-clips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.vw-g{font:400 16px/1 'Jersey 15',sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--vmute);margin:0 2px 0 8px}
.vw-g:first-child{margin-left:0}
.vw-chip{font:inherit;font-size:13px;color:var(--vfg);background:var(--vpanel);border:1px solid var(--vline);border-radius:999px;padding:3px 10px;cursor:pointer}
.vw-chip.on{background:var(--vacc);color:#16181f;border-color:var(--vacc);font-weight:800}
.vw-chip i{font-style:normal;font-size:10px;text-transform:uppercase;letter-spacing:.06em;margin-left:6px;padding:0 5px;border-radius:6px;background:#e3350d;color:#fff}
.vw-chip i.ch{background:#2a75bb}
#vw-review{background:var(--vpanel);border:1px solid var(--vline);border-radius:10px;padding:14px 18px}
#vw-review h2{font:400 24px/1.1 'Jersey 15',sans-serif;margin:0 0 6px;color:var(--vacc);letter-spacing:.03em}
#vw-review p{margin:0 0 8px;max-width:75ch}
.vw-big{font-size:15px}
.vw-new{color:var(--vmute)}
#vw-review dl{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:6px 16px;margin:8px 0 0}
#vw-review dt{color:var(--vmute)}
#vw-review dd{margin:0;max-width:75ch}
@media (max-width:640px){#vw-review dl{grid-template-columns:minmax(0,1fr)}#vw-review dd{margin-bottom:6px}}
body.bare #app{padding:0;max-width:none;display:block}
body.bare .vw-ui{display:none}
body.bare #vw-wrap{width:960px;height:540px;border-radius:0;box-shadow:none}
::view-transition-group(*){animation-duration:.3s}
/* ---------- the stage ---------- */
#stage,#stage *,#stage *::before,#stage *::after{box-sizing:border-box}
#stage .wd,#stage .cam,#stage .shk,#stage .L{position:absolute;left:0;top:0;width:960px;height:540px}
#stage .wd{overflow:hidden}
#stage .cam,#stage .shk{transform-origin:50% 50%;will-change:transform}
#stage .L{pointer-events:none}
#stage .a{position:absolute;left:0;top:0;will-change:transform,opacity}
.px{image-rendering:pixelated;image-rendering:crisp-edges}
#stage .shd{background:#0a1020;border-radius:50%}
#stage .tn{mix-blend-mode:normal}
/* shared look, taken from pass 25 of the UI redesign: Raider Red, Pika Yellow, Ink, Paper, Sky */

const NOTES={"1": {"name": "First Motion", "big": "The floor. Six basic battle beats (send out, recall, attack and hit, faint, HP bar, standing) each get one clean, readable tween. The game's own sprite frames keep playing underneath; everything here is the code-made motion around them.", "clips": ["Send Out", "Recall", "Attack and Hit", "Faint", "HP Bar", "Standing"], "q1": "Not yet. This pass is about order and clarity: one thing happens at a time and you can always tell what.", "q2": "Compared with the game today: recall gets its red beam back, fainting sinks into the ground instead of fading, and the HP number counts down with the bar.", "q3": "Yes. Switching, level-up, EXP and a missed attack have no clip yet. They come in pass 2.", "q4": "Nothing to set yet. From pass 20 every clip here obeys the motion settings.", "q5": "The ball arc, white flash and red recall beam are straight from the handheld games."}, "2": {"name": "Weight", "big": "Everything gets mass. The ball squashes when it lands, attacks wind up before they go, hits freeze for a blink before the recoil, landings throw dust and the HP plate takes the blow too.", "clips": ["Switch", "Miss", "EXP and Level Up"], "q1": "Yes. The same six beats now have bounce, stretch and dust, so even a plain Tackle looks like it hurts.", "q2": "Pass 1 moved things from A to B. Pass 2 adds what happens before (wind-up) and after (recoil, settle, dust) each move, plus hit-stop: an 80ms freeze on contact that makes hits feel heavy.", "q3": "Three more clips: switching as one unbroken move, a dodge for a missed attack, and EXP into level-up.", "q4": "Hit-stop and screen shake already have sliders in Settings; these clips are drawn at their default strength.", "q5": "The ball bounce before it opens and the two happy hops on level-up are small touches the 3D games use."}, "3": {"name": "Elements", "big": "Type is now visible in the motion itself. Eighteen impact kits, a type-coloured glow before every move, and type sparks when a Pokémon lands. The game's move animations still play; this is the layer wrapped around them.", "clips": ["Type Reel", "Wind-up Tells", "End-of-turn Damage", "Healing"], "q1": "Yes. Hits went from a white blink to bolts, embers, splashes, shards and petals. The Type Reel alone is eighteen new effects.", "q2": "Pass 2 made a hit feel heavy; pass 3 makes it look like what it is. You can now tell fire from water with the sound off and the text hidden.", "q3": "Four more clips, and a new Conditions group for burn, poison and Leech Seed ticks, which had no animation at all in the game.", "q4": "The type kits use particles, so they follow the existing Reduce particles setting: at Reduced they keep the star and ring and drop the sparks.", "q5": "Type colours are the ones on the type pills in the UI redesign, so a Fire move matches its button."}, "4": {"name": "Trainers", "big": "People join in. Trainers skid on with dust, wind up and throw from the hand, call out to their Pokémon, announce their ace before it lands and pay up when they lose. They step in for a moment and step out again, so the battle screen stays clear.", "clips": ["Trainer Intro", "Ace Call", "Trainer Defeated", "Trainer Call-out"], "q1": "Yes. A battle now opens with two people facing off, and the ace gets a full-screen banner and a double-size landing.", "q2": "Passes 1 to 3 were only about the Pokémon. Now the ball leaves from a hand, the team size is shown as balls dropping onto the name plate, and the ace is announced before it appears instead of just being the last one left.", "q3": "Four trainer clips and a new Trainers group. Gym Leaders, rivals and villains get their own passes later (13 and 14).", "q4": "Trainer call-outs would sit under Settings, Battle, with Full, Short and Off.", "q5": "Trainer slides in, throws, steps out is exactly how the handheld games open a battle. Your throw uses the game's own throw frames."}, "5": {"name": "Stagecraft", "big": "The interface starts performing. Plates fly in on springs, damage numbers jump out of the hit, SUPER EFFECTIVE slams on like a rubber stamp, the message bubble pops for every line, and the three set pieces every Pokémon game is remembered for (the wild encounter, the catch and the break-out) get full choreography.", "clips": ["Numbers and Stamps", "Danger", "Wild Encounter", "Catch", "Break Out"], "q1": "Yes. The catch alone has a bonk, two bounces, three lamps, a click, flying stars, a stamp and confetti.", "q2": "Until now the plates and text sat still while the Pokémon moved. Now the whole screen reacts to a hit, and breaking out of a ball (which had no animation at all) is its own moment.", "q3": "Five more clips and a Catching group. 24 clips in total after five passes.", "q4": "Damage numbers and battle text animations already have switches in Settings; stamps would share the damage numbers switch.", "q5": "Three ball shakes with a click and stars is the most recognisable animation in the series. The lamps make the count readable on a small screen."}};
/* Pocket Raiders animation redesign: mockup kit.
   clip(pass, id, meta, fn) is one animation; verb(pass, name, fn) is a reusable move (send out, hit, faint...).
   Both are versioned by pass: at pass P the newest version with pass <= P plays, so a later pass re-animates every clip that uses a verb.

};
