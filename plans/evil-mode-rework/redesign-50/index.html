/* viewer chrome (single dark look on purpose: it frames game screens) */
:root{color-scheme:dark;--vbg:#12141b;--vpanel:#1b1e28;--vfg:#eef0f6;--vmute:#9aa2b8;--vline:#2c3142;--vacc:#ff4d5e}
html,body{height:auto}
body{margin:0;background:var(--vbg);color:var(--vfg);font:14px/1.5 'M PLUS Rounded 1c',system-ui,sans-serif}
#app{max-width:1200px;margin:0 auto;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
.vw-top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.vw-top h1{font:400 26px/1 'Jersey 15',sans-serif;letter-spacing:.04em;margin:0;color:var(--vacc)}
.vw-passbar{display:flex;align-items:center;gap:8px;flex:1 1 320px;min-width:0}
.vw-passbar b{font:400 20px/1 'Jersey 15',sans-serif;white-space:nowrap}
.vw-passbar span{color:var(--vmute);min-width:0;overflow-wrap:anywhere}
.vw-btn{font:inherit;color:var(--vfg);background:var(--vpanel);border:1px solid var(--vline);border-radius:8px;padding:6px 12px;cursor:pointer}
.vw-btn:hover,.vw-chip:hover{border-color:var(--vacc)}
.vw-btn:focus-visible,.vw-chip:focus-visible{outline:2px solid var(--vacc);outline-offset:2px}
#vw-range{flex:1 1 160px;min-width:120px;accent-color:var(--vacc)}
#vw-wrap{position:relative;width:100%;overflow:hidden;border-radius:10px;background:#000;box-shadow:0 0 0 1px var(--vline)}
#stage{position:absolute;left:0;top:0;width:960px;height:540px;transform-origin:0 0;overflow:hidden;view-transition-name:stage;contain:layout paint}
.vw-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;color:var(--vmute)}
#vw-cur{flex:1 1 200px;color:var(--vfg)}
#vw-screens{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.vw-g{font:400 16px/1 'Jersey 15',sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--vmute);margin:0 2px 0 8px}
.vw-g:first-child{margin-left:0}
.vw-chip{font:inherit;font-size:13px;color:var(--vfg);background:var(--vpanel);border:1px solid var(--vline);border-radius:999px;padding:3px 10px;cursor:pointer}
.vw-chip.on{background:var(--vacc);color:#16181f;border-color:var(--vacc);font-weight:800}
.vw-chip i{font-style:normal;font-size:10px;text-transform:uppercase;letter-spacing:.06em;margin-left:6px;padding:0 5px;border-radius:6px;background:#e3350d;color:#fff}
#vw-review{background:var(--vpanel);border:1px solid var(--vline);border-radius:10px;padding:14px 18px}
.vw-iv{color:#ffd36b}
#vw-ivs{display:flex;flex-wrap:wrap;gap:6px}
.vw-ivb{font:inherit;font-size:12px;color:var(--vfg);background:var(--vpanel);border:1px solid var(--vline);border-radius:8px;padding:3px 9px;cursor:pointer}
.vw-ivb.on{background:#c8102e;border-color:#ff5a6e;color:#fff;font-weight:800}
#vw-name{margin:0;color:var(--vmute);flex-basis:100%}
#vw-review h2{font:400 24px/1.1 'Jersey 15',sans-serif;margin:0 0 6px;color:var(--vacc);letter-spacing:.03em}
#vw-review p{margin:0 0 8px;max-width:75ch}
.vw-big{font-size:15px}
.vw-new{color:var(--vmute)}
#vw-review dl{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:6px 16px;margin:8px 0 0}
#vw-review dt{color:var(--vmute)}
#vw-review dd{margin:0;max-width:75ch}
@media (max-width:640px){#vw-review dl{grid-template-columns:minmax(0,1fr)}#vw-review dd{margin-bottom:6px}}
body.bare #app{padding:0;max-width:none;display:block}
body.bare .vw-ui{display:none}
body.bare #vw-wrap{width:960px;height:540px;border-radius:0;box-shadow:none}
body.still #stage *,body.still #stage *::before,body.still #stage *::after{animation-delay:-60s!important;animation-play-state:paused!important;transition:none!important}
.px{image-rendering:pixelated;image-rendering:crisp-edges}
#stage,#stage *,#stage *::before,#stage *::after{box-sizing:border-box}
#stage img{max-width:none;display:block;user-select:none}
#stage [data-go]{cursor:pointer}
::view-transition-group(*){animation-duration:.42s;animation-timing-function:cubic-bezier(.3,1.3,.5,1)}
::view-transition-old(root),::view-transition-new(root){animation:none}
@media (prefers-reduced-motion:reduce){#stage *,#stage *::before,#stage *::after{animation:none!important;transition:none!important}}
body.bare #vw-ivs{display:none}
</style>
<style data-pass="0">
/* always on */
#stage .px{image-rendering:pixelated}
</style>

  --fd:'Jersey 15','Pixelify Sans',sans-serif;--fb:'M PLUS Rounded 1c',system-ui,sans-serif;font:500 15px/1.3 var(--fb);color:var(--cr);background:var(--ink)}
.scr{position:absolute;inset:0;overflow:hidden}
b{font-weight:800}

.b-arena{background:linear-gradient(rgba(20,6,16,.55),rgba(50,6,16,.7)),url(sprites/town-street.png) center/cover}

.b-g-z{background:linear-gradient(rgba(10,0,20,.35),rgba(10,0,20,.55)),url(sprites/fx-spiral.png) center/cover}

const NOTES={"1": {"name": "Nova Baseline", "big": "A fresh start built on the approved looks: every Dominion page redrawn in the main game's new style (word menus, black panels, key strip) in Team Nova's black, crimson and gold, with the HQ floors and Staff Office from the HQ plan.", "pages": [], "q1": "It starts from the strongest looks already approved: the main game's word menus and key strip, in black with crimson seams and gold numbers, with sprites on lit plinths and a crimson ray burst for the Boss's orders.", "q2": "Everything before this is thrown away. Instead of the old Dominion boxes, all 66 pages now share the main game's parts (top bar, word menu, panels, tab strip, key strip), so Evil Mode looks like the same game seen from the other side.", "q3": "The HQ now follows the HQ plan: three real floors (Upper Floor 2F, Ground Floor G, The Cellar B1) with plots for sale, and the Staff Office gets its own page (Auto-Checker with gear tiers). More splits come in later passes.", "q4": "Esc opens the Boss Menu, built like the main game's title menu, with the empire at a glance beside it. Settings is the main game's Settings with Dominion and Rotom categories. The tab strip (1 to 6) is on every working page.", "q5": "Yes: word menus, Trainer-style plates, the main game's battle console and Poké Ball buttons, with Persian at the Boss's feet. Grunts are male, Rotom is the guide."}, "2": {"name": "Big & Bold", "big": "Every page title is now a crimson slash across the top, words are set in big slanted game type, sprites are about one and a half times bigger, and the battle commands become big slanted words under the right thumb.", "pages": ["Staff Office", "Pick the crew"], "q1": "Yes. Titles are now big crimson slashes that cut in from the left, the selected row juts out with a gold edge, and the battle's FIGHT is a huge slanted word.", "q2": "Pass 1 still read like a spreadsheet in small type. Now the eye lands on one big word per page (THE COMPOUND, PICK THE CREW, FIGHT) and sprites are big enough to read faces.", "q3": "Yes, two. The Staff Office gets its own page with the three posts as cards (Auto-Checker, Bookkeeper, Caretaker), and Pick the crew splits choosing who goes out from the odds on The Card.", "q4": "The tab strip becomes six slanted words, the same type as the battle commands, so Menu, tabs and commands read as one system. Settings rows use the big type too.", "q5": "Yes. Big slanted battle words and type colour chips are straight from the main game's battle look; the crew cards read like party slots."}, "3": {"name": "Places", "big": "Every page now happens somewhere. Panels are smoked glass over a real place (the Compound, Viridian at morning, Celadon at night, the Holding Pens), people stand on the ground with shadows, and the HQ is the Compound cut open with the crew inside the rooms.", "pages": ["Walk the street"], "q1": "Yes. The places glow through the panels: warm lamplight in the Compound, a pink morning over Viridian, blue night in Saffron. The HQ has a purple roof, wooden floors, a green ground line and a stone Cellar under it.", "q2": "Passes 1 and 2 floated on a dark wash. Now you always know where you are: a location chip in the top bar, the real place behind the glass, people standing on the ground, and Mina, Rook and Persian sitting in their rooms on the HQ.", "q3": "Yes, Walk the street: the district's shops stand as real buildings (Bike Shop, Gym, Poké Mart, Nugget Bridge), and each door says what you can do there (Extort, Challenge, Snatch, Recruit).", "q4": "The Boss Menu now opens over the place you were in, so pausing never loses your spot. Settings sit in the Compound.", "q5": "Yes. The street is built from the main game's own town buildings and the HQ reads like a Pokémon building interior."}, "4": {"name": "In Motion", "big": "Nothing sits still any more. Pages wipe in behind a crimson blade while money, Heat, titles and panels glide to their new place, the Nova eye hops beside whatever you choose, cards deal in, numbers count up, the odds ring winds round, text types out and HP drains with a pale ghost.", "pages": ["Motion sheet"], "q1": "Yes. A crimson blade wipes each new page in, the Nova eye hops beside your choice, result pages burst with coins, the VS disc wobbles, the eye in the top bar blinks and the HQ's lamps flicker on floor by floor.", "q2": "Pass 3 was a still photo of a place. Now pages are linked by motion: the title, money, Heat, panels and the tab highlight glide from page to page instead of blinking, so you can follow where you went.", "q3": "One new page, the Motion sheet, lists every motion with its timing and what Calm mode does instead. No action needed splitting this pass.", "q4": "The tab highlight slides between tabs as you change page, and the Boss Menu words deal in one after another. Calm mode for every motion is listed and will get its own Settings row next pass.", "q5": "Yes. The hopping cursor, the dealt cards and HP draining with a ghost are the main game's own motions, here with the Nova eye instead of a Poké Ball."}, "5": {"name": "Menu & Settings", "big": "The Boss Menu becomes the Nova Dial, the same dial you get by holding Q, with a live look at the HQ beside it. Settings becomes a home page with eight tiles and one page per category with real switches, sliders and a live preview. Every area of the game now has its own colour and badge in its title slash.", "pages": ["Settings home", "Settings · Effects", "Settings · Sound", "Save and quit"], "q1": "Yes. The Boss Menu is a spinning crimson-and-gold dial with the Nova eye at its centre, the chosen word grows, and the Settings pages have moving previews: a blade wiping, an equaliser, a run bar with your node blinking.", "q2": "Passes 1 to 4 had a plain word list for the menu and one long Settings list. Now the menu is a dial you turn, every area has its own colour and badge in its title (HQ crimson, Jobs purple, Crew teal, Opposition blue), and Settings is a real home page with categories.", "q3": "Yes, four: Settings home, Effects, Sound, and Save and quit. Each Settings category has its own page, so no page holds more than five rows.", "q4": "Esc opens the Nova Dial; holding Q on any page opens the same dial, so there is one menu to learn. Settings home sits on the dial; each category page keeps the categories down the left so you can hop between them.", "q5": "Yes. It works like the main game's pause wheel and Settings, with Rotom explaining which settings are Evil Mode's own."}, "6": {"name": "Faces & Colours", "big": "Every person now has a signature colour and a face. Round portraits ride on every text box and footer, people glow in their own colour on stage, files are painted in it, and the crew roster becomes a police line-up.", "pages": ["People you know", "Crew ID · Rook"], "q1": "Yes. Round portraits in each person's colour sit on every text box, actors glow in their colour, files are painted in it, and the roster is a police line-up with height lines.", "q2": "Until now everyone wore the same crimson. Now you can tell people apart at a glance: Rosa is teal, Rook blue, Gus orange, Red red, Giovanni grey, Looker tan, and the same colour follows each of them from page to page.", "q3": "Yes, two. People you know lists everyone met so far by side (crew, Rocket, heroes and gyms, the law), and each crew member gets a Crew ID card with photo, rank stripes and armband.", "q4": "People you know is reachable from the Crew tab and the dial; portraits in the Boss Menu glance use the same faces.", "q5": "Yes. Portraits by the text box and colour-coded trainers are how Pokémon games show who is talking."}, "7": {"name": "The Heist", "big": "A job is now a heist in beats: pick it from the Job board, pick the crew, read the Card, give the order, watch it play out live, then walk through the report one step at a time. Orders left for the day ride in the top bar on every page.", "pages": ["Job board", "The job · live"], "q1": "Yes. Jobs are dealt as big heist cards with their target building and a gold odds dial, the order cut-in has speed lines and an ORDER stamp, and the live job shows Rook creeping past the Day Care under the moon with an alert popping over his head.", "q2": "Before, a job jumped from the Card straight to a result. Now it has a shape: board, crew, card, order, live moment, report. The report has a step rail (take, Heat, crew, loot, next) so the result pages no longer dump everything at once.", "q3": "Yes, two. The Job board shows today's three jobs side by side, and The job · live gives the risky moment its own page with three answers, instead of hiding it in a dice roll.", "q4": "Orders left today now sit as three dots beside the Day in the top bar on every page, so the Menu never has to tell you. The Effects settings page already controls the speed lines and stamp.", "q5": "Yes. A live moment with an alert mark over a sprite is straight from Pokémon's overworld, and the step-by-step report mirrors the main game's Victory Lap."}, "8": {"name": "Battle Stage", "big": "Battles are filmed now. The camera sits behind the Boss's Pokémon, the foe stands on a Nova court under crossing spotlights, the Hideout Raid gets a turn clock, the crew wait on a bench, and the foe's team shows as Poké Balls. The spotlights now cross every scene in the game.", "pages": ["Pick a move", "Crew steps in"], "q1": "Yes. Two spotlights sweep across a crimson Nova court, the raid clock ticks, Houndoom fills the near side with a red glow, and the move list is painted in each move's type colour with a rainbow MEGA button.", "q2": "Pass 2's battle was a flat picture with words on the side. Now it is a stage with depth (the court is tilted away from you), the raid has a clock you can read from across the room, and the foe's team and the Hero show at a glance.", "q3": "Yes, two. Pick a move and Crew steps in are their own pages, so the battle screen only ever shows one choice at a time.", "q4": "ORDER is the Boss's own battle command (one a battle), CREW opens the bench. Esc still opens the Nova Dial, which pauses the battle.", "q5": "Yes, very: camera behind your Pokémon, foe on a platform, Poké Ball team pips, type-coloured moves and a MEGA button are core Pokémon battle parts."}, "9": {"name": "Power Surge", "big": "Mega Evolution, Terastal, Dynamax and Z-Power each get a full-screen scene of their own (stones linked by a beam, red storm clouds, crystal shards, a Z spiral), the Legend gets a psychic storm, and a rainbow power line runs under the top bar whenever a power is charged. Move animations are not touched.", "pages": ["Pick a power", "Power gear"], "q1": "Yes, the loudest pass so far: a rainbow burst with stones joined by a beam for Mega, red storm clouds and a towering red-glowing Gengar for Dynamax, floating crystal shards for Terastal, a turning golden spiral with a giant Z, and a psychic storm behind Mewtwo.", "q2": "In pass 8 the four powers shared one look. Now each has its own world, the Pokémon flashes white and then shows its new form, the trainer's power item glows between them, and a rainbow line under the top bar tells you a power is charged on any page.", "q3": "Yes, two. Pick a power puts the four powers side by side (locked ones as black silhouettes with the region they open in), and Power gear lists the items you own, so the battle's MEGA button stays one press.", "q4": "The rainbow line under the top bar shows on every page while a power is charged, so the Boss Menu does not need a separate notice. Effects settings can turn flashing down.", "q5": "Yes. Each power is shown the way the Pokémon games stage it (Key Stone link, Dynamax clouds, Tera crystals, Z pose), only the Pokémon and its surroundings move, and the moves themselves are untouched."}, "10": {"name": "Story Beats", "big": "Every event now plays in four beats (talk, choose, result, reward) with a beat bar across the top. Choices are big cards that show the stat check and your chance, the result shows the roll, and the reward only appears after the text is closed. The text box is rebuilt everywhere: a gold corner, a Log key and an Auto switch.", "pages": ["Event · choose", "Event · result", "Text log"], "q1": "Yes. Events now feel like a show: a beat bar lights up step by step, choices slide in as big gold-edged cards with your chance counting up, and the result lands as a green SUCCESS plate with the roll under it.", "q2": "Before, an event was one text box with a list of words. Now it is four clear beats on separate screens, every choice tells you the stat check and the odds before you pick, and the text box itself is rebuilt on every page with a gold corner, a speaker portrait, a Log key and an Auto switch.", "q3": "Yes, three. Choose and Result each get their own page so the talk screen stays clean, and the Text log page lets you read everything said in the event without crowding the box.", "q4": "The Log and Auto keys sit on every text box, and Auto has a matching switch in Settings > Dominion. The Boss Menu stays one key away and does not interrupt the beats.", "q5": "Yes. It reads like a Pokémon game event: a speaker name plate, a blinking arrow, the text stays until you press a key, and the reward only shows after the text is closed, then waits for your key press."}, "11": {"name": "Living HQ", "big": "The HQ becomes a building you live in. The tab bar is now a lit lift console on every page (a lamp, a count and a you-are-here arrow), every panel opens like lift doors and its ceiling light flickers on, and the Compound is cut open at night with a lift riding between floors and people working in lit rooms.", "pages": ["Ground Floor · G", "The Cellar · B1", "New floor", "Staff gear"], "q1": "Yes. The HQ is now a lit building at night under a moon, with a lift car riding up the shaft, people bobbing in warm rooms, scaffolding for the next floor, and a New floor reveal where the storey drops in with dust.", "q2": "Pass 10 changed events; this pass changes every page. The tab bar became a lift console with lamps, counts and a you-are-here arrow, every panel opens like lift doors and its light flickers on, and the HQ went from a grid of boxes to a real building with floors you can ride to.", "q3": "Yes, four. Each floor has its own page (lift buttons on the left, the rooms across the top, the picked room below), plus New floor and Staff gear, so the HQ screen only shows the building and tonight’s jobs.", "q4": "The lift console is the main menu bar now, and the Boss Menu still opens on Q. The new floor reveal and the light flicker follow the Effects settings (they shorten when motion is turned down).", "q5": "Yes. It feels like a Pokémon building interior, like Silph Co. or the Game Corner hideout: a lift with floor buttons, rooms with people at work, and floor names like 2F and B1."}, "12": {"name": "The Board", "big": "Kanto becomes a tabletop board on a wooden table, with land, sea, the real routes and district tokens in their owner’s colour. Pieces stand on it: your crew, Rocket chips and the Hero with a blue ping. The whole UI turns into pieces too: money, Heat and the day are icons in the top bar, and the place chip is now a map pin that opens the board from any page.", "pages": ["Place your crew", "Travel"], "q1": "Yes. The map is now a board that tilts down onto a wooden table, tokens pop up in their colours, pieces drop onto the cities, dotted routes march between them, and the picked city lifts and glows.", "q2": "Pass 11 was the HQ; this pass moves the rest of the world. The map stopped being a grid of boxes and became Kanto with real routes, the crew and the Hero are pieces you can see, and every page’s top bar now uses icons and a map pin that jumps to the board.", "q3": "Yes, two. Place your crew keeps the board on screen while you put each crew member on a city, and Travel shows the road and its ambush odds, so the map page itself stays clean.", "q4": "The map pin in the top bar is a shortcut to the board from any page, and the Boss Menu’s Region Map row opens the same board. A Board motion switch in Effects can stop the tilt and the dotted routes moving.", "q5": "Yes. It reads like the Town Map in the Pokémon games, with Kanto’s real cities and routes (Route 3 by Mt. Moon, Cycling Road, the sea routes to Cinnabar), turned into a board game for the villains."}, "13": {"name": "Rotom Phone", "big": "The Boss Menu is now a Rotom Phone you hold: Rotom’s eyes on top, nine apps with counts, and notifications sliding in beside it. The phone peeks out of the key strip on every page with a buzz and a count. Every speech line in the game is a chat bubble with a tail, and the buttons under it are reply chips.", "pages": ["Messages", "Incoming call"], "q1": "Yes. The phone rises into your hand with a tilt, Rotom’s eyes blink on top, apps pop in one by one, notifications drop in beside it, and a full-screen incoming call from Giovanni rings with red waves while Rotom buzzes.", "q2": "Pass 12 changed the top bar; this pass changes the bottom of every page. The speech box became a chat bubble with a tail and the buttons became reply chips, and a buzzing Rotom Phone tab with a count now sits in the key strip everywhere. The Boss Menu went from a dial to a phone with apps.", "q3": "Yes, two. Messages holds the crew’s texts with reply chips, and Incoming call gives big moments (Giovanni ringing) their own screen, so the HQ page does not have to show them.", "q4": "The phone is the Menu now: P opens it from any page and its apps hold Settings, Save and Rotom. Notifications point straight to the page that needs you, so nothing feels like a maze.", "q5": "Yes. The Rotom Phone is straight from Sword and Shield and Scarlet and Violet, and the chat bubbles and calls feel like the games’ phone calls from rivals and gym leaders."}, "14": {"name": "Card Collection", "big": "Every person in Dominion is now a collectable card: a coloured frame, a name bar with their level, a foil that sweeps across, a role stripe and rarity stars. Every grid of people turns into cards with stars, every picked row shines like foil, and the roster becomes a hand of six cards dealt onto the table.", "pages": ["Card binder", "New card"], "q1": "Yes. Cards deal in from below with a spin, a rainbow foil sweeps across every card and every picked row, and a hire rips open like a booster pack before the new card flips over in a burst of light.", "q2": "Pass 13 changed how people talk; this pass changes how people look everywhere. Every grid of people became framed cards with rarity stars, the roster went from a lineup to a hand of six cards with stats under them, and foil now marks whatever you have picked on any list.", "q3": "Yes, two. The Card binder keeps everyone you have met (crew, Rocket, Heroes, Gyms, town) with set bonuses, and New card gives each hire its own moment, so the roster only shows your crew.", "q4": "The Rotom Phone’s Crew app opens the hand of cards, and the binder is one key (B) from there. A Foil shine switch in Effects turns the sweep off for anyone who finds it busy.", "q5": "Yes. It borrows the Pokémon Trading Card Game look (name bar, level, art window, rarity stars, holo foil), and a pack opening is one of the most Pokémon things there is."}, "15": {"name": "Day & Night", "big": "Every page now happens at a time of day. The light changes (gold morning, bright noon, orange evening, blue night), weather drifts over the place (sun rays, rain, warm haze, fireflies), and a clock in the top bar shows the phase and opens The Day dial.", "pages": ["The Day", "Forecast", "Night falls"], "q1": "Yes. Rain streaks over Saffron at night, fireflies drift over the jobs, sun rays sweep across mornings, the day dial’s hand swings round to Morning, and on Night falls the city’s windows switch on one by one under a rising moon.", "q2": "Pass 14 changed people; this pass changes the air on every page. Each place now has a time and weather laid over it, the top bar has a clock that opens the day, and the day itself is a dial you can see and plan around instead of a number.", "q3": "Yes, three. The Day dial shows the four phases and what is planned in each, the Forecast shows a week of weather and what it does to jobs, and Night falls shows what the night shift did before you sleep.", "q4": "The clock in the top bar opens The Day from any page, and the Rotom Phone has the forecast. Weather effects follow the Effects settings, with a Weather on screen switch for anyone who wants it still.", "q5": "Yes. Time of day and weather are core Pokémon ideas (day and night from Gold and Silver, weather from Ruby and Sapphire), and rain helping some types and hurting Fire types is exactly how the games work."}, "16": {"name": "Heat & the Law", "big": "Heat becomes something you feel. The edges of every page glow red as it climbs, the Heat chip in the top bar is a thermometer that opens the Heat board, police sirens sweep red and blue over every police page, and the police get faces: Officer Jenny’s men, Looker’s notes and a wanted poster.", "pages": ["Heat", "Wanted poster", "Police raid"], "q1": "Yes. Red and blue sirens sweep across every police page, the screen edges pulse red with Heat, a wanted poster slaps onto the board with pins, and a police raid flashes the whole HQ with a countdown and three officers at the door.", "q2": "Pass 15 added time and weather; this pass adds danger to every page. Heat used to be a number in a chip. Now it is a red glow round every screen, a thermometer in the top bar, and a whole police side with its own faces, notes and raids.", "q3": "Yes, three. The Heat board explains each level and where the Heat comes from, the Wanted poster gives a hunted crew member ways to cool down, and Police raid is its own big moment instead of a line in the morning report.", "q4": "Tapping the Heat thermometer in the top bar opens the Heat board from any page. Flashing sirens and the red edge glow follow the Effects settings (Flashing lights off turns them into a calm red border).", "q5": "Yes. Officer Jenny, policemen and Looker are all Pokémon characters, and evil teams being chased by the police and the International Police comes straight from the games."}, "17": {"name": "Rivals & Heroes", "big": "You are never alone on screen now. Giovanni and Red watch from the key strip on every page with their Tension and Threat, every name plate in a scene is a slanted VS banner on halftone, and battle intros split the screen down the middle like a fight poster.", "pages": ["Rivals", "Hero tracker"], "q1": "Yes. Battle intros now tear open down a white split line with comic halftone, name plates are slanted VS banners, the Rivals board stands three enemies side by side under their colours, and Red’s route lights up across the board day by day.", "q2": "Pass 16 brought the police; this pass brings your enemies onto every page. Giovanni and Red now sit in the key strip everywhere with their numbers, so you always feel watched, and every scene’s name plates and battle intros got a fight-poster look.", "q3": "Yes, two. The Rivals board compares Rocket, the Hero and the Gym Leaders in one place, and the Hero tracker shows Red’s path and when he reaches you, with a plan to pick. The rival and hero files stay for the details.", "q4": "Pressing the two faces in the key strip opens the Rivals board from any page, and the Rotom Phone sends a notification when a rival moves. The halftone and split effects follow the Effects settings.", "q5": "Yes. Rivals, the Hero and Gym Leaders are the heart of every Pokémon game, and the split VS intro with name banners is how the games open a big trainer battle."}, "18": {"name": "Headlines", "big": "Kanto talks about you now. A news ticker crawls under the top bar of every page, every result comes with a torn newspaper clipping about what you just did, and how the papers spin a job decides whether you gain Dread or Regard.", "pages": ["Newsstand", "Scrapbook", "Press interview"], "q1": "Yes. A red news ticker crawls under every top bar, torn clippings slam onto every result, three newspapers drop onto the stand with different headlines, and the scrapbook pins six clippings to a cork board tied together with red string.", "q2": "Pass 17 put your enemies on screen; this pass puts Kanto’s opinion on screen. Every page now carries the news, every result shows how the papers told it, and Dread and Regard are explained by real headlines instead of plain numbers.", "q3": "Yes, three. The Newsstand compares how three papers spin the same job, the Scrapbook keeps the run’s story in one place, and the Press interview lets you choose your public face. Clicking the ticker or any clipping opens the Newsstand.", "q4": "The ticker is one click from the Newsstand on any page, and the Rotom Phone’s notifications include big headlines. The ticker can be slowed or turned off in Effects for anyone who finds moving text hard to read.", "q5": "Yes. Kanto newspapers and TV news are everywhere in the Pokémon games (Lilycove TV, the Celadon reporter, Team Rocket taking the Radio Tower), and evil teams always want the region to know their name."}, "19": {"name": "The Chair", "big": "The Boss’s authority runs through the whole UI: every panel gets gold corner brackets like a framed decree, and every main button is a gold plate pressed with a crimson wax seal. The Chair becomes a first-person view across the Boss’s desk, with the visitor under the lamp, Persian on the desk and Dale at your shoulder.", "pages": ["Waiting room", "Favour ledger"], "q1": "Yes. The Chair is now a lamp-lit first-person scene across a desk with a gold nameplate, Persian sitting on the desk and Dale at your shoulder, and every main button in the game is stamped with a wax seal that presses in with a bounce.", "q2": "Pass 18 was about what Kanto says; this pass is about the Boss’s power on every page. Gold corner brackets frame every panel, the main button everywhere is a sealed gold plate, and the Chair moved from a talk scene to the Boss’s own point of view.", "q3": "Yes, two. The Waiting room lines up today’s visitors with what each wants and their mood, and the Favour ledger tracks who owes you and whom you owe, so the Chair screen only holds one visitor and three answers.", "q4": "The Waiting room opens from the Chair with Q, and Favours sit in the Rotom Phone’s Ledger app. The wax-seal press follows the Motion setting.", "q5": "Yes, in a villain way. It feels like walking into Giovanni’s office in Silph Co. or the Game Corner, with the Boss’s Persian at the desk, and every answer is a clear Pokémon-style choice with its result shown."}, "20": {"name": "Every Player", "big": "Dominion is built for any player and any screen. The key strip shows the controller button next to every key, whatever you have picked wears a bright white focus ring you can always find, and Settings gains Access (text size, colour shapes, motion, one-button play) and Controls.", "pages": ["Settings · Access", "Controls", "On a phone"], "q1": "It is the quietest pass on purpose, but it still shows off: a full controller drawing with a bouncing A button, coloured pad buttons beside every key on every page, and a phone in your hand showing the whole HQ on a tall screen.", "q2": "Pass 19 added the Boss’s power; this pass makes every page easier to use. The key strip now speaks keyboard and controller at once, the thing you picked always has a bright white ring, and Settings gained an Access page with live previews and a Controls page.", "q3": "Yes, three. Access holds text size, colour shapes, motion and one-button play, Controls shows every action for keys, pad and touch, and On a phone shows how the HQ rearranges on a tall screen. They sit in the Settings home with the others.", "q4": "Access and Controls are two of the eight tiles on the Settings home, and the Access page keeps the same category list as the Dominion settings, so Settings stays one level deep.", "q5": "Yes. Pokémon games always show which button does what (A to choose, B to go back), and playing the same game on a TV or in your hands is the Switch way."}, "21": {"name": "Rotom’s Lessons", "big": "The tutorial is woven into the UI itself. Every page carries its lesson on T in the key strip, and a lesson lays a dark sheet over the real page, cuts a spotlight round the one thing it teaches, and has Rotom point at it with numbered steps, Skip and Next.", "pages": ["Lesson · the lift console", "Lesson · the Card", "Lesson book"], "q1": "Yes, in a new way: the page you are on dims behind a dark sheet, a dashed gold spotlight pulses round the one thing being taught, and Rotom floats up beside it with a speech bubble and numbered steps.", "q2": "Pass 20 made the UI easier for every player; this pass teaches it inside the real pages instead of on separate slides. Every page now shows its lesson number on T, and a lesson is the live page with a spotlight, so what you learn is exactly what you will use.", "q3": "Yes, three. Two lessons show how it works on real pages (the lift console on the HQ, the chance ring on the Card), and the Lesson book lists all 15 lessons with what you have seen, so any lesson can be replayed without hunting.", "q4": "T opens the lesson for the page you are on, the Lesson book sits in the Rotom Phone and Settings › Lessons, and the Tutorial row in Settings › Dominion picks Full, Tips only or Off.", "q5": "Yes. Pokémon games teach with a friendly helper (the Rotom Dex, Professor Oak’s aides) who points at one thing at a time, and the text always waits for your button press."}, "22": {"name": "Empire", "big": "The UI thinks bigger than one city. The Nova emblem on every page wears a gold ring that fills with your Goal and four region gems (Kanto lit), Empire pages turn gold and crimson with a slow banner wave, and Kanto becomes the first island on a World map.", "pages": ["The World", "Sail to Johto", "Pick the Holder"], "q1": "Yes. A gold Goal ring spins up round the Nova emblem on every page, with four region gems (Kanto lit and pulsing), Empire pages hang a crimson and gold garland that sways under the ticker, and the World map has a dotted gold sea route with a little ship sailing it and islands that glow when they are yours.", "q2": "Pass 21 taught the UI; this pass makes it feel like you are building something bigger than one city. Your progress to the Goal is always on screen in the emblem, and Kanto is now just the first island, so leaving a region is a proper journey with a sunset harbour and a list of what comes and what stays.", "q3": "Yes, three. The World (all regions at a glance), Sail to Johto (one clear goodbye page that says money does not carry over) and Pick the Holder (who runs Kanto while you are away). The Empire page now leads to the World instead of crowding four regions onto one screen.", "q4": "Press the Nova emblem on any page to open the World. In the menu, the World sits under Empire; the Holder choice is also in the Chair’s queue. Settings › Dominion gets a Holder row: Ask me, or Pick the most stable.", "q5": "Yes. It feels like the moment you board the S.S. Anne or the Magnet Train to a new region: a harbour, a ship, a map with routes, and the next region waiting with its own villain team."}, "23": {"name": "Breathing Room", "big": "Less chrome, more game. The top bar’s three chips fold into one status capsule, the bottom line becomes a real Pokémon text box that types itself out and waits on a bouncing ▼, and the buttons sit in a choice box with a ▶ cursor.", "pages": ["At a glance", "Focus view", "Settings · Screen"], "q1": "Yes, by doing less, better. The page breathes: one clean capsule replaces three chips, the speech line is a framed Pokémon text box whose words type themselves out before a ▼ bounces, and the buttons sit in a white choice box with a ▶ cursor that nudges back and forth. Focus view folds the whole HUD away with a slide.", "q2": "Pass 22 made the world bigger; this pass makes every page calmer and more readable. The top bar has a third fewer edges, the bottom of every page now reads like a real Pokémon conversation, and the HUD can be folded away completely when you want to look at the board.", "q3": "Yes, three. At a glance explains the capsule in plain words with what needs you, so the top bar never has to explain itself. Focus view shows any page with no HUD at all. Settings › Screen lets you pick how much HUD you want. All three are one press from where you are.", "q4": "Tap the capsule on any page for At a glance; V folds the HUD; Settings › Access gains a Screen tab with Status, News ticker, Key hints, Text speed and Focus view rows, each previewed live on the right.", "q5": "Yes, more than any pass so far: the white framed text box, the ▼ that waits for your button, and the ▶ cursor in a YES/NO style choice box are exactly how every main-series Pokémon game talks to you."}, "24": {"name": "Nova Mark", "big": "Team Nova finally has a brand, and the whole UI wears it: every page opens through a crimson Nova star that bursts like an iris, a giant Nova star turns slowly behind every page, every panel head is stamped with the four-point star, and every crew portrait wears a crimson armband.", "pages": ["The Mark", "Uniforms", "Calling card"], "q1": "Yes. Every page now opens with a crimson four-point Nova star that spins open like an iris and wipes away, a huge Nova star turns slowly behind the panels, every panel head gets a little star that spins in, and every crew portrait wears a crimson N armband. The Mark page waves a full team flag with turning light rays, and the Calling card drops onto the table and gets stamped.", "q2": "Pass 23 calmed the screen; this pass gives it an identity. Before, Team Nova looked like any menu; now the Nova star, crimson and the N armband are on every page, the same way Rocket’s R is everywhere in Pokémon. You feel like you are running a team with a brand, not reading a spreadsheet.", "q3": "Yes, three. The Mark (team colour, emblem and armband letter) and Uniforms (the whole crew lined up in armbands) give the brand its own home instead of hiding it in settings. The Calling card is a quick choice after a job, between the result and the next morning, so it never blocks the flow.", "q4": "The Mark sits in the Menu under HQ and in Settings › Dominion as “Team mark”. Settings › Effects gains a Page opener row: Nova star, Fade or Cut, so players who dislike the iris can turn it off. Uniforms opens from the Crew roster.", "q5": "Yes. Every villain team in Pokémon is defined by its logo and uniform: Rocket’s R, Galactic’s G, the Plasma shield. Giving Nova its own mark, armbands and a calling card is exactly that language."}, "25": {"name": "Master Cut", "big": "The first big synthesis: every panel now wears the same framed look as the text box (dark frame, cream inner line, area-colour rule), so the whole game reads as one Pokémon-style set of windows, and the frame itself is a choice in Options. The Phone tab becomes Start, which opens a classic Start menu that slides over the live page.", "pages": ["Start menu", "Options", "Boss card"], "q1": "Yes. Every window now has the same jewel-like frame (dark edge, cream inner line, a colour rule), the Start menu slides in from the right over the live page while the rest dims, a ▶ cursor nudges through the list, and the Boss card flips over in 3D like a Trainer Card with district stamps popping in.", "q2": "Passes 21 to 24 each added a layer (lessons, the world, a calmer HUD, the Nova brand). This pass ties them together: one frame for every window instead of mixed panel styles, one entry point (Start) instead of a Phone tab and a menu, and the Boss card becomes the one place that sums up your run.", "q3": "Yes, two new and one remade. The Start menu is a short list over the live page, so you never lose your place. Options holds the five settings people change most plus the frame picker, so the full Settings stays for everything else. The Boss card replaces the plain file page.", "q4": "This is the answer to both: Start (or the old Phone tab, which now says Start) opens the Start menu; Options is in it; Options links to All settings; Save is one line away. The Rotom Phone is item one, so nothing from before is lost.", "q5": "Very much. The right-side Start menu with a ▶ cursor, Options with Text speed, Battle scene, Sound and Frame 1 to 6, and a Trainer Card with an ID No. and badge circles are straight from the main series."}, "26": {"name": "Spectacle", "big": "Big moments hit like a Pokémon battle: every scene slams in with black letterbox bars, a white impact flash and a shake, the scene text box becomes the same cream framed box as everywhere else, and every page title streaks in on speed lines. Move animations are never touched: only trainers, Pokémon and the screen around them move.", "pages": ["Phase two", "Crew team-up", "Snapshot"], "q1": "Yes. Scenes now hit: black letterbox bars slam in and pull back, the screen flashes white and shakes, Giovanni rises out of a red shockwave for Phase Two, three crew strips slash across the screen for a team-up, and a Snapshot develops from white like a real photo before it drops into the album.", "q2": "Pass 25 unified every window; this pass makes the big moments feel big. The scene text box joins the cream frame look (with the ▼), page titles streak in on speed lines, and boss fights gain a proper second phase. It moves from tidy menus to a game with drama.", "q3": "Yes, three. Phase two explains what changed in one screen instead of a pile of battle messages. The Crew team-up is its own cut-in with one choice, Team up or Not now. The Snapshot sits between the battle and the result and saves to an album shown on the Boss card.", "q4": "Settings › Effects already has Show (Full, Lighter, Calm); Calm removes the bars, flash and shake. Options › Page opener covers the iris. The Album opens from the Boss card and from the Start menu’s Boss card line.", "q5": "Yes. Letterbox bars and a white flash before a boss, a gym leader’s second phase with new music, and a photo of the moment are all things recent Pokémon games do, and moves themselves stay exactly as they are."}, "27": {"name": "Sound You Can See", "big": "The UI shows what you hear: a little equaliser dances in the rainbow wedge, a Now playing card slides up whenever the music changes, speakers in the text box send out voice blips, and the lit lift button pulses on the beat.", "pages": ["Jukebox", "Radio", "Settings · Captions"], "q1": "Yes. A record spins on the Jukebox with its arm swinging down, a waveform ripples beside it, the Radio needle sweeps across the dial while three speakers throb, and on every page a Now playing card rises from the corner, a tiny equaliser dances in the rainbow wedge, and voice rings pulse from whoever is talking.", "q2": "Pass 26 gave big moments drama; this pass makes sound part of the screen. Music, voices and sirens now have something to look at, and the Radio turns sound into play: the Police band tells you where patrols will be, so you can plan around them.", "q3": "Yes, three. The Jukebox collects tracks as you hear them. The Radio is a real tool, not decoration. Captions gives every sound words and an arrow, which helps deaf and hard of hearing players and anyone playing muted.", "q4": "The Jukebox and Radio are lines in the Start menu (and the equaliser in the corner opens the Jukebox). Captions is a new tab beside Sound in Settings, with live captions in its preview.", "q5": "Yes. The Pokégear radio from Gold and Silver, a sound test or jukebox, and a Now playing card are all Pokémon touches, and the Rocket takeover of a radio station is canon."}, "28": {"name": "Crew Life", "big": "The crew stop being rows and start being people around you: whoever speaks in the text box pops a Pokémon-style emote bubble, off-duty crew stroll past behind the panels on every page, and the Crew button on the lift console shows the faces of whoever wants a word.", "pages": ["Bonds", "Downtime", "Heart-to-heart"], "q1": "Yes. Speakers pop a little emote bubble that bounces (♥ for Rosa, ♪ for Gus, ! for Rook), off-duty crew hop past behind the panels on every page, the Bonds web draws itself line by line in gold, teal and dashed red, and each Downtime spot floats its icon in a warm glow.", "q2": "Pass 27 made sound visible; this pass makes the crew feel alive. Before, crew were stats in rows; now they react when they talk, wander the HQ while you work, wave from the Crew button when they want you, and have friendships and grudges that change how jobs go.", "q3": "Yes, three. Bonds shows every relationship on one web instead of hiding it in six files. Downtime is one evening choice with clear effects. The Heart-to-heart is a short scene with two answers, reached from Bonds or when a crew member wants a word.", "q4": "Bonds and Downtime sit on the Crew page and in the Start menu under Crew. Settings › Dominion gains Crew chatter (Lots, Some, Few) for how often emotes and walk-bys appear; Effects › Calm hides the strollers.", "q5": "Yes. Emote bubbles over heads are classic overworld Pokémon, Pokémon Amie and Camp gave Pokémon downtime, and support chats with your team match the warmth of the series."}, "29": {"name": "Rocket War", "big": "Rocket is not a menu any more, it is a rival army pushing back on every page: a tug-of-war bar under the top bar shows Nova against Rocket across Kanto with a spark where they clash, Rocket’s R is sprayed behind the panels wherever they hold ground, and grunts patrol past the crew in the background.", "pages": ["War front", "Turf clash", "Parley"], "q1": "Yes. A tug-of-war line runs under the top bar of every page, crimson for Nova and grey for Rocket, with a white spark pulsing where they clash. Rocket’s R fades in like spray paint on job and opposition pages, a Rocket grunt patrols past behind the panels, and the Turf clash lines up three against three around a spinning VS badge.", "q2": "Pass 28 brought the crew to life; this pass gives them a real enemy. Before, Rocket was a number in district files; now the war is on every screen, you can see each district being pulled both ways, and you get a choice of how to deal with Archer: fight, pay, or split the city.", "q3": "Yes, three. The War front shows all nine districts as tug bars on one page. The Turf clash is a single setup screen before a fight (squad, odds, go). The Parley gives three clear offers with their costs, so diplomacy is a page, not a hidden event.", "q4": "The tug line opens the War front on any page, and it sits in the Start menu under Region map. Settings › Dominion gains Rocket pressure (Calm, Normal, Fierce), and Effects › Calm hides the spray tags.", "q5": "Yes. Team Rocket taking over towns and Executives like Archer bargaining with you are canon from Gold and Silver and HeartGold and SoulSilver, and turf battles with three on three feel like the multi battles in later games."}, "30": {"name": "Second Cut", "big": "The second synthesis pulls 26 to 29 together and clears space: the strip under the top bar carries news only where news matters and the Nova against Rocket war line everywhere else, every page arrives with a Black and White style place sign that slides in and away, and the speaker’s name moves onto a tab on top of the text box so the words get the whole box.", "pages": ["Last night", "Adventure log", "Hall of Infamy"], "q1": "Yes. Each page now arrives with a cream place sign that drops in (“The Compound · Viridian”), the strip under the top bar becomes a bright Nova against Rocket war line with a spark on most pages, speaker names sit on coloured tabs on the text box, Last night deals four recap cards onto the table, the Adventure log turns its page and writes itself in ink, and the Hall of Infamy raises the crew onto gold pedestals under sweeping spotlights.", "q2": "Passes 26 to 29 each added something big (drama, sound, crew life, the war). This pass makes them sit together calmly: news only shows where news matters, the war is always one glance away, the text box gives the words the full width, and three summary pages tie the run together: each morning, each day, and the end of a region.", "q3": "Yes, three, and they reduce clutter. Last night replaces a pile of overnight pop-ups with one recap. The Adventure log is the one place the story is written down. The Hall of Infamy marks the end of a region before you sail on.", "q4": "The Adventure log is in the Start menu; Last night can be switched in Settings › Dominion (Recap: Always, Short, Off); News ticker in Settings › Screen still picks On, Quiet (the new default, news only on news pages) or Off.", "q5": "Yes. The sliding place sign is straight from Black and White, the Adventure log comes from Platinum and Omega Ruby and Alpha Sapphire, and the Hall of Infamy is a dark mirror of the Hall of Fame."}};

/* Pass 1 · Nova Baseline. Restart: the main game's new look (word menus, black panels, key strip)
   in Team Nova's livery, with the Dominion pages and the HQ floors and Staff Office from the HQ thread. */
const fh = (k, h) => Math.min(5, h / ((SPR[k] || [32, 32])[1]));
const SP = (k, h, cls = '', m = 1) => spr(k, fh(k, h), cls, '', m ? 'spr-' + k : '');
const TABS = [['HQ', 'hq'], ['Region Map', 'map'], ['Crew', 'roster'], ['Pokémon', 'reserve'], ['Jobs', 'card'], ['Ledger', 'ledger']];
const TABOF = { HQ: 0, 'The Day': 1, Jobs: 4, Crew: 2, 'Pokémon': 3, Opposition: 1, Empire: 5, 'The Chair': 0, Rotom: -1 };
const neg = v => /^[−-]/.test(String(v));

comp(1, 'bg', b => `<div class="bgx b-${b || 'hq'}" data-nocheck></div>`);
comp(1, 'top', (s, ttl, sub) => `<header class="nb" ${mm('top')}><span class="nb-sig" ${mm('emb')}>N</span><b class="nb-team">TEAM NOVA</b><span class="nb-t" ${mm('ttl')}>${esc(ttl || s.t)}</span>${sub ? `<em class="nb-sub">${esc(sub)}</em>` : ''}<span class="nb-sp"></span>
  <u ${mm('funds')}>Funds <b>${RUN.funds}</b></u><u class="heat" ${mm('heat')}>Heat <b>${RUN.heat}%</b></u><u>Day <b>${RUN.day}</b></u></header>`);
comp(1, 'tabs', s => { const on = TABOF[s.g]; return on === undefined || on < 0 ? '' : `<nav class="tabs" ${mm('tabs')}>${map(TABS, ([l, g], i) => `<button class="${i === on ? 'on' : ''}" ${go(g)}><kbd>${i + 1}</kbd>${l}</button>`)}</nav>`; });
comp(1, 'foot', (who, line, ctas) => `<section class="foot" ${mm('box')}><p>${who ? `<b>${esc(who)}</b>` : ''}${esc(line)}</p>${map(ctas, ([l, g], i) => `<button class="cta${i === ctas.length - 1 ? ' on' : ''}" ${go(g)}>${esc(l)}</button>`)}</section>`);
comp(1, 'keys', k => `<footer class="keys" ${mm('keys')}><i class="rb"></i>${map(k || KEYS.std, ([a, b]) => `<span><kbd>${esc(a)}</kbd>${esc(b)}</span>`)}</footer>`);
comp(1, 'ico', it => it.spr ? SP(it.spr, 40, 'ico') : it.ty ? `<span class="tyb" style="--t:${TYC[it.ty]}">${cap(it.ty)}</span>` : it.ico ? spr(it.ico, 1.25, 'ico') : '');
comp(1, 'bar', (l, v, mx, i) => `<div class="bar" ${st(i || 0)}><span>${esc(l)}</span><i><u style="width:${Math.round(v / mx * 100)}%"></u></i><b>${v}</b></div>`);
comp(1, 'mons', ks => `<div class="mons">${map(ks, (k, i) => `<span ${st(i)}>${SP(MON[k][0], 44, '', 0)}<b>${MON[k][1]}</b></span>`)}</div>`);
comp(1, 'pn', (cls, head, body, m) => `<section class="pn ${cls}" ${m ? mm(m) : ''}>${head ? `<h3>${head}</h3>` : ''}${body}</section>`);

/* Title: the main game's word menu, in black and crimson, with the Boss over the street */

  <div class="t-logo" ${mm('ttl')}><b>DOMINION</b><small>${esc(s.tag)}</small></div>
  <nav class="t-menu">${map(s.items, ([l, d, g], i) => `<button class="wm${i === 0 ? ' on' : ''}" ${go(g)} ${st(i, 70)}><b>${esc(l)}</b>${d ? `<span>${esc(d)}</span>` : ''}</button>`)}</nav>

  ${d ? C('pn', 'l-det', '', `<div class="plinth">${SP(d.spr, 110, 'dspr')}</div><b class="det-t">${esc(d.ttl)}</b>${map(d.lines, l => `<p>${esc(l)}</p>`)}${d.cta ? `<button class="cta on" ${go(d.cta[1])}>${esc(d.cta[0])}</button>` : ''}`, 'det') : ''}
  ${C('tabs', s)}${C('keys')}</div>`; });

comp(1, 'k:scene', s => { const ch = s.choices || [], many = ch.length > 1; const word = s.mode === 'gim' ? ({ mega: 'MEGA EVOLUTION', dyna: 'DYNAMAX', tera: 'TERASTAL', z: 'Z-POWER' })[s.gim] : s.mode === 'vs' ? (s.id === 'herohit' ? 'A HERO APPEARS' : s.id === 'legend' ? 'BETRAYAL' : s.id === 'debate' ? 'THE DEBATE' : 'BATTLE') : s.mode === 'cut' ? (s.id === 'ace' ? 'THE ACE' : 'THE ORDER') : '';
  return `<div class="scr nv k-scene sm-${s.mode}${many ? ' many' : ''}">${C('bg', s.mode === 'gim' ? 'g-' + s.gim : s.bg)}
  ${word ? `<div class="sc-word" ${mm('ttl')}><small>${s.mode === 'cut' ? esc(s.left.n) + ' · ' + esc(s.left.r) : s.mode === 'gim' ? 'Power moment' : 'The job is interrupted'}</small><b>${word}</b></div>` : ''}
  ${s.mode === 'vs' ? '<div class="vsdisc" data-nocheck>VS</div>' : ''}
  <div class="act l">${SP(s.left.s, s.mode === 'gim' ? 150 : 250)}<span class="plate"><b>${esc(s.left.n)}</b><em>${esc(s.left.r)}</em></span></div>
  <div class="act r">${SP(s.right.s, s.mode === 'gim' ? 230 : 250, s.right.s.startsWith('m-') ? '' : 'flip')}<span class="plate"><b>${esc(s.right.n)}</b><em>${esc(s.right.r)}</em></span></div>
  ${s.meter ? `<div class="meter">${C('bar', s.meter[0], s.meter[1], 100, 0)}</div>` : ''}
  ${many ? `<nav class="chs">${map(ch, ([k, l, g], i) => `<button class="ch${i === 0 ? ' on' : ''}" ${go(g)} ${st(i, 90)}><kbd>${esc(k)}</kbd><b>${esc(l)}</b></button>`)}</nav>` : ''}
  <section class="tbox" ${mm('box')}>${s.speaker ? `<b class="spk">${esc(s.speaker)}</b>` : ''}<p>${esc(s.line)}</p>${s.reply ? `<p class="rep">${esc(s.reply)}</p>` : ''}${many ? '' : `<button class="cta on" ${go(ch[0] && ch[0][2])}>${esc(ch[0] ? ch[0][1] : 'Next')}</button>`}<i class="more">▼</i></section>
  ${C('keys', many ? [['1-3', 'answer'], ['Enter', 'your call']] : [['Enter', 'next']])}</div>`; });

/* Result: the big number, a stamp, and what changed */
comp(1, 'k:result', s => `<div class="scr nv k-res${s.bad ? ' bad' : ''}">${C('bg', s.bad ? 'police' : 'gold')}${C('top', s, s.t)}
  <div class="r-l"><small>${s.bad ? 'What it cost' : 'The take'}</small><b class="r-big" ${mm('funds')}>${esc(s.big)}</b><p>${esc(s.sub)}</p><div class="stamp" ${mm('ttl')}>${esc(s.stamp)}</div></div>
  ${C('pn', 'r-lines', 'What changed', map(s.lines, ([a, b, d], i) => `<div class="chg ${d > 0 ? 'up' : 'dn'}" ${st(i, 110)}><i>${d > 0 ? '▲' : '▼'}</i><b>${esc(a)}</b><em>${esc(b)}</em></div>`), 'panel')}
  ${C('foot', '', s.bad ? '“They won’t talk. Probably.”' : '“Another good day for Team Nova.”', [s.cta])}${C('keys', [['Enter', 'next']])}</div>`);

/* Grid: cards (crew, rooms, regions), the Pokémon box, and the rank pyramid */
comp(1, 'k:grid', s => { const md = s.mode || 'cards', n = s.cells.length; const cell = ([k, l, d, tag], i) => `<button class="cell${i === s.sel ? ' on' : ''}${k ? '' : ' empty'}" ${st(i, 50)}>${k ? `<span class="cs">${SP(k, md === 'box' ? 46 : md === 'pyr' ? 40 : n > 6 ? 48 : 64)}</span>` : '<i class="plus">+</i>'}<b>${esc(l)}</b><em>${esc(d)}</em>${tag ? `<i class="tag">${esc(tag)}</i>` : ''}</button>`;

  return `<div class="scr nv k-grid g-${md}">${C('bg', 'hq')}${C('top', s)}${C('pn', 'g-main', esc(s.head), body, 'panel')}${C('tabs', s)}${C('keys')}</div>`; });

/* Paper: the Kanto Ledger on the desk, or the hijacked TV */
comp(1, 'k:paper', s => s.mode === 'tv' ? `<div class="scr nv k-tv">${C('bg', 'night')}<section class="tv" ${mm('panel')}><div class="tv-in">${SP(s.photo, 230)}<span class="onair">● ON AIR</span><div class="low3"><b>${esc(s.head)}</b><em>${esc(s.sub)}</em></div></div></section>
  ${C('pn', 'tv-side', 'Across Kanto', map(s.side, ([a, b], i) => `<div class="part" ${st(i)}><span>${esc(a)}</span><b>${esc(b)}</b></div>`) + map(s.cols, c => `<p class="q">${esc(c)}</p>`), 'det')}${C('keys', [['Enter', 'next'], ['Esc', 'back']])}</div>`
  : `<div class="scr nv k-paper">${C('bg', 'hq')}${C('top', s)}<section class="sheet" ${mm('panel')}><div class="mast" ${mm('ttl')}>${esc(s.mast)}</div><h2>${esc(s.head)}</h2><p class="sub">${esc(s.sub)}</p><div class="sh-b"><div class="photo">${SP(s.photo, 120)}</div><div class="cols">${map(s.cols, c => `<p>${esc(c)}</p>`)}</div></div></section>

/* Boss Menu: the title's word menu in black, the empire at a glance beside it */

  <div class="bpl me" ${mm('meplate')}><b>${s.me[1]}</b><em>Lv ${s.me[2]}</em><i class="hp"><u style="width:${s.me[3]}%"></u></i><span>${Math.round(s.me[3] * 1.4)} / 140</span></div>
  <nav class="b-words">${map([['FIGHT', ''], ['ORDER', '1 ready'], ['CRATE', '3 items'], ['CREW', '4 left'], ['RETREAT', '']], ([l, d], i) => `<button class="bw${i === 0 ? ' on' : ''}" ${st(i, 60)}><kbd>${i + 1}</kbd><b>${l}</b>${d ? `<em>${d}</em>` : ''}</button>`)}</nav></div>`);

  Opposition: ['blue', 'Saffron · after dark'], Trainers: ['night', 'Fuchsia'], Events: ['morn', 'Celadon · noon'], Empire: ['roof', 'Saffron rooftops'], 'The Chair': ['chair', 'The Chair · Boss Office'], Rotom: ['in', 'The Compound'], Menu: ['morn', ''], Settings: ['in', ''], Start: ['morn', 'Viridian'], Guide: ['in', 'The Compound'], 'Map of pages': ['in', ''] };

comp(4, 'k:card', (s, P) => before('k:card', 4)(s, P).replace(`<b>${s.odds}%</b><em>chance</em>`, `<b class="cnt" style="--to:${s.odds}"></b><em>chance</em>`));

const RG = { viridian: 8, pewter: 35, cerulean: 61, saffron: 84, celadon: 30, lavender: 20, vermilion: 44, fuchsia: 15, cinnabar: 5 };
const PUSH = { celadon: 'Rocket pushes tonight', cerulean: 'You could take it back', saffron: 'Silph Co. · their fortress' };
comp(29, 'k:war29', s => `<div class="scr nv k-war29">${C('bg', 'night')}${C('top', s, 'War front', 'Nova 42 · Rocket 58')}
  <section class="wg29" ${mm('panel')}>${map(DIST, (d, i) => `<button class="wd29 o-${d.own}${d.id === 'celadon' ? ' on' : ''}" ${go(d.id === 'celadon' ? 'turf' : '')} style="--n:${d.c}%;--r:${RG[d.id]}%;--d:${i * 50}ms"><b>${d.n}</b><span class="tb"><i class="n"></i><i class="r"></i></span><em>${PUSH[d.id] || (d.own === 'nova' ? 'Yours' : d.own === 'rocket' ? 'Rocket holds it' : 'Up for grabs')}</em></button>`)}</section>
  ${C('foot', 'Dale', '“Archer’s grunts hit Celadon tonight. We hold it or we lose it.”', [['Parley', 'parley'], ['Defend Celadon', 'turf']])}${C('tabs', s)}${C('keys', [['←→↑↓', 'district'], ['Enter', 'go'], ['Esc', 'back']])}</div>`);

/* a Turf clash */
page('turf', { g: 'Opposition', t: 'Turf clash', kind: 'tc29', from: 29 });
comp(29, 'k:tc29', s => `<div class="scr nv k-tc29">${C('bg', 'street')}<i class="fl26" data-nocheck></i>${C('top', s, 'Turf clash', 'Celadon · tonight')}
  <div class="side29 me">${map([['c-rosa', 'Rosa'], ['c-rook', 'Rook'], ['c-dale', 'Dale']], ([k, n], i) => `<span class="ft29" style="--d:${i * 120}ms">${SP(k, 120, '', 0)}<b>${n}</b></span>`)}</div>
  <div class="vs29" data-nocheck><b>VS</b><i></i></div>
  <div class="side29 them">${map([['t-grunt', 'Grunt'], ['c-archer', 'Archer'], ['t-grunt', 'Grunt']], ([k, n], i) => `<span class="ft29" style="--d:${i * 120 + 300}ms">${SP(k, 120, 'flip', 0)}<b>${n}</b></span>`)}</div>
  <div class="odds29"><b>58%</b><em>chance to hold Celadon</em></div>
  ${C('foot', 'Rosa', '“Three of us, three of them. I like those numbers.”', [['Change squad', 'squads'], ['Fight', 'battle']])}${C('keys', [['Enter', 'fight'], ['S', 'squad']])}</div>`);

/* a Parley with Archer */
page('parley', { g: 'Opposition', t: 'Parley', kind: 'pa29', from: 29 });
const OFFER = [['Split Celadon', 'You keep the Dept. Store, they keep the Game Corner', 'Rocket grip −10 · Regard +4'], ['Pay tribute', '₽2,000 a week and they leave you be', 'Funds −₽2,000 · Dread −3'], ['Refuse', 'War in Celadon tonight', 'Dread +6 · Heat +4']];
comp(29, 'k:pa29', s => `<div class="scr nv k-pa29">${C('bg', 'roof')}${C('top', s, 'Parley', 'Archer · Rocket Executive')}
  <div class="tbl29" data-nocheck></div><div class="arc29">${SP('c-archer', 200, '', 0)}</div>
  ${C('pn', 'of29', 'Archer’s offer', map(OFFER, ([a, b, c], i) => `<button class="o29${i === 2 ? ' on' : ''}" ${st(i, 90)}><b>${a}</b><em>${b}</em><i>${c}</i></button>`), 'det')}
  ${C('foot', 'Archer', '“Giovanni is gone. Rocket is mine now. Choose wisely.”', [['Think it over', 'war'], ['Answer', 'war']])}${C('keys', [['↑↓', 'offer'], ['Enter', 'answer'], ['Esc', 'leave']])}</div>`);

/* ===== pass 30 ===== */
/* Pass 30 · Second Cut. The second synthesis pulls 26 to 29 together and clears space: the strip under the top bar now
   carries news only where news matters and the Nova against Rocket war line everywhere else, every page arrives with a
   Black and White style place sign that slides in and away, and the speaker's name moves onto a tab on top of the text
   box so the words get the whole box. New pages: Last night (a quick recap each morning), the Adventure log, and the
   Hall of Infamy. */
const NEWSG = ['The Day', 'Jobs', 'Opposition', 'Events', 'Trainers', 'Gimmicks'];
comp(30, 'top', (s, ttl, sub) => { let h = before('top', 30)(s, ttl, sub); const pl = (PLACE[s.g] || [])[1];
  if (!NEWSG.includes(s.g)) h = h.replace(/<div class="tick18"[^]*?<\/div>/, `<div class="war30" ${go('war')} data-nocheck><b>NOVA ${WAR}</b><span><i style="width:${WAR}%"></i><em style="left:${WAR}%"></em></span><b class="r">${100 - WAR} ROCKET</b></div>`);
  return h + (pl ? `<div class="sign30" data-nocheck><i></i><b>${esc(pl)}</b></div>` : ''); });
comp(30, 'foot', (who, line, ctas) => before('foot', 30)(who, line, ctas).replace('class="foot', `class="foot${who ? ' nm30' : ''}`));

/* Last night: a quick recap each morning */
page('recap', { g: 'The Day', t: 'Last night', kind: 'rc30', from: 30 });
const RECAP = [['Job', 'Celadon Day Care', 'Rook snatched a Growlithe', '+₽1,200', 'c-rook'], ['War', 'Celadon held', 'Archer’s grunts ran', 'Nova 42', 't-grunt'], ['Crew', 'Rosa and Rook', 'Bond grew to 4', '♥', 'c-rosa'], ['Police', 'Looker in Saffron', 'Heat 22%, patrols east', '+3', 't-looker']];
comp(30, 'k:rc30', s => `<div class="scr nv k-rc30">${C('bg', 'street')}${C('top', s, 'Last night', 'Day 17 → Day 18')}
  <section class="rg30" ${mm('panel')}>${map(RECAP, ([k, a, b, v, sp], i) => `<div class="rcd30" style="--d:${i * 220}ms"><small>${k}</small><span class="sp">${SP(sp, 96, '', 0)}</span><b>${a}</b><em>${b}</em><i>${v}</i></div>`)}</section>
  ${C('foot', 'Rotom', '“Bzzt! Previously, on Team Nova… Ready for Day 18?”', [['Skip', 'morning'], ['Start Day 18', 'morning']])}${C('tabs', s)}${C('keys', [['Enter', 'start the day'], ['Esc', 'skip']])}</div>`);

/* the Adventure log */
page('journal', { g: 'Menu', t: 'Adventure log', kind: 'jl30', from: 30 });
const JL = [['Day 18', 'Held Celadon against Archer. Rosa says Rocket is cracking.', 1], ['Day 17', 'Snatched a Growlithe from the Day Care. Rook never made a sound.', 1], ['Day 16', 'Red beat Koga’s gym. He is coming our way.', 0], ['Day 15', 'Opened the Laundromat. Clean money, finally.', 1], ['Day 14', 'Gus pocketed a take. I let it slide. This time.', 0]];
comp(30, 'k:jl30', s => `<div class="scr nv k-jl30">${C('bg', 'hq')}${C('top', s, 'Adventure log', 'Written by the Boss')}
  <div class="bk30" ${mm('card')}><div class="pg l">${map(JL.slice(0, 3), ([d, t, g], i) => `<p class="en30" style="--d:${i * 200}ms"><b>${d}</b>${esc(t)}${g ? '<i>✦</i>' : ''}</p>`)}</div><div class="pg r">${map(JL.slice(3), ([d, t, g], i) => `<p class="en30" style="--d:${(i + 3) * 200}ms"><b>${d}</b>${esc(t)}${g ? '<i>✦</i>' : ''}</p>`)}<span class="sig30">— Nate</span></div></div>
  ${C('foot', 'Rosa', '“You write in that every night? Boss, you’re soft.”', [['Back', 'start'], ['Older pages', '']])}${C('keys', [['←→', 'page'], ['Esc', 'back']])}</div>`);

/* the Hall of Infamy */
page('infamy', { g: 'Empire', t: 'Hall of Infamy', kind: 'hi30', from: 30 });
comp(30, 'k:hi30', s => `<div class="scr nv k-hi30">${C('bg', 'night')}<i class="spot30" data-nocheck></i>${C('top', s, 'Hall of Infamy', 'Kanto taken · Day 64')}
  <section class="hall30" ${mm('panel')}>${map([['t-natebig', 'Nate', 'The Boss'], ['c-rosa', 'Rosa', 'Holder of Kanto'], ['mb-229', 'Houndoom', 'Ace · Lv 52'], ['c-rook', 'Rook', 'Never caught'], ['c-mina', 'Mina', 'Brains']], ([k, n, r], i) => `<div class="ped30${i === 0 ? ' top' : ''}" style="--d:${i * 160}ms"><span class="sp">${SP(k, i === 0 ? 150 : 110, '', 0)}</span><i class="base"></i><b>${n}</b><em>${r}</em></div>`)}</section>
  ${C('foot', 'Rotom', '“Bzzt! Saved to the Hall. Kanto will remember. Kanto will not forgive.”', [['Credits', 'ending'], ['Sail on', 'world']])}${C('tabs', s)}${C('keys', [['Enter', 'continue']])}</div>`);

boot();
</script>
