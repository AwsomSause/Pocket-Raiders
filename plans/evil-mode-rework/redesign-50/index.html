/* ===== pass 1 ===== */
/* Pass 1 · Nova Baseline. Restart: the main game's new look (word menus, black panels, key strip)
   in Team Nova's livery, with the Dominion pages and the HQ floors and Staff Office from the HQ thread. */
const fh = (k, h) => Math.min(5, h / ((SPR[k] || [32, 32])[1]));
const SP = (k, h, cls = '', m = 1) => spr(k, fh(k, h), cls, '', m ? 'spr-' + k : '');
const TABS = [['HQ', 'hq'], ['Region Map', 'map'], ['Crew', 'roster'], ['Pokémon', 'reserve'], ['Jobs', 'card'], ['Ledger', 'ledger']];
const TABOF = { HQ: 0, 'The Day': 1, Jobs: 4, Crew: 2, 'Pokémon': 3, Opposition: 1, Empire: 5, 'The Chair': 0, Rotom: -1 };
const neg = v => /^[−-]/.test(String(v));

comp(1, 'bg', b => `<div class="bgx b-${b || 'hq'}" data-nocheck></div>`);
comp(1, 'top', (s, ttl, sub) => `<header class="nb" ${mm('top')}><span class="nb-sig" ${mm('emb')}>N</span><b class="nb-team">TEAM NOVA</b><span class="nb-t" ${mm('ttl')}>${esc(ttl || s.t)}</span>${sub ? `<em class="nb-sub">${esc(sub)}</em>` : ''}<span class="nb-sp"></span>
  <u ${mm('funds')}>Funds <b>${RUN.funds}</b></u><u class="heat" ${mm('heat')}>Heat <b>${RUN.heat}%</b></u><u>Day <b>${RUN.day}</b></u></header>`);
comp(1, 'tabs', s => { const on = TABOF[s.g]; return on === undefined || on < 0 ? '' : `<nav class="tabs" ${mm('tabs')}>${map(TABS, ([l, g], i) => `<button class="${i === on ? 'on' : ''}" ${go(g)}><kbd>${i + 1}</kbd>${l}</button>`)}</nav>`; });
comp(1, 'foot', (who, line, ctas) => `<section class="foot" ${mm('box')}><p>${who ? `<b>${esc(who)}</b>` : ''}${esc(line)}</p>${map(ctas, ([l, g], i) => `<button class="cta${i === ctas.length - 1 ? ' on' : ''}" ${go(g)}>${esc(l)}</button>`)}</section>`);
comp(1, 'keys', k => `<footer class="keys" ${mm('keys')}><i class="rb"></i>${map(k || KEYS.std, ([a, b]) => `<span><kbd>${esc(a)}</kbd>${esc(b)}</span>`)}</footer>`);
comp(1, 'ico', it => it.spr ? SP(it.spr, 40, 'ico') : it.ty ? `<span class="tyb" style="--t:${TYC[it.ty]}">${cap(it.ty)}</span>` : it.ico ? spr(it.ico, 1.25, 'ico') : '');
comp(1, 'bar', (l, v, mx, i) => `<div class="bar" ${st(i || 0)}><span>${esc(l)}</span><i><u style="width:${Math.round(v / mx * 100)}%"></u></i><b>${v}</b></div>`);
comp(1, 'mons', ks => `<div class="mons">${map(ks, (k, i) => `<span ${st(i)}>${SP(MON[k][0], 44, '', 0)}<b>${MON[k][1]}</b></span>`)}</div>`);
comp(1, 'pn', (cls, head, body, m) => `<section class="pn ${cls}" ${m ? mm(m) : ''}>${head ? `<h3>${head}</h3>` : ''}${body}</section>`);

/* Title: the main game's word menu, in black and crimson, with the Boss over the street */
comp(1, 'k:title', s => `<div class="scr nv k-title">${C('bg', 'street')}<div class="t-n" data-nocheck>N</div><div class="t-slab"></div>
  <div class="t-logo" ${mm('ttl')}><b>DOMINION</b><small>${esc(s.tag)}</small></div>
  <nav class="t-menu">${map(s.items, ([l, d, g], i) => `<button class="wm${i === 0 ? ' on' : ''}" ${go(g)} ${st(i, 70)}><b>${esc(l)}</b>${d ? `<span>${esc(d)}</span>` : ''}</button>`)}</nav>
  <div class="t-boss">${SP('t-natebig', 290)}</div><div class="t-cat">${SP('p-persian', 92)}</div>
  <div class="t-crew">${map(['c-rook', 'c-rosa', 'c-mina'], (k, i) => `<i ${st(i, 90)}>${SP(k, 86)}</i>`)}</div>
  <div class="t-quote"><p>“Kanto doesn’t need another hero. It needs a boss.”</p><b>Nate · Day 18</b></div>${C('keys', [['↑↓', 'move'], ['Enter', 'choose']])}</div>`);

/* List: a word list on the left, the chosen row explained on the right */
comp(1, 'k:list', s => { const d = s.detail; const n = s.items.length; return `<div class="scr nv k-list">${C('bg', s.bg || 'hq')}${C('top', s)}
  ${C('pn', 'l-main' + (d ? '' : ' wide') + (n > 5 ? ' tight' : ''), esc(s.head), map(s.items, (it, i) => `<button class="row${i === (s.sel || 0) ? ' on' : ''}" ${go(it.go || (i === (s.sel || 0) && d && d.cta ? d.cta[1] : ''))} ${st(i, 60)}>${C('ico', it)}<span class="row-t"><b>${esc(it.l)}</b><em>${esc(it.s)}</em></span>${it.tag ? `<i class="tag${/^₽|^\d/.test(it.tag) ? ' num' : ''}">${esc(it.tag)}</i>` : ''}</button>`), 'panel')}
  ${d ? C('pn', 'l-det', '', `<div class="plinth">${SP(d.spr, 110, 'dspr')}</div><b class="det-t">${esc(d.ttl)}</b>${map(d.lines, l => `<p>${esc(l)}</p>`)}${d.cta ? `<button class="cta on" ${go(d.cta[1])}>${esc(d.cta[0])}</button>` : ''}`, 'det') : ''}
  ${C('tabs', s)}${C('keys')}</div>`; });

/* File: portrait, stats, and traits, with the person talking at the bottom */
comp(1, 'k:file', s => `<div class="scr nv k-file">${C('bg', 'hq')}${C('top', s)}
  ${C('pn', 'f-por', '', `<div class="plinth big">${SP(s.spr, 190, 'fspr')}</div><b class="f-name" ${mm('name')}>${esc(s.name)}</b><em class="f-rank">${esc(s.rank)}</em>`, 'det')}
  ${C('pn', 'f-st', 'Stats', map(s.stats, ([l, v, mx], i) => C('bar', l, v, mx, i)) + (s.team ? C('mons', s.team.slice(0, 3)) : ''), 'panel')}
  ${C('pn', 'f-tr', 'Notes', map(s.traits, ([a, b], i) => `<div class="trait" ${st(i)}><b>${esc(a)}</b><em>${esc(b)}</em></div>`) + `<dl class="facts">${map(s.facts, ([a, b]) => `<dt>${esc(a)}</dt><dd>${esc(b)}</dd>`)}</dl>`)}
  ${C('foot', '', s.quote || '', s.cta ? [['Back', ''], s.cta] : [['Back', '']])}${C('tabs', s)}${C('keys')}</div>`);

/* HQ: the building cut open, floor by floor (HQ thread: Upper Floor, Ground Floor, The Cellar) */
comp(1, 'k:hub', s => `<div class="scr nv k-hub">${C('bg', 'street')}${C('top', s, 'The Compound', 'HQ Lv ' + RUN.hqLv)}
  <section class="pn h-bld" ${mm('panel')}><h3>The Compound · 3 floors · 11 of 15 plots</h3>${map(FLOORS, (f, i) => `<div class="fl${f.f === 'B1' ? ' under' : ''}" ${st(i, 120)}><span class="fl-tag" ${go(i === 0 ? 'floor' : '')}><b>${f.f}</b><em>${f.n}</em></span>
    ${map(f.rooms, ([n, ic, sub, k]) => `<span class="rm${k ? ' ' + k : ''}" ${go(k === 'plot' ? 'plot' : n === 'Staff Office' ? 'auto' : n === 'Applications' ? 'apps' : '')}>${ic ? spr(ic, 1, '') : '<i>+</i>'}<b>${esc(n)}</b><em>${esc(sub)}</em></span>`)}</div>`)}</section>
  ${C('pn', 'h-side', 'Tonight', map([['Assign 3 free crew', 'assign', '3'], ['Rosa wants a word', 'file', '!'], ['Plan a job in Cerulean', 'map', '']], ([l, g, n], i) => `<button class="row sm${i === 0 ? ' on' : ''}" ${go(g)} ${st(i)}><b>${esc(l)}</b>${n ? `<i class="tag">${n}</i>` : ''}</button>`) + `<div class="h-crew">${map(CREW.slice(0, 4), c => SP(c.s, 70))}</div>`, 'det')}
  ${C('foot', 'Rook', '“Upper Floor’s done, Boss. The Lookout can see all of Viridian.”', [['Start the day', 'morning']])}${C('tabs', s)}${C('keys', [['F', 'floor'], ['P', 'plot'], ['K', 'Staff Office'], ['Enter', 'open']])}</div>`);

/* Map: Kanto as coloured district tiles, the chosen one on the right */
comp(1, 'k:map', s => { const d = DIST.find(x => x.id === s.sel); return `<div class="scr nv k-map">${C('bg', 'night')}${C('top', s, 'Region Map · Kanto')}
  <section class="pn m-grid" ${mm('panel')}>${map(DIST, (x, i) => `<button class="tile o-${x.own}${x.id === s.sel ? ' on' : ''}" ${go(x.id === s.sel ? 'district' : '')} ${mm('dist-' + x.id)} ${st(i, 40)}><b>${x.n}</b><em>${OWN[x.own][0]}${x.c ? ' · ' + x.c : ''}</em></button>`)}
    <ul class="leg">${map(Object.values(OWN), ([n, c]) => `<li style="--c:${c}"><i></i>${n}</li>`)}</ul></section>
  ${C('pn', 'm-side', 'District file', `<b class="det-t big">${d.n}</b><p class="own" style="--c:${OWN[d.own][1]}">${OWN[d.own][0]}</p>${C('bar', 'Your control', d.c, 100, 0)}${C('bar', 'Heat here', d.h, 100, 1)}${C('bar', 'Rocket grip', 61, 100, 2)}<div class="chips">${map(['Extort', 'Snatch', 'Scout', 'Recruit', 'Lay low'], (c, i) => `<i class="${i === 0 ? 'on' : ''}">${c}</i>`)}</div>`, 'det')}
  ${C('foot', 'Mina', '“Red was seen in Pewter. Cerulean is clear tonight.”', [['Open the district', 'district']])}${C('tabs', s)}${C('keys', [['←→↑↓', 'district'], ['Enter', 'plan']])}</div>`; });

comp(1, 'k:card', s => `<div class="scr nv k-card">${C('bg', 'street')}${C('top', s, 'The Card', s.job)}
  ${C('pn', 'c-odds', '', `<div class="ring" style="--p:${s.odds}"><b>${s.odds}%</b><em>chance</em></div><b class="det-t">${esc(s.job)}</b><p>${esc(s.where)}</p>`, 'det')}
  ${C('pn', 'c-parts', 'How the odds are made', map(s.parts, ([a, b], i) => `<div class="part" ${st(i, 70)}><span>${esc(a)}</span><b class="${neg(b) ? 'neg' : ''}">${esc(b)}</b></div>`) + `<div class="part tot"><span>Total</span><b>${s.odds}%</b></div>`, 'panel')}
  ${C('pn', 'c-who', 'Who is there', map(s.who || [], k => `<div class="who">${SP(k, 64)}</div>`) + `<dl class="facts"><dt>Pay</dt><dd>${esc(s.pay)}</dd><dt>Heat</dt><dd>${esc(s.heat)}</dd><dt>Risk</dt><dd>${esc(s.risk)}</dd></dl>`)}
  ${C('foot', 'Rosa', '“Say the word, Boss.”', [['Back', 'map'], ['Do it', 'order']])}${C('tabs', s)}${C('keys', [['Enter', 'do it'], ['Esc', 'back']])}</div>`);

/* Scenes: talk, cut-in, face-off, gimmick and event, all ending in a box that waits for a key */
const BIGW = { cut: 'THE BOSS GIVES THE ORDER', vs: 'A HERO APPEARS' };
comp(1, 'k:scene', s => { const ch = s.choices || [], many = ch.length > 1; const word = s.mode === 'gim' ? ({ mega: 'MEGA EVOLUTION', dyna: 'DYNAMAX', tera: 'TERASTAL', z: 'Z-POWER' })[s.gim] : s.mode === 'vs' ? (s.id === 'herohit' ? 'A HERO APPEARS' : s.id === 'legend' ? 'BETRAYAL' : s.id === 'debate' ? 'THE DEBATE' : 'BATTLE') : s.mode === 'cut' ? (s.id === 'ace' ? 'THE ACE' : 'THE ORDER') : '';
  return `<div class="scr nv k-scene sm-${s.mode}${many ? ' many' : ''}">${C('bg', s.mode === 'gim' ? 'g-' + s.gim : s.bg)}
  ${word ? `<div class="sc-word" ${mm('ttl')}><small>${s.mode === 'cut' ? esc(s.left.n) + ' · ' + esc(s.left.r) : s.mode === 'gim' ? 'Power moment' : 'The job is interrupted'}</small><b>${word}</b></div>` : ''}
  ${s.mode === 'vs' ? '<div class="vsdisc" data-nocheck>VS</div>' : ''}
  <div class="act l">${SP(s.left.s, s.mode === 'gim' ? 150 : 250)}<span class="plate"><b>${esc(s.left.n)}</b><em>${esc(s.left.r)}</em></span></div>
  <div class="act r">${SP(s.right.s, s.mode === 'gim' ? 230 : 250, s.right.s.startsWith('m-') ? '' : 'flip')}<span class="plate"><b>${esc(s.right.n)}</b><em>${esc(s.right.r)}</em></span></div>

  <section class="cs41" ${mm('panel')}><i class="rug" data-nocheck></i><span class="hd" data-nocheck>${SP('m-229', 190, '', 0)}</span><span class="hts" data-nocheck>${rep(6, i => `<i style="--i:${i};--x:${[30, 55, 70, 40, 62, 48][i]}%"></i>`)}</span><span class="tools">${map([['Brush', 'i-soothe_bell'], ['Poké Puff', 'i-candy'], ['Play', 'g-ball']], ([n, k], i) => `<button class="tl41${i === 1 ? ' on' : ''}" ${st(i, 90)}>${spr(k, 1.5, '')}<b>${n}</b></button>`)}</span></section>
  ${C('pn', 'cf41', 'Houndoom', `<div class="af41"><b>Affection</b><span>${rep(5, i => `<i class="${i < 4 ? 'on' : ''}" style="--d:${i * 120}ms"></i>`)}</span></div>${map([['Mood', 'Pleased'], ['Last fed', 'This morning'], ['Bonus', 'May shrug off a hit'], ['Favourite', 'Spicy Poké Puffs']], ([a, b], i) => `<div class="row40" ${st(i, 80)}><b>${a}</b><i>${b}</i></div>`)}`, 'det')}
  ${C('foot', 'Nate', '“Good dog. You earned this one.”', [['Back', 'party'], ['Give a Poké Puff', 'party']])}${C('tabs', s)}${C('keys', [['←→', 'tool'], ['Enter', 'use'], ['Esc', 'back']])}</div>`);

/* ===== pass 42 ===== */
/* Pass 42 · The Hunted. Red is close, and the whole UI knows it. While the Hero’s Threat is over 70, every page beats
   with a slow blue heartbeat at its edges, a Hero ping blinks on the war line where Red was last seen, and the
   capsule’s Heat meter shakes when he is in the same district. New pages: Lie low (hide the crew for two days), Disguises
   (dress each crew member for the street), and Close call (Red walks past your hiding place). */
const HT42 = 74;
comp(42, 'bg', b => before('bg', 42)(b) + (HT42 > 70 ? '<i class="hb42" data-nocheck></i>' : ''));
comp(42, 'top', (s, ttl, sub) => before('top', 42)(s, ttl, sub).replace(/(<div class="war30[^>]*>)/, `$1<i class="rp42" ${go('herotrack')} data-nocheck><u></u>${SP('t-redbig', 14, '', 0)}</i>`).replace('<b>KANTO NEWS</b>', `<b>KANTO NEWS</b><b class="rh42" ${go('herotrack')}>RED · PEWTER</b>`));

/* Lie low */
page('lielow', { g: 'Opposition', t: 'Lie low', kind: 'll42', from: 42 });
const HD42 = [['The Cellar', 'B1 · your HQ', '−8 Heat', 'Safe, but no jobs from home', 'g-storage-key', 1], ['Celadon Mansion roof', 'A friend of Rosa’s', '−5 Heat', 'Jobs in Celadon only', 'g-secret-key', 0], ['Silph Co. 7F', 'A bought guard', '−10 Heat', 'Costs ₽1,500 a night', 'g-card-key', 0], ['Pokémon Tower', 'Lavender · nobody goes up', '−6 Heat', 'Crew Morale −5 (ghosts)', 'g-soothe-bell', 0]];
comp(42, 'k:ll42', s => `<div class="scr nv k-ll42">${C('bg', 'night')}${C('top', s, 'Lie low', 'Two days · Red is close')}
  ${C('pn', 'hl42', 'Where do we hide?', map(HD42, ([n, w, h, c, k, on], i) => `<button class="hr42${on ? ' on' : ''}" ${st(i, 90)}>${spr(k, 2, '')}<span><b>${n}</b><em>${w}</em></span><span class="fx"><i>${h}</i><small>${c}</small></span></button>`), 'panel')}
  <div class="cd42" ${mm('card')}><small>Two days in the Cellar</small><b>HEAT 22% → 14%</b><span class="dd">${map(['Day 19', 'Day 20'], (d, i) => `<i style="--d:${i * 200}ms"><u>${d}</u><em>${i ? 'Red leaves Celadon' : 'Rain all day'}</em></i>`)}</span><em class="w">Jobs stop. Wages still go out.</em></div>
  ${C('foot', 'Rosa', '“Two quiet days. Red gets bored, the police get bored, we come back.”', [['Not yet', 'herotrack'], ['Lie low', 'rest']])}${C('tabs', s)}${C('keys', [['↑↓', 'place'], ['Enter', 'hide'], ['Esc', 'not yet']])}</div>`);

/* Disguises */
page('disguise', { g: 'Crew', t: 'Disguises', kind: 'dg42', from: 42 });
const DG42 = [['c-rook', 'Rook', 'Hiker', 'Stealth +2 on routes'], ['c-mina', 'Mina', 'Scientist', 'Gets into Silph'], ['c-gus', 'Gus', 'Clown', 'Crowds love him · Heat −1'], ['c-rosa', 'Rosa', 'Lady', 'Gets into the Mansion']];
comp(42, 'k:dg42', s => `<div class="scr nv k-dg42">${C('bg', 'hq')}${C('top', s, 'Disguises', 'Dressing room · 4 of 6 dressed')}
  <section class="dr42" ${mm('panel')}>${map(DG42, ([k, n, o, b], i) => `<button class="dm42${i === 0 ? ' on' : ''}" style="--d:${i * 110}ms"><span class="mir" data-nocheck>${SP(k, 120, '', 0)}<i class="cur"></i></span><b>${n}</b><em>as a ${o}</em><small>${b}</small></button>`)}</section>
  ${C('foot', 'Gus', '“A clown? Boss. Boss, no. …Okay, the shoes are good.”', [['Back', 'roster'], ['Dress the rest', 'uniform']])}${C('tabs', s)}${C('keys', [['←→', 'crew'], ['↑↓', 'outfit'], ['Enter', 'wear']])}</div>`);

/* Close call */
page('closecall', { g: 'Opposition', t: 'Close call', kind: 'cc42', from: 42 });
comp(42, 'k:cc42', s => `<div class="scr nv k-cc42">${C('bg', 'street')}<i class="dk42" data-nocheck></i>
  <div class="al42" data-nocheck><i class="wall"></i><span class="crates">${rep(3, i => `<i style="--i:${i}"></i>`)}</span><span class="hid">${map(['c-gus', 't-natebig'], k => SP(k, 90, '', 0))}</span><span class="red">${SP('t-redbig', 150, '', 0)}<i class="cone"></i><u>?</u></span></div>
  <div class="br42" ${mm('card')}><small>Hold your breath</small><span><i></i></span><em>Red is 3 steps away</em></div>
  ${C('foot', 'Gus', '“…don’t… move…”', [['Run for it', 'botched'], ['Stay still', 'recap']])}${C('keys', [['Hold Space', 'stay still'], ['Esc', 'run']])}</div>`);

/* ===== pass 43 ===== */
/* Pass 43 · Climbing the Ranks. The Boss has a level now, like a Pokémon. Every page’s title chip carries a thin EXP
   bar that fills as the run goes well, and the Nova emblem wears a Boss level badge. New pages: Boss level up (the
   classic stats window, with what each point unlocks), the Boss skill tree (Fear, Greed and Charm), and Promotion
   night (a crew member steps up in front of everyone). */
const BLV43 = 23, BXP43 = 62;
comp(43, 'top', (s, ttl, sub) => before('top', 43)(s, ttl, sub).replace(/(<b class="nb2-t[^"]*"[^>]*>)/, `$1<u class="xp43" data-nocheck><i style="width:${BXP43}%"></i></u>`).replace(/(<span class="nb-sig[^>]*>N)/, `$1<i class="lv43" ${go('levelup')}>${BLV43}</i>`));

/* Boss level up */
page('levelup', { g: 'Crew', t: 'Boss level up', kind: 'lu43', from: 43 });
const LU43 = [['Nerve', 14, 2], ['Wits', 11, 1], ['Charm', 9, 0], ['Brawn', 12, 1], ['Presence', 16, 3]];
comp(43, 'k:lu43', s => `<div class="scr nv k-lu43">${C('bg', 'hq')}<i class="sb43" data-nocheck></i>${C('top', s, 'Level up', 'Boss Lv 23 → 24')}
  <div class="bn43" data-nocheck>${SP('t-natebig', 230, '', 0)}<i class="ring"></i></div>
  <div class="lv43w" ${mm('card')}><b class="h">NATE grew to Lv. 24!</b>${map(LU43, ([n, v, d], i) => `<div class="sr43" style="--d:${i * 120}ms"><b>${n}</b><i>${v}</i><em class="${d ? 'up' : ''}">${d ? '+' + d : '—'}</em></div>`)}<p class="ul43">Unlocked: <b>a 4th Boss order each day</b></p></div>
  ${C('foot', 'Rosa', '“Level 24. The crew stands up a little straighter when you walk in.”', [['Skill tree', 'skills'], ['Continue', 'hq']])}${C('keys', [['Enter', 'continue'], ['S', 'skill tree']])}</div>`);

/* the Boss skill tree */
page('skills', { g: 'Crew', t: 'Boss skill tree', kind: 'sk43', from: 43 });
const BR43 = [['Fear', '#e0294a', [['Glare', 1], ['Make an example', 1], ['Nobody talks', 1], ['Reign of terror', 0]]], ['Greed', '#e8b23a', [['Skim', 1], ['Second books', 1], ['Golden handshake', 0], ['Own the Game Corner', 0]]], ['Charm', '#5ab4ff', [['Smooth talker', 1], ['Friends in Silph', 0], ['Press darling', 0], ['Mayor’s ear', 0]]]];
comp(43, 'k:sk43', s => `<div class="scr nv k-sk43">${C('bg', 'night')}${C('top', s, 'Skill tree', '2 points to spend')}
  <section class="st43" ${mm('panel')}>${map(BR43, ([n, c, nodes], b) => `<div class="br43" style="--c:${c};--b:${b}"><b class="bh">${n}</b>${map(nodes, ([t, on], i) => `<i class="nd43${on ? ' on' : ''}${b === 1 && i === 2 ? ' sel' : ''}" style="--d:${(b * 4 + i) * 70}ms"><u><span>${i + 1}</span></u><em>${t}</em></i>`)}</div>`)}</section>
  ${C('pn', 'sd43', 'Golden handshake', `<p class="sd43t">Bribes cost 25% less, and every official you bribe stays bought for a week.</p>${map([['Needs', 'Second books'], ['Cost', '1 point'], ['Path', 'Greed 3 of 4']], ([a, b], i) => `<div class="row40" ${st(i, 80)}><b>${a}</b><i>${b}</i></div>`)}`, 'det')}
  ${C('foot', 'Mina', '“Greed it is. Money opens more doors than fear does.”', [['Back', 'levelup'], ['Learn it', 'hq']])}${C('tabs', s)}${C('keys', [['←→', 'branch'], ['↑↓', 'skill'], ['Enter', 'learn']])}</div>`);

/* Promotion night */
page('promo', { g: 'Crew', t: 'Promotion night', kind: 'pm43', from: 43 });
comp(43, 'k:pm43', s => `<div class="scr nv k-pm43">${C('bg', 'night')}<i class="sp43" data-nocheck></i>
  <div class="stg43" data-nocheck><span class="crowd">${map(['c-gus', 'c-gruntb', 'c-mina', 'c-rook'], (k, i) => `<i style="--i:${i}">${SP(k, 80, '', 0)}</i>`)}</span><span class="hero">${SP('c-dale', 150, '', 0)}<i class="medal"></i></span><span class="boss">${SP('t-natebig', 150, '', 0)}</span><span class="cnf">${rep(14, i => `<i style="--x:${(i * 67) % 100}%;--d:${(i % 7) * .25}s;--c:${['#ffd75a', '#e0294a', '#fff', '#5ab4ff'][i % 4]}"></i>`)}</span></div>
  <div class="rk43" ${mm('card')}><small>Promotion</small><b>DALE</b><span><i>Sergeant</i><u>▶</u><i class="n">Lieutenant</i></span><em>Can now lead a squad of 3 · wage ₽240 a week</em></div>
  ${C('foot', 'Dale', '“Lieutenant. My mum’s going to think I got a real job.”', [['Back', 'pyramid'], ['Applause', 'roster']])}${C('keys', [['Enter', 'applause']])}</div>`);

/* ===== pass 44 ===== */
/* Pass 44 · Gym Rush. Kanto’s eight Gyms become part of the empire. The war line on every page now opens with a gym
   case: eight gym marks, the ones Nova controls lit and spinning, the next target pulsing. New pages: the Gym case
   (all eight Gyms and who holds them), Gym takeover (Celadon Gym, floor plan and the leader’s weak spot), and
   Erika’s choice (the leader decides: step aside, take money, or fight). */
const GM44 = [['bd-rock', 'Pewter', 'Brock', 'nova'], ['bd-water', 'Cerulean', 'Misty', 'rocket'], ['bd-electric', 'Vermilion', 'Lt. Surge', 'nova'], ['bd-grass', 'Celadon', 'Erika', 'next'], ['bd-poison', 'Fuchsia', 'Koga', 'free'], ['bd-psychic', 'Saffron', 'Sabrina', 'rocket'], ['bd-fire', 'Cinnabar', 'Blaine', 'free'], ['bd-ground', 'Viridian', 'Giovanni', 'rocket']];
comp(44, 'top', (s, ttl, sub) => before('top', 44)(s, ttl, sub).replace(/(<div class="war30[^>]*>)(<i class="rp42[^]*?<\/i>)?<b>/, (m, a, p) => `${a}${p || ''}<u class="gc44" ${go('gymcase')}>${map(GM44, ([k, , , o], i) => `<i class="g-${o}" style="--d:${i * 60}ms">${spr(k, .4, '')}</i>`)}</u><b>`));

/* the Gym case */
page('gymcase', { g: 'Empire', t: 'Gym case', kind: 'gy44', from: 44 });
comp(44, 'k:gy44', s => `<div class="scr nv k-gy44">${C('bg', 'night')}${C('top', s, 'Gym case', '2 of 8 Gyms are Nova’s')}
  <section class="gy44" ${mm('panel')}><i class="lid" data-nocheck></i>${map(GM44, ([k, t, l, o], i) => `<button class="gs44 g-${o}${o === 'next' ? ' on' : ''}" style="--d:${i * 80}ms"><span class="slot">${spr(k, 2, '')}</span><b>${t}</b><em>${l}</em><i>${({ nova: 'Nova', rocket: 'Rocket', next: 'Next', free: 'Free' })[o]}</i></button>`)}</section>
  ${C('foot', 'Mina', '“Two Gyms pay us. Celadon is next, and Erika hates Rocket as much as we do.”', [['Back', 'ledger'], ['Plan Celadon', 'gymplan']])}${C('keys', [['←→↑↓', 'Gym'], ['Enter', 'plan'], ['Esc', 'back']])}</div>`);

/* Gym takeover */
page('gymplan', { g: 'Jobs', t: 'Gym takeover', kind: 'gp44', from: 44 });
comp(44, 'k:gp44', s => `<div class="scr nv k-gp44">${C('bg', 'night')}${C('top', s, 'Gym takeover', 'Celadon Gym · Grass')}
  <section class="gp44" ${mm('panel')}><i class="hedge" data-nocheck></i>${map([[90, 230, 't-acetrainer-m'], [260, 150, 't-applicant'], [430, 230, 't-acetrainer-m']], ([x, y, k], i) => `<span class="gt44" style="left:${x}px;top:${y}px;--i:${i}">${SP(k, 52, '', 0)}<i class="vw"></i></span>`)}<span class="ld44" style="left:262px;top:20px">${SP('t-erika', 70, '', 0)}<u>Erika</u></span><svg class="pt44" viewBox="0 0 540 328" data-nocheck><path d="M270,320 L270,280 L180,280 L180,200 L350,200 L350,120 L300,110"/></svg><i class="me44" data-nocheck>${SP('t-natebig', 46, '', 0)}</i></section>
  ${C('pn', 'gw44', 'Weak spots', map([['Her trainers', 'Grass types · Houndoom wins', 'ok'], ['The perfume shop', 'Erika’s family business · leverage', 'mid'], ['Rocket', 'Erika hates them · common enemy', 'ok'], ['Tangela path', 'Cut through the hedges · 2 trainers skipped', 'ok']], ([a, b, c], i) => `<div class="o29 w-${c}" ${st(i, 90)}><b>${a}</b><em>${b}</em></div>`), 'det')}
  ${C('foot', 'Rook', '“Cut through the hedges, skip two trainers, and you’re at her desk.”', [['Back', 'gymcase'], ['Walk in', 'gymtalk']])}${C('tabs', s)}${C('keys', [['↑↓', 'weak spot'], ['Enter', 'walk in']])}</div>`);

/* Erika's choice */
page('gymtalk', { g: 'Trainers', t: 'Erika’s choice', kind: 'scene', mode: 'talk', bg: 'gold', from: 44, left: { s: 't-natebig', n: 'Nate', r: 'Team Nova Boss' }, right: { s: 't-erika', n: 'Erika', r: 'Celadon Gym Leader' }, speaker: 'Erika', line: 'You are not Rocket. I can smell it. Rocket burned my greenhouse. What do you want with my Gym?', choices: [['1', 'Step aside, keep your title', 'gymcase'], ['2', 'Take ₽5,000 a month', 'gymcase'], ['3', 'Battle for the Gym', 'vs']] });
NAMEK.Erika = 't-erika';

/* ===== pass 45 ===== */
/* Pass 45 · Fifth Cut. The fifth synthesis folds 41 to 44 into what was already there instead of adding more doors:
   only one thing on screen may pulse at a time (the most urgent, which right now is Red’s ping), the Hero heartbeat
   stays off the calm pages (Settings, Menu, Guide), and three old pages are rebuilt to carry the new systems: the
   Boss card shows level, EXP and gym marks, Rotom’s X-ray labels the new parts of the screen, and the Start menu only
   lists what exists. */

/* the Boss card, rebuilt */
PR.pages.tcard.up = Object.assign(PR.pages.tcard.up || {}, { 45: { kind: 'bc45' } });
comp(45, 'k:bc45', s => `<div class="scr nv k-bc25 k-bc45">${C('bg', 'roof')}${C('top', s, 'Boss card', 'Flip with ←→')}
  <div class="bcw25"><div class="bc25" ${mm('card')}><div class="bh"><b>BOSS CARD</b><em>ID No. 03142</em></div>
    <div class="bb"><dl>${map([['Name', 'NATE'], ['Level', 'Lv ' + BLV43], ['Money', RUN.funds], ['Chapter', '3 · Fireworks'], ['Time', '14:32'], ['Day', RUN.day]], ([a, b]) => `<dt>${a}</dt><dd>${b}</dd>`)}</dl><span class="pt">${SP('t-natebig', 150, '', 0)}</span></div>
    <div class="xb45"><b>EXP</b><span><i style="width:${BXP43}%"></i></span><em>to Lv ${BLV43 + 1}</em></div>
    <div class="bd"><b>Gym marks</b><span class="gm45">${map(GM44, ([k, , , o], i) => `<i class="g-${o}" style="--d:${i * 70}ms">${spr(k, .75, '')}</i>`)}</span></div></div></div>
  ${C('pn', 'bcb25', 'The back', map([['Skills', 'Glare · Make an example · Skim'], ['Best job', 'Silph Scope · ₽6,400'], ['Hero met', 'Red · 3 times, never caught'], ['Goal', RUN.goal + ' ' + RUN.goalPct + '% · Siege in 3 days']], ([a, b], i) => `<div class="bk25" ${st(i, 70)}><b>${a}</b><em>${b}</em></div>`), 'det')}
  ${C('foot', 'Rosa', '“Two Gyms, level 23, and Red still can’t find you. Not bad, Boss.”', [['Back', 'start'], ['Skill tree', 'skills']])}${C('tabs', s)}${C('keys', [['←→', 'flip'], ['Esc', 'back']])}</div>`);

/* Rotom's X-ray, rebuilt for the new parts */
PR.pages.xray.up = Object.assign(PR.pages.xray.up || {}, { 45: { kind: 'xr45' } });
const XR45 = [[52, 40, 'Boss level', 'Opens Level up', 70, 100], [200, 46, 'EXP bar', 'Fills as the run goes well', 230, 150], [60, 56, 'Gym marks', 'Gold = yours · opens the Gym case', 40, 210], [240, 56, 'Red’s ping', 'Where the Hero was seen', 420, 110], [900, 56, 'Siege chip', 'Days until the siege', 700, 140], [480, 488, 'Rail tabs', 'The train is the page you are on', 560, 330]];
comp(45, 'k:xr45', s => `<div class="scr nv k-xr35"><div class="rp21" data-nocheck>${C('k:hub', PR.pages.hq)}</div><i class="xs35" data-nocheck></i>
  <svg class="xl35" viewBox="0 0 960 540" data-nocheck>${map(XR45, ([x, y, , , lx, ly]) => `<path d="M${x},${y} L${lx + 90},${ly + 20}"/><circle cx="${x}" cy="${y}" r="6"/>`)}</svg>
  ${map(XR45, ([, , n, d, lx, ly], i) => `<div class="xc35" style="left:${lx}px;top:${ly}px;--d:${i * 120}ms"><b>${n}</b><em>${d}</em></div>`)}
  ${C('keys', [['Enter', 'next part'], ['Esc', 'close']])}</div>`);

boot();
</script>
