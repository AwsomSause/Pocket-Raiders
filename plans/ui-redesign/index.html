/* viewer chrome (single dark look on purpose: it frames game screens) */
:root{color-scheme:dark;--vbg:#12141b;--vpanel:#1b1e28;--vfg:#eef0f6;--vmute:#9aa2b8;--vline:#2c3142;--vacc:#ffcb05}
html,body{height:auto}
body{margin:0;background:var(--vbg);color:var(--vfg);font:14px/1.5 'M PLUS Rounded 1c',system-ui,sans-serif}
#app{max-width:1200px;margin:0 auto;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
.vw-top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.vw-top h1{font:400 26px/1 'Jersey 15',sans-serif;letter-spacing:.04em;margin:0;color:var(--vacc)}
.vw-passbar{display:flex;align-items:center;gap:8px;flex:1 1 320px;min-width:0}
.vw-passbar b{font:400 20px/1 'Jersey 15',sans-serif;white-space:nowrap}
.vw-passbar span{color:var(--vmute);min-width:0;overflow-wrap:anywhere}
.vw-btn{font:inherit;color:var(--vfg);background:var(--vpanel);border:1px solid var(--vline);border-radius:8px;padding:6px 12px;cursor:pointer}
.vw-btn:hover,.vw-chip:hover{border-color:var(--vacc)}
.vw-btn:focus-visible,.vw-chip:focus-visible{outline:2px solid var(--vacc);outline-offset:2px}
#vw-range{flex:1 1 160px;min-width:120px;accent-color:var(--vacc)}
#vw-wrap{position:relative;width:100%;overflow:hidden;border-radius:10px;background:#000;box-shadow:0 0 0 1px var(--vline)}
#stage{position:absolute;left:0;top:0;width:960px;height:540px;transform-origin:0 0;overflow:hidden;view-transition-name:stage;contain:layout paint}
.vw-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;color:var(--vmute)}
#vw-cur{flex:1 1 200px;color:var(--vfg)}
#vw-screens{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.vw-g{font:400 16px/1 'Jersey 15',sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--vmute);margin:0 2px 0 8px}
.vw-g:first-child{margin-left:0}
.vw-chip{font:inherit;font-size:13px;color:var(--vfg);background:var(--vpanel);border:1px solid var(--vline);border-radius:999px;padding:3px 10px;cursor:pointer}
.vw-chip.on{background:var(--vacc);color:#16181f;border-color:var(--vacc);font-weight:800}
.vw-chip i{font-style:normal;font-size:10px;text-transform:uppercase;letter-spacing:.06em;margin-left:6px;padding:0 5px;border-radius:6px;background:#e3350d;color:#fff}
#vw-review{background:var(--vpanel);border:1px solid var(--vline);border-radius:10px;padding:14px 18px}
#vw-review h2{font:400 24px/1.1 'Jersey 15',sans-serif;margin:0 0 6px;color:var(--vacc);letter-spacing:.03em}
#vw-review p{margin:0 0 8px;max-width:75ch}
.vw-big{font-size:15px}
.vw-new{color:var(--vmute)}
#vw-review dl{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:6px 16px;margin:8px 0 0}
#vw-review dt{color:var(--vmute)}
#vw-review dd{margin:0;max-width:75ch}
@media (max-width:640px){#vw-review dl{grid-template-columns:minmax(0,1fr)}#vw-review dd{margin-bottom:6px}}
body.bare #app{padding:0;max-width:none;display:block}
body.bare .vw-ui{display:none}
body.bare #vw-wrap{width:960px;height:540px;border-radius:0;box-shadow:none}
body.still #stage *,body.still #stage *::before,body.still #stage *::after{animation-delay:-60s!important;animation-play-state:paused!important;transition:none!important}
.px{image-rendering:pixelated;image-rendering:crisp-edges}
#stage,#stage *,#stage *::before,#stage *::after{box-sizing:border-box}
#stage img{max-width:none;display:block;user-select:none}
#stage [data-go]{cursor:pointer}
::view-transition-group(*){animation-duration:.42s;animation-timing-function:cubic-bezier(.3,1.3,.5,1)}
::view-transition-old(root),::view-transition-new(root){animation:none}
@media (prefers-reduced-motion:reduce){#stage *,#stage *::before,#stage *::after{animation:none!important;transition:none!important}}
</style>
<style data-pass="1">
#stage{
/* Pass 1 · Clean Slate. Layout idea: bright paper, white cards with a navy outline, the three logo colours. */
&{--ink:#1d2a4d;--red:#e3350d;--yel:#ffcb05;--blu:#2a75bb;--paper:#eef3fa;--card:#fff;--mute:#5d6a8c;--ok:#35b34a;--mid:#f0a800;--low:#e3350d;
  --fd:'Jersey 15','Pixelify Sans',sans-serif;--fb:'M PLUS Rounded 1c',system-ui,sans-serif;
  font:500 15px/1.35 var(--fb);color:var(--ink);background:var(--paper)}
.scr{position:absolute;inset:0;background:var(--paper) radial-gradient(circle,#d3dcec 1.5px,transparent 2px) 0 0/18px 18px}
b{font-weight:800}
p{margin:0}
small{font-size:12px;color:var(--mute);font-weight:500}
.hdr{position:absolute;left:0;top:0;right:0;height:50px;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:4px solid var(--ink);z-index:5}
.hdr-t{font:400 32px/1 var(--fd);letter-spacing:.04em}
.hdr-p{display:flex;gap:8px}
.hdr-p b{background:#fff;color:var(--ink);border-radius:999px;padding:3px 12px;font-size:13px}
.keys{position:absolute;left:0;right:0;bottom:0;height:30px;background:var(--ink);color:#fff;display:flex;gap:18px;align-items:center;justify-content:flex-end;padding:0 20px;font-size:13px;z-index:5}
.keys kbd{font:inherit;font-weight:800;background:#fff;color:var(--ink);border-radius:5px;padding:0 6px;margin-right:6px}
.pn{background:var(--card);border:2px solid var(--ink);border-radius:12px;box-shadow:0 4px 0 var(--ink)}
.btn{display:flex;flex-direction:column;justify-content:center;background:var(--card);border:2px solid var(--ink);border-radius:10px;padding:6px 14px;box-shadow:0 3px 0 var(--ink);min-height:40px;font-size:16px}
.btn.on{background:var(--yel)}
.btn.on>b::before{content:'▶';color:var(--red);margin-right:8px;font-size:12px}
.btn.sm{min-height:34px;padding:4px 10px;font-size:14px;align-items:center}
.hp{display:inline-block;height:12px;flex:1;background:#d8deea;border:2px solid var(--ink);border-radius:6px;overflow:hidden}
.hp i{display:block;height:100%;background:var(--ok)}
.hp.mid i{background:var(--mid)}
.hp.low i{background:var(--low)}
.ty{display:inline-block;background:var(--t);color:#fff;border-radius:999px;padding:1px 10px;font-size:12px;font-weight:800;text-shadow:0 1px 0 rgba(0,0,0,.35)}
.tb{position:absolute;left:16px;right:16px;bottom:42px;min-height:76px;background:#fff;border:2px solid var(--ink);border-radius:12px;box-shadow:0 4px 0 var(--ink);padding:14px 18px;font-size:16px;z-index:4}
.tb-w{position:absolute;top:-14px;left:16px;background:var(--blu);color:#fff;border:2px solid var(--ink);border-radius:8px;padding:0 10px;font-size:13px}
.lv{font:400 18px/1 var(--fd);color:var(--mute)}
.num{font:400 18px/1 var(--fd)}
.gd{font-style:normal;color:var(--blu);font-size:13px}
.ar-bg{position:absolute;inset:0;width:960px;height:540px}
.ar-bg.dim{filter:brightness(.55) saturate(.8)}
.tabs{display:flex;gap:6px}
.tab{border:2px solid var(--ink);border-bottom:0;border-radius:8px 8px 0 0;background:#dfe6f3;padding:4px 12px;font-size:13px;font-weight:800}
.tab.on{background:var(--yel)}
.li{display:flex;align-items:center;gap:10px;padding:6px 12px;border-radius:8px;font-size:15px}
.li.on{background:var(--yel)}
.li .num,.li .val{margin-left:auto}
.row{display:flex;gap:8px}
.balls{display:inline-flex;gap:2px}
.balls .ko{filter:grayscale(1) brightness(.6)}
.balls .none{opacity:.25}
.st{font-style:normal;font-size:11px;font-weight:800;color:#fff;border-radius:6px;padding:1px 7px;background:var(--mute)}
.st.PSN{background:#9141cb}

const NOTES={"1": {"name": "Clean Slate", "big": "A fresh start. Twelve core screens redrawn bright and simple in the three Pokémon logo colours (red, yellow, blue), replacing the dark navy look.", "pages": ["Title", "Hub Town", "Stage Map", "Battle", "Battle · Moves", "Event", "Party", "Summary", "Bag", "Poké Mart", "Pause Menu", "Settings"], "q1": "Not yet. It is tidy but flat: square cards on dotted paper, small sprites, nothing moves. Next pass needs energy and scale.", "q2": "Against the game today: light instead of dark, far bigger words, one selection colour, and every button says what it does.", "q3": "Yes. The battle screen sends Bag and Pokémon to the general pages, which hides the fight. They need their own battle pages.", "q4": "The Pause Menu is a plain list and Settings is one long tab row. Both work, neither is special yet.", "q5": "Partly. The logo colours and Poké Ball markers say Pokémon, but the shapes could be any app."}, "2": {"name": "Slant & Scale", "big": "Everything leans forward. A red slash carries every title, buttons and plates are slanted, sprites are about twice as big, and the battle gets its own Bag and Switch pages.", "pages": ["Battle · Bag", "Battle · Switch"], "q1": "Better: the slash and the huge Charizard on the title grab the eye. But it is still two flat colours with no life from the Pokémon themselves.", "q2": "Pass 1 was square cards on paper. Now panels lean, the lead Pokémon gets a big card, the map is a real road with stop numbers, and Fight is the biggest button in battle.", "q3": "Done here: Bag and Switch are battle pages now, so the fight stays on screen behind them. Move details still crowd the move row and should get more room.", "q4": "The Pause Menu moved onto the red slash with the trainer standing beside it. Settings swapped the tab row for a category list on the left, which leaves room for more categories.", "q5": "More than before. Slanted bars and a road map read as modern Pokémon. What is missing is type colour, the thing every Pokémon screen is built on."}, "3": {"name": "Type Colour", "big": "Colour now means something. Moves, party cards, HP plates and the Summary are painted in the Pokémon's own type with type medals, and every move shows how well it will hit.", "pages": ["Battle · Move Info", "Type Chart"], "q1": "Yes: move cards are big blocks of type colour with a ghosted medal, and the Summary band is a fire-to-sky gradient. It still sits perfectly still, which is the next thing to fix.", "q2": "Pass 2 used red, yellow and white for everything. Now a glance tells you type, matchup (▲ Super effective, ▼ Weak hit) and event risk (orange risky, green certain, blue costs money).", "q3": "Two added. Move Info takes the long move text and the damage estimate off the move row. The Type Chart gets its own page, opened with T from Party or Summary.", "q4": "No change to their layout this pass. Settings needs a colour-blind option now that colour carries meaning (planned with the accessibility pass); medals and arrows already repeat what the colour says.", "q5": "Much more. Type colours and type medals are the most Pokémon thing on any screen."}, "4": {"name": "In Motion", "big": "Nothing sits still any more. The cursor is a hopping Poké Ball, the title band runs, sprites breathe over ground shadows, cards deal in one by one, pages slide and morph, and entering a battle is a Poké Ball that snaps shut and splits open.", "pages": ["Battle Start", "Move Hit", "Motion Sheet"], "q1": "Yes in play: press Play tour or click around. The ball iris and the hit burst are the showpieces. On a still picture it reads through the ball cursor, ground shadows and the timeline strips.", "q2": "Pass 3 was a set of posters. Now every page has an entrance, every choice has a hopping ball and a breathing outline, HP drains with a ghost bar, and the map road marches toward the next stops.", "q3": "Two battle moments got their own pages so the animation can be designed step by step: Battle Start and Move Hit, each with a timeline. The Motion Sheet lists every animation and how long it takes.", "q4": "Menus slide in from the slash with the cards dealing in. Settings needs an Animations page where each effect can be turned down, and a Reduced motion switch that these mockups already obey.", "q5": "Yes. The ball opening on a wild Pokémon and the flash-shake-number of a hit are straight from the series."}, "5": {"name": "Menu & Settings Hub", "big": "The Pause Menu is now a Poké Ball wheel with a live glance panel, Settings became a home page plus one page per category with real switches, sliders and a preview, and every area of the game has its own colour and badge in the title band.", "pages": ["Settings · Display", "Settings · Audio", "Settings · Controls", "Settings · Accessibility", "Save Slots"], "q1": "The wheel is the most eye-catching menu so far: eight badges orbit a Poké Ball with the trainer inside. Settings pages are calm on purpose, but they finally look like part of the game.", "q2": "Pass 4 still had a plain list for the menu and one cramped Settings list. Now the menu shows your party before you open anything, each setting has a proper control, and the title band changes colour by area with a trail showing where you are (Menu › Settings › Display).", "q3": "Five added. Settings alone went from one page to a home page and four category pages (the other categories follow the same pattern), plus Save Slots.", "q4": "This pass is the answer: Esc opens the wheel from anywhere, Settings is one stop on it, and Q and E flip between Settings categories without going back.", "q5": "Yes. The menu is literally a Poké Ball, and the Save Slots read like a trainer's journal."}, "6": {"name": "Battle Stage", "big": "The battle is filmed like a movie. Dark bars at the top and bottom hold all the battle text, the camera sits right behind your Pokémon, and every menu now floats over the world instead of a blank page.", "pages": ["Send Out", "Trainer Intro", "Ace Announcement"], "q1": "Your Pokémon is drawn five times bigger from behind, the commands are round buttons that pop out of the bottom bar, and the lead of your party stands under a spotlight.", "q2": "Pass 5 still had small boxes floating over the arena. Now nothing floats: names, HP and text sit in two film bars, so the arena is clear and the Pokémon are huge.", "q3": "Yes, three. Throwing the ball, the trainer's VS intro and the ace reveal each get their own page, so the main battle screen never has to squeeze them in.", "q4": "The pause menu dims the world and puts a spotlight on the wheel. Settings and the other pages keep their layout but now show the world faintly behind them.", "q5": "Yes. The behind-the-back camera, the VS split and the Poké Ball throw are the classic Pokémon battle moments, just bigger."}, "7": {"name": "Power Surge", "big": "Mega Evolution, Terastallizing, Dynamax and Z-Moves stop hiding inside the move list. They get a Power button, a picker page, a full-screen scene each, and a rainbow energy line that marks anything charged.", "pages": ["Battle · Power Up", "Mega Evolution", "Terastallize", "Dynamax", "Z-Move", "Battle · Powered Up", "Settings · Animations"], "q1": "Each power-up fills the whole screen with the game's own effect art: the Mega spiral, Tera crystals, the red Dynamax storm and the Z-Move title. The title screen now stars Mega Charizard X.", "q2": "Pass 6 had no place for power-ups at all. Now the battle bar has a glowing Power button, the Fight page shows what is armed, and the bars carry Mega, Tera, Max and Z tags.", "q3": "Yes, seven. One picker, four scenes, one page for the powered-up battle and a new Animations settings page.", "q4": "The pause menu and the Party page show which powers are ready, used or locked. Settings gets an Animations page where the scenes can be set to Full, Short or Off.", "q5": "Yes. These are the four big Pokémon battle gimmicks, shown the way the main games show them, with the game's own sprites and effects."}, "8": {"name": "Victory Lap", "big": "Winning now feels like winning. The dark battle bar grows to fill the screen and walks you through seven clear steps: the win, team EXP, level up, a new move, evolution, a catch and a reward pick.", "pages": ["Victory", "Team EXP", "Level Up", "New Move", "Evolution", "Catch", "Pick a Reward"], "q1": "A giant Victory banner with rays and an MVP badge, EXP bars that fill on six cards at once, a gold level stamp, and reward cards that deal in like a hand of cards.", "q2": "Before this pass a battle simply ended. Now EXP runs along the edge of the battle bar the whole time, the prize is shown during the fight, and every reward has its own screen.", "q3": "Yes, seven new pages. One job per page, so the level-up numbers, the move swap and the reward choice never fight for space.", "q4": "The pause menu shows the run score, stars and win streak. Header pills gain coin, badge and ball icons. The Animations settings from pass 7 also control these scenes.", "q5": "Yes. EXP bars, level-up stat lists, 'wants to learn a move', evolution with B to stop, and 'Gotcha!' are the heart of every Pokémon game."}, "9": {"name": "Story Time", "big": "An event now plays like a small scene in four beats: talk, choose, result, reward. The place fills the screen, whoever speaks gets a face, and the text box waits for you every time.", "pages": ["Event · Choice", "Event · Result", "Event Stage", "Event · Reward", "Run Journal"], "q1": "Full-screen place art with the hour and weather, a tall speaker with a portrait in the text box, and choices as three big cards that deal in with a coloured risk label.", "q2": "Pass 8 still showed the speech and all the choices crammed on one screen. Now the text stays alone until you press Enter, the choices get a clean page, and rewards only appear after the text is gone, as you asked.", "q3": "Yes, five. Choice, result and reward pages, an Event Stage page for battles that happen inside an event, and a Run Journal that lists every stop of this run.", "q4": "The pause menu and the title show the next stop and open the Journal with J. The map's Story button opens it too. Speaker portraits also appear in the shop and in the battle bar.", "q5": "Yes. A character talks, you answer, something happens. It reads like the story scenes of the main games, and the Journal works like a trainer's diary."}, "10": {"name": "World Tour", "big": "The run becomes a trip around the world. Every region gets its own two colours and a passport stamp, the stage map is drawn on the region's real town map, and the region's colours ride on the battle bars.", "pages": ["World Tour", "Region Intro", "Badge Case", "Settings · Gameplay"], "q1": "The title screen now sits on the Kanto town map with a tape of region colours behind the team. Entering a region gets a full-screen intro with a giant name and a stamp that thumps down.", "q2": "Before, a region was just a word in the header. Now it has colours, a stamp and a map you can recognise at a glance, and each Pokémon shows where it was met.", "q3": "Yes, four. World Tour shows all nine regions and what gets harder in each, Region Intro asks about regional forms, Badge Case shows the gyms and the League, and Gameplay settings holds stage length.", "q4": "The pause menu gets the region stamp and a stage progress line. Settings gets a Gameplay page with stage length, regional forms, Blessings, Ultra Beasts and Evil Mode.", "q5": "Yes. Town maps, gym badges in a case, the Elite Four and a new region with new rules are exactly how a Pokémon journey is measured."}, "11": {"name": "Town Square", "big": "Places become places. The hub is a street built from the game's own buildings, your team walks beside you out of their balls, and the shop has real shelves and a counter.", "pages": ["Hub Town (street)", "Title (in town)", "Poké Mart (shelves)", "Poké Mart · Check Out", "Pokémon Center", "Event Hall", "Achievement Hall"], "q1": "The title screen is now the town itself: a blue sky, the street, and Red leading the whole team along the road. In the hub, the building you are standing at glows and a big sign pops up over it.", "q2": "The hub used to be a row of seven tiles under a line-up. Now you walk a street and each door is a building. In battle the rest of the team waits on the sideline with little HP bars, and the party stage and pause menu show the place you are in.", "q3": "Yes, four. Check Out is its own page so the shelf stays clean, the Pokémon Center has its own healing page, and the Event Hall and Achievement Hall take the news and rewards off the hub.", "q4": "Settings is the last door on the street and still opens the Settings hub. The pause menu's ball is now a window onto where you are, with your partner walking next to you.", "q5": "More than any pass so far: Pokémon Center, Poké Mart, the route gate, a clerk behind the counter, the healing machine lighting up six balls one by one, and Pokémon following their trainer."}, "12": {"name": "Collector's Cards", "big": "Every Pokémon is now a card you hold. The party is a hand of six shiny cards, the summary is one big card with a page for each tab, and the same card shows up in the Reserve, the pause menu and on the battle sideline.", "pages": ["Party (hand of cards)", "Summary · Stats", "Summary · Moves", "Summary · Bond", "Pokédex", "Pokédex Entry", "Reserve", "Bag (pockets)", "Bag · Use On"], "q1": "Cards have a type-coloured frame, a foil shine that sweeps across the picture and a gold level pill. They deal onto the table one after another. The stats page draws a six-point radar that grows out from the middle.", "q2": "The party was a big stage plus five rows. Now all six are equal cards side by side, so you can compare them at a glance. The summary used to cram seven tabs on one page; now there are three pages with room to breathe.", "q3": "Yes, six: Moves and Bond pages for the summary, a Pokédex and its entry page, the Reserve, and a Use On page so picking who gets a potion never covers the bag.", "q4": "The pause menu's party panel is now six small cards, and the wheel opens the Pokédex. Nothing new is needed in Settings; card shine follows the Animations setting from pass 7.", "q5": "Yes. Collecting cards is as Pokémon as it gets, and the Pokédex grid with grey unseen slots and Poké Ball marks is straight from the games."}, "13": {"name": "Trainers", "big": "People get faces and colours. Each trainer has a colour that fills their banner, their Trainer Card and their side of the battle bars. Five new pages cover who you play as, your rivals, the next Gym Leader and the League.", "pages": ["Trainer Select", "Trainer Card", "Rival Board", "Gym Leader File", "Pokémon League"], "q1": "The title screen now has Red standing large in front of the town with a name plate. Trainer Select is a row of tall coloured banners, and the Trainer Card is a real card with a photo, a badge strip and a foil shine.", "q2": "Before, trainers were only a name on a bar. Now Blue's battle bar is blue and yours is red, so you can tell the sides apart before reading a word, and rivals have a board that shows the score between you.", "q3": "Yes, five. Trainer Select and the Trainer Card leave the hub and menu clean, the Rival Board holds all four rivals, the Gym Leader File shows what a boss brings before you commit, and the League is a staircase of five rooms.", "q4": "The pause menu swaps its row of pills for a one-line Trainer Card that opens the full card. No new settings are needed.", "q5": "Yes: a Trainer Card with eight badge slots, a rival who is always one step ahead, and a Gym Leader with a title and an ace are the heart of a Pokémon journey. The trainer is still not drawn on the battlefield itself."}, "14": {"name": "Rotom Phone", "big": "One helper, one device. The pause menu is now a Rotom Phone with eight apps, Rotom gives one short tip wherever you might be stuck, and finding your way gets pages of its own.", "pages": ["Pause Menu · Rotom Phone", "Quick Wheel", "Ask Rotom", "Search", "Controls Overlay", "Notices", "Confirm", "Travel Screen"], "q1": "The phone is a big orange device with Rotom's blinking eyes and a lightning ear, and its apps pop in two by two. Rotom itself floats and tilts on every page it speaks on. Between stops the whole team walks along a scrolling road.", "q2": "The pause menu was a wheel that only held eight links. The phone holds the apps, the time, the next stop, a tip, your hand of cards and your powers in one tidy place. The old wheel stays as a quick pop-up on Tab.", "q3": "Yes, seven. Ask Rotom, Search, a Controls overlay for the page you are on, Notices, a Confirm box, a Travel screen and the Quick Wheel. None of them add anything to the pages you already use.", "q4": "The Menu is the phone. Settings is an app on it, Search can jump straight to one setting, and the Controls overlay points to Settings › Controls for changing keys.", "q5": "Yes, the Rotom Phone comes straight from the newer games. In this game the helper is always called Rotom."}, "15": {"name": "The Journey", "big": "A run now has a clear beginning and a clear end. A route line with the eight gyms on it rides on every screen, and starting a run, picking a starter and a Blessing, losing and winning each get their own pages.", "pages": ["New Run", "Starter Quiz", "Starter Pick", "Blessing", "Run Over", "Run Report", "Hall of Fame"], "q1": "The Hall of Fame puts each team member in its own spotlight with confetti. Blessings are dealt out as three tall cards with the Legendary on them, and Run Over draws the route line up to the stop where you fell.", "q2": "Before, a run just started and the only sign of progress was a 12 of 30 label. Now a thin route line sits under every header, under the battle bar, on the Continue ticket and inside the Rotom Phone, with a red diamond for every Gym.", "q3": "Yes, seven. New Run is four small steps with a step bar on top, so no step is crowded, and Run Over is kept apart from the Run Report so the sad moment and the numbers do not fight.", "q4": "The four run choices on the New Run page (kind of run, stage length, first region, seed) are the same switches as Settings › Gameplay. The phone shows the route line on its home screen.", "q5": "Yes: a quiz from Professor Oak, three starters on Poké Balls, Legendary blessings and a Hall of Fame are all classic moments."}, "16": {"name": "Stage Lights", "big": "Every screen is lit like a stage. In battle the two dark bars are gone: the foe's plate floats top-left, the command console lifts off the bottom, and light beams cross a full arena. Menus now sit over the place you are (the town, or the route) instead of a flat backdrop.", "pages": ["Battle · Info", "Battle · Log", "Battle · Auto", "Shiny Encounter"], "q1": "Yes. Sun rays on the title and hub, a spotlight on the picked party card, a glowing phone in the dark, light beams and a vignette in battle, a star ring for shinies.", "q2": "Pass 15 added the journey line but kept flat bars and a flat backdrop. Here the battle shows far more arena, and every menu gains depth and a sense of place. The gimmick cut-ins also get their dark stage back, so the white titles read properly again.", "q3": "Yes, four. Info and Auto were buttons with nowhere to go: Info now has its own page (weather, field, stat changes, enemy heals left), with the Battle Log one key away, and Auto has its own page for style, speed and when to stop.", "q4": "The Rotom Phone glows over a dimmed world, so the pause reads as a pause. Settings sit over the town like every other out-of-run page.", "q5": "Yes. Foe plate top-left with the arena wide open is the classic battle framing, and the shiny star ring is straight from the series."}, "17": {"name": "Headlines", "big": "Big type leads every screen. The title is rebuilt around a giant logo and a word menu, battle commands are big slanted words instead of small round icons, moves are called out across the screen, the party hand fans out, and every page has its name in giant letters behind it.", "pages": ["Boot", "Loading", "Credits", "Settings · Text", "Settings · Story", "Settings · Save & Data"], "q1": "Yes. The logo is twice the size, FIGHT is the biggest thing in the battle console, and move names slam across the arena when they land.", "q2": "Pass 16 changed light and depth but kept small labels. Here the words carry the design: fewer icons to decode, faster to read at a glance.", "q3": "Yes, six. Text, Story and Save & Data were settings tiles with no page behind them; Boot, Loading and Credits did not exist at all.", "q4": "Settings now has a page behind all nine tiles. Save & Data shows backups, the save check, export and import in one place. The phone's next stop is a headline.", "q5": "Yes. Big slanted command words, loud move call-outs and a loading tip with your team walking are all series habits."}, "18": {"name": "Showdown", "big": "Big fights look big. Trainer battles hang pennants in the trainer's colours and show the foe's team down the side. The next Gym is posted on the title, the phone and the party screen with who is a good pick. Gym Leaders, Legendaries and the Evil Team get their own scenes.", "pages": ["Gym Leader Intro", "Gym Battle", "Legendary Encounter", "Evil Team · Betrayal", "Badge Earned", "Rival Wins"], "q1": "Yes. Pennants, a gold-trimmed boss plate, a glowing Legendary in the dark, a spinning badge in a burst of light.", "q2": "Pass 17 made every screen louder, but a Gym fight still looked like any other. Now the stakes show: what the boss brings, how many heals are left, whether the boss power is used.", "q3": "Yes, six. Each big moment has its own page instead of sharing the normal battle or victory screens. Losing to a rival has a page that says clearly the run goes on.", "q4": "The phone carries a Next Gym poster under the run score and Rotom talks about it. Nothing new is needed in Settings; boss scenes follow the Animations page.", "q5": "Yes. Gym intro, badge ceremony, a Legendary waiting in a cave and a rival who says 'Smell ya later' are the heart of the series."}, "19": {"name": "The Other Side", "big": "Evil Mode joins the redesign. The same big type, cards and word menus, but in Team Nova's black, crimson and gold, so it is clearly the same game seen from the other side. Evil Mode gets its own glowing row on the title, the Boss's shadow looms behind Red there, and the Boss gets a battle screen of his own.", "pages": ["Evil Mode · Title", "Evil Mode · The Hideout", "Evil Mode · Give an Order", "Evil Mode · Region Map", "Evil Mode · The Card", "Evil Mode · Boss Order", "Evil Mode · Job Done", "Evil Mode · A Hero Appears", "Evil Mode · Crew File", "Evil Mode · The Chair", "Evil Mode · Boss Menu", "Evil Mode · Battle"], "q1": "Yes. Lacquer black with crimson seams and gold numbers, a giant N behind the crew, a glass-crack split when the Hero walks in, a PAID IN FULL stamp.", "q2": "Until now the redesign only covered the hero's game. Evil Mode now has the same parts (word menu, panels, cut-ins, key strip) in its own livery, following the approved Dominion mockups for content.", "q3": "Yes, twelve. Giving an order, the odds Card, the Boss order, the result and the Hero interrupt are each their own page, so no screen has to hold a whole day. The Boss also gets his own battle page: the Hero raids the Hideout and you hold the door.", "q4": "Esc opens the Boss Menu: the title's word menu in black, with the empire at a glance beside it. Settings is the same Settings, with a Dominion category.", "q5": "Yes, the villain side of one: grunts with ranks, Persian by the Boss, Rocket as the rival gang, and Red as the trainer you do not want to meet."}, "20": {"name": "Any Screen, Any Player", "big": "Built for fingers as well as keys. The title menu becomes a pad of big buttons, battle commands leave the bottom bar and sit under the right thumb with a Menu button on screen, party cards stand straight so none overlap, and every page gets a full-width button bar. Plus an answer for every screen and player: ultrawide wings, phone layouts, high-contrast, colour-blind, large-text and calm versions.", "pages": ["Screen · Ultrawide", "Screen · Phone, sideways", "Screen · Phone, upright", "Access · High Contrast", "Access · Colour-blind", "Access · Large Text", "Access · Reduced Motion"], "q1": "Less about flash, more about reach: the upright phone battle with a giant FIGHT button and the patterned type wall are the eye-catchers.", "q2": "Passes 1 to 19 only ever drew one 960 by 540 screen for a keyboard. Now the Title and Battle are laid out again around a thumb, every key hint is a button you can tap, and every colour signal has a shape as well.", "q3": "Yes, seven: three for screen shapes, four for accessibility. Each is linked to the setting that switches it on.", "q4": "Battle now has an on-screen Menu button, because a phone has no Esc key. Settings › Display gains Wide screen (Wings, Scenery, Black bars). The button bar colours confirm green and back red on every page.", "q5": "Yes. The upright phone layout is the handheld layout the series grew up on: scene on top, big buttons underneath."}, "21": {"name": "Living World", "big": "The world now has a clock and a sky. Every stop has a time of day (day, evening or night) and battles carry weather, and every screen shows it: it is evening with rain, so the title, the town, the menus and the party camp all turn to dusk, lamps come on, and rain falls across the battle.", "pages": ["Time of Day", "Weather", "Weather Rolls In", "Rotom Forecast", "Night Encounter"], "q1": "Yes. A setting sun behind Red on the title, lamp glow and first stars in Hub Town, a campfire glow under the party, rain streaking across the whole arena, and a lantern-lit night encounter.", "q2": "Passes 1 to 20 were always the same sunny afternoon. Now the light on every screen follows the run, so stop 12 in the evening rain looks nothing like stop 16 at noon.", "q3": "Yes, five. Time of Day and Weather each get an explainer page instead of a tooltip, the weather change gets its own moment, the forecast gets a page, and night gets its own encounter.", "q4": "The pause menu shows the time and how long the rain lasts, and its backdrop follows the sky. Battle Info already lists the weather; the new chip links to the Weather page. Settings › Display can gain a 'Time of day lighting' switch for players who want the bright look.", "q5": "Yes. Day and night, weather that changes which moves hit hard, and Pokémon that only come out after dark are core to the series since Gold and Silver."}, "22": {"name": "Festivals & Side Roads", "big": "The game event of the week now dresses the whole game in its own colour: bunting over the title, the town and every menu header, a banner hanging in the battle arena, and a goal chip on the phone and party. Side roads (sub-regions inside a stop) get their own pages, drawn like a stage but never counted as one.", "pages": ["Game Event · Homeland Week", "Side Road · The Door", "Side Road · Map", "Side Road · Prize", "Ultra Wormhole", "Regional Forms"], "q1": "Yes. Strings of flags across the title and Hub Town, a hanging event banner over the arena, a spinning wormhole behind Nihilego, and a festival poster page in the event's blue.", "q2": "Until now a game event was one line from Rotom. Now you can see at a glance that an event is on from any screen, and what you still need to do for it. Side roads were not drawn at all before.", "q3": "Yes, six. The door, the side-road map and its prize are three separate pages so the choice to enter is never mixed with the map; the event has its own poster page; Ultra Wormholes and regional forms each get a page.", "q4": "The pause menu and party show the event chip, and it opens the event page. Settings › Game keeps the Ultra Beasts switch (on by default) and the page says so. Regional forms are asked once per region, not buried in Settings.", "q5": "Yes. Sevii and the Orange Islands, festivals, Ultra Wormholes and Alolan forms are all straight from the series, and the side road is drawn with the same stage map the main road uses."}, "23": {"name": "Breathing Room", "big": "After twenty-two passes of adding, this pass takes things away. Every main screen keeps one job: the battle folds five separate strips into a single status bar and drops the bench, the title keeps only the menu and the face-off, the party shows full details for one Pokémon at a time, and the phone and the town tuck their extras behind one button.", "pages": ["Battle · Status", "News", "This Run", "Before and After"], "q1": "Yes, by subtraction. With the strips gone the two Pokémon, the weather and the big FIGHT button are what you see first, which makes the battle look bolder than any added effect did.", "q2": "Pass 22's battle had thirteen separate things on screen; this one has seven. The title went from eleven to five. Nothing was deleted from the game: it moved one tap away.", "q3": "Yes, four, and they exist only so the main screens can be emptier: Battle Status holds the folded strips, News holds the title's notices, This Run holds the phone's powers, score and Gym card, and a before / after sheet shows the rule.", "q4": "The pause menu loses three strips and gains one This Run card. Battle gets Menu inside the status bar. Settings is untouched, but Settings › Display could offer 'Show everything' for players who liked the busy battle.", "q5": "More than before. The classic battle screen is two Pokémon, two HP boxes and four big choices, and that is what this pass returns to."}, "24": {"name": "The Tilted Ball", "big": "The game gets a mark of its own: a Poké Ball whose belt is tipped 14 degrees, the same slant as the slash on the title. It becomes the O in the logo, the giant sun behind the hero, a court painted on every battlefield, the cap on every party card, every app on the Rotom Phone, every page icon and the save mark. Every button becomes a capsule.", "pages": ["The Signature", "Save Marks", "Screen Wipe"], "q1": "Yes. Red now stands in front of a giant tilted ball instead of a plain sun, every battle is fought on a painted ball court, and the party looks like six balls opened into cards.", "q2": "Before this pass the design had good parts but nothing you could point to and say 'that is Pocket Raiders'. Now one shape repeats from the logo to the save icon, so a single cropped corner of any screen is recognisable.", "q3": "Yes, three: The Signature (the mark, three shapes, five colours, where it lives), Save Marks (saving, saved, loading, could not save) and Screen Wipe (the ball-shut change of place).", "q4": "Menu apps are now balls in each app's colour, and the phone wallpaper is the mark. Settings › Save & Data gains 'Show save mark'. Reduced motion swaps the wipe for a fade.", "q5": "Yes, as directly as it can: the Poké Ball is the most Pokémon shape there is, and the tilt and the capsule buttons make it this game's own."}, "25": {"name": "Master Cut", "big": "The final frames. A showtime finish on the main screens (a ray burst behind the giant ball, type-coloured auras and a soft vignette in battle, a holo foil on the chosen party card), the party and the phone now sit on the ball's own two halves, every page header joins the morph so each page grows out of the last, and the hand-over pages are in: Master Cut, Style Guide, Page Map, Motion Rules and Build Order.", "pages": ["Master Cut", "Style Guide", "Page Map", "Motion Rules", "Build Order"], "q1": "Yes, this is the loudest version: spinning rays and sparkles on the title, glowing rings under both Pokémon, a rainbow foil card in the party, and a glow around FIGHT.", "q2": "Pass 24 gave the game its mark; this pass finishes the frames around it and adds what is needed to build it: the rules written down, every page listed, and an order to build in.", "q3": "Yes, five hand-over pages: Master Cut (the journey from pass 1), Style Guide, Page Map (every page by group), Motion Rules (six kinds of movement with timings) and Build Order.", "q4": "The pause menu and party now share one backdrop idea (the ball's two halves, belt in the middle), so opening the menu from anywhere feels like the same place. Settings is listed in the Page Map with all ten of its pages.", "q5": "Yes. Rays, sparkles, foil cards and a ball in the logo are the title-screen language of the series, and nothing here needs art the game does not already have."}, "26": {"name": "Final Cut", "label": "Final Cut · Kice's picks", "big": "Kice's picks in one set: the Title from pass 17, the Pause menu from pass 24, and every other screen from pass 25. Evil Mode pages are left out. Three fixes Kice asked for are in: no light rays over the Pokémon in Hub Town, a smaller status bar under the foe in battle, and the \"What will Charizard do?\" box moved clear of the EXP bar.", "pages": ["Final Cut"], "q1": "It keeps the loudest pass (25) for almost everything, and takes the calmer word-menu Title from pass 17 that Kice preferred.", "q2": "Nothing new is invented here. It is the chosen mix, with the three things Kice pointed at fixed.", "q3": "One: the Final Cut page lists which pass each screen comes from and what was fixed.", "q4": "Pause is the pass 24 phone with the giant ball behind it. Settings is the pass 25 set of ten pages.", "q5": "Yes. These are the screens Kice picked as the game's look."}, "27": {"name": "New areas 1 · First Draft", "label": "New areas · pass 1 of 25", "big": "The first drawing of five areas the 25 passes never covered: Raids, Totems, the Galar Gym Challenge, Mega-Expeditions and the main game's evil teams. All eleven pages use the Final Cut look as it is, with words and numbers taken from the game's own files.", "pages": ["Raid · The Den", "Raid · Battle", "Totem · Territory", "Totem · Battle", "Galar · Gym Challenge Intro", "Galar · Stadium Battle", "Galar · Tournament Bracket", "Expedition · The Gate", "Expedition · Route", "Evil Team · They Are Here", "Evil Team · Encounter"], "q1": "Not yet. This pass borrows the existing battle, event and map parts so each area can be judged on what it needs to show. The loud versions start next pass.", "q2": "These areas had no mockups at all before. Now each has a first screen for its key moment and one for the choice that leads into it.", "q3": "Yes, eleven: a den page before a raid, a territory page before a totem, a gate before an expedition, and a reveal before the first evil team stop, so the battle screens stay clean.", "q4": "Unchanged. Pause and Settings from the Final Cut open the same way from all of these.", "q5": "Yes. Dens, totems, the stadium crowd and a villain team with a red R are straight from the series, drawn with the game's own sprites."}, "28": {"name": "New areas 2 · Five Flags", "label": "New areas · pass 2 of 25", "big": "Each area now has its own colour and emblem. Raids are Dynamax pink with the storm spiral behind the boss, totems are amber with a carved band, the Gym Challenge is league blue with a scoreboard, expeditions are teal on a map grid, and the evil team stamps a giant R in its own colour. Five reference pages join.", "pages": ["Raid · Tiers", "Totem · Totems of the Region", "Galar · The Dynamax Band", "Expedition · Party", "Evil Team · Teams by Region"], "q1": "Yes. Pass 1 borrowed the normal battle and event look; now a raid, a totem fight and a stadium match can be told apart from across the room by colour alone.", "q2": "Pass 1 was one look for five different things. This pass gives each a flag: colour, emblem, and one prop that only it has (spiral, carved band, scoreboard, map grid, the R).", "q3": "Yes, five reference pages so the den, territory and gate pages do not have to explain everything: tiers, the list of totems, the Dynamax Band, party rules and which team belongs to which region.", "q4": "Unchanged. The emblem in the page header also shows on the pause menu's Next Stop l  "Yes. Pass 3 was big but silent. Now there is a live broadcast frame, a moving ticker and a talking head on each screen.", "q2": "Pass 3 showed the size of the thing. This pass explains it while you play, so the status strip can stay short and the rules do not need a separate read.", "q3": "Yes, five: Cheers and Talk and Boss Cards for raids, the Ally Call moment for totems, The Crowd for Galar, and a Rest Area stop for expeditions.", "q4": "Unchanged. The caster strip uses the same slot as the battle question box, so the pause menu and its key hints stay where they were.", "q5": "Yes. A stadium match called by a reporter is the Galar games' own framing, and Rotom as the helper keeps the game's rule that the helper is always Rotom."}, "31": {"name": "New areas 5 · Dials and Prizes", "label": "New areas · pass 5 of 25", "big": "The number that decides each area is now one big dial: a turn clock in raids, a phase dial at the Totem, a tug-of-war bar with both faces for the Galar crowd, a loot bag with what you keep in each outcome on the expedition, and a Heat thermometer with the Ambush and Reinforcements lines marked. Six ending pages close each loop.", "pages": ["Raid · Raid Clear", "Raid · The Catch", "Totem · The Gift", "Galar · Round Won", "Expedition · The Haul", "Evil Team · It Falls Apart"], "q1": "Yes. Round dials, a thermometer and a tug-of-war bar are louder and faster to read than the text strips they replace.", "q2": "Pass 4 told you what was going on in words. This pass shows the one number that matters as a shape, and finally shows how each area ends.", "q3": "Yes, six endings: Raid Clear, The Catch, the Totem's Gift, Round Won, the Expedition's Haul, and the evil team falling apart (which leads into the Betrayal and Legendary pages from before).", "q4": "Unchanged.", "q5": "Yes. A single throw at a worn-out raid boss and a Totem stepping aside are the series' own endings for these fights."}, "32": {"name": "New areas 6 · Roll Call", "label": "New areas · pass 6 of 25", "big": "Every special screen now shows exactly who is on each side. Raids get a four-trainer squad rail with what each ally picked this turn. The Totem's side is a row of slots: the Totem, the ally it called, and the call it still has. The Galar match gets a TV line-up board with both teams of six. The expedition header carries your party's health, and the evil team stop shows the grunt's extra Pokémon before you choose.", "pages": ["Raid · Lobby", "Raid · This Turn", "Raid · Shield Broken", "Totem · Both Sides", "Galar · Line-ups", "Evil Team · Never Fair", "Expedition · Party Check"], "q1": "Yes. Faces and Pokémon replace plain counters, and the raid finally looks like four trainers against one giant.", "q2": "Pass 5 showed the numbers. This pass shows the people and Pokémon behind them, so you can plan around who is still standing.", "q3": "Yes, seven: a raid lobby where everyone readies up, a turn-order page, the shield-break moment, and a both-sides page for the Totem, the Gym, the evil team and the expedition.", "q4": "Unchanged. The line-up pages open with one key from the battle and close straight back to it.", "q5": "Yes. Line-up boards before a stadium match and a row of Poké Balls for each side are how the series has always shown a team."}, "33": {"name": "New areas 7 · Home Ground", "label": "New areas · pass 7 of 25", "big": "Each area now owns the ground it stands on. Patterned side rails frame the screen: hex plates for raids, a zigzag weave for Totems, stadium chevrons for Galar, map contours for expeditions and hazard stripes for the evil team. The FIGHT button wears the area's colours, the Totem stands in a ring of torches, the Galar pitch has its painted lines, and the expedition map is split into five labelled layers.", "pages": ["Totem · The Aura", "Totem · Phase Two", "Totem · Tiers", "Totem · The Totem Stands", "Raid · Out of Turns", "Expedition · Failed"], "q1": "Yes. Torches, pitch lines and patterned rails make each place lance.", "q3": "Yes, eight. The evil team had three pages; it now has a page for each turning point, including the Offer and the Inside route with its Acts, Operations, Trust and four endings.", "q4": "The Case File is the evil team's own menu page: J opens it from any of their stops, the same key as the journal.", "q5": "Yes. A grunt, an executive who comes back, a hideout cleared room by room and the Boss in his office is the classic evil-team arc."}};

function __check() {
  const st = $('#stage'), S = st.getBoundingClientRect(), out = [];
  const texty = el => [...el.childNodes].some(n => n.nodeType === 3 && n.textContent.trim());
  const name = el => (el.className && el.className.baseVal === undefined ? '.' + String(el.className).trim().split(/\s+/).join('.') : el.tagName) + ' "' + el.textContent.trim().slice(0, 28) + '"';
  const leaves = [...st.querySelectorAll('*')].filter(el => texty(el) && !el.closest('[data-nocheck]') && el.getClientRects().length);
  for (const el of leaves) {
    const r = el.getBoundingClientRect(), cs = getComputedStyle(el);
    if (cs.visibility === 'hidden' || +cs.opacity === 0) continue;
    if (r.left < S.left - 1 || r.right > S.right + 1 || r.top < S.top - 1 || r.bottom > S.bottom + 1) out.push('off-screen ' + name(el));
    if (cs.display !== 'inline' && ((el.scrollWidth > el.clientWidth + 1 && cs.overflowX !== 'visible') || (el.scrollHeight > el.clientHeight + 1 && cs.overflowY !== 'visible'))) out.push('cut off ' + name(el));
    if (parseFloat(cs.fontSize) < 11) out.push('tiny text ' + parseFloat(cs.fontSize) + 'px ' + name(el));
    for (let a = el.parentElement; a && a !== st; a = a.parentElement) {
      const ca = getComputedStyle(a); if (ca.overflowX === 'visible' && ca.overflowY === 'visible') continue;
      const ar = a.getBoundingClientRect();
      if (r.left < ar.left - 1 || r.right > ar.right + 1 || r.top < ar.top - 1 || r.bottom > ar.bottom + 1) { out.push('cut by parent ' + name(el)); break; }
    }
    const top = document.elementFromPoint(Math.min(S.right - 1, Math.max(S.left, r.left + r.width / 2)), Math.min(S.bottom - 1, Math.max(S.top, r.top + r.height / 2)));
    if (top && top !== el && !el.contains(top) && !top.contains(el)) out.push('covered ' + name(el) + ' by ' + name(top));
  }
  for (let i = 0; i < leaves.length; i++) for (let j = i + 1; j < leaves.length; j++) {
    const a = leaves[i], b = leaves[j]; if (a.contains(b) || b.contains(a)) continue;
    const x = a.getBoundingClientRect(), y = b.getBoundingClientRect();
    const ox = Math.min(x.right, y.right) - Math.max(x.left, y.left), oy = Math.min(x.bottom, y.bottom) - Math.max(x.top, y.top);
    if (ox > 3 && oy > 3) out.push('overlap ' + name(a) + ' × ' + name(b));
  }
  return out;
}
/* decor(pass, id, {cls, add, rep}): from this pass on, draw the previous version of a page with an extra class, extra html before its end, or text swaps */
function decor(pass, id, o) {
  const prev = () => pick(PR.defs[id].filter(d => d.pass < pass), pass);
  def(pass, id, o.meta || prev().meta, P => {
    let h = prev().fn(P);
    if (o.cls) h = h.replace('class="scr ', 'class="scr ' + o.cls + ' ');
    for (const [a, b] of o.rep || []) h = h.split(a).join(b);
    if (o.add) h = h.replace(/<\/div>\s*$/, o.add + '</div>');
    if (o.fn) h = o.fn(h);
    return h;
  });
}

comp(5, 'hdr', (t, pills = [], area, crumb) => { const a = area || AREA_OF[t] || (t.startsWith('Settings') ? 'set' : 'map'), A = AREA[a]; return `<div class="hdr" data-a="${a}" ${mm('hdr')}><span class="hdr-ic">${spr(A[1], A[2])}</span><span class="hdr-t">${t}</span>${crumb ? `<span class="crumb">${crumb.map(c => `<i>${c}</i>`).join('')}</span>` : ''}<span class="hdr-p">${pills.map(p => `<b><u>${p}</u></b>`).join('')}</span></div>`; });

  ${C('keys', keys || [['←→', 'tab'], ['↑↓', 'next Pokémon'], ['T', 'type chart'], ['Esc', 'back']])}</div>`; };
