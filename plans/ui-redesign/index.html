/* viewer chrome (single dark look on purpose: it frames game screens) */
:root{color-scheme:dark;--vbg:#12141b;--vpanel:#1b1e28;--vfg:#eef0f6;--vmute:#9aa2b8;--vline:#2c3142;--vacc:#ffcb05}
html,body{height:auto}
body{margin:0;background:var(--vbg);color:var(--vfg);font:14px/1.5 'M PLUS Rounded 1c',system-ui,sans-serif}
#app{max-width:1200px;margin:0 auto;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px}
.vw-top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.vw-top h1{font:400 26px/1 'Jersey 15',sans-serif;letter-spacing:.04em;margin:0;color:var(--vacc)}
.vw-passbar{display:flex;align-items:center;gap:8px;flex:1 1 320px;min-width:0}
.vw-passbar b{font:400 20px/1 'Jersey 15',sans-serif;white-space:nowrap}
.vw-passbar span{color:var(--vmute);min-width:0;overflow-wrap:anywhere}
.vw-btn{font:inherit;color:var(--vfg);background:var(--vpanel);border:1px solid var(--vline);border-radius:8px;padding:6px 12px;cursor:pointer}
.vw-btn:hover,.vw-chip:hover{border-color:var(--vacc)}
.vw-btn:focus-visible,.vw-chip:focus-visible{outline:2px solid var(--vacc);outline-offset:2px}
#vw-range{flex:1 1 160px;min-width:120px;accent-color:var(--vacc)}
#vw-wrap{position:relative;width:100%;overflow:hidden;border-radius:10px;background:#000;box-shadow:0 0 0 1px var(--vline)}
#stage{position:absolute;left:0;top:0;width:960px;height:540px;transform-origin:0 0;overflow:hidden;view-transition-name:stage;contain:layout paint}
.vw-row{display:flex;flex-wrap:wrap;align-items:center;gap:8px;color:var(--vmute)}
#vw-cur{flex:1 1 200px;color:var(--vfg)}
#vw-screens{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.vw-g{font:400 16px/1 'Jersey 15',sans-serif;letter-spacing:.06em;text-transform:uppercase;color:var(--vmute);margin:0 2px 0 8px}
.vw-g:first-child{margin-left:0}
.vw-chip{font:inherit;font-size:13px;color:var(--vfg);background:var(--vpanel);border:1px solid var(--vline);border-radius:999px;padding:3px 10px;cursor:pointer}
.vw-chip.on{background:var(--vacc);color:#16181f;border-color:var(--vacc);font-weight:800}
.vw-chip i{font-style:normal;font-size:10px;text-transform:uppercase;letter-spacing:.06em;margin-left:6px;padding:0 5px;border-radius:6px;background:#e3350d;color:#fff}
#vw-review{background:var(--vpanel);border:1px solid var(--vline);border-radius:10px;padding:14px 18px}
#vw-review h2{font:400 24px/1.1 'Jersey 15',sans-serif;margin:0 0 6px;color:var(--vacc);letter-spacing:.03em}
#vw-review p{margin:0 0 8px;max-width:75ch}
.vw-big{font-size:15px}
.vw-new{color:var(--vmute)}
#vw-review dl{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:6px 16px;margin:8px 0 0}
#vw-review dt{color:var(--vmute)}
#vw-review dd{margin:0;max-width:75ch}
@media (max-width:640px){#vw-review dl{grid-template-columns:minmax(0,1fr)}#vw-review dd{margin-bottom:6px}}
body.bare #app{padding:0;max-width:none;display:block}
body.bare .vw-ui{display:none}
body.bare #vw-wrap{width:960px;height:540px;border-radius:0;box-shadow:none}
body.still #stage *,body.still #stage *::before,body.still #stage *::after{animation-delay:-60s!important;animation-play-state:paused!important;transition:none!important}
.px{image-rendering:pixelated;image-rendering:crisp-edges}
#stage,#stage *,#stage *::before,#stage *::after{box-sizing:border-box}
#stage img{max-width:none;display:block;user-select:none}
#stage [data-go]{cursor:pointer}
::view-transition-group(*){animation-duration:.42s;animation-timing-function:cubic-bezier(.3,1.3,.5,1)}
::view-transition-old(root),::view-transition-new(root){animation:none}
@media (prefers-reduced-motion:reduce){#stage *,#stage *::before,#stage *::after{animation:none!important;transition:none!important}}
</style>
<style data-pass="1">
#stage{
/* Pass 1 · Clean Slate. Layout idea: bright paper, white cards with a navy outline, the three logo colours. */
&{--ink:#1d2a4d;--red:#e3350d;--yel:#ffcb05;--blu:#2a75bb;--paper:#eef3fa;--card:#fff;--mute:#5d6a8c;--ok:#35b34a;--mid:#f0a800;--low:#e3350d;
  --fd:'Jersey 15','Pixelify Sans',sans-serif;--fb:'M PLUS Rounded 1c',system-ui,sans-serif;
  font:500 15px/1.35 var(--fb);color:var(--ink);background:var(--paper)}
.scr{position:absolute;inset:0;background:var(--paper) radial-gradient(circle,#d3dcec 1.5px,transparent 2px) 0 0/18px 18px}
b{font-weight:800}
p{margin:0}
small{font-size:12px;color:var(--mute);font-weight:500}
.hdr{position:absolute;left:0;top:0;right:0;height:50px;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 20px;border-bottom:4px solid var(--ink);z-index:5}
.hdr-t{font:400 32px/1 var(--fd);letter-spacing:.04em}
.hdr-p{display:flex;gap:8px}
.hdr-p b{background:#fff;color:var(--ink);border-radius:999px;padding:3px 12px;font-size:13px}
.keys{position:absolute;left:0;right:0;bottom:0;height:30px;background:var(--ink);color:#fff;display:flex;gap:18px;align-items:center;justify-content:flex-end;padding:0 20px;font-size:13px;z-index:5}
.keys kbd{font:inherit;font-weight:800;background:#fff;color:var(--ink);border-radius:5px;padding:0 6px;margin-right:6px}
.pn{background:var(--card);border:2px solid var(--ink);border-radius:12px;box-shadow:0 4px 0 var(--ink)}
.btn{display:flex;flex-direction:column;justify-content:center;background:var(--card);border:2px solid var(--ink);border-radius:10px;padding:6px 14px;box-shadow:0 3px 0 var(--ink);min-height:40px;font-size:16px}
.btn.on{background:var(--yel)}
.btn.on>b::before{content:'▶';color:var(--red);margin-right:8px;font-size:12px}
.btn.sm{min-height:34px;padding:4px 10px;font-size:14px;align-items:center}
.hp{display:inline-block;height:12px;flex:1;background:#d8deea;border:2px solid var(--ink);border-radius:6px;overflow:hidden}
.hp i{display:block;height:100%;background:var(--ok)}
.hp.mid i{background:var(--mid)}
.hp.low i{background:var(--low)}
.ty{display:inline-block;background:var(--t);color:#fff;border-radius:999px;padding:1px 10px;font-size:12px;font-weight:800;text-shadow:0 1px 0 rgba(0,0,0,.35)}
.tb{position:absolute;left:16px;right:16px;bottom:42px;min-height:76px;background:#fff;border:2px solid var(--ink);border-radius:12px;box-shadow:0 4px 0 var(--ink);padding:14px 18px;font-size:16px;z-index:4}
.tb-w{position:absolute;top:-14px;left:16px;background:var(--blu);color:#fff;border:2px solid var(--ink);border-radius:8px;padding:0 10px;font-size:13px}
.lv{font:400 18px/1 var(--fd);color:var(--mute)}
.num{font:400 18px/1 var(--fd)}
.gd{font-style:normal;color:var(--blu);font-size:13px}
.ar-bg{position:absolute;inset:0;width:960px;height:540px}
.ar-bg.dim{filter:brightness(.55) saturate(.8)}
.tabs{display:flex;gap:6px}
.tab{border:2px solid var(--ink);border-bottom:0;border-radius:8px 8px 0 0;background:#dfe6f3;padding:4px 12px;font-size:13px;font-weight:800}
.tab.on{background:var(--yel)}
.li{display:flex;align-items:center;gap:10px;padding:6px 12px;border-radius:8px;font-size:15px}
.li.on{background:var(--yel)}
.li .num,.li .val{margin-left:auto}
.row{display:flex;gap:8px}
.balls{display:inline-flex;gap:2px}
.balls .ko{filter:grayscale(1) brightness(.6)}
.balls .none{opacity:.25}
.st{font-style:normal;font-size:11px;font-weight:800;color:#fff;border-radius:6px;padding:1px 7px;background:var(--mute)}
.st.PSN{background:#9141cb}

const GROUPS = ['Start', 'Run', 'Map', 'Battle', 'Gimmicks', 'After battle', 'Events', 'Pokémon', 'Trainers', 'Town', 'Menu', 'Settings', 'Evil Mode', 'Extras', 'Guide'];
function def(pass, id, meta, fn) { (PR.defs[id] = PR.defs[id] || []).push({ pass, meta, fn }); if (!PR.order.includes(id)) PR.order.push(id); }
function comp(pass, name, fn) { (PR.comps[name] = PR.comps[name] || []).push({ pass, fn }); }
function pick(list, P) { let best = null; for (const d of list || []) if (d.pass <= P && (!best || d.pass >= best.pass)) best = d; return best; }
function C(name, ...a) { const d = pick(PR.comps[name], PR.P); return d ? d.fn(...a) : ''; }
function screensAt(P) {
  const out = [];
  for (const id of PR.order) { const d = pick(PR.defs[id], P); if (d && d.fn) out.push({ id, meta: d.meta, isNew: Math.min(...PR.defs[id].map(x => x.pass)) === P, changed: d.pass === P }); }

const $ = (s, r = document) => r.querySelector(s);
const QS = new URLSearchParams(location.search);
const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
function paint(id) {
  const st = $('#stage'), list = screensAt(PR.P);
  if (!list.find(s => s.id === id)) id = (list.find(s => s.changed) || list[0]).id;
  PR.cur = id;
  const d = pick(PR.defs[id], PR.P);
  st.dataset.pass = PR.P; st.dataset.scr = id;
  st.innerHTML = d.fn(PR.P);
  nameMorphs();
}
function nameMorphs() {
  const seen = new Set();
  for (const el of $('#stage').querySelectorAll('[data-m]')) {
    const k = 'm-' + el.dataset.m.replace(/[^a-z0-9-]/gi, '');
    if (seen.has(k)) continue; seen.add(k); el.style.viewTransitionName = k;
  }
}
function swap(fn, kind) {
  const root = document.documentElement;
  root.dataset.tr = kind || 'page';
  if (document.startViewTransition && !reduced() && !QS.has('still')) {
    try { const t = document.startViewTransition(fn); t.finished.finally(() => { delete root.dataset.tr; }); return; } catch (e) { /* fall through */ }
  }
  fn();
}
function show(id, kind) { swap(() => { paint(id); chrome(); }, kind); }
function setPass(P, kind) {
  P = Math.max(1, Math.min(PR.maxPass, P));
  swap(() => {
    PR.P = P;
    for (const s of document.querySelectorAll('style[data-pass]')) s.media = (+s.dataset.pass <= P) ? 'all' : 'not all';
    paint(PR.cur); chrome();
  }, kind || 'pass');
}
function chrome() {
  if (QS.has('bare')) return;
  const P = PR.P, n = NOTES[P] || {}, list = screensAt(P);
  $('#vw-pass').textContent = 'Pass ' + P + ' of ' + PR.maxPass;
  $('#vw-name').textContent = n.name || '';
  $('#vw-range').max = PR.maxPass; $('#vw-range').value = P;
  let html = '', g = '';
  for (const s of list) {
    if (s.meta.g !== g) { g = s.meta.g; html += `<span class="vw-g">${g}</span>`; }
    html += `<button class="vw-chip${s.id === PR.cur ? ' on' : ''}" data-show="${s.id}">${esc(s.meta.t)}${s.isNew ? '<i>new</i>' : ''}</button>`;
  }
  $('#vw-screens').innerHTML = html;
  const cur = list.find(s => s.id === PR.cur);
  $('#vw-cur').textContent = cur ? cur.meta.g + ' · ' + cur.meta.t + '  (' + (list.indexOf(cur) + 1) + ' of ' + list.length + ')' : '';
  const qs = [['More extravagant and eye-catching?', n.q1], ['How is it different and better than the last pass?', n.q2], ['More pages to avoid clutter?', n.q3], ['How do the Menu and Settings fit?', n.q4], ['Does it feel like a Pokémon game?', n.q5]];
  $('#vw-review').innerHTML = `<h2>Pass ${P}: ${esc(n.name || '')}</h2><p class="vw-big">${esc(n.big || '')}</p>` +
    (n.pages && n.pages.length ? `<p class="vw-new"><b>New pages:</b> ${n.pages.map(esc).join(' · ')}</p>` : '') +
    `<dl>${qs.filter(q => q[1]).map(q => `<dt>${q[0]}</dt><dd>${esc(q[1])}</dd>`).join('')}</dl>`;
}
function fit() {

}
let tourT = null;
function tour(on) {
  clearInterval(tourT); tourT = null;
  if (on) tourT = setInterval(() => { const l = screensAt(PR.P), i = l.findIndex(s => s.id === PR.cur); show(l[(i + 1) % l.length].id); }, 2600);
  const b = $('#vw-tour'); if (b) b.textContent = on ? 'Stop tour' : 'Play tour';
}
function boot() {
  PR.maxPass = Math.max(...Object.keys(NOTES).map(Number));
  PR.P = +QS.get('pass') || PR.maxPass;
  if (QS.has('bare')) document.body.classList.add('bare');
  if (QS.has('still')) document.body.classList.add('still');
  for (const s of document.querySelectorAll('style[data-pass]')) s.media = (+s.dataset.pass <= PR.P) ? 'all' : 'not all';
  PR.cur = QS.get('s') || '';
  paint(PR.cur); chrome(); fit();
  addEventListener('resize', fit);
  document.addEventListener('click', e => {
    const g = e.target.closest('[data-go]'); if (g && $('#stage').contains(g)) { tour(false); return show(g.dataset.go, g.dataset.tr); }
    const c = e.target.closest('[data-show]'); if (c) { tour(false); return show(c.dataset.show); }
    const p = e.target.closest('[data-pass-step]'); if (p) return setPass(PR.P + +p.dataset.passStep);
    if (e.target.closest('#vw-tour')) return tour(!tourT);
    if (e.target.closest('#vw-replay')) { const s = $('#stage'); const h = s.innerHTML; s.innerHTML = ''; void s.offsetWidth; s.innerHTML = h; nameMorphs(); }
  });
  const r = $('#vw-range'); if (r) r.addEventListener('input', () => setPass(+r.value));

    if (e.target.tagName === 'INPUT') return;

/* ---------- self-check used by shoot.js: clipped, hidden, overlapping or off-screen words ---------- */
function __check() {
  const st = $('#stage'), S = st.getBoundingClientRect(), out = [];
  const texty = el => [...el.childNodes].some(n => n.nodeType === 3 && n.textContent.trim());
  const name = el => (el.className && el.className.baseVal === undefined ? '.' + String(el.className).trim().split(/\s+/).join('.') : el.tagName) + ' "' + el.textContent.trim().slice(0, 28) + '"';
  const leaves = [...st.querySelectorAll('*')].filter(el => texty(el) && !el.closest('[data-nocheck]') && el.getClientRects().length);
  for (const el of leaves) {
    const r = el.getBoundingClientRect(), cs = getComputedStyle(el);
    if (cs.visibility === 'hidden' || +cs.opacity === 0) continue;
    if (r.left < S.left - 1 || r.right > S.right + 1 || r.top < S.top - 1 || r.bottom > S.bottom + 1) out.push('off-screen ' + name(el));
    if (cs.display !== 'inline' && ((el.scrollWidth > el.clientWidth + 1 && cs.overflowX !== 'visible') || (el.scrollHeight > el.clientHeight + 1 && cs.overflowY !== 'visible'))) out.push('cut off ' + name(el));
    if (parseFloat(cs.fontSize) < 11) out.push('tiny text ' + parseFloat(cs.fontSize) + 'px ' + name(el));
    for (let a = el.parentElement; a && a !== st; a = a.parentElement) {
      const ca = getComputedStyle(a); if (ca.overflowX === 'visible' && ca.overflowY === 'visible') continue;
      const ar = a.getBoundingClientRect();
      if (r.left < ar.left - 1 || r.right > ar.right + 1 || r.top < ar.top - 1 || r.bottom > ar.bottom + 1) { out.push('cut by parent ' + name(el)); break; }
    }
    const top = document.elementFromPoint(Math.min(S.right - 1, Math.max(S.left, r.left + r.width / 2)), Math.min(S.bottom - 1, Math.max(S.top, r.top + r.height / 2)));
    if (top && top !== el && !el.contains(top) && !top.contains(el)) out.push('covered ' + name(el) + ' by ' + name(top));
  }
  for (let i = 0; i < leaves.length; i++) for (let j = i + 1; j < leaves.length; j++) {
    const a = leaves[i], b = leaves[j]; if (a.contains(b) || b.contains(a)) continue;
    const x = a.getBoundingClientRect(), y = b.getBoundingClientRect();
    const ox = Math.min(x.right, y.right) - Math.max(x.left, y.left), oy = Math.min(x.bottom, y.bottom) - Math.max(x.top, y.top);
    if (ox > 3 && oy > 3) out.push('overlap ' + name(a) + ' × ' + name(b));
  }
  return out;
}

def(3, 'moveinfo', { t: 'Battle · Move Info', g: 'Battle' }, () => { const m = MOVES[0]; return `<div class="scr battle b2 minfo">${C('arena', { dim: 1 })}
  <div class="mi-card" style="--t:${TYC[m.ty]}" ${mm('tb')}>${spr('bd-' + m.ty, 5, 'mv-m')}<small>Move</small><b>${m.n}</b><div class="mi-row">${C('ty', m.ty)}<span>${m.cat}</span><span>No contact</span></div>
    <div class="mi-nums"><div><span>Power</span><b>${m.pw}</b></div><div><span>Accuracy</span><b>${m.acc}</b></div><div><span>PP</span><b>${m.pp}/${m.mpp}</b></div></div><p>${m.d}</p></div>
  <div class="mi-vs pn"><b>Against ${FOE.n}</b>
    <div class="mult"><span>${C('ty', 'fire')} into ${C('ty', 'water')}</span><b class="bad">× 0.5</b></div>
    <div class="mult"><span>Same type as Charizard</span><b class="good">× 1.5</b></div>
    <div class="est"><span>Takes about</span><div class="hp ok"><i style="width:74%"></i><u style="left:56%;width:18%"></u></div><b>18%</b></div>
    <p>Not very effective. Thunder Punch would hit about three times harder.</p>
    <div class="row"><div class="btn on" ${go('battle')}><b>Use it</b></div><div class="btn" ${go('fight')}><b>Back</b></div></div></div></div>`; });

def(3, 'b-switch', { t: 'Battle · Switch', g: 'Battle' }, () => { const hint = [['', 'In battle'], ['▲', 'Strong vs Water'], ['', 'Normal damage'], ['▲', 'Resists Water'], ['', 'Fainted'], ['', 'Bulky pick']]; return `<div class="scr battle b2 bsw">${C('arena', { dim: 1 })}
  <div class="sw-list">${PARTY.map((p, i) => `<div class="sw btn typed${i === 1 ? ' on' : ''}${p.st === 'FNT' ? ' fnt' : ''}" style="${tgrad(p.ty)}"><div class="sw-r">${spr('m-' + p.k, 1, 'pc-s')}<b>${p.n}</b>${p.ty.map(t => C('medal', t, .625)).join('')}<span class="lv">Lv ${p.lv}</span>${C('hp', pct(p.hp, p.mx))}<em class="hint h${i}">${hint[i][0]} ${hint[i][1]}</em></div></div>`).join('')}</div>
  <div class="sw-pick pn typed-card" style="${tgrad(['electric'])}" ${mm('tb')}>${spr('bd-electric', 6, 'mv-m')}${spr('m-25', 3)}<b>Pikachu</b><div>${C('ty', 'electric')}</div><p>Thunderbolt · Volt Tackle · Iron Tail · Quick Attack</p><div class="row"><div class="btn on" ${go('battle')}><b>Send out</b></div><div class="btn" ${go('battle')}><b>Back</b></div></div></div></div>`; });

def(3, 'event', { t: 'Event', g: 'Events' }, () => `<div class="scr event"><img class="px ar-bg" src="sprites/a-sea-bg.png" alt="">
  <div class="ev-tag" ${mm('hdr')}><b>Event</b>The Old Lighthouse</div>
  <div class="ev-cast">${spr('t-acem', 3)}</div>
  <div class="ev-choices"><div class="btn on tone risk"><b>Climb to the lamp room</b><small><i>Risky</i> a battle may start</small></div><div class="btn tone cost"><b>Help the keeper fix the light</b><small><i>Certain</i> costs ₽ 300</small></div><div class="btn tone safe" ${go('map')}><b>Walk on</b><small><i>Certain</i> nothing happens</small></div></div>
  ${C('box', 'Keeper Amos', '"The lamp went dark an hour ago, and something up there keeps tapping on the glass. I am too old for those stairs. Would you take a look?"')}
  ${C('keys', [['↑↓', 'move'], ['Enter', 'choose']])}</div>`);

def(3, 'party', { t: 'Party', g: 'Pokémon' }, () => { const p = PARTY[0]; return `<div class="scr party p2 p3">${C('hdr', 'Party', ['6 of 6', '₽ ' + RUN.money])}
  <div class="leadc pn on typed-card" style="${tgrad(p.ty)}" ${go('summary')} ${mm('mon-card')}>${spr('bd-' + p.ty[0], 7, 'mv-m')}<i class="st lead">Lead</i>${spr('m-' + p.k, 3)}<div class="pc-1"><b>${p.n}</b><span class="lv">Lv ${p.lv}</span></div><div class="pc-2">${C('hp', pct(p.hp, p.mx))}<span class="num">${p.hp}/${p.mx}</span></div><div class="pc-3">${p.ty.map(t => C('ty', t)).join('')}</div><div class="sm-i">${spr('i-' + p.ik, 1)}<span>${p.item}</span></div></div>
  <div class="pt-rows">${PARTY.slice(1).map(p => `<div class="pcard pn typed${p.st === 'FNT' ? ' fnt' : ''}" style="${tgrad(p.ty)}"><div class="disc">${spr('m-' + p.k, 1.5, 'pc-s')}</div><div class="pc-b"><div class="pc-1"><b>${p.n}</b><span class="lv">Lv ${p.lv}</span></div><div class="pc-2">${C('hp', pct(p.hp, p.mx))}<span class="num">${p.hp}/${p.mx}</span></div></div><div class="pc-3">${p.ty.map(t => C('ty', t)).join('')}${p.st ? `<i class="st ${p.st}">${p.st}</i>` : ''}</div></div>`).join('')}</div>
  ${C('keys', [['↑↓', 'move'], ['Enter', 'summary'], ['Shift', 'swap'], ['T', 'type chart'], ['Esc', 'back']])}</div>`; });

def(3, 'summary', { t: 'Summary', g: 'Pokémon' }, () => { const p = PARTY[0], st = [['HP', 124], ['Attack', 86], ['Defense', 80], ['Sp. Atk', 118], ['Sp. Def', 88], ['Speed', 112]]; return `<div class="scr summary s2 s3" style="${tgrad(p.ty)}">${C('hdr', 'Summary', ['1 of 6'])}
  <div class="sm-band">${spr('bd-' + p.ty[0], 9, 'mv-m')}</div>
  <div class="sm-left" ${mm('mon-card')}><div class="sm-art">${spr('m-' + p.k, 4)}</div><div class="sm-n"><b>${p.n}</b><i class="gd">${p.g}</i><span class="lv">Lv ${p.lv}</span></div><div class="sm-t">${p.ty.map(t => C('ty', t)).join('')}</div><div class="sm-i">${spr('i-' + p.ik, 1)}<span>${p.item}</span></div></div>
  <div class="sm-right"><div class="tabs">${['Overview', 'Stats', 'Moves', 'Items', 'Bond', 'History', 'Traits'].map((t, i) => `<span class="tab${i === 1 ? ' on' : ''}">${t}</span>`).join('')}</div>
    <div class="sm-body pn"><div class="sm-stats">${st.map(s => `<div class="stat"><span>${s[0]}</span><i><u style="width:${Math.round(s[1] / 1.4)}%"></u></i><b>${s[1]}</b></div>`).join('')}</div>
    <div class="sm-facts"><div><span>Ability</span><b>${p.ab}</b></div><div><span>Nature</span><b>${p.nat} (+Speed, −Attack)</b></div><div><span>Weak to</span><b class="tyrow">${['rock', 'water', 'electric'].map(t => C('ty', t)).join('')}</b></div><div><span>Met</span><b>Kanto, stage 1 (starter)</b></div></div></div></div>
  ${C('keys', [['←→', 'page'], ['↑↓', 'Pokémon'], ['T', 'type chart'], ['Esc', 'back']])}</div>`; });

def(3, 'types', { t: 'Type Chart', g: 'Pokémon' }, () => `<div class="scr types">${C('hdr', 'Type Chart', [])}
  <div class="tc-grid">${Object.keys(TYC).map(t => `<div class="tc${t === 'fire' ? ' on' : ''}" style="--t:${TYC[t]}">${spr('bd-' + t, 1.5)}<b>${cap(t)}</b></div>`).join('')}</div>
  <div class="tc-side pn" style="--t:${TYC.fire}"><div class="tc-h">${spr('bd-fire', 2)}<b>Fire</b></div>
    <div class="tc-row"><span>Hits hard</span><div>${['grass', 'ice', 'bug', 'steel'].map(t => C('ty', t)).join('')}</div></div>
    <div class="tc-row"><span>Weak hit on</span><div>${['fire', 'water', 'rock', 'dragon'].map(t => C('ty', t)).join('')}</div></div>
    <div class="tc-row"><span>Takes double from</span><div>${['water', 'ground', 'rock'].map(t => C('ty', t)).join('')}</div></div>
    <div class="tc-row"><span>Shrugs off</span><div>${['fire', 'grass', 'ice', 'bug', 'steel', 'fairy'].map(t => C('ty', t)).join('')}</div></div></div>
  ${C('keys', [['←→↑↓', 'pick a type'], ['Esc', 'back']])}</div>`);

boot();
</script>
</body></html>
