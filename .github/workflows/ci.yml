name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, beta-0.5]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A newer push to the same PR cancels the older run, and on main only waiting runs are replaced, so the runner queue does not back up.
# "CI ok" runs with if: always(), so it reports on cancelled runs.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # PRs: a newer push cancels the running one. Main: the running CI finishes and only waiting runs are replaced by the newest.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Docs-only PRs (markdown, docs, plans, promo, reports, ideas) skip the heavy jobs; "CI ok" still reports.
  changes:
    # Draft PRs do not run CI (mark ready for review to run it); this halves runner load.
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          code=true
          if [ "${{ github.event_name }}" = pull_request ]; then
            files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
            if [ -n "$files" ] && ! echo "$files" | grep -qvE '^(docs/|plans/|promo/|reports/|ideas/|[^/]+\.md$)'; then code=false; fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Content quality gate (QUALITY_GATES.md): fails when a content-report number gets worse than tools/content-baseline.json.
      - run: npm run report:check
      # Asset audit and load budget (QUALITY_GATES gates 4 and 8).
      - run: npm run report:assets
      - run: npm run report:perf
      # Bot playtest: 50 seeded runs with side stops; any crash, stuck run or broken number fails the PR.
      - run: node tools/playtest.ts 0 50 --heal --sides --strict > /dev/null
      # Deep playtest: a stronger bot on the multi-region mode; fails unless a run reaches the third region (late-game coverage).
      - run: node tools/playtest.ts 1000 4 --heal --sides --strict --deep > /dev/null
        env:
          NODE_OPTIONS: --max-old-space-size=6144

  # Browser tests run in 4 parallel shards (the slowest part of CI used to be one long serial job).
  e2e:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Cache the browser download; the system packages still install every run.
      - uses: actions/cache@v4
        id: pw
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        if: steps.pw.outputs.cache-hit != 'true'
      - run: npx playwright install-deps chromium
        if: steps.pw.outputs.cache-hit == 'true'
      - run: npx playwright test --shard=${{ matrix.shard }}/4 --trace off
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failures-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  # One stable name for branch protection: require "CI ok" instead of every job and shard.
  ci-ok:
    name: CI ok
    if: always()
    needs: [changes, check, e2e]
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "code=${{ needs.changes.outputs.code }} check=${{ needs.check.result }} e2e=${{ needs.e2e.result }}"
          if [ "${{ needs.changes.result }}" = skipped ]; then echo "Draft PR: CI did not run. Mark it ready for review to run CI."; exit 1; fi
          [ "${{ needs.changes.result }}" = success ] || exit 1
          if [ "${{ needs.changes.outputs.code }}" = false ]; then exit 0; fi
          [ "${{ needs.check.result }}" = success ] && [ "${{ needs.e2e.result }}" = success ]
