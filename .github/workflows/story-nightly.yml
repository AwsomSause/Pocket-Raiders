name: Story nightly

# Story Overhaul S19: 10,000 Director blueprints plus bot walks of real Story Runs. Never blocks a PR; run it by hand from the Actions tab too.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

jobs:
  story-sim:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node tools/story-nightly.ts 10000 3
        env:
          NODE_OPTIONS: --max-old-space-size=6144
